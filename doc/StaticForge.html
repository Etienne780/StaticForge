<p><code>GetAssetMapped</code> returns a non-owning <code>AssetView</code> directly into mapped memory — no allocation or copy needed. The view becomes invalid as soon as <code>CloseMapped</code> is called. For an empty file the view has <code>size == 0</code> and a valid (non-null) <code>data</code> pointer.</p>
<p><code>LoadAssetMapped</code> and <code>LoadAssetRangeMapped</code> also work for compressed assets, they decompress directly from the mapped memory.</p>
<blockquote><strong>Important:</strong> <code>GetAssetMapped</code> is <strong>not possible for compressed assets</strong>, because only the compressed data is in memory. It returns an empty view with an error. Use <code>LoadAssetMapped</code> instead.</blockquote>
<h2>Compression</h2>
<p>Assets can be stored compressed inside an archive. This is transparent for all functions except <code>GetAssetMapped</code> — <code>LoadAsset</code> detects compressed entries and decompresses them automatically before returning the data:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// Works for both compressed and uncompressed assets</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">vector</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">byte</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">data</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">maps/level1.map"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">data</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">))</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">endl</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>Internally, compressed files are split into blocks (64 KB by default, configurable when packing). Each block is compressed independently and prefixed with its compressed and original size.</p>
<div class="table-wrapper"><table><thead><tr><th>Access method</th><th>Uncompressed</th><th>Compressed</th></tr></thead><tbody><tr><td><code>LoadAsset</code></td><td>✅</td><td>✅ (auto-decompress)</td></tr><tr><td><code>LoadAssetAt</code></td><td>✅</td><td>✅ (auto-decompress)</td></tr><tr><td><code>LoadAssetRange</code></td><td>✅</td><td>✅ (needed blocks)</td></tr><tr><td><code>LoadAssetMapped</code></td><td>✅</td><td>✅ (auto-decompress)</td></tr><tr><td><code>LoadAssetRangeMapped</code></td><td>✅</td><td>✅ (needed blocks)</td></tr><tr><td><code>GetAssetMapped</code></td><td>✅</td><td>❌ not possible</td></tr></tbody></table></div>
<h2>Error handling</h2>
<p><code>StaticForgeReader</code> and <code>StaticForgeArchive</code> collect error messages. Always check the return value:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">audio/music.ogg"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">data</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">))</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// possible reasons: key not found, seek failure, checksum mismatch,</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// decompression failure, or buffer too small</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">endl</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<div class="table-wrapper"><table><thead><tr><th>Function</th><th>Description</th></tr></thead><tbody><tr><td><code>IsValid()</code></td><td><code>true</code> if no errors are stored</td></tr><tr><td><code>GetError()</code></td><td>Returns all stored errors as one string</td></tr><tr><td><code>TakeError()</code></td><td>Returns all stored errors and clears them</td></tr><tr><td><code>ClearErrors()</code></td><td>Clears all stored errors</td></tr></tbody></table></div>
<p>Errors of the archive accumulate over several calls until you take or clear them, so you can load many assets and report all problems at once:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">a.png"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">a</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">b.png"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">b</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">IsValid</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">())</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">  </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// errors of both calls</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>Errors that no longer apply are cleared automatically: <code>reader.Load</code> clears the errors of the reader and of the archive it loads into.</p></div>

<template id="tmpl-node_mu3td1kurklac1g47o2b">

    <section id="node_mu3td1kurklac1g47o2b" class="export-section">
    
    <div class="export-section__body"><h1>Building Archives in Code</h1>
<p>Instead of using the command-line tool you can drive the build process directly from C++ using <code>StaticForgeBuilder</code>.</p>
<h2>Minimal example</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">#</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">include </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">StaticForgeCore/StaticForge.h</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword"></span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeBuilder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetArchiveName</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">textures"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AddSourcePath</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets/textures"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetOutputPath</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./build"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetCreateOutputDir</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__literal">true</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Build</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">())</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">endl</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>At least one source path and an output path are required, <code>Build()</code> fails with an error otherwise.</p>
<h2>Multiple source paths</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetSourcePath</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">({</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets/textures"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets/audio"</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">});</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>or add them one at a time:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AddSourcePath</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets/textures"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AddSourcePath</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets/audio"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>Paths are <code>std::filesystem::path</code>. For UTF-8 strings use <code>std::filesystem::u8path(...)</code>, so non-ASCII names also work on Windows.</p>
<h2>Fluent API</h2>
<p>All setters return <code>*this</code> so they can be chained:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeBuilder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">main"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">},</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./build"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">};</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetCreateOutputDir</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__literal">true</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>

<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Build</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<h2>Options</h2>
<div class="table-wrapper"><table><thead><tr><th>Setter</th><th>CLI equivalent</th><th>Description</th></tr></thead><tbody><tr><td><code>SetArchiveName(name)</code></td><td><code>--name</code></td><td>Archive name for files without a meta file (default <code>main</code>)</td></tr><tr><td><code>SetSourcePath(paths)</code> / <code>AddSourcePath(path)</code></td><td><code>--source</code></td><td>Source directories</td></tr><tr><td><code>SetOutputPath(path)</code></td><td><code>--output</code></td><td>Output directory</td></tr><tr><td><code>SetCreateOutputDir(bool)</code></td><td><code>--mkdir</code></td><td>Create the output directory if it is missing</td></tr><tr><td><code>SetDebugMode(bool)</code></td><td><code>--verbose</code></td><td>Print detailed progress to <code>stdout</code></td></tr><tr><td><code>SetStoreNames(bool)</code></td><td><code>--store-names</code></td><td>Store file names in all archives</td></tr><tr><td><code>SetCompress(bool)</code></td><td><code>--compress</code></td><td>Compress files larger than 4096 bytes in all archives</td></tr><tr><td><code>SetCompressionBlockSize(size)</code></td><td><code>--compress-block-size</code></td><td>Compression block size in bytes (default <code>DEFAULT_COMPRESSION_BLOCK_SIZE</code>)</td></tr><tr><td><code>SetCompressionTableSizeLog2(size)</code></td><td><code>--compress-table-size</code></td><td>Match table size as power of two (default <code>DEFAULT_COMPRESSION_TABLE_SIZE_LOG2</code>)</td></tr><tr><td><code>SetCompressionMinMatchLength(length)</code></td><td><code>--compress-min-match</code></td><td>Shortest match stored as reference (default <code>DEFAULT_COMPRESSION_MIN_MATCH_LENGTH</code>)</td></tr><tr><td><code>SetCompressionMinSaving(percent)</code></td><td><code>--compress-min-saving</code></td><td>Minimum saving in percent, otherwise stored raw (default <code>DEFAULT_COMPRESSION_MIN_SAVING</code>)</td></tr><tr><td><code>SetCacheDir(path)</code></td><td><code>--cache-dir</code></td><td>Directory of the build cache, enables incremental builds</td></tr><tr><td><code>SetRebuild(bool)</code></td><td><code>--rebuild</code></td><td>Builds all archives, also the ones that are up to date</td></tr></tbody></table></div>
<p>The valid ranges of the compression settings are the <code>MIN_COMPRESSION_*</code> and <code>MAX_COMPRESSION_*</code> constants in <code>StaticForgeTypes.h</code>. Invalid values make <code>Build()</code> fail with an error. Compression settings that are set on the builder override the values of meta files, settings that are not set fall back to the meta file value and then to the default.</p>
<h2>Building again</h2>
<p>The same builder can run <code>Build()</code> several times, e.g. after changing the source paths. Each build starts fresh and clears the errors of the previous build.</p>
<h2>Incremental builds</h2>
<p>With <code>SetCacheDir(path)</code> only the archives whose files or settings changed are built (see <em>Packing Assets</em>). After <code>Build()</code> the counts tell what happened:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetCacheDir</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./build/intermediates/release/sfcache"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Build</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">())</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cout</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetBuiltArchiveCount</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string"> built, "</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">              </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetUpToDateArchiveCount</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string"> up to date, "</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">              </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetRemovedArchiveCount</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string"> removed</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__escape">\n</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<h2>Debug mode</h2>
<p><code>SetDebugMode(true)</code> prints detailed progress to <code>stdout</code> - the same output as <code>--verbose</code> in the CLI tool.</p></div>

<template id="tmpl-node_mu3td1kuw60i4y16ior5l">
  <div class="main" data-node-id="node_mu3td1kuw60i4y16ior5l" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1kuw60i4y16ior5l" class="export-section">
    
    <div class="export-section__body"><h1>CLI Reference</h1>
<p>Quick reference for all <code>StaticForgeTool</code> arguments.</p>
<h2>Arguments</h2>
<div class="table-wrapper"><table><thead><tr><th>Argument</th><th>Short</th><th>Description</th><th>Type</th><th>Default</th><th>Multi</th></tr></thead><tbody><tr><td><code>--source</code></td><td><code>--src</code></td><td>Source directory of the files to be packed (can be specified multiple times)</td><td>filepath</td><td>—</td><td>yes</td></tr><tr><td><code>--output</code></td><td><code>--o</code></td><td>Output directory for packed archives or extracted files</td><td>filepath</td><td>—</td><td>no</td></tr><tr><td><code>--name</code></td><td><code>--n</code></td><td>Default archive name when no <code>.sfpak.meta</code> file is found</td><td>string</td><td><code>main</code></td><td>no</td></tr><tr><td><code>--mkdir</code></td><td><code>--p</code></td><td>Create the output directory if it does not exist</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--info</code></td><td><code>--i</code></td><td>Display header and index info of a <code>.sfpak</code> file (can be repeated)</td><td>filepath</td><td>—</td><td>yes</td></tr><tr><td><code>--extract</code></td><td><code>--x</code></td><td>Extract <code>.sfpak</code> file(s) into <code>&lt;output&gt;/&lt;archive name&gt;/</code> (can be repeated)</td><td>filepath</td><td>—</td><td>yes</td></tr><tr><td><code>--verify</code></td><td><code>--vf</code></td><td>Check the checksums of all files in <code>.sfpak</code> file(s) (can be repeated)</td><td>filepath</td><td>—</td><td>yes</td></tr><tr><td><code>--verbose</code></td><td><code>--v</code></td><td>Enable debug/verbose console output</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--store-names</code></td><td><code>--sn</code></td><td>Store original filenames in all archives for debug inspection and extraction</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--compress</code></td><td><code>--c</code></td><td>Compress files larger than 4096 bytes before storing them in the archive</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--help</code></td><td><code>--h</code></td><td>Show the help message</td><td>—</td><td>—</td><td>no</td></tr></tbody></table></div>
<p>Short forms always use two dashes (<code>--v</code>, not <code>-v</code>).</p>
<p>Arguments that can be repeated also accept a comma-separated list: <code>--source &quot;./textures, ./audio&quot;</code>.</p>
<h2>Compression settings</h2>
<p>Only used together with compression (<code>--compress</code> or <code>compress = true;</code> in a meta file). They override the values of <code>.sfpak.meta</code> files.</p>
<div class="table-wrapper"><table><thead><tr><th>Argument</th><th>Short</th><th>Description</th><th>Default</th><th>Range</th></tr></thead><tbody><tr><td><code>--compress-block-size</code></td><td><code>--cbs</code></td><td>Size in bytes of the blocks a file is split into for compression</td><td><code>65536</code></td><td>1024 - 67108864</td></tr><tr><td><code>--compress-table-size</code></td><td><code>--cts</code></td><td>Match table size as power of two (entries = 2^value)</td><td><code>16</code></td><td>8 - 24</td></tr><tr><td><code>--compress-min-match</code></td><td><code>--cmm</code></td><td>Shortest repeated sequence that is stored as a reference</td><td><code>8</code></td><td>4 - 65535</td></tr><tr><td><code>--compress-min-saving</code></td><td><code>--cms</code></td><td>Percent a block or file must get smaller, otherwise it is stored uncompressed</td><td><code>5</code></td><td>0 - 99</td></tr></tbody></table></div>
<p>Larger blocks compress better, because a block can only reference data inside of itself. Above 64 KB the gain is very small.</p>
<p><code>--compress-min-saving</code> avoids compression that isn't worth the time it takes to decompress: a block is only stored compressed if it gets at least this many percent smaller, otherwise it is stored raw. The same applies to the whole file, a file that doesn't get small enough is stored completely uncompressed. With <code>0</code> every saved byte counts.</p>
<h2>Incremental build</h2>
<div class="table-wrapper"><table><thead><tr><th>Argument</th><th>Short</th><th>Description</th><th>Type</th><th>Default</th></tr></thead><tbody><tr><td><code>--cache-dir</code></td><td><code>--cd</code></td><td>Directory of the build cache, enables incremental builds</td><td>filepath</td><td>—</td></tr><tr><td><code>--rebuild</code></td><td><code>--rb</code></td><td>Builds all archives, also the ones that are up to date</td><td>bool</td><td>false</td></tr></tbody></table></div>
<p>With <code>--cache-dir</code> only the archives whose files or settings changed are built, see <em>Packing Assets</em>. Without it every archive is built.</p>
<h2>Values</h2>
<ul><li><strong>bool</strong> arguments can be used without a value: <code>--verbose</code> is the same as <code>--verbose true</code>. Accepted values are <code>true</code>/<code>false</code>, <code>1</code>/<code>0</code>, <code>yes</code>/<code>no</code> and <code>y</code>/<code>n</code> (case insensitive). Anything else is an error, so a forgotten value like <code>--mkdir ./assets</code> is reported instead of silently being <code>false</code>.</li><li><strong>int</strong> arguments must be plain decimal numbers (<code>65536</code>, not <code>64k</code>).</li><li>All other arguments require a value.</li><li>Arguments and paths can contain any Unicode characters.</li><li>Paths with spaces must be quoted: <code>--source &quot;C:\Program Files\Game\assets&quot;</code>. On Windows a path in quotes must not end with <code>\</code> (<code>&quot;C:\assets\&quot;</code>), because <code>\&quot;</code> is read as a quote character.</li></ul>
<h2>Modes</h2>
<p>Exactly one mode must be active per invocation. Modes are determined by which arguments are provided:</p>
<div class="table-wrapper"><table><thead><tr><th>Mode</th><th>Required arguments</th><th>Optional arguments</th></tr></thead><tbody><tr><td>pack</td><td><code>--source</code> and <code>--output</code></td><td><code>--name</code>, <code>--mkdir</code>, <code>--verbose</code>, <code>--store-names</code>, <code>--compress</code>, <code>--compress-*</code>, <code>--cache-dir</code>, <code>--rebuild</code></td></tr><tr><td>extract</td><td><code>--extract</code> and <code>--output</code></td><td><code>--mkdir</code>, <code>--verbose</code></td></tr><tr><td>info</td><td><code>--info</code></td><td><code>--verbose</code></td></tr><tr><td>verify</td><td><code>--verify</code></td><td><code>--verbose</code></td></tr><tr><td>help</td><td><code>--help</code></td><td>—</td></tr></tbody></table></div>
<p>Combining arguments from multiple modes (e.g. <code>--source</code> together with <code>--info</code>) is an error.</p>
<h2>Exit code</h2>
<p>The tool returns <code>0</code> on success and <code>1</code> on any error, so it can be used in build scripts.</p>
<p>Errors are printed as <code>[Error] &lt;message&gt;</code>. Several errors at once, e.g. more than one invalid argument, are listed below a short description:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>[Error] Invalid arguments:
  - Unknown argument &#39;foo&#39;
  - Invalid value &#39;10k&#39; for argument &#39;cbs&#39;</code></pre></div>
<h2>Command line priority</h2>
<p>When <code>--store-names</code> or <code>--compress</code> is set on the command line, the option is forced on for every archive regardless of what the <code>.sfpak.meta</code> file specifies. The meta-file value is only used when the CLI flag is absent.</p>
<p>The <code>--compress-*</code> settings replace the meta file values for all archives when they are set.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1ku1de5w2cswv1sn">
  <div class="main" data-node-id="node_mu3td1ku1de5w2cswv1sn" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1ku1de5w2cswv1sn" class="export-section">
    
    <div class="export-section__body"><h1>Architecture</h1>
<p>StaticForge is split into two main components.</p>
<h2>StaticForgeCore</h2>
<p>The core static library. Contains all format logic and is linked by both the tool and any consuming application:</p>
<ul><li>Archive format definition and binary layout</li><li><code>StaticForgeBuilder</code> - writes <code>.sfpak</code> files</li><li><code>StaticForgeReader</code> - reads and validates <code>.sfpak</code> files</li><li><code>StaticForgeArchive</code> - runtime handle for an open archive</li><li><code>StaticForgeConcurrentArchive</code> - runtime handle that can be used from several threads at once</li><li><code>StaticForgeArchiveSet</code> / <code>StaticForgeConcurrentArchiveSet</code> - load from several archives as if they were one</li><li>Meta file parsing (<code>StaticForgeMeta</code>)</li><li>Archive core (<code>Internal/ArchiveCore</code>): the loaded archive data, shared between archive objects, and the asset loading logic</li><li>Internal helpers: hashing, alignment, endian handling, compression, memory mapping, error support</li></ul>
<p>Only the headers directly in <code>include/StaticForgeCore/</code> are part of the public API. The <code>Internal/</code> headers are not included in the SDK release packages.</p>
<h2>StaticForgeTool</h2>
<p>The CLI executable. Wraps <code>StaticForgeCore</code> with argument parsing and five modes: pack, extract, info, verify, help. Does not contain any format logic itself.</p>
<p><code>Utf8Console</code> makes the tool work with Unicode on Windows: it reads the command line arguments as UTF-8 and switches the console output to UTF-8 while the tool runs. On other platforms the arguments already are UTF-8.</p>
<h2>StaticForgeTests</h2>
<p>A console application with the tests of the library, built with its own small test framework (<code>TEST_CASE</code>, <code>CHECK</code>, <code>REQUIRE</code>). Slow tests are marked with <code>STRESS_TEST</code> and only run with <code>--stress</code>. The tests also use the internal headers, e.g. to test the compressor directly. The normal tests run in the CI on every push (<code>.github/workflows/tests.yml</code>) and before every release.</p>
<h2>Dependency graph</h2>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>StaticForgeTool
    └── StaticForgeCore
            ├── StaticForgeBuilder
            ├── StaticForgeReader
            ├── StaticForgeArchive
            ├── StaticForgeConcurrentArchive
            ├── StaticForgeArchiveSet / StaticForgeConcurrentArchiveSet
            └── Internal (archive core, set index, thread errors, build cache, helpers, meta, hashing, compression, mmap)

Your Game / Application
    └── StaticForgeCore
            ├── StaticForgeReader
            ├── StaticForgeArchive / StaticForgeConcurrentArchive
            └── StaticForgeArchiveSet / StaticForgeConcurrentArchiveSet (optional)</code></pre></div>
<p>The tool-side classes (<code>StaticForgeBuilder</code>, meta parsing) are compiled into Core but an application that only reads archives still links the same library - there is currently no separate runtime-only build target.</p>
<h2>Platforms</h2>
<p>Tested on Windows (MSVC) and Linux (GCC, Ubuntu). Archives are byte-identical across platforms: the same sources give the same archive on Windows and Linux (the files are sorted by path), and an archive packed on Windows can be loaded on Linux and the other way around.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1kuuhnvwc15ryskk">
  <div class="main" data-node-id="node_mu3td1kuuhnvwc15ryskk" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1kuuhnvwc15ryskk" class="export-section">
    
    <div class="export-section__body"><h1>File Format</h1>
<p>A <code>.sfpak</code> file consists of three required regions and three optional regions written sequentially: <strong>Header</strong>, <strong>Index</strong>, <strong>Data</strong>, and — when name storage is enabled — <strong>Name Table Header</strong>, <strong>Name Table Entries</strong>, and <strong>Name Table String Data</strong>.</p>
<p>All integers are stored little-endian on all platforms.</p>
<h2>Layout</h2>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>[ HEADER                 ]  52 bytes, padded to a multiple of ALIGNMENT_HEADER = 32 (64 bytes)
[ INDEX                  ]  N × 40 bytes, then padded to ALIGNMENT_FILE = 4096
[ DATA BLOCKS            ]  files written back-to-back, each padded to ALIGNMENT_FILE = 4096
[ NAME TABLE HEADER      ]  optional — present when store-names is enabled
[ NAME TABLE ENTRIES     ]  optional — one entry per file
[ NAME TABLE STRING DATA ]  optional — raw UTF-8 path strings packed together</code></pre></div>
<h2>Header</h2>
<p>Magic bytes <code>SFPK</code> followed by six <code>uint64_t</code> fields.</p>
<div class="table-wrapper"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><code>magic</code></td><td><code>char[4]</code></td><td>Always <code>S</code>, <code>F</code>, <code>P</code>, <code>K</code></td></tr><tr><td><code>version</code></td><td><code>uint64_t</code></td><td>Format version (currently <code>3</code>)</td></tr><tr><td><code>fileCount</code></td><td><code>uint64_t</code></td><td>Number of files in this archive</td></tr><tr><td><code>indexOffset</code></td><td><code>uint64_t</code></td><td>Byte offset to the start of the index</td></tr><tr><td><code>indexSize</code></td><td><code>uint64_t</code></td><td>Total size of the index in bytes (<code>fileCount × 40</code>)</td></tr><tr><td><code>dataOffset</code></td><td><code>uint64_t</code></td><td>Byte offset to the start of data</td></tr><tr><td><code>nameTableHeaderOffset</code></td><td><code>uint64_t</code></td><td>Byte offset to the Name Table Header, or <code>0</code> if not present</td></tr></tbody></table></div>
<p>The reader only accepts archives with exactly its own <code>version</code>. The format is not backward compatible, archives are rebuilt with the application that uses them.</p>
<h2>Index entry</h2>
<p>One 40-byte entry per file, stored contiguously starting at <code>indexOffset</code>.</p>
<div class="table-wrapper"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><code>hashName</code></td><td><code>uint64_t</code></td><td>64-bit FNV-1a hash of the relative file path</td></tr><tr><td><code>fileOffset</code></td><td><code>uint64_t</code></td><td>Byte offset of the file's data block relative to <code>dataOffset</code></td></tr><tr><td><code>fileSize</code></td><td><code>uint64_t</code></td><td>Original (uncompressed) file size in bytes</td></tr><tr><td><code>compressedFileSize</code></td><td><code>uint64_t</code></td><td>Total bytes on disk including the framing headers. <code>0</code> means stored uncompressed</td></tr><tr><td><code>filePadding</code></td><td><code>uint32_t</code></td><td>Padding bytes appended after the file data to reach the next 4096-byte boundary</td></tr><tr><td><code>checksum</code></td><td><code>uint32_t</code></td><td>32-bit FNV-1a checksum of the data as written on disk (covers framing headers + compressed data)</td></tr></tbody></table></div>
<h2>Data blocks</h2>
<p>Each file occupies one data block starting at <code>dataOffset + fileOffset</code>. The block is always padded with zero bytes to the next 4096-byte boundary; the padding size is stored in <code>filePadding</code>.</p>
<p>When <code>compressedFileSize == 0</code> the block contains the raw file bytes verbatim.</p>
<p>When <code>compressedFileSize != 0</code> the block contains a sequence of independently compressed chunks:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>[ CHUNK 0 ][ CHUNK 1 ][ ... ][ CHUNK N ]</code></pre></div>
<p>Each chunk has the following layout:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>[ compressedSize : uint32_t ]  size of the compressed payload that follows
[ originalSize   : uint32_t ]  size of the decompressed output for this chunk
[ payload        : bytes    ]  compressedSize bytes of compressed data, or the raw bytes if compressedSize == originalSize</code></pre></div>
<p>Chunks are produced by splitting the original file into pieces of the compression block size (default 64 KB, at most <code>MAX_COMPRESSION_BLOCK_SIZE</code>) and compressing each piece independently. The decompressor reads chunks sequentially until all <code>compressedFileSize</code> bytes are consumed. Because each chunk carries its own original size, the reader does not need to know the block size that was used for packing. A chunk with <code>compressedSize == originalSize</code> is stored raw (it didn't get small enough when packing) and is copied instead of decompressed.</p>
<p>The FNV-1a checksum covers all chunk bytes as written on disk — framing headers included — so integrity is verified before any decompression takes place.</p>
<blockquote><strong>Note:</strong> Compressed data blocks cannot be accessed via memory mapping. Use the stream-based <code>LoadAsset</code> API which handles decompression automatically.</blockquote>
<h2>Name Table Header</h2>
<p>Present only when the archive was built with name storage enabled. Located at <code>nameTableHeaderOffset</code>.</p>
<div class="table-wrapper"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><code>entryOffset</code></td><td><code>uint64_t</code></td><td>Byte offset to the first Name Table Entry</td></tr><tr><td><code>stringDataOffset</code></td><td><code>uint64_t</code></td><td>Byte offset to the start of the compressed String Data</td></tr><tr><td><code>stringDataSize</code></td><td><code>uint64_t</code></td><td>Size of the String Data after decompression</td></tr><tr><td><code>stringDataCompressedSize</code></td><td><code>uint64_t</code></td><td>Size of the compressed String Data in the file</td></tr></tbody></table></div>
<h2>Name Table Entry</h2>
<p>One 16-byte entry per file, stored contiguously starting at <code>entryOffset</code>, in the same order as the index.</p>
<div class="table-wrapper"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><code>hash</code></td><td><code>uint64_t</code></td><td>FNV-1a hash of the path (matches <code>hashName</code> in the corresponding index entry)</td></tr><tr><td><code>nameLength</code></td><td><code>uint32_t</code></td><td>Length of the UTF-8 path string in bytes</td></tr><tr><td><code>nameOffset</code></td><td><code>uint32_t</code></td><td>Byte offset within the decompressed String Data where this path starts</td></tr></tbody></table></div>
<h2>Name Table String Data</h2>
<p>UTF-8 path strings packed end-to-end with no separators. The whole block is compressed as one piece with the same compression as the file data (without framing header), because paths usually share long prefixes and compress very well (often to 20 - 50 %). If it doesn't get small enough (e.g. only a few short names), it is stored raw and <code>stringDataCompressedSize == stringDataSize</code>.</p>
<p>To read a filename, read <code>stringDataCompressedSize</code> bytes at <code>stringDataOffset</code>, decompress them to <code>stringDataSize</code> bytes (or use them directly if both sizes are equal), then take <code>nameLength</code> bytes at <code>nameOffset</code>. Paths use <code>/</code> as separator and are relative to the source folder.</p>
<h2>Alignment</h2>
<ul><li>The header region is padded to a multiple of 32 bytes (<code>ALIGNMENT_HEADER</code>), which makes it 64 bytes.</li><li>Every file data block is padded to 4096 bytes (<code>ALIGNMENT_FILE</code>) — one filesystem page.</li><li>Padding bytes are always zero.</li></ul>
<p>This alignment ensures that file offsets are always multiples of 4096, which allows direct memory-mapped access for uncompressed assets without additional alignment work.</p>
<h2>Validation</h2>
<p><code>StaticForgeReader::Load</code> checks the archive against the real file size before allocating any memory:</p>
<ul><li><code>indexSize</code> must match <code>fileCount × 40</code>, and the index must be inside the file.</li><li><code>dataOffset</code> and the name table must be inside the file.</li><li>The data of every index entry must be inside the file, and every hash must be unique.</li><li>The compressed string data must be inside the file, and <code>stringDataSize</code> must be possible for its compressed size (at most <code>compressedSize × 13108</code>).</li><li>Every name must be inside the decompressed string data.</li></ul>
<p>When loading a compressed entry, every chunk's <code>originalSize</code> must be at most <code>MAX_COMPRESSION_BLOCK_SIZE</code> and the sum must match <code>fileSize</code>. A corrupted archive is rejected with an error instead of crashing.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1kucsyh3x1ldzws1">
  <div class="main" data-node-id="node_mu3td1kucsyh3x1ldzws1" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1kucsyh3x1ldzws1" class="export-section">
    
    <div class="export-section__body"><h1>Hashing</h1>
<p>StaticForge uses <strong>FNV-1a</strong> (Fowler–Noll–Vo) for two purposes: filename lookup (64 bit) and data integrity (32 bit).</p>
<h2>Filename hashing</h2>
<p>When the builder packs a file, the relative path string (e.g. <code>textures/background.png</code>) is hashed with <strong>64-bit FNV-1a</strong> (offset basis <code>14695981039346656037</code>, prime <code>1099511628211</code>) and stored in the index as <code>hashName</code>.</p>
<p>At runtime, <code>StaticForgeArchive::LoadAsset</code> hashes the key string you pass in and looks it up in the index map. Unless the archive was built with <code>store-names</code>, the original string is not stored in the archive.</p>
<p><strong>Implications:</strong><br><ul><li>Lookups are O(1) via <code>std::unordered_map</code>.</li><li>Without a name table the archive cannot list filenames - only validate whether a known key exists. <code>--info --verbose</code> and <code>--extract</code> then show the hash instead (16 hex digits).</li><li>Hash collisions between two different paths of one build are detected at build time and cause an error. With 64 bit they are practically impossible (even with 100 000 files the probability is below one in a billion).</li></ul></p>
<h2>Data checksum</h2>
<p>During packing, each file's bytes as written to disk are fed through <strong>32-bit FNV-1a</strong> with the initial value <code>2166136261</code> to produce a <code>uint32_t</code> checksum. This is written into the index entry.</p>
<p>When loading, <code>StaticForgeArchive::LoadEntry</code> recomputes the checksum over the read bytes and compares it to the stored value. A mismatch causes <code>LoadAsset</code> to return <code>false</code> with an error message. Partial loads (<code>LoadAssetRange</code>) don't validate the checksum, because it covers the whole stored data.</p>
<p>The checksum detects accidental damage. It is not a cryptographic signature and does not protect against intentional changes.</p>
<h2>Path format</h2>
<p>Use a path <strong>relative to the source root</strong> used during packing. The path is UTF-8 and case sensitive, backslashes are converted to forward slashes before hashing.</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// Correct</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">textures/background.png"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">data</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// Also valid</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">textures</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__escape">\\</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">background.png"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">data</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// Wrong - path is not relative to the source root</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets/textures/background.png"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">data</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div></div>
  </section>
