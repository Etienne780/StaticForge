<template id="tmpl-node_mu3td1kulgv50d577zxf">
  <div class="main" data-node-id="node_mu3td1kulgv50d577zxf" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1kulgv50d577zxf" class="export-section">
    
    <div class="export-section__body"><h1>Build Process</h1>
<p><code>StaticForgeBuilder::Build()</code> resets the data of a previous build, then runs the internal phases below in sequence.</p>
<h2>1. CheckCompressionSettings</h2>
<p>Validates the compression settings set on the builder (block size, table size, min match length) against the <code>MIN_COMPRESSION_*</code> / <code>MAX_COMPRESSION_*</code> ranges. Settings that are not set are skipped.</p>
<h2>2. CheckFilepaths</h2>
<p>Validates that:</p>
<ul><li>the default archive name is a valid file name (no <code>/</code> or <code>\</code>, not <code>.</code> or <code>..</code>)</li><li>all source paths exist and are directories</li><li>the output path is not an archive file path (ending with <code>.sfpak</code>) and, if it exists, is a directory</li></ul>
<p>A missing output directory is only an error if <code>SetCreateOutputDir(true)</code> was not called. The directory is created later in <code>CreateOutputDir</code>, so a build that fails while scanning leaves nothing behind.</p>
<h2>3. ScanFiles</h2>
<p>Each source directory is read <strong>once</strong> into a list of files. Read errors are reported as build errors. The list is sorted by the UTF-8 path, because every file system returns the files in a different order. Then two passes run over these lists:</p>
<p><strong>Pass 1 — Meta collection:</strong>  <br>Collects all files ending with <code>.sfpak.meta</code> and builds a <code>directory → StaticForgeMetaData</code> mapping. Each entry stores the archive name, excluded extensions, the <code>store-names</code> and <code>compress</code> flags and the optional compression settings. Archive names and compression settings are validated here.</p>
<p><strong>Pass 2 — File assignment:</strong>  <br>Iterates all non-meta files, computes their relative path (from the path itself, so a symbolic link to a file is stored under its own path with the content of its target), hashes it with 64-bit FNV-1a, and assigns each file to the appropriate <code>ArchiveGroup</code> by walking up the directory tree until a meta entry is found. Falls back to the default archive name if no meta file applies.</p>
<p>For each file the builder also:<br><ul><li>Skips files whose name ends with one of the excluded extensions (case insensitive).</li><li>Reports an error if the same relative path occurs more than once in the build, also if the files go into different archives (e.g. two <code>--source</code> folders that both contain <code>textures/hero.png</code>). It can't be decided which of the files is the right one.</li><li>Reports an error on hash collisions between different paths.</li><li>Applies the overrides when an archive group is created:<ul><li><code>store-names</code> and <code>compress</code>: if the global flag is set, it is forced on even when the meta file sets it to <code>false</code>.</li><li>compression settings: builder value → meta file value → default.</li></ul></li></ul></p>
<p>At the end the files of every archive group are sorted by their relative path (UTF-8 byte order), also when they come from several source paths. The same sources therefore always give the same archive, byte for byte, on every system.</p>
<h2>4. CheckUpToDate</h2>
<p>Only runs with a cache directory (<code>SetCacheDir</code>). For every archive group the cache file <code>&lt;cache dir&gt;/&lt;archive name&gt;.sfcache</code> is read and compared in this order, the first difference is the reason for the build:</p>
<ol><li><code>SetRebuild(true)</code> was called</li><li>the cache file is missing or can't be parsed, or has another cache version</li><li>the archive format version (<code>VERSION</code>), the absolute output path or the settings are different</li><li>the archive file is missing, or its size or modification time is different</li><li>the file list is different (both lists are sorted by path)</li><li>the size of a file is different</li><li>the modification time of a file is different and the 64-bit FNV-1a hash of its content as well</li></ol>
<p>If only the modification time of a file changed, the archive is up to date and only its cache file is written again with the new time. Archives that are up to date are skipped by all following phases.</p>
<p>Cache files in the cache directory without an archive group of this build belong to archives that are not built anymore. If the cache file is valid and contains the same output directory, the archive and its cache file are deleted in <code>RemoveOldArchives</code> after the build.</p>
<p>The cache file is text:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>StaticForgeCache 1
format 3
output D:/dev/game/build/packed
settings store-names=1 compress=1 block-size=65536 table-size=16 min-match=8 min-saving=10 exclude=.psd
archive 41100 134364826999478632
files 3
20000 134364826980778712 af8f0deb8b372d7b textures/hero.png
9000 134364826981220378 87ddee1928e25947 textures/ui/button.png
23492 134364826981425961 499fa1f519db8fe5 textures/ui/theme.txt</code></pre></div>
<div class="table-wrapper"><table><thead><tr><th>Line</th><th>Content</th></tr></thead><tbody><tr><td><code>StaticForgeCache</code></td><td>version of the cache file format (<code>BUILD_CACHE_VERSION</code>)</td></tr><tr><td><code>format</code></td><td>archive format version</td></tr><tr><td><code>output</code></td><td>absolute output directory</td></tr><tr><td><code>settings</code></td><td>settings of the archive that are used for the build</td></tr><tr><td><code>archive</code></td><td>size and modification time of the archive file</td></tr><tr><td><code>files</code></td><td>number of files, followed by one line per file: size, modification time, content hash (hex) and the relative path (rest of the line)</td></tr></tbody></table></div>
<p>Modification times are the raw values of the file clock (<code>std::filesystem::file_time_type</code>), so a cache file is only valid on the system that wrote it. The content hash is calculated while the file is written into the archive, no extra read is needed.</p>
<h2>5. CreateOutputDir</h2>
<p>Creates the output directory and its missing parents if <code>SetCreateOutputDir(true)</code> was called. The created directories are remembered, so they can be removed again if the build fails.</p>
<h2>6. CreateGroups</h2>
<p>The archive groups are written in order of their name. For each <code>ArchiveGroup</code> the temporary file <code>&lt;output&gt;/&lt;archive name&gt;.sfpak.tmp</code> is created and the following phases run in order:</p>
<p><strong>CalculateDataStart</strong> — computes the byte offset at which file data begins. This is the sum of the aligned header size and the index table size, rounded up to the next 4096-byte boundary.</p>
<p><strong>WriteData</strong> — writes <code>dataStart</code> bytes of zero-padding to reserve space for the header and index, then writes all file data blocks. During this pass, <code>blockOffset</code>, <code>filePadding</code>, <code>checksum</code>, and <code>compressedFileSize</code> are filled in on each file entry so the index can be written correctly afterwards.</p>
<p><strong>WriteHeader</strong> — seeks back to offset <code>0</code> and writes the <code>StaticForgeHeader</code> struct, padded to a multiple of 32 bytes.</p>
<p><strong>WriteIndex</strong> — writes one <code>StaticForgeIndexEntry</code> per file directly after the header. Checksums computed during <code>WriteData</code> are included here — no second seek is needed.</p>
<p><strong>BuildNameTable</strong> <em>(optional, when store-names is enabled)</em> — computes the byte layout of the Name Table Header, Name Table Entries, and String Data region, and compresses all names as one block. Offsets are appended after the last data block.</p>
<p><strong>WriteNameTable</strong> <em>(optional)</em> — seeks to <code>nameTableStart</code> (set at the end of <code>WriteData</code>) and writes the Name Table Header, Name Table Entries, and the compressed UTF-8 string data.</p>
<h2>7. CommitArchives</h2>
<p>When all archives are written, every temporary file is renamed to <code>&lt;archive name&gt;.sfpak</code> and replaces the old archive.</p>
<h2>8. WriteCacheFiles</h2>
<p>Only runs with a cache directory. Writes the cache files of the built archives and of the archives whose cache changed, each to a temporary file that is renamed when it is complete. The cache directory is created if it is missing.</p>
<h2>9. RemoveOldArchives</h2>
<p>Only runs with a cache directory. Deletes the archives found by <code>CheckUpToDate</code> that are not built anymore, together with their cache files.</p>
<p>If any phase from <code>CreateOutputDir</code> on fails, all temporary files are removed and the directories created by <code>CreateOutputDir</code> are removed again if they are empty. The old archives stay as they were, unless the error happens while renaming: the archives renamed until then are already replaced. The cache files of a failed build stay as they were, so the next build checks the archives again.</p>
<h2>Write phases summary</h2>
<div class="table-wrapper"><table><thead><tr><th>Phase</th><th>Seeks to</th><th>What it writes</th></tr></thead><tbody><tr><td><code>WriteData</code></td><td><code>0</code> (start)</td><td><code>dataStart</code> zero-padding, then all file data blocks in order</td></tr><tr><td><code>WriteHeader</code></td><td><code>0</code> (seekp back)</td><td><code>StaticForgeHeader</code> struct padded to a multiple of 32 bytes</td></tr><tr><td><code>WriteIndex</code></td><td>after header</td><td>One <code>StaticForgeIndexEntry</code> per file, including computed checksums</td></tr><tr><td><code>WriteNameTable</code></td><td><code>nameTableStart</code> (seekp forward)</td><td>Name Table Header, Name Table Entries, compressed UTF-8 string data</td></tr></tbody></table></div>
<h2>Compression</h2>
<p>When compression is enabled for an archive group (via the meta file or the global <code>SetCompress</code> flag), files larger than 4096 bytes are compressed. Compression is applied per block during <code>WriteData</code>:</p>
<ul><li>The file is read in blocks of the compression block size (default 64 KB) and each block is compressed independently.</li><li>Each compressed block is prefixed with a framing header: <code>[uint32_t compressedSize][uint32_t originalSize]</code> (little-endian).</li><li>The raw compressed bytes follow immediately after the framing header.</li><li>A block that doesn't get at least <code>compress-min-saving</code> percent smaller (default 5 %) is stored raw instead. It is marked by <code>compressedSize == originalSize</code>; a compressed block never has this size, because it would not be small enough.</li><li>If the whole file (framing headers included) doesn't get at least <code>compress-min-saving</code> percent smaller, the builder seeks back to the start of the file in the archive and writes it again uncompressed (<code>compressedFileSize = 0</code>). Only files that don't compress well are read twice. Because the compressed attempt can be a few bytes longer, the archive is cut to its real size with <code>std::filesystem::resize_file</code> after writing.</li><li><code>compressedFileSize</code> in the index entry is set to the total number of bytes written for the file, <strong>including</strong> the framing headers. A value of <code>0</code> means the entry is stored uncompressed.</li></ul>
<p>The per-block approach means the decompressor can process one block at a time.</p>
<p>The FNV-1a checksum covers the framing headers and compressed block data as written, so integrity verification happens before decompression.</p>
<p>The name table string data uses the same rule: if it doesn't get small enough, it is stored raw and <code>stringDataCompressedSize == stringDataSize</code>.</p>
<h3>Compressor</h3>
<p>The compressor (<code>Internal::LZ4Compression</code>) is an LZ77 compressor inspired by LZ4, with its own simple format:</p>
<div class="table-wrapper"><table><thead><tr><th>Block</th><th>Layout</th><th>Meaning</th></tr></thead><tbody><tr><td>literal</td><td><code>[0x01][len:u16][len bytes]</code></td><td>Bytes stored as they are</td></tr><tr><td>match</td><td><code>[0x02][distance:u16][len:u16]</code></td><td>Copy <code>len</code> bytes from <code>distance</code> bytes back</td></tr><tr><td>end</td><td><code>[0x00]</code></td><td>End of the compressed block</td></tr></tbody></table></div>
<p>For every position the compressor looks up the last position of the same 4-byte sequence in a hash table (<code>compress-table-size</code>). A match is extended as far as possible and only stored if it is at least <code>compress-min-match</code> bytes long — shorter matches would take more space than storing the bytes as literals. A match can only reference data inside the same block and at most 65535 bytes back.</p>
<p>The hash table is only allocated when compressing and is reset per block with a generation counter instead of clearing the whole table.</p>
<h2>Overflow safety</h2>
<p>All size and offset arithmetic uses checked helpers that return <code>false</code> on overflow instead of wrapping silently:</p>
<div class="table-wrapper"><table><thead><tr><th>Helper</th><th>Description</th></tr></thead><tbody><tr><td><code>SafeAddU64</code></td><td>Addition with overflow check</td></tr><tr><td><code>SafeMulU64</code></td><td>Multiplication with overflow check</td></tr><tr><td><code>SafeAlignSize</code></td><td>Rounds up to a power-of-two alignment, overflow-safe</td></tr><tr><td><code>GetHeaderSize</code></td><td>Returns the aligned header size via <code>SafeAlignSize</code></td></tr></tbody></table></div>
<p>Any overflow causes <code>Build()</code> to return <code>false</code> with a descriptive error.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1ku1hsv9km18cfhyf">
  <div class="main" data-node-id="node_mu3td1ku1hsv9km18cfhyf" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1ku1hsv9km18cfhyf" class="export-section">
    
    <div class="export-section__body"><h1>Meta File Parser</h1>
<p>Meta files use a minimal custom format parsed by <code>StaticForgeMeta</code> inside <code>StaticForgeCore</code>.</p>
<h2>Syntax</h2>
<p>Each statement is a key-value pair terminated by a semicolon:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>key = value;</code></pre></div>
<p>Multiple statements can appear in any order:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>archive = main;
exclude = .png, .jpg, .vert, .help;
store-names = true;</code></pre></div>
<p>Comments start with <code>#</code> and run to the end of the line:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code># this is a comment
archive = main; # this is also a comment</code></pre></div>
<h2>Tokenizer</h2>
<p><code>MetaTokenizer</code> reads the entire file into memory (skipping a UTF-8 BOM), then walks it character by character via <code>ProcessContent</code> → <code>ProcessChar</code>. It tracks the current line and column for error reporting and produces a flat <code>std::vector&lt;MetaToken&gt;</code>. Columns count characters, not bytes, so multi-byte UTF-8 characters count as one column.</p>
<p><strong>Character dispatch (<code>ProcessChar</code>):</strong></p>
<div class="table-wrapper"><table><thead><tr><th>Input</th><th>Action</th></tr></thead><tbody><tr><td>Whitespace (<code>\r</code>, <code>\n</code>, <code> </code>, <code>\t</code>)</td><td>Skipped; newlines increment the line counter</td></tr><tr><td><code>=</code></td><td>Emit <code>Assign</code></td></tr><tr><td><code>,</code></td><td>Emit <code>Separator</code></td></tr><tr><td><code>;</code></td><td>Emit <code>Delimiter</code></td></tr><tr><td><code>#</code></td><td>Call <code>SkipComment</code> — consume until <code>\n</code></td></tr><tr><td>Letter, digit, <code>_</code>, <code>.</code>, <code>-</code>, UTF-8 byte</td><td>Call <code>ReadIdentifier</code></td></tr><tr><td>Anything else</td><td>Add error, emit <code>UNKNOWN</code></td></tr></tbody></table></div>
<p><strong><code>ReadIdentifier</code>:</strong> records the start pointer, then advances <code>m_cur</code> while the character is an identifier character (<code>IsIdentifierChar</code>: alphanumeric, <code>_</code>, <code>.</code>, <code>-</code> or a byte ≥ <code>0x80</code>, which is part of a UTF-8 character). The resulting <code>string_view</code> into the in-memory buffer is stored in the token without any heap allocation.</p>
<p><strong>Token types:</strong></p>
<div class="table-wrapper"><table><thead><tr><th>Token type</th><th>Description</th></tr></thead><tbody><tr><td><code>Identifier</code></td><td>An unquoted word — keys, values, extensions, booleans, numbers</td></tr><tr><td><code>Assign</code></td><td>The <code>=</code> character</td></tr><tr><td><code>Separator</code></td><td>The <code>,</code> character (used between list values like extensions)</td></tr><tr><td><code>Delimiter</code></td><td>The <code>;</code> character — terminates a statement</td></tr><tr><td><code>EndOfFile</code></td><td>Sentinel appended after the last character</td></tr><tr><td><code>UNKNOWN</code></td><td>Unrecognised character; always accompanied by an error</td></tr></tbody></table></div>
<p>Every token stores its <strong>line</strong> and <strong>column</strong> at the point it was emitted.</p>
<h2>Parser</h2>
<p><code>StaticForgeMeta::ParseTokens</code> consumes the token stream produced by <code>MetaTokenizer</code>. Each statement follows this pattern:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>Identifier(key)  Assign  Identifier(value)  Delimiter</code></pre></div>
<p>For list values (e.g. <code>exclude</code>) the value section is instead:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>Identifier  Separator  Identifier  Separator  ...  Identifier  Delimiter</code></pre></div>
<p>Any deviation — wrong token type, unexpected <code>EndOfFile</code>, missing <code>Delimiter</code> — is a parse error. Errors include the line and column of the offending token, also a missing or invalid value:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>Missing value for &#39;compress&#39; at line: 2, column: 1
Failed to parse value &#39;5&#39; of &#39;compress&#39; at line: 2, column: 1</code></pre></div>
<h2>Error suggestions</h2>
<p>If a key is not recognised, the parser compares it with every known key. Separators (<code>-</code>, <code>_</code>, space) and case are ignored, and the names are compared character by character. If the lengths differ by at most 3 and at most 3 characters are different, a suggestion is appended to the error:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>Unknown identifier &#39;archiv&#39; at line: 1, column: 1. Did you mean &#39;archive&#39;?</code></pre></div>
<h2>Supported parameters</h2>
<div class="table-wrapper"><table><thead><tr><th>Key</th><th>Type</th><th>Required</th><th>Description</th></tr></thead><tbody><tr><td><code>archive</code></td><td>string</td><td>yes</td><td>Name for the <code>.sfpak</code> archive</td></tr><tr><td><code>exclude</code></td><td>string[]</td><td>no</td><td>Comma-separated list of file extensions to skip</td></tr><tr><td><code>store-names</code></td><td>bool</td><td>no</td><td>Store original filenames in the archive for debug inspection and extraction</td></tr><tr><td><code>compress</code></td><td>bool</td><td>no</td><td>Compress files larger than 4096 bytes</td></tr><tr><td><code>compress-block-size</code></td><td>uint</td><td>no</td><td>Compression block size in bytes</td></tr><tr><td><code>compress-table-size</code></td><td>uint</td><td>no</td><td>Compressor match table size as power of two</td></tr><tr><td><code>compress-min-match</code></td><td>uint</td><td>no</td><td>Shortest match the compressor stores as reference</td></tr><tr><td><code>compress-min-saving</code></td><td>uint</td><td>no</td><td>Percent a block or file must get smaller to be stored compressed</td></tr></tbody></table></div>
<h2>Value parsing</h2>
<p><strong><code>archive</code></strong> — the <code>Identifier</code> token value is used as-is. The builder rejects names containing <code>/</code> or <code>\</code> and the names <code>.</code> and <code>..</code>.</p>
<p><strong><code>exclude</code></strong> — after the <code>=</code>, the parser collects <code>Identifier</code> tokens separated by <code>Separator</code> (<code>,</code>) tokens until it sees a <code>Delimiter</code> (<code>;</code>). Each value is lowercased and a missing leading dot is added, so <code>.PNG</code>, <code>.png</code> and <code>png</code> are treated identically.</p>
<p><strong><code>store-names</code>, <code>compress</code></strong> — the single <code>Identifier</code> token after <code>=</code> is compared case-insensitively. Only <code>true</code> and <code>false</code> are valid, anything else is a parse error.</p>
<p><strong><code>compress-block-size</code>, <code>compress-table-size</code>, <code>compress-min-match</code>, <code>compress-min-saving</code></strong> — parsed with <code>std::from_chars</code> as an unsigned decimal number. The whole value has to be a number (<code>64k</code> or <code>-5</code> are errors). The builder checks the value against the valid range.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1ku1t629jd11ytz7k">
  <div class="main" data-node-id="node_mu3td1ku1t629jd11ytz7k" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1ku1t629jd11ytz7k" class="export-section">
    
    <div class="export-section__body"><h1>StaticForgeArchive</h1>
<p><code>StaticForgeArchive</code> is the runtime handle for a loaded <code>.sfpak</code> file. It is populated by <code>StaticForgeReader::Load</code> and then used to retrieve asset data.</p>
<h2>Ownership, move and Clone</h2>
<p><code>StaticForgeArchive</code> can be moved but not copied, so a copy doesn't open another file handle by accident. Use <code>Clone()</code> for a second archive object:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">a</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">b</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">move</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">a</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// OK</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">c</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">a</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">            </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// compile error</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">d</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">b</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Clone</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// OK, shares the loaded data</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>An archive object can be loaded again with <code>StaticForgeReader::Load</code>. The reader calls the private <code>Reset()</code> first, which closes the stream and releases the mapping, the loaded data and the errors of the previous archive. Clones keep the old data.</p>
<h2>Internal state</h2>
<div class="table-wrapper"><table><thead><tr><th>Member</th><th>Description</th></tr></thead><tbody><tr><td><code>m_data</code></td><td><code>std::shared_ptr&lt;const Internal::ArchiveData&gt;</code>, the loaded data, shared with clones</td></tr><tr><td><code>m_mmap</code></td><td><code>std::shared_ptr&lt;Internal::MmapFile&gt;</code>, the memory mapping, shared with clones</td></tr><tr><td><code>m_stream</code></td><td><code>std::ifstream</code> used for stream-based reads, every archive object has its own</td></tr></tbody></table></div>
<p><code>Internal::ArchiveData</code> (in <code>Internal/ArchiveCore.h</code>) holds everything the reader loads:</p>
<div class="table-wrapper"><table><thead><tr><th>Field</th><th>Description</th></tr></thead><tbody><tr><td><code>path</code></td><td>Path to the <code>.sfpak</code> file on disk</td></tr><tr><td><code>header</code></td><td>Parsed <code>StaticForgeHeader</code> struct</td></tr><tr><td><code>indexEntries</code></td><td><code>std::vector&lt;StaticForgeIndexEntry&gt;</code> — one per file</td></tr><tr><td><code>hashNameToEntry</code></td><td><code>std::unordered_map&lt;uint64_t, size_t&gt;</code> for O(1) lookup</td></tr><tr><td><code>indexToName</code></td><td><code>std::unordered_map&lt;size_t, std::string&gt;</code> for reverse name lookup</td></tr></tbody></table></div>
<p>The data is never changed after loading, so it can be shared between archive objects and threads without locking. If nothing is loaded <code>m_data</code> is <code>nullptr</code> and the getters use empty data.</p>
<p><code>Clone()</code> copies both <code>shared_ptr</code>s. The clone gets its own stream (opened on the first load) and its own errors. <code>CloseMapped()</code> only releases the archive's own reference to the mapping, it is unmapped when the last archive releases it. <code>OpenMapped()</code> on an archive that isn't mapped creates a new mapping.</p>
<p>The loading logic (<code>LoadEntry</code>, <code>LoadEntryRange</code>, <code>DecompressBlocks</code>, <code>VerifyEntry</code>) lives in <code>Internal/ArchiveCore</code> as free functions. They get the data, the entry and an <code>EntrySource</code> (the stream or the mapping), so they can be used by other archive types too. The decompressor is shared, its <code>DecompressTo</code> doesn't change the object and reports errors through a parameter.</p>
<h2>LoadAsset flow</h2>
<ol><li>Normalize the slashes of the key and hash it with <code>HashFilename</code> (64-bit FNV-1a).</li><li>Look up the hash in <code>hashNameToEntry</code> to find the index position.</li><li>Call <code>LoadEntry</code>, which is shared by all full loads (vector or buffer, stream or mapped):</li></ol>
<ul><li>Clear the stream state, so a previous failed read does not break this one.</li><li>If <code>compressedFileSize == 0</code> (uncompressed): read <code>fileSize</code> bytes at <code>dataOffset + fileOffset</code> directly into the target and validate the FNV-1a checksum.</li><li>If <code>compressedFileSize != 0</code> (compressed): read <code>compressedFileSize</code> bytes, validate the checksum, then decompress block by block (<code>DecompressBlocks</code>). Each block is prefixed with <code>[uint32_t compressedSize][uint32_t originalSize]</code> and decompressed independently, directly into the target. A block with <code>compressedSize == originalSize</code> is stored raw and only copied.</li></ul>
<ol><li>With a vector, the block sizes are checked before the vector is resized to <code>fileSize</code>, so a damaged size in the index can't cause a huge allocation. The vector is only changed on success.</li></ol>
<p><code>LoadAssetAt(index, ...)</code> skips steps 1 and 2 and loads the entry at the given index directly.</p>
<p>The buffer variants (<code>LoadAsset(key, buffer, bufferSize)</code>, ...) fail with an error if <code>bufferSize</code> is smaller than <code>fileSize</code>. Only <code>fileSize</code> bytes are written.</p>
<h2>LoadAssetRange flow</h2>
<p><code>LoadEntryRange</code> checks that <code>[offset, offset + size)</code> is inside of <code>fileSize</code> (overflow safe). The checksum is <strong>not</strong> validated, because it covers the whole stored data.</p>
<ul><li>Uncompressed: read <code>size</code> bytes at <code>dataOffset + fileOffset + offset</code>.</li><li>Compressed: <code>DecompressBlocks</code> walks the block frames. Blocks before the range are skipped by reading only their 8 byte frame. Blocks completely inside of the range are decompressed directly into the buffer; the first and last block, if only partly inside, are decompressed into a temporary block buffer and the needed part is copied. The walk stops after the last block of the range.</li></ul>
<p>Reading a range near the end of a large compressed asset reads one frame per block before it, which is small compared to decompressing them.</p>
<h2>LoadAssetMapped / GetAssetMapped flow</h2>
<ol><li>Verify the archive is memory-mapped (<code>IsMapped()</code>).</li><li>Hash the key and look up the index entry.</li><li>Get the pointer with <code>MmapFile::At(offset, size)</code>, which returns <code>nullptr</code> if the range <code>[dataOffset + fileOffset, storedSize]</code> is not inside the mapped file. An empty range at the end of the file is valid.</li><li><code>GetAssetMapped</code> returns a non-owning <code>AssetView</code> pointing directly into mapped memory — no copy. Compressed entries are rejected, because their original data is not in memory.</li></ol>
   <code>LoadAssetMapped</code> uses the same <code>LoadEntry</code> as the stream version, only the stored bytes come from the mapping instead of the stream. It validates the checksum, then copies the bytes or decompresses them directly from the mapping into the target.
<p><code>LoadAssetRangeMapped</code> works like <code>LoadAssetRange</code>, the block frames are read directly from the mapping.</p>
<blockquote>The <code>AssetView</code> is only valid while the archive remains mapped. Call <code>CloseMapped</code> only after you are done with all views.</blockquote>
<p><code>OpenMapped</code> works with relative and absolute paths. On Windows the path is made absolute and prefixed with <code>\\?\</code>, so long paths work too.</p>
<h2>Access method comparison</h2>
<div class="table-wrapper"><table><thead><tr><th>Method</th><th>Compressed</th><th>Allocates</th><th>Copies data</th><th>Checksum</th></tr></thead><tbody><tr><td><code>LoadAsset</code> / <code>LoadAssetAt</code> (vector)</td><td>✅</td><td>✅</td><td>✅</td><td>✅</td></tr><tr><td><code>LoadAsset</code> / <code>LoadAssetAt</code> (buffer)</td><td>✅</td><td>❌ ¹</td><td>✅</td><td>✅</td></tr><tr><td><code>LoadAssetRange</code> / <code>LoadAssetRangeAt</code></td><td>✅</td><td>❌ ¹</td><td>✅</td><td>❌</td></tr><tr><td><code>LoadAssetMapped</code> (vector)</td><td>✅</td><td>✅</td><td>✅</td><td>✅</td></tr><tr><td><code>LoadAssetMapped</code> (buffer)</td><td>✅</td><td>❌</td><td>✅</td><td>✅</td></tr><tr><td><code>LoadAssetRangeMapped</code></td><td>✅</td><td>❌ ²</td><td>✅</td><td>❌</td></tr><tr><td><code>GetAssetMapped</code></td><td>❌</td><td>❌</td><td>❌</td><td>❌</td></tr></tbody></table></div>
<p>¹ No allocation for uncompressed assets. For compressed assets a temporary buffer for the stored data (full load) or for one block (range) is used.  <br>² For compressed assets a temporary buffer for a block that is only partly inside of the range.</p>
<h2>Accessor methods</h2>
<p>All getters read directly from the header or the index entries and are cheap:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetVersion</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">       </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// uint64_t</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetFileCount</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">     </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// size_t</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetIndexOffset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// uint64_t</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetIndexSize</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">     </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// uint64_t</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetDataOffset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// uint64_t</span>

<h2>VerifyAll</h2>
<p><code>VerifyAll</code> opens the file stream if needed and, for every index entry, reads the stored bytes (<code>compressedFileSize</code> for compressed entries, otherwise <code>fileSize</code>) in 1 MB chunks while computing the FNV-1a checksum. A mismatch or missing data adds one error per asset (<code>Asset &#39;&lt;name&gt;&#39; is damaged (...)</code>, or the hash if no names are stored). All entries are checked, the function returns <code>false</code> if any of them is damaged. Nothing is decompressed.</p>
<h2>Managing the file stream</h2>
<p>After <code>StaticForgeReader::Load</code> succeeds the archive's file stream is open. <code>LoadAsset</code> reopens it automatically if it was closed. You can control this manually:</p>

<h2>StaticForgeConcurrentArchive</h2>
<p><code>StaticForgeConcurrentArchive</code> uses the same <code>ArchiveData</code> and the same loading functions of <code>Internal/ArchiveCore</code>, only the stream handling and the errors are different. It doesn't derive from <code>ErrorSupport</code>.</p>
<div class="table-wrapper"><table><thead><tr><th>Member</th><th>Description</th></tr></thead><tbody><tr><td><code>m_data</code></td><td><code>std::shared_ptr&lt;const Internal::ArchiveData&gt;</code>, shared with clones</td></tr><tr><td><code>m_mmap</code></td><td><code>std::shared_ptr&lt;Internal::MmapFile&gt;</code>, shared with clones</td></tr><tr><td><code>m_state</code></td><td><code>std::unique_ptr&lt;State&gt;</code> with the stream pool and the errors (defined in the <code>.cpp</code>)</td></tr></tbody></table></div>
<p><code>State</code> is behind a pointer, because a <code>std::mutex</code> can't be moved. The move constructor gives the moved-from object a new empty <code>State</code>, so it stays usable as an empty archive.</p>
<h3>Stream pool</h3>
<ul><li><code>freeStreams</code>: open streams that are not used, protected by <code>poolMutex</code>.</li><li><code>poolSize</code>, <code>activeCount</code>, <code>openCount</code>: <code>std::atomic</code>, so the getters can read them without the lock. They are only changed while the lock is held.</li><li><strong>Acquire:</strong> waits on <code>poolCondition</code> until a free stream exists or <code>openCount &lt; poolSize</code>. A free stream is taken, otherwise a new one is opened (outside of the lock).</li><li><strong>Release:</strong> gives the stream back and wakes up one waiting load. If the pool got smaller in the meantime (<code>openCount &gt; poolSize</code>), the stream is closed instead.</li><li>A <code>Lease</code> object gives the stream back in its destructor, so it isn't lost if loading throws.</li><li><code>SetPoolSize</code> closes the free streams above the new size and wakes up all waiting loads, so it can be called while loading.</li><li><code>StaticForgeReader::Load</code> puts the stream it used for reading into the pool as the first free stream.</li></ul>
<p>Mapped loads use <code>m_mmap</code> directly and don't touch the pool. <code>m_mmap</code> itself is not protected, so <code>OpenMapped</code>/<code>CloseMapped</code> must not run while other threads load.</p>
<h3>Errors</h3>
<p>Every function takes an optional <code>std::string* errorOut</code>. <code>Report()</code> writes the error there, or adds it to the list of the calling thread in <code>Internal::ThreadErrors</code> (<code>Internal/ThreadErrors.h</code>): a <code>std::unordered_map&lt;std::thread::id, ...&gt;</code> protected by a mutex. Each thread gets a number when it reports its first error. The number is kept when its errors are cleared, so the same thread keeps the same number. The format of a thread's list is the same as <code>ErrorSupport</code>: one message per line. <code>GetAllErrors()</code> sorts the threads by number and prefixes every line with <code>[Thread &lt;n&gt;] </code>.</p>
<h2>Archive sets</h2>
<p><code>StaticForgeArchiveSet</code> and <code>StaticForgeConcurrentArchiveSet</code> share <code>Internal::ArchiveSetIndex&lt;Archive&gt;</code> (<code>Internal/ArchiveSetIndex.h</code>):</p>
<ul><li>A list of slots: the archive pointer and the <code>shared_ptr</code> to the <code>ArchiveData</code> the archive had when it was added.</li><li>A lookup <code>asset hash -&gt; (slot, entry index)</code>, so finding an asset stays O(1) for any number of archives.</li><li><code>Add</code> checks all hashes of the new archive against the lookup before anything is added. A hash that already exists means the same path (or a hash collision) in two archives and is an error.</li><li><code>Remove</code> rebuilds the lookup, because the slot indices change.</li></ul>
<p>The sets are friends of their archive class and call the private <code>LoadEntry</code>/<code>LoadEntryRange</code>/<code>VerifyAllInto</code> with an error string, so errors end up in the set and not in the archive. Before each load the set compares the archive's current <code>m_data</code> with the stored one. If the archive was loaded again in the meantime, the stored entry belongs to the old file and an error is reported instead.</p>
<p>The sets only keep pointers and never touch the archives in their destructor. <code>StaticForgeArchiveSet</code> derives from <code>ErrorSupport</code>, <code>StaticForgeConcurrentArchiveSet</code> uses <code>Internal::ThreadErrors</code> like the concurrent archive. Its lookup is only read while loading, so loads need no lock; <code>Add</code>, <code>Remove</code> and <code>Clear</code> change it and must not run at the same time.</p></div>
  </section>
  </div>

    <section id="node_mu3td1ku72xkz714tsyqd" class="export-section">
    
    <div class="export-section__body"><h1>ErrorSupport</h1>
<p><code>ErrorSupport</code> is the base class for <code>StaticForgeBuilder</code>, <code>StaticForgeReader</code>, <code>StaticForgeArchive</code> and <code>StaticForgeArchiveSet</code>.  <br>It provides a simple error collection system.</p>
<h2>API</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">bool</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">IsValid</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">const</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">            </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// true if no errors are stored</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">string</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">const</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// returns all stored errors as a single string</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">string</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">         </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// returns all stored errors and clears them</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">void</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">ClearErrors</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">              </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// clears all stored errors</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<h2>Format</h2>
<p><code>GetError()</code> returns one message per line:</p>
<div class="code-block-wrapper"><pre><code>Failed to load asset, entry with key &#39;missing1&#39; not found
Failed to load asset, entry with key &#39;missing2&#39; not found</code></pre><div class="code-language-tag code-language-tag--unrecognized">txt</div></div>
<p>Formatting is left to the application. The CLI tool, for example, prints a single error as <code>[Error] &lt;message&gt;</code> and several errors as a list. Paths in messages always use <code>/</code> as separator.</p>
<h2>Error accumulation</h2>
<p>Errors are accumulated in insertion order.</p>
<p>Each call to <code>AddError()</code> appends a new entry to the internal error list.  <br><code>GetError()</code> combines all stored messages into a single newline-separated string.</p>
<h2>When errors are cleared</h2>
<p>Errors are only cleared when they no longer apply:</p>
<div class="table-wrapper"><table><thead><tr><th>Event</th><th>Cleared errors</th></tr></thead><tbody><tr><td><code>StaticForgeBuilder::Build()</code></td><td>errors of the builder (previous build)</td></tr><tr><td><code>StaticForgeReader::Load()</code></td><td>errors of the reader and of the target archive</td></tr><tr><td><code>StaticForgeMeta::Load()</code></td><td>errors of the meta parser</td></tr><tr><td><code>TakeError()</code> / <code>ClearErrors()</code></td><td>all errors of the object</td></tr></tbody></table></div>
<p>Errors of <code>StaticForgeArchive</code> calls like <code>LoadAsset</code> stay stored until they are taken or cleared, so several failed loads can be reported together.</p></div>
  </section>
  </div>
