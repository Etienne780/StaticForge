  var nodeAliases = {};
  var firstNode = {"id":"node_mu3td1kuufx8v3a1hzju","tabId":"tab_mu3td1ku2qztxt16axy53"};
  var searchIndex = [{"nodeId":"node_mu3td1kuufx8v3a1hzju","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Getting Started","headings":["Getting Started","What you get","Typical workflow"],"content":"StaticForge is an asset archive system for bundling and loading game files. It combines multiple files into a compact `.sfpak` container that can be efficiently read at runtime. - A command-line tool (`StaticForgeTool`) to pack your assets during your build process, and to inspect or extract existing archives - A C++ library (`StaticForgeCore`) to load assets from `.sfpak` files at runtime 1. Organize your asset folders 2. Optionally add `.sfpak.meta` files to control how folders are grouped into archives 3. Run `StaticForgeTool` to pack your assets into one or more `.sfpak` files 4. At runtime, use `StaticForgeReader` and `StaticForgeArchive` to load assets by path --- Tip: `.sfpak` files are binary and not meant to be edited manually. Always rebuild them from source assets using the tool. Note: The archive format is not meant for long-term storage. Archives are rebuilt together with your application, so the reader only accepts archives of its own format version (currently `3`)."},{"nodeId":"node_mu3td1ku93dq7vjxmvr2","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Packing Assets","headings":["Packing Assets","Basic usage","Specifying an archive name","Multiple source folders","Output directory","Compression","Bool arguments","Verbose output","Unicode"],"content":"Use `StaticForgeTool` to pack a folder of assets into a `.sfpak` archive. ```bash StaticForgeTool --source ./assets --output ./build ``` This scans `./assets` recursively and writes the archive to `./build/main.sfpak`. By default the archive is named `main`. Use `--name` to override: ```bash StaticForgeTool --source ./assets --output ./build --name textures ``` This produces `./build/textures.sfpak`. The name may contain dots (`textures.hd` produces `textures.hd.sfpak`) and non-ASCII characters, but no `/` or `\\`. `--source` can be repeated to include multiple directories: ```bash StaticForgeTool --source ./textures --source ./audio --output ./build ``` or ```bash StaticForgeTool --source \"./textures, ./audio\" --output ./build ``` Every source path has to be a directory. Asset paths inside the archive are relative to the source folder they were found in, so two source folders must not contain the same relative path. `--output` is always a directory. The archive file name comes from `--name` or from a meta file (see Meta Files ), so a path like `./build/main.sfpak` is rejected. Directory names with dots (e.g. `./build/v1.0`) are fine. If the output directory doesn't exist yet, add `--mkdir`: ```bash StaticForgeTool --source ./assets --output ./build/packed --mkdir ``` Add `--compress` to compress every file larger than 4096 bytes: ```bash StaticForgeTool --source ./assets --output ./build --compress ``` Compressed assets are decompressed automatically by `LoadAsset`, but they can't be accessed with the memory-mapped API. The compression can be tuned with `--compress-block-size`, `--compress-table-size` and `--compress-min-match`, see CLI Reference . The defaults are the most efficient values for typical game assets. Already compressed formats (PNG, JPG, OGG, ...) barely get smaller, text and uncompressed data (shaders, scripts, JSON, meshes) compress well. Bool arguments like `--mkdir`, `--verbose`, `--store-names` and `--compress` can be used without a value. `--verbose` is the same as `--verbose true`. Accepted values are `true`/`false`, `1`/`0`, `yes`/`no` and `y`/`n`, anything else is an error. Add `--verbose` (or `--v`) to print detailed information about every file processed: ```bash StaticForgeTool --source ./assets --output ./build --verbose ``` File names, directories, archive names and command line arguments can contain any Unicode characters (e.g. `纹理/背景.png`). Names are stored as UTF-8."},{"nodeId":"node_mu3td1ku1d4g35y4wv21q","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Meta Files","headings":["Meta Files","File format","Supported parameters","Archive names","Excluding files","How it works","Fallback","Command line overrides"],"content":"Meta files let you split assets from a single source tree into multiple `.sfpak` archives automatically. A meta file is any file whose name ends with `.sfpak.meta` (e.g. `textures.sfpak.meta` or `my.textures.sfpak.meta`). It uses a simple semicolon-terminated key-value syntax: ``` archive = textures; exclude = .png, .jpg; store-names = true; ``` Each statement is a `key = value;` pair. Whitespace around `=` and `;` is ignored. Comments start with `#` and run to the end of the line: ``` archive = ui; exclude = .psd; # skip source files ``` Meta files are read as UTF-8, values can contain any Unicode characters (e.g. `archive = 纹理;`). A UTF-8 BOM at the start of the file is ignored. | Key | Type | Required | Description | |-----------------------|----------|----------|-----------------------------------------------------------------------------| | `archive` | string | yes | Name for the `.sfpak` archive produced from this directory | | `exclude` | string[] | no | Comma-separated list of file extensions to skip (e.g. `.png`, `.tar.gz`) | | `store-names` | bool | no | Store original filenames in the archive for debug inspection and extraction | | `compress` | bool | no | Compress files larger than 4096 bytes | | `compress-block-size` | int | no | Block size in bytes used for compression (1024 - 67108864, default 65536) | | `compress-table-size` | int | no | Compressor match table size as power of two (8 - 24, default 16) | | `compress-min-match` | int | no | Shortest repeated sequence stored as a reference (4 - 65535, default 8) | Bool values are `true` or `false` (case insensitive). Int values are plain decimal numbers without units (`65536`, not `64k`). Example with all parameters: ``` archive = main; exclude = .png, .jpg, .vert, .help; store-names = true; compress = true; compress-block-size = 65536; compress-table-size = 16; compress-min-match = 8; ``` The archive name becomes the file name of the archive (`archive = textures;` produces `textures.sfpak`). It may contain dots (`textures.hd` produces `textures.hd.sfpak`) but no `/` or `\\`, and it must not be `.` or `..`. A file is excluded if its name ends with one of the `exclude` entries: - The comparison is case insensitive (`.PNG` excludes `image.png`). - Multi-part extensions work (`.tar.gz` excludes `data.tar.gz`, but not `data.gz`). - A missing dot is added (`png` is the same as `.png`), so `png` does not exclude `image.xpng`. When the tool scans your source directories it looks for `.sfpak.meta` files. Every asset file in the same directory (or any subdirectory) is then packed into the archive named in that meta file. If a subdirectory has its own meta file, that one is used for the subdirectory. Excluded extensions are skipped entirely. Each directory can contain only one meta file. ``` assets/ textures/ textures.sfpak.meta <- archive = textures; exclude = .psd; background.png ui.png audio/ audio.sfpak.meta <- archive = audio; music.ogg sfx.wav scripts/ game.lua <- no meta file → goes into the default archive ``` Running the tool on `assets/` produces: - `textures.sfpak` - `audio.sfpak` - `main.sfpak` (for everything without a meta file) Asset paths inside the archive are always relative to the source folder, not to the meta file. `background.png` above is loaded as `textures/background.png`. Files that are not covered by any meta file are packed into the archive name set with `--name` (default: `main`). Values set on the command line win over the meta file: - `--store-names` and `--compress` force the option on for all archives, even those whose meta file sets it to `false`. The meta value only takes effect when the CLI flag is not set. - `--compress-block-size`, `--compress-table-size` and `--compress-min-match` replace the meta file value for all archives. Without the CLI argument the meta value is used, without both the default."},{"nodeId":"node_mu3td1ku1w2zp279b2ssx","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Inspecting Archives","headings":["Inspecting Archives","Basic info","Inspecting multiple archives at once","Verbose index listing","Extracting archives"],"content":"Use `--info` to display header and index information of one or more existing `.sfpak` files, and `--extract` to turn an archive back into normal files. ```bash StaticForgeTool --info ./build/textures.sfpak ``` Output: ``` Archive: textures.sfpak Version: 3 File count: 2 Index offset: 64 Index size: 80 Data offset: 4096 ``` `--info` can be repeated to inspect several archives in one invocation: ```bash StaticForgeTool --info ./build/textures.sfpak --info ./build/audio.sfpak ``` Each archive is printed in sequence, separated by an empty line. With more than one archive the full path is shown instead of only the file name. Add `--verbose` to also print every index entry: ```bash StaticForgeTool --info ./build/textures.sfpak --verbose ``` Output includes a line per file showing its hash (hexadecimal), byte offset relative to the data section, and original size: ``` Index entries: [0] hash: a01c85352df03fae, offset: 0, size: 9 [1] hash: 0254d0414b3d0eaf, offset: 4096, size: 200000 ``` If the archive was built with `--store-names` (or `store-names = true` in the meta file), each line also shows the original relative path: ``` Index entries: [0] name: textures/background.png, hash: 0254d0414b3d0eaf, offset: 0, size: 200000 [1] name: textures/ui.png, hash: a6cf994350b589ad, offset: 200704, size: 3 ``` `--extract` writes every file of an archive back to disk. Each archive gets its own folder `<output /<archive name /`: ```bash StaticForgeTool --extract ./build/textures.sfpak --output ./unpacked --mkdir ``` With stored names the original folder structure is restored, e.g. `./unpacked/textures/textures/background.png` (the path inside the archive is relative to the source folder). Without stored names the original paths are unknown, so the files are named after their hash, matching the `--info --verbose` output: `./unpacked/main/a01c85352df03fae.bin`. Several archives can be extracted at once: ```bash StaticForgeTool --extract \"./build/textures.sfpak, ./build/main.sfpak\" --output ./unpacked --mkdir --verbose ``` Rules: - Existing files are never overwritten. If one of the target files already exists, nothing is extracted. Empty the output folder first. - Names in the archive must be relative paths. An archive with names like `../file` or `C:/file` is rejected, so a manipulated archive can't write outside of the output folder. Note: Without name storage the index only contains hashes. The original path is not recoverable from the archive alone — keep your source assets, or pack with `--store-names` if you need to extract with the original names."},{"nodeId":"node_mu3td1kuzgocka16m5db0","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Loading Assets at Runtime","headings":["Loading Assets at Runtime","Opening an archive","Loading a file by path","Loading all files","Managing the file stream","Memory-mapped access","Compression","Error handling"],"content":"At runtime, use `StaticForgeReader` to open a `.sfpak` file and `StaticForgeArchive` to load individual assets. ```cpp #include <StaticForgeCore/StaticForge.h StaticForge::StaticForgeArchive archive; StaticForge::StaticForgeReader reader; if (!reader.Load(\"./build/textures.sfpak\", &archive)) { // reader.GetError() contains a description of what went wrong std::cerr << reader.GetError() << std::endl; } ``` `Load` validates the whole archive structure (header, index and name table) against the file size, so a damaged or truncated archive is rejected with an error instead of crashing. Archives of another format version are rejected as well; rebuild them with the current tool. The same archive object can be loaded again with another file. Everything of the previous archive (open stream, memory mapping, index, errors) is released first. Pass the relative path of the file exactly as it appeared under the source directory: ```cpp std::vector<std::byte data; if (!archive.LoadAsset(\"textures/background.png\", &data)) { std::cerr << archive.TakeError() << std::endl; } // data now contains the raw bytes of the file ``` Important: The asset path must exactly match the path relative to the source root, it is case sensitive and UTF-8 encoded. Backslashes are converted to forward slashes, so `textures\\background.png` works too. `LoadAssetAt` loads an asset by its index, which is useful to iterate over the whole archive, also if it stores no names: ```cpp std::vector<std::byte data; for (size t i = 0; i < archive.GetFileCount(); i++) { if (!archive.LoadAssetAt(i, &data)) { std::cerr << archive.TakeError() << std::endl; continue; } // archive.GetName(i) is the path if the archive stores names, otherwise empty } ``` After `StaticForgeReader::Load` succeeds, the archive's file stream is open. `LoadAsset` reopens it automatically if it was closed. You can control this manually: ```cpp archive.CloseFileStream(); // release the file handle archive.OpenFileStream(); // reopen when needed bool open = archive.IsFileStreamOpen(); ``` A failed load (e.g. a checksum mismatch) does not affect later loads of other assets. For better read performance, the archive can be opened using memory mapping instead of a file stream. This avoids repeated `seek`/`read` calls and lets the OS manage page caching. ```cpp if (!archive.OpenMapped()) { std::cerr << archive.TakeError() << std::endl; } // Zero-copy view — valid only while the archive stays mapped StaticForge::AssetView view = archive.GetAssetMapped(\"textures/background.png\"); if (view.data == nullptr) { std::cerr << archive.TakeError() << std::endl; } // Or copy into a buffer, same as LoadAsset std::vector<std::byte data; if (!archive.LoadAssetMapped(\"textures/background.png\", &data)) { std::cerr << archive.TakeError() << std::endl; } archive.CloseMapped(); bool mapped = archive.IsMapped(); ``` `GetAssetMapped` returns a non-owning `AssetView` directly into mapped memory — no allocation or copy needed. The view becomes invalid as soon as `CloseMapped` is called. For an empty file the view has `size == 0` and a valid (non-null) `data` pointer. Important: Memory-mapped access is not supported for compressed assets . Calling `GetAssetMapped` or `LoadAssetMapped` on a compressed entry will return an error. Use `LoadAsset` (stream-based) instead, which handles decompression automatically. Assets can be stored compressed inside an archive. This is transparent when using the stream-based API — `LoadAsset` detects compressed entries and decompresses them automatically before returning the data: ```cpp // Works for both compressed and uncompressed assets std::vector<std::byte data; if (!archive.LoadAsset(\"maps/level1.map\", &data)) { std::cerr << archive.TakeError() << std::endl; } ``` Internally, compressed files are split into blocks (64 KB by default, configurable when packing). Each block is compressed independently and prefixed with its compressed and original size. | Access method | Uncompressed | Compressed | |----------------------|:------------:|:-------------------:| | `LoadAsset` | ✅ | ✅ (auto-decompress) | | `LoadAssetAt` | ✅ | ✅ (auto-decompress) | | `LoadAssetMapped` | ✅ | ❌ not supported | | `GetAssetMapped` | ✅ | ❌ not supported | `StaticForgeReader` and `StaticForgeArchive` collect error messages. Always check the return value: ```cpp if (!archive.LoadAsset(\"audio/music.ogg\", &data)) { // possible reasons: key not found, seek failure, checksum mismatch, // decompression failure, or compressed asset accessed via mmap std::cerr << archive.TakeError() << std::endl; } ``` | Function | Description | |-----------------|--------------------------------------------------------------| | `IsValid()` | `true` if no errors are stored | | `GetError()` | Returns all stored errors as one string | | `TakeError()` | Returns all stored errors and clears them | | `ClearErrors()` | Clears all stored errors | Errors of the archive accumulate over several calls until you take or clear them, so you can load many assets and report all problems at once: ```cpp archive.LoadAsset(\"a.png\", &a); archive.LoadAsset(\"b.png\", &b); if (!archive.IsValid()) std::cerr << archive.TakeError(); // errors of both calls ``` Errors that no longer apply are cleared automatically: `reader.Load` clears the errors of the reader and of the archive it loads into."},{"nodeId":"node_mu3td1kurklac1g47o2b","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Building Archives in Code","headings":["Building Archives in Code","Minimal example","Multiple source paths","Fluent API","Options","Building again","Debug mode"],"content":"Instead of using the command-line tool you can drive the build process directly from C++ using `StaticForgeBuilder`. ```cpp #include <StaticForgeCore/StaticForge.h StaticForge::StaticForgeBuilder builder; builder .SetArchiveName(\"textures\") .AddSourcePath(\"./assets/textures\") .SetOutputPath(\"./build\") .SetCreateOutputDir(true); if (!builder.Build()) { std::cerr << builder.TakeError() << std::endl; } ``` ```cpp builder.SetSourcePath({ \"./assets/textures\", \"./assets/audio\" }); ``` or add them one at a time: ```cpp builder.AddSourcePath(\"./assets/textures\"); builder.AddSourcePath(\"./assets/audio\"); ``` Paths are `std::filesystem::path`. For UTF-8 strings use `std::filesystem::u8path(...)`, so non-ASCII names also work on Windows. All setters return ` this` so they can be chained: ```cpp StaticForge::StaticForgeBuilder builder{ \"main\", { \"./assets\" }, \"./build\" }; builder .SetCreateOutputDir(true) .SetDebugMode(true) .Build(); ``` | Setter | CLI equivalent | Description | |---------------------------------------|--------------------------|-----------------------------------------------------------------------| | `SetArchiveName(name)` | `--name` | Archive name for files without a meta file (default `main`) | | `SetSourcePath(paths)` / `AddSourcePath(path)` | `--source` | Source directories | | `SetOutputPath(path)` | `--output` | Output directory | | `SetCreateOutputDir(bool)` | `--mkdir` | Create the output directory if it is missing | | `SetDebugMode(bool)` | `--verbose` | Print detailed progress to `stdout` | | `SetStoreNames(bool)` | `--store-names` | Store file names in all archives | | `SetCompress(bool)` | `--compress` | Compress files larger than 4096 bytes in all archives | | `SetCompressionBlockSize(size)` | `--compress-block-size` | Compression block size in bytes (default `DEFAULT COMPRESSION BLOCK SIZE`) | | `SetCompressionTableSizeLog2(size)` | `--compress-table-size` | Match table size as power of two (default `DEFAULT COMPRESSION TABLE SIZE LOG2`) | | `SetCompressionMinMatchLength(length)`| `--compress-min-match` | Shortest match stored as reference (default `DEFAULT COMPRESSION MIN MATCH LENGTH`) | The valid ranges of the compression settings are the `MIN COMPRESSION ` and `MAX COMPRESSION ` constants in `StaticForgeTypes.h`. Invalid values make `Build()` fail with an error. Compression settings that are set on the builder override the values of meta files, settings that are not set fall back to the meta file value and then to the default. The same builder can run `Build()` several times, e.g. after changing the source paths. Each build starts fresh and clears the errors of the previous build. `SetDebugMode(true)` prints detailed progress to `stdout` - the same output as `--verbose` in the CLI tool."},{"nodeId":"node_mu3td1kuw60i4y16ior5l","tabId":"tab_mu3td1ku2qztxt16axy53","title":"CLI Reference","headings":["CLI Reference","Arguments","Compression settings","Values","Modes","Exit code","Command line priority"],"content":"Quick reference for all `StaticForgeTool` arguments. | Argument | Short | Description | Type | Default | Multi | |-----------------|---------|------------------------------------------------------------------------------|----------|---------|-------| | `--source` | `--src` | Source directory of the files to be packed (can be specified multiple times) | filepath | — | yes | | `--output` | `--o` | Output directory for packed archives or extracted files | filepath | — | no | | `--name` | `--n` | Default archive name when no `.sfpak.meta` file is found | string | `main` | no | | `--mkdir` | `--p` | Create the output directory if it does not exist | bool | false | no | | `--info` | `--i` | Display header and index info of a `.sfpak` file (can be repeated) | filepath | — | yes | | `--extract` | `--x` | Extract `.sfpak` file(s) into `<output /<archive name /` (can be repeated) | filepath | — | yes | | `--verbose` | `--v` | Enable debug/verbose console output | bool | false | no | | `--store-names` | `--sn` | Store original filenames in all archives for debug inspection and extraction | bool | false | no | | `--compress` | `--c` | Compress files larger than 4096 bytes before storing them in the archive | bool | false | no | | `--help` | `--h` | Show the help message | — | — | no | Short forms always use two dashes (`--v`, not `-v`). Arguments that can be repeated also accept a comma-separated list: `--source \"./textures, ./audio\"`. Only used together with compression (`--compress` or `compress = true;` in a meta file). They override the values of `.sfpak.meta` files. | Argument | Short | Description | Default | Range | |-------------------------|---------|-------------------------------------------------------------------|---------|------------------| | `--compress-block-size` | `--cbs` | Size in bytes of the blocks a file is split into for compression | `65536` | 1024 - 67108864 | | `--compress-table-size` | `--cts` | Match table size as power of two (entries = 2^value) | `16` | 8 - 24 | | `--compress-min-match` | `--cmm` | Shortest repeated sequence that is stored as a reference | `8` | 4 - 65535 | Larger blocks compress better, because a block can only reference data inside of itself. Above 64 KB the gain is very small. - bool arguments can be used without a value: `--verbose` is the same as `--verbose true`. Accepted values are `true`/`false`, `1`/`0`, `yes`/`no` and `y`/`n` (case insensitive). Anything else is an error, so a forgotten value like `--mkdir ./assets` is reported instead of silently being `false`. - int arguments must be plain decimal numbers (`65536`, not `64k`). - All other arguments require a value. - Arguments and paths can contain any Unicode characters. Exactly one mode must be active per invocation. Modes are determined by which arguments are provided: | Mode | Required arguments | Optional arguments | |---------|-------------------------------|-----------------------------------------------------------------------------| | pack | `--source` and `--output` | `--name`, `--mkdir`, `--verbose`, `--store-names`, `--compress`, `--compress- ` | | extract | `--extract` and `--output` | `--mkdir`, `--verbose` | | info | `--info` | `--verbose` | | help | `--help` | — | Combining arguments from multiple modes (e.g. `--source` together with `--info`) is an error. The tool returns `0` on success and a non-zero exit code on any error, so it can be used in build scripts. When `--store-names` or `--compress` is set on the command line, the option is forced on for every archive regardless of what the `.sfpak.meta` file specifies. The meta-file value is only used when the CLI flag is absent. The `--compress- ` settings replace the meta file values for all archives when they are set."},{"nodeId":"node_mu3td1ku1de5w2cswv1sn","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"Architecture","headings":["Architecture","StaticForgeCore","StaticForgeTool","Dependency graph","Platforms"],"content":"StaticForge is split into two main components. The core static library. Contains all format logic and is linked by both the tool and any consuming application: - Archive format definition and binary layout - `StaticForgeBuilder` - writes `.sfpak` files - `StaticForgeReader` - reads and validates `.sfpak` files - `StaticForgeArchive` - runtime handle for an open archive - Meta file parsing (`StaticForgeMeta`) - Internal helpers: hashing, alignment, endian handling, compression, memory mapping, error support Only the headers directly in `include/StaticForgeCore/` are part of the public API. The `Internal/` headers are not included in the SDK release packages. The CLI executable. Wraps `StaticForgeCore` with argument parsing and four modes: pack, extract, info, help. Does not contain any format logic itself. `Utf8Console` makes the tool work with Unicode on Windows: it reads the command line arguments as UTF-8 and switches the console output to UTF-8 while the tool runs. On other platforms the arguments already are UTF-8. ``` StaticForgeTool └── StaticForgeCore ├── StaticForgeBuilder ├── StaticForgeReader ├── StaticForgeArchive └── Internal (helpers, meta, hashing, compression, mmap) Your Game / Application └── StaticForgeCore ├── StaticForgeReader └── StaticForgeArchive ``` The tool-side classes (`StaticForgeBuilder`, meta parsing) are compiled into Core but an application that only reads archives still links the same library - there is currently no separate runtime-only build target. Tested on Windows (MSVC) and Linux (GCC, Ubuntu). Archives are byte-identical across platforms: an archive packed on Windows can be loaded on Linux and the other way around."},{"nodeId":"node_mu3td1kuuhnvwc15ryskk","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"File Format","headings":["File Format","Layout","Header","Index entry","Data blocks","Name Table Header","Name Table Entry","Name Table String Data","Alignment","Validation"],"content":"A `.sfpak` file consists of three required regions and three optional regions written sequentially: Header , Index , Data , and — when name storage is enabled — Name Table Header , Name Table Entries , and Name Table String Data . All integers are stored little-endian on all platforms. ``` [ HEADER ] 52 bytes, padded to a multiple of ALIGNMENT HEADER = 32 (64 bytes) [ INDEX ] N × 40 bytes, then padded to ALIGNMENT FILE = 4096 [ DATA BLOCKS ] files written back-to-back, each padded to ALIGNMENT FILE = 4096 [ NAME TABLE HEADER ] optional — present when store-names is enabled [ NAME TABLE ENTRIES ] optional — one entry per file [ NAME TABLE STRING DATA ] optional — raw UTF-8 path strings packed together ``` Magic bytes `SFPK` followed by six `uint64 t` fields. | Field | Type | Description | |-------------------------|------------|-----------------------------------------------------------------| | `magic` | `char[4]` | Always `S`, `F`, `P`, `K` | | `version` | `uint64 t` | Format version (currently `3`) | | `fileCount` | `uint64 t` | Number of files in this archive | | `indexOffset` | `uint64 t` | Byte offset to the start of the index | | `indexSize` | `uint64 t` | Total size of the index in bytes (`fileCount × 40`) | | `dataOffset` | `uint64 t` | Byte offset to the start of data | | `nameTableHeaderOffset` | `uint64 t` | Byte offset to the Name Table Header, or `0` if not present | The reader only accepts archives with exactly its own `version`. The format is not backward compatible, archives are rebuilt with the application that uses them. One 40-byte entry per file, stored contiguously starting at `indexOffset`. | Field | Type | Description | |----------------------|------------|------------------------------------------------------------------------------------------| | `hashName` | `uint64 t` | 64-bit FNV-1a hash of the relative file path | | `fileOffset` | `uint64 t` | Byte offset of the file's data block relative to `dataOffset` | | `fileSize` | `uint64 t` | Original (uncompressed) file size in bytes | | `compressedFileSize` | `uint64 t` | Total bytes on disk including the framing headers. `0` means stored uncompressed | | `filePadding` | `uint32 t` | Padding bytes appended after the file data to reach the next 4096-byte boundary | | `checksum` | `uint32 t` | 32-bit FNV-1a checksum of the data as written on disk (covers framing headers + compressed data) | Each file occupies one data block starting at `dataOffset + fileOffset`. The block is always padded with zero bytes to the next 4096-byte boundary; the padding size is stored in `filePadding`. When `compressedFileSize == 0` the block contains the raw file bytes verbatim. When `compressedFileSize != 0` the block contains a sequence of independently compressed chunks: ``` [ CHUNK 0 ][ CHUNK 1 ][ ... ][ CHUNK N ] ``` Each chunk has the following layout: ``` [ compressedSize : uint32 t ] size of the compressed payload that follows [ originalSize : uint32 t ] size of the decompressed output for this chunk [ payload : bytes ] compressedSize bytes of compressed data ``` Chunks are produced by splitting the original file into pieces of the compression block size (default 64 KB, at most `MAX COMPRESSION BLOCK SIZE`) and compressing each piece independently. The decompressor reads chunks sequentially until all `compressedFileSize` bytes are consumed. Because each chunk carries its own original size, the reader does not need to know the block size that was used for packing. The FNV-1a checksum covers all chunk bytes as written on disk — framing headers included — so integrity is verified before any decompression takes place. Note: Compressed data blocks cannot be accessed via memory mapping. Use the stream-based `LoadAsset` API which handles decompression automatically. Present only when the archive was built with name storage enabled. Located at `nameTableHeaderOffset`. | Field | Type | Description | |--------------------|------------|--------------------------------------------------------| | `entryOffset` | `uint64 t` | Byte offset to the first Name Table Entry | | `stringDataOffset` | `uint64 t` | Byte offset to the start of Name Table String Data | One 16-byte entry per file, stored contiguously starting at `entryOffset`, in the same order as the index. | Field | Type | Description | |--------------|------------|--------------------------------------------------------------------------------| | `hash` | `uint64 t` | FNV-1a hash of the path (matches `hashName` in the corresponding index entry) | | `nameLength` | `uint32 t` | Length of the UTF-8 path string in bytes | | `nameOffset` | `uint32 t` | Byte offset within the String Data region where this path starts | Raw UTF-8 path strings packed end-to-end with no separators. To read a filename, seek to `stringDataOffset + nameOffset` and read `nameLength` bytes. Paths use `/` as separator and are relative to the source folder. - The header region is padded to a multiple of 32 bytes (`ALIGNMENT HEADER`), which makes it 64 bytes. - Every file data block is padded to 4096 bytes (`ALIGNMENT FILE`) — one filesystem page. - Padding bytes are always zero. This alignment ensures that file offsets are always multiples of 4096, which allows direct memory-mapped access for uncompressed assets without additional alignment work. `StaticForgeReader::Load` checks the archive against the real file size before allocating any memory: - `indexSize` must match `fileCount × 40`, and the index must be inside the file. - `dataOffset` and the name table must be inside the file. - The data of every index entry must be inside the file, and every hash must be unique. - Every name table entry and every name must be inside the file. When loading a compressed entry, every chunk's `originalSize` must be at most `MAX COMPRESSION BLOCK SIZE` and the sum must match `fileSize`. A corrupted archive is rejected with an error instead of crashing."},{"nodeId":"node_mu3td1kucsyh3x1ldzws1","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"Hashing","headings":["Hashing","Filename hashing","Data checksum","Path format"],"content":"StaticForge uses FNV-1a (Fowler–Noll–Vo) for two purposes: filename lookup (64 bit) and data integrity (32 bit). When the builder packs a file, the relative path string (e.g. `textures/background.png`) is hashed with 64-bit FNV-1a (offset basis `14695981039346656037`, prime `1099511628211`) and stored in the index as `hashName`. At runtime, `StaticForgeArchive::LoadAsset` hashes the key string you pass in and looks it up in the index map. Unless the archive was built with `store-names`, the original string is not stored in the archive. Implications: - Lookups are O(1) via `std::unordered map`. - Without a name table the archive cannot list filenames - only validate whether a known key exists. `--info --verbose` and `--extract` then show the hash instead (16 hex digits). - Hash collisions between two different paths in the same archive are detected at build time and cause an error. With 64 bit they are practically impossible (even with 100 000 files the probability is below one in a billion). During packing, each file's bytes as written to disk are fed through 32-bit FNV-1a with the initial value `2166136261` to produce a `uint32 t` checksum. This is written into the index entry. When loading, `StaticForgeArchive::LoadEntry` recomputes the checksum over the read bytes and compares it to the stored value. A mismatch causes `LoadAsset` to return `false` with an error message. The checksum detects accidental damage. It is not a cryptographic signature and does not protect against intentional changes. Use a path relative to the source root used during packing. The path is UTF-8 and case sensitive, backslashes are converted to forward slashes before hashing. ```cpp // Correct archive.LoadAsset(\"textures/background.png\", &data); // Also valid archive.LoadAsset(\"textures\\\\background.png\", &data); // Wrong - path is not relative to the source root archive.LoadAsset(\"./assets/textures/background.png\", &data); ```"},{"nodeId":"node_mu3td1kulgv50d577zxf","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"Build Process","headings":["Build Process","1. CheckCompressionSettings","2. CheckFilepaths","3. ScanFiles","4. CreateGroups","Write phases summary","Compression","Compressor","Overflow safety"],"content":"`StaticForgeBuilder::Build()` resets the data of a previous build, then runs four internal phases in sequence. Validates the compression settings set on the builder (block size, table size, min match length) against the `MIN COMPRESSION ` / `MAX COMPRESSION ` ranges. Settings that are not set are skipped. Validates that: - the default archive name is a valid file name (no `/` or `\\`, not `.` or `..`) - all source paths exist and are directories - the output path is not an archive file path (ending with `.sfpak`) and, if it exists, is a directory If `SetCreateOutputDir(true)` was called and the output directory is missing, it is created here. Each source directory is read once into a list of files. Read errors are reported as build errors. Then two passes run over these lists: Pass 1 — Meta collection: Collects all files ending with `.sfpak.meta` and builds a `directory → StaticForgeMetaData` mapping. Each entry stores the archive name, excluded extensions, the `store-names` and `compress` flags and the optional compression settings. Archive names and compression settings are validated here. Pass 2 — File assignment: Iterates all non-meta files, computes their relative path, hashes it with 64-bit FNV-1a, and assigns each file to the appropriate `ArchiveGroup` by walking up the directory tree until a meta entry is found. Falls back to the default archive name if no meta file applies. For each file the builder also: - Skips files whose name ends with one of the excluded extensions (case insensitive). - Detects hash collisions between files in the same group and reports them as errors. - Applies the overrides when an archive group is created: - `store-names` and `compress`: if the global flag is set, it is forced on even when the meta file sets it to `false`. - compression settings: builder value → meta file value → default. For each `ArchiveGroup` the output file `<output /<archive name .sfpak` is created and the following phases run in order: CalculateDataStart — computes the byte offset at which file data begins. This is the sum of the aligned header size and the index table size, rounded up to the next 4096-byte boundary. WriteData — writes `dataStart` bytes of zero-padding to reserve space for the header and index, then writes all file data blocks. During this pass, `blockOffset`, `filePadding`, `checksum`, and `compressedFileSize` are filled in on each file entry so the index can be written correctly afterwards. WriteHeader — seeks back to offset `0` and writes the `StaticForgeHeader` struct, padded to a multiple of 32 bytes. WriteIndex — writes one `StaticForgeIndexEntry` per file directly after the header. Checksums computed during `WriteData` are included here — no second seek is needed. BuildNameTable (optional, when store-names is enabled) — computes the byte layout of the Name Table Header, Name Table Entries, and String Data region. Offsets are appended after the last data block. WriteNameTable (optional) — seeks to `nameTableStart` (set at the end of `WriteData`) and writes the Name Table Header, Name Table Entries, and raw UTF-8 string data. | Phase | Seeks to | What it writes | |-------------------|-------------------|------------------------------------------------------------------------------| | `WriteData` | `0` (start) | `dataStart` zero-padding, then all file data blocks in order | | `WriteHeader` | `0` (seekp back) | `StaticForgeHeader` struct padded to a multiple of 32 bytes | | `WriteIndex` | after header | One `StaticForgeIndexEntry` per file, including computed checksums | | `WriteNameTable` | `nameTableStart` (seekp forward) | Name Table Header, Name Table Entries, raw UTF-8 string data | When compression is enabled for an archive group (via the meta file or the global `SetCompress` flag), files larger than 4096 bytes are compressed. Compression is applied per block during `WriteData`: - The file is read in blocks of the compression block size (default 64 KB) and each block is compressed independently. - Each compressed block is prefixed with a framing header: `[uint32 t compressedSize][uint32 t originalSize]` (little-endian). - The raw compressed bytes follow immediately after the framing header. - `compressedFileSize` in the index entry is set to the total number of bytes written for the file, including the framing headers. A value of `0` means the entry is stored uncompressed. The per-block approach means the decompressor can process one block at a time. The FNV-1a checksum covers the framing headers and compressed block data as written, so integrity verification happens before decompression. The compressor (`Internal::LZ4Compression`) is an LZ77 compressor inspired by LZ4, with its own simple format: | Block | Layout | Meaning | |---------|-------------------------------------|------------------------------------------------------| | literal | `[0x01][len:u16][len bytes]` | Bytes stored as they are | | match | `[0x02][distance:u16][len:u16]` | Copy `len` bytes from `distance` bytes back | | end | `[0x00]` | End of the compressed block | For every position the compressor looks up the last position of the same 4-byte sequence in a hash table (`compress-table-size`). A match is extended as far as possible and only stored if it is at least `compress-min-match` bytes long — shorter matches would take more space than storing the bytes as literals. A match can only reference data inside the same block and at most 65535 bytes back. The hash table is only allocated when compressing and is reset per block with a generation counter instead of clearing the whole table. All size and offset arithmetic uses checked helpers that return `false` on overflow instead of wrapping silently: | Helper | Description | |-----------------|--------------------------------------------------------| | `SafeAddU64` | Addition with overflow check | | `SafeMulU64` | Multiplication with overflow check | | `SafeAlignSize` | Rounds up to a power-of-two alignment, overflow-safe | | `GetHeaderSize` | Returns the aligned header size via `SafeAlignSize` | Any overflow causes `Build()` to return `false` with a descriptive error."},{"nodeId":"node_mu3td1ku1hsv9km18cfhyf","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"Meta File Parser","headings":["Meta File Parser","Syntax","Tokenizer","Parser","Error suggestions","Supported parameters","Value parsing"],"content":"Meta files use a minimal custom format parsed by `StaticForgeMeta` inside `StaticForgeCore`. Each statement is a key-value pair terminated by a semicolon: ``` key = value; ``` Multiple statements can appear in any order: ``` archive = main; exclude = .png, .jpg, .vert, .help; store-names = true; ``` Comments start with `#` and run to the end of the line: ``` archive = main; # this is also a comment ``` `MetaTokenizer` reads the entire file into memory (skipping a UTF-8 BOM), then walks it character by character via `ProcessContent` → `ProcessChar`. It tracks the current line and column for error reporting and produces a flat `std::vector<MetaToken `. Columns count characters, not bytes, so multi-byte UTF-8 characters count as one column. Character dispatch (`ProcessChar`): | Input | Action | |----------------------------------------------|----------------------------------------------| | Whitespace (`\\r`, `\\n`, ` `, `\\t`) | Skipped; newlines increment the line counter | | `=` | Emit `Assign` | | `,` | Emit `Separator` | | `;` | Emit `Delimiter` | | `#` | Call `SkipComment` — consume until `\\n` | | Letter, digit, ` `, `.`, `-`, UTF-8 byte | Call `ReadIdentifier` | | Anything else | Add error, emit `UNKNOWN` | `ReadIdentifier`: records the start pointer, then advances `m cur` while the character is an identifier character (`IsIdentifierChar`: alphanumeric, ` `, `.`, `-` or a byte ≥ `0x80`, which is part of a UTF-8 character). The resulting `string view` into the in-memory buffer is stored in the token without any heap allocation. Token types: | Token type | Description | |--------------|--------------------------------------------------------------| | `Identifier` | An unquoted word — keys, values, extensions, booleans, numbers | | `Assign` | The `=` character | | `Separator` | The `,` character (used between list values like extensions) | | `Delimiter` | The `;` character — terminates a statement | | `EndOfFile` | Sentinel appended after the last character | | `UNKNOWN` | Unrecognised character; always accompanied by an error | Every token stores its line and column at the point it was emitted. `StaticForgeMeta::ParseTokens` consumes the token stream produced by `MetaTokenizer`. Each statement follows this pattern: ``` Identifier(key) Assign Identifier(value) Delimiter ``` For list values (e.g. `exclude`) the value section is instead: ``` Identifier Separator Identifier Separator ... Identifier Delimiter ``` Any deviation — wrong token type, unexpected `EndOfFile`, missing `Delimiter` — is a parse error. Errors about the statement structure include the line and column of the offending token. If a key is not recognised, the parser compares it with every known key. Separators (`-`, ` `, space) and case are ignored, and the names are compared character by character. If the lengths differ by at most 3 and at most 3 characters are different, a suggestion is appended to the error: ``` Unknown identifier 'archiv'. Did you mean 'archive'? ``` | Key | Type | Required | Description | |-----------------------|----------|----------|-----------------------------------------------------------------------------| | `archive` | string | yes | Name for the `.sfpak` archive | | `exclude` | string[] | no | Comma-separated list of file extensions to skip | | `store-names` | bool | no | Store original filenames in the archive for debug inspection and extraction | | `compress` | bool | no | Compress files larger than 4096 bytes | | `compress-block-size` | uint | no | Compression block size in bytes | | `compress-table-size` | uint | no | Compressor match table size as power of two | | `compress-min-match` | uint | no | Shortest match the compressor stores as reference | `archive` — the `Identifier` token value is used as-is. The builder rejects names containing `/` or `\\` and the names `.` and `..`. `exclude` — after the `=`, the parser collects `Identifier` tokens separated by `Separator` (`,`) tokens until it sees a `Delimiter` (`;`). Each value is lowercased and a missing leading dot is added, so `.PNG`, `.png` and `png` are treated identically. `store-names`, `compress` — the single `Identifier` token after `=` is compared case-insensitively. Only `true` and `false` are valid, anything else is a parse error. `compress-block-size`, `compress-table-size`, `compress-min-match` — parsed with `std::from chars` as an unsigned decimal number. The whole value has to be a number (`64k` or `-5` are errors). The builder checks the value against the valid range."},{"nodeId":"node_mu3td1ku1t629jd11ytz7k","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"StaticForgeArchive","headings":["StaticForgeArchive","Ownership and move semantics","Internal state","LoadAsset flow","LoadAssetMapped / GetAssetMapped flow","Access method comparison","Accessor methods","Managing the file stream","Managing memory mapping","Error handling"],"content":"`StaticForgeArchive` is the runtime handle for a loaded `.sfpak` file. It is populated by `StaticForgeReader::Load` and then used to retrieve asset data. `StaticForgeArchive` is move-only. Copying is deleted because it owns an open `std::ifstream`. ```cpp StaticForge::StaticForgeArchive a; StaticForge::StaticForgeArchive b = std::move(a); // OK StaticForge::StaticForgeArchive c = a; // compile error ``` An archive object can be loaded again with `StaticForgeReader::Load`. The reader calls the private `Reset()` first, which closes the stream and the memory mapping and clears the header, index, name table and errors of the previous archive. | Member | Description | |---------------------|---------------------------------------------------------------------| | `m path` | Path to the `.sfpak` file on disk | | `m stream` | `std::ifstream` used for stream-based reads | | `m mmap` | `std::unique ptr<Internal::MmapFile ` used for memory mapping | | `m compressor` | `std::unique ptr<Internal::LZ4Compression ` used for decompression | | `m header` | Parsed `StaticForgeHeader` struct | | `m indexEntries` | `std::vector<StaticForgeIndexEntry ` — one per file | | `m hashNameToEntry` | `std::unordered map<uint64 t, size t ` for O(1) lookup | | `m indexToName` | `std::unordered map<size t, std::string ` for reverse name lookup | 1. Normalize the slashes of the key and hash it with `HashFilename` (64-bit FNV-1a). 2. Look up the hash in `m hashNameToEntry` to find the index position. 3. Call `LoadEntry`: - Clear the stream state, so a previous failed read does not break this one. - If `compressedFileSize == 0` (uncompressed): seek to `dataOffset + fileOffset`, read `fileSize` bytes, validate the FNV-1a checksum, return the raw bytes. - If `compressedFileSize != 0` (compressed): seek to `dataOffset + fileOffset`, read `compressedFileSize` bytes, validate the checksum, then decompress block by block. Each block is prefixed with `[uint32 t compressedSize][uint32 t originalSize]` and decompressed independently until all bytes are consumed. The reassembled output must equal `fileSize` bytes. 4. Return the decompressed (or raw) bytes in `outData`. `LoadAssetAt(index, &data)` skips steps 1 and 2 and loads the entry at the given index directly. 1. Verify the archive is memory-mapped (`IsMapped()`). 2. Hash the key and look up the index entry. 3. Reject compressed entries — if `compressedFileSize != 0`, add an error and return `false` / empty view. Use `LoadAsset` instead for compressed assets. 4. Get the pointer with `MmapFile::At(offset, size)`, which returns `nullptr` if the range `[dataOffset + fileOffset, fileSize]` is not inside the mapped file. An empty range at the end of the file is valid. 5. `GetAssetMapped` returns a non-owning `AssetView` pointing directly into mapped memory — no copy. `LoadAssetMapped` validates the checksum first, then copies the bytes into `outData`. The `AssetView` is only valid while the archive remains mapped. Call `CloseMapped` only after you are done with all views. `OpenMapped` works with relative and absolute paths. On Windows the path is made absolute and prefixed with `\\\\?\\`, so long paths work too. | Method | Compressed | Allocates | Copies data | |-------------------|:----------:|:---------:|:-----------:| | `LoadAsset` | ✅ | ✅ | ✅ | | `LoadAssetAt` | ✅ | ✅ | ✅ | | `LoadAssetMapped` | ❌ | ✅ | ✅ | | `GetAssetMapped` | ❌ | ❌ | ❌ | All getters read directly from `m header` or `m indexEntries` and are cheap: ```cpp archive.GetVersion(); // uint64 t archive.GetFileCount(); // size t archive.GetIndexOffset(); // uint64 t archive.GetIndexSize(); // uint64 t archive.GetDataOffset(); // uint64 t archive.StoresNames(); // bool — true if name table is present archive.GetHashName(i); // uint64 t — 0 if i is invalid archive.GetFileOffset(i); // uint64 t — 0 if i is invalid archive.GetFileSize(i); // uint64 t — 0 if i is invalid archive.GetFilePadding(i); // uint64 t — 0 if i is invalid archive.GetName(i); // std::string — empty if name table not present or i is invalid ``` After `StaticForgeReader::Load` succeeds the archive's file stream is open. `LoadAsset` reopens it automatically if it was closed. You can control this manually: ```cpp archive.CloseFileStream(); // release the file handle archive.OpenFileStream(); // reopen when needed bool open = archive.IsFileStreamOpen(); ``` Memory mapping is independent of the file stream and must be opened explicitly: ```cpp archive.OpenMapped(); // map the file into memory archive.IsMapped(); // bool archive.CloseMapped(); // unmap — invalidates all AssetViews ``` `StaticForgeArchive` collects errors (see ErrorSupport ). Always check the return value and read the error when it returns `false`: ```cpp if (!archive.LoadAsset(\"audio/music.ogg\", &data)) { // possible reasons: key not found, seek/read failure, // checksum mismatch, decompression failure std::cerr << archive.TakeError() << std::endl; } if (!archive.LoadAssetMapped(\"textures/ui.png\", &data)) { // additional possible reason: entry is compressed std::cerr << archive.TakeError() << std::endl; } ```"},{"nodeId":"node_mu3td1ku72xkz714tsyqd","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"ErrorSupport","headings":["ErrorSupport","API","Header mode","Error accumulation","When errors are cleared"],"content":"`ErrorSupport` is the base class for `StaticForgeBuilder`, `StaticForgeReader`, and `StaticForgeArchive`. It provides a simple error collection system with optional formatted prefixes. ```cpp bool IsValid() const; // true if no errors are stored std::string GetError() const; // returns all stored errors as a single string std::string TakeError(); // returns all stored errors and clears them void ClearErrors(); // clears all stored errors ``` The constructor takes a boolean `hasHeader`. When enabled, the first error is prefixed with: ```txt [Error]: ``` Additional errors are indented for readability. Example: ```txt [Error]: Failed to load asset, entry with key 'missing1' not found Failed to load asset, entry with key 'missing2' not found ``` `HAS HEADER` is a constant with the value `true` and is used by: - `StaticForgeBuilder` - `StaticForgeReader` - `StaticForgeArchive` Internal helper classes such as `StaticForgeMeta` disable this mode and emit raw messages without formatting. Errors are accumulated in insertion order. Each call to `AddError()` appends a new entry to the internal error list. `GetError()` combines all stored messages into a single newline-separated string. Errors are only cleared when they no longer apply: | Event | Cleared errors | |--------------------------------|---------------------------------------------| | `StaticForgeBuilder::Build()` | errors of the builder (previous build) | | `StaticForgeReader::Load()` | errors of the reader and of the target archive | | `StaticForgeMeta::Load()` | errors of the meta parser | | `TakeError()` / `ClearErrors()`| all errors of the object | Errors of `StaticForgeArchive` calls like `LoadAsset` stay stored until they are taken or cleared, so several failed loads can be reported together."}];
  var currentTabId = null;
  var currentNodeId = null;
  var isTransitioning = false;
  var dynamicContent = document.getElementById('dynamicContent');

  // -- Search state --------------------------------------------------------
  var searchInput   = document.getElementById('searchInput');
  var searchResults = document.getElementById('searchResults');
  var searchResultsList = document.getElementById('searchResultsList');
  var searchToggle  = document.getElementById('searchIncludeTabs');
  var searchDebounceTimer = null;

  // -- Helper: find node's tab --------------------------------------------
  function getNodeTabId(nodeId) {
    var node = allNodes.find(n => { return n.id === nodeId; });
    return node ? node.tabId : null;
  }

  // -- Helper: page (and section) that shows a node ----------------------
  function resolveTarget(nodeId) {
    if (!nodeId)
      return null;
    if (allNodes.some(n => { return n.id === nodeId; }))
      return { pageId: nodeId, anchor: null };
    return nodeAliases[nodeId] || null;
  }

  function scrollToSection(anchor) {
    if (!anchor)
      return;
    var el = document.getElementById(anchor);
    if (el && dynamicContent.contains(el))
      el.scrollIntoView();
  }

  // Opens any node: pages directly, merged children on their page at their section.
  function openNode(nodeId, updateUrl, onDone) {
    var target = resolveTarget(nodeId);
    if (!target) {
      onDone?.();
      return;
    }
    loadNode(target.pageId, updateUrl, () => {
      scrollToSection(target.anchor);
      onDone?.();
    });
  }

  // -- Header scroll-hide behaviour --------------------------------------
  var docHeader = document.getElementById('docHeader');
  if (docHeader && docHeader.classList.contains('header-scroll-hide')) {
    var lastScrollY = 0;
    var scrollTarget = document.querySelector('.dynamic-content') || window;
    var onScroll = () => {
      var y = (scrollTarget === window) ? window.scrollY : scrollTarget.scrollTop;
      if (y > lastScrollY && y > 60) {
        docHeader.classList.add('hidden-scrolled');
      } else {
        docHeader.classList.remove('hidden-scrolled');
      }
      lastScrollY = y;
    };
    scrollTarget.addEventListener('scroll', onScroll, { passive: true });
  }

  // -- TOC builder --------------------------------------------------------
  var tocLinks = document.getElementById('tocLinks');
  function buildToc() {
    if (!tocLinks) 
      return;
    var headings = dynamicContent.querySelectorAll('h1,h2,h3,h4');
    tocLinks.innerHTML = '';
    headings.forEach(h => {
      if (!h.id) h.id = 'h-' + Math.random().toString(36).slice(2, 7);
      var a = document.createElement('a');
      a.className = 'toc-link';
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.dataset.level = h.tagName[1];
      a.addEventListener('click', e => {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth' });
      });
      tocLinks.appendChild(a);
    });
  }

  // -- Sidebar toggle ------------------------------------------------------
  var docRoot = document.getElementById('docRoot');
  var navBackdrop = document.getElementById('navBackdrop');
  var toggleButtons = [
    document.getElementById('navToggleBtn')
  ].filter(Boolean);
  var closeBtn = document.getElementById('navCloseBtn');

  function setSidebarCollapsed(collapsed, persist) {
    docRoot.classList.toggle('sidebar-collapsed', collapsed);
    toggleButtons.forEach(btn => {
      btn.setAttribute('aria-expanded', String(!collapsed));
    });
    if (persist) {
      try { sessionStorage.setItem('_docSidebarCollapsed', collapsed ? '1' : '0'); } catch (e) {}
    }
  }

  function toggleSidebar() {
    setSidebarCollapsed(!docRoot.classList.contains('sidebar-collapsed'), true);
  }

  toggleButtons.forEach(btn => {
    btn.addEventListener('click', toggleSidebar);
  });

  if (closeBtn) {
    closeBtn.addEventListener('click', () => {
      setSidebarCollapsed(true, true);
    });
  }

  navBackdrop.addEventListener('click', () => {
    setSidebarCollapsed(true, true);
  });

  // When the sidebar floats over the content (position: fixed, e.g. on
  // mobile), close it after a node was picked. Only if it can be reopened.
  var navContainer = document.querySelector('.nav-container');
  function collapseOverlaySidebar() {
    var isOverlay = navContainer && getComputedStyle(navContainer).position === 'fixed';
    if (isOverlay && toggleButtons.length > 0) {
      setSidebarCollapsed(true, true);
    }
  }

  // Default: open on desktop, closed on mobile — unless the user already
  // picked a state this session. Never auto-collapse if there is no way
  // to reopen the sidebar again (no toggle button rendered, e.g.
  // header-show:'sidebar'/'never').
  (function initSidebarState() {
    var stored = null;
    try { stored = sessionStorage.getItem('_docSidebarCollapsed'); } catch (e) {}

    var canReopen = toggleButtons.length > 0;
    var collapsed = stored !== null
      ? stored === '1'
      : (canReopen && window.innerWidth <= 768);

    setSidebarCollapsed(collapsed, false);
  })();

  // -- Load node content from template with crossfade ---------------------
  function loadNode(nodeId, updateUrl, onDone) {
    if (isTransitioning) {
      onDone?.();
      return;
    }

    if (nodeId === currentNodeId) { 
      onDone?.(); 
      return; 
    }

    var template = document.getElementById('tmpl-' + nodeId);
    if (!template) {
      console.warn('Template not found for node', nodeId);
      onDone?.(); 
      return;
    }

    var newTabId = getNodeTabId(nodeId);
    if (!newTabId) { 
      onDone?.(); 
      return;
    }

    var activeTabSection = document.querySelector('.sidebar-section.active');
    if (activeTabSection && activeTabSection.dataset.tab !== newTabId) {
      switchTab(newTabId, () => {
        loadNode(nodeId, updateUrl, onDone);
      });
      return;
    }

    isTransitioning = true;
    dynamicContent.classList.add('fade-out');

    setTimeout(() => {
      var clone = document.importNode(template.content, true);
      dynamicContent.innerHTML = '';
      dynamicContent.appendChild(clone);
      buildToc();

      document.querySelectorAll('.nav-row').forEach(row => {
        row.classList.remove('active');
      });
      document.querySelectorAll('.nav-row[data-node-id="' + nodeId + '"]').forEach(row => {
        row.classList.add('active');
      });

      currentNodeId = nodeId;
      currentTabId = newTabId;

      if (updateUrl !== false && window.location.hash !== '#' + nodeId) {
        history.pushState(null, '', '#' + nodeId);
      }

      dynamicContent.classList.remove('fade-out');
      setTimeout(() => {
        isTransitioning = false;
        onDone?.(); 
      }, 50);
    }, 150);
  }

  // -- Tab switching -----------
  function switchTab(tabId, callback) {
    document.querySelectorAll('.sidebar-section').forEach(s => {
      s.classList.toggle('active', s.dataset.tab === tabId);
    });
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tabId);
    });

    try { 
      sessionStorage.setItem('_docActiveTab', tabId); 
    } catch (e) {}

    var firstNodeInTab = allNodes.find(n => n.tabId === tabId);
    if (firstNodeInTab) {
      loadNode(firstNodeInTab.id, true, callback);
    } else {
      dynamicContent.innerHTML = '<div class="main"><p>No content in this tab.</p></div>';
      currentNodeId = null;
      currentTabId = tabId;
      callback?.();
    }
  }

  // -- Nav group toggle --------------------------------------
  function toggleNavGroup(groupId) {
    var group = document.getElementById(groupId);
    if (!group)
      return;
    group.classList.toggle('collapsed');
  }

  // -- Search helpers ------------------------------------------------------

  /** Escapes a string for safe insertion as HTML text content. */
  function _escHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /**
   * Returns the HTML-escaped string with all occurrences of query
   * wrapped in <mark> tags for highlighting.
   */
  function _highlight(text, query) {
    if (!query || !text)
      return _escHtml(text);
    var escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('(' + escaped + ')', 'gi');
    return _escHtml(text).replace(re, '<mark>$1</mark>');
  }

  /**
   * Returns a short excerpt of text centred around the first occurrence
   * of query, padded by radius characters on each side.
   */
  function _getSnippet(text, query, radius) {
    radius = radius || 80;
    if (!text)
      return '';
    if (!query)
      return text.slice(0, radius * 2);
    var idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx < 0) 
      return text.slice(0, radius * 2);
    var start = Math.max(0, idx - radius);
    var end   = Math.min(text.length, idx + query.length + radius);
    return (start > 0 ? '\u2026' : '') + text.slice(start, end) + (end < text.length ? '\u2026' : '');
  }

  /**
   * Scores a single index entry against the query string.
   * Returns { score, matchedHeading }.
   *
   * Score weights:
   *   title match   +100
   *   heading match  +50  (first matched heading captured)
   *   content match  +10
   */
  function _scoreEntry(entry, query) {
    var ql = query.toLowerCase();
    var score = 0;
    var matchedHeading = null;

    if (entry.title.toLowerCase().indexOf(ql) >= 0)
      score += 100;

    for (var i = 0; i < entry.headings.length; i++) {
      if (entry.headings[i].toLowerCase().indexOf(ql) >= 0) {
        score += 50;
        if (!matchedHeading) matchedHeading = entry.headings[i];
      }
    }

    if (entry.content.toLowerCase().indexOf(ql) >= 0)
      score += 10;

    return { score: score, matchedHeading: matchedHeading };
  }

  /**
   * Executes a search over the index and renders results into the
   * floating results panel. Hides the panel when query is empty.
   */
  function _runSearch(query) {
    if (!searchResultsList)
      return;

    query = (query || '').trim();

    if (query.length < 2) {
      searchResults.classList.remove('visible');
      searchResultsList.innerHTML = '';
      return;
    }

    // Scope: current tab only, or all tabs when toggle is checked.
    var crossTab = searchToggle ? searchToggle.checked : false;
    var pool = crossTab
      ? searchIndex
      : searchIndex.filter(e => { return e.tabId === currentTabId; });

    var scored = [];
    for (var i = 0; i < pool.length; i++) {
      var res = _scoreEntry(pool[i], query);
      if (res.score > 0)
        scored.push({ entry: pool[i], score: res.score, matchedHeading: res.matchedHeading });
    }

    scored.sort((a, b) => { return b.score - a.score; });
    var top = scored.slice(0, 20);

    if (top.length === 0) {
      searchResultsList.innerHTML = '<div class="search-no-results">No results found</div>';
      searchResults.classList.add('visible');
      return;
    }

    searchResultsList.innerHTML = top.map(item => {
      var e = item.entry;
      var snippet = _getSnippet(e.content, query, 80);
      var headingHtml = item.matchedHeading
        ? '<div class="search-result-heading">' + _highlight(item.matchedHeading, query) + '</div>'
        : '';
      return '<div class="search-result" data-node-id="' + _escHtml(e.nodeId) + '">'
        + '<div class="search-result-title">'   + _highlight(e.title, query) + '</div>'
        + headingHtml
        + '<div class="search-result-preview">' + _highlight(snippet, query) + '</div>'
        + '</div>';
    }).join('');

    searchResults.classList.add('visible');
  }

  // -- Event handling -----------------------------------------------------

  // Reference links ([[slug]]): open the target page and scroll to the anchor
  document.body.addEventListener('click', e => {
    var ref = e.target.closest('.doc-ref[data-ref-node]');
    if (!ref)
      return;
    e.preventDefault();
    var anchor = ref.getAttribute('data-ref-anchor');
    openNode(ref.getAttribute('data-ref-node'), true, () => {
      scrollToSection(anchor);
    });
  });

  // Sidebar-Clicks (Delegation): chevrons/folders toggle, nodes load
  document.body.addEventListener('click', e => {
    var btn = e.target.closest('[data-toggle-group]');
    if (btn && btn.dataset.toggleGroup) {
      e.preventDefault();
      toggleNavGroup(btn.dataset.toggleGroup);
      return;
    }

    var link = e.target.closest('.nav-row[data-node-id]');
    if (link && link.getAttribute('data-node-id')) {
      e.preventDefault();
      loadNode(link.getAttribute('data-node-id'), true);
      collapseOverlaySidebar();
    }
  });

  // Tab-Clicks
  var tabNav = document.getElementById('tabNav');
  if (tabNav) {
    tabNav.addEventListener('click', e => {
      var btn = e.target.closest('.tab-btn');
      if (btn && btn.dataset.tab) {
        switchTab(btn.dataset.tab);
      }
    });
  }

  var tabNavContainer = document.getElementById('tabNavContainer');
  if (tabNavContainer) {
    // Convert vertical scroll to horizontal scroll
    tabNavContainer.addEventListener('wheel', (e) => {
      if (e.deltaY === 0)
        return;
    
      e.preventDefault(); // prevent vertical scroll
      tabNavContainer.scrollBy({
        left: e.deltaY,
        behavior: 'smooth'
      });
    }, { passive: false });
  }

  window.addEventListener('hashchange', () => {
    var hash = window.location.hash.slice(1);
    if (resolveTarget(hash)) {
      openNode(hash, false);
    } else if (firstNode) {
      loadNode(firstNode.id, true);
    }
  });

  // -- Search event handling ----------------------------------------------

  if (searchInput) {
    // Debounced input -> run search after 120 ms of silence.
    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounceTimer);
      var val = searchInput.value;
      searchDebounceTimer = setTimeout(() => {
        _runSearch(val);
      }, 120);
    });

    // Re-show results on focus if there is a pending query.
    searchInput.addEventListener('focus', () => {
      if (searchInput.value.trim().length >= 2 && searchResultsList)
        searchResults.classList.add('visible');
    });
  }

  // Result clicks: navigate to node and close panel.
  if (searchResultsList) {
    searchResultsList.addEventListener('click', e => {
      var item = e.target.closest('.search-result');
      if (!item)
        return;
      
      var nodeId = item.getAttribute('data-node-id');
      searchResults.classList.remove('visible');
      
      if (searchInput)
        searchInput.value = '';
      if (nodeId)
        openNode(nodeId, true);
    });
  }

  // Close results when clicking anywhere outside the search widget.
  document.addEventListener('click', e => {
    if (!searchResultsList)
      return;
    var docSearch = document.getElementById('docSearch');
    if (docSearch && !docSearch.contains(e.target))
      searchResults.classList.remove('visible');
  });

  // -- Externe Navigation (postMessage) ------------------------------------
  var NAV_SOURCE = 'doc-nav';
  var navScrollPending = false;

  function getLocationPayload() {
    var scrollTop = dynamicContent.scrollTop;
    var scrollHeight = dynamicContent.scrollHeight;
    var clientHeight = dynamicContent.clientHeight;
    var maxScroll = scrollHeight - clientHeight;
    return {
      tabId: currentTabId,
      nodeId: currentNodeId,
      scrollTop: scrollTop,
      scrollHeight: scrollHeight,
      clientHeight: clientHeight,
      ratio: maxScroll > 0 ? scrollTop / maxScroll : 0
    };
  }

  function postLocation() {
    try {
      window.parent.postMessage({ source: NAV_SOURCE, type: 'location', payload: getLocationPayload() }, '*');
    } catch (e) {
    }
  }

  dynamicContent.addEventListener('scroll', function () {
    if (navScrollPending)
      return;
    navScrollPending = true;
    requestAnimationFrame(function () {
      navScrollPending = false;
      postLocation();
    });
  }, { passive: true });

  (function () {
    var tableHeadPending = false;
    function updateTableHeads() {
      tableHeadPending = false;
      var stickTop = dynamicContent.getBoundingClientRect().top;
      dynamicContent.querySelectorAll('.table-wrapper thead').forEach(function (thead) {
        var tableRect = thead.parentElement.getBoundingClientRect();
        var maxOffset = Math.max(tableRect.height - thead.offsetHeight, 0);
        var offset = Math.min(Math.max(stickTop - tableRect.top, 0), maxOffset) - 1;
        thead.style.transform = offset ? 'translateY(' + offset + 'px)' : '';
      });
    }
    dynamicContent.addEventListener('scroll', function () {
      if (tableHeadPending)
        return;
      tableHeadPending = true;
      requestAnimationFrame(updateTableHeads);
    }, { passive: true });
  })();

  function applyExternalScroll(scrollPosition) {
    if (scrollPosition == null) 
      return;
    var top;
    if (typeof scrollPosition === 'object' && scrollPosition.ratio != null) {
      top = scrollPosition.ratio * (dynamicContent.scrollHeight - dynamicContent.clientHeight);
    } else if (typeof scrollPosition === 'number') {
      top = scrollPosition;
    } else {
      return;
    }
    dynamicContent.scrollTop = top;
  }

  function handleExternalNavigate(msg) {
    var target = resolveTarget(msg.nodeId) || resolveTarget(currentNodeId);
    var finish = function () {
      if (msg.scrollPosition == null)
        scrollToSection(target && target.anchor);
      applyExternalScroll(msg.scrollPosition);
      postLocation();
    };
    if (target && target.pageId !== currentNodeId) {
      loadNode(target.pageId, true, finish);
    } else {
      finish();
    }
  }

  window.addEventListener('message', function (e) {
    var msg = e.data;
    if (!msg || msg.source !== NAV_SOURCE)
      return;
    if (msg.type === 'navigate') {
      handleExternalNavigate(msg);
    } else if (msg.type === 'location:get') {
      postLocation();
    }
  });

  // Direkter Zugriff, falls contentWindow verfügbar ist
  window.docNav = {
    navigate: function (opts) { handleExternalNavigate(opts || {}); },
    getLocation: getLocationPayload
  };

  // -- Initialization ---------------------------------------
  var savedTab = null;
  try { 
    savedTab = sessionStorage.getItem('_docActiveTab'); 
  } catch (e) {
  }
  var initialTab = (savedTab && allNodes.some(n => { 
      return n.tabId === savedTab; 
    })
  ) ? savedTab : (firstNode ? firstNode.tabId : null);
  
  var hashTarget = resolveTarget(window.location.hash.slice(1));
  var initialNodeId = null;
  if (hashTarget) {
    initialNodeId = hashTarget.pageId;
  } else if (firstNode) {
    initialNodeId = firstNode.id;
  }

  if (initialTab) {
    document.querySelectorAll('.sidebar-section').forEach(s => {
      s.classList.toggle('active', s.dataset.tab === initialTab);
    });
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === initialTab);
    });
  }

  if (initialNodeId) {
    loadNode(initialNodeId, false, () => {
      scrollToSection(hashTarget && hashTarget.anchor);
      postLocation();
      window.parent.postMessage({ source: NAV_SOURCE, type: 'ready' }, '*');
    });
  } else {
    postLocation();
    window.parent.postMessage({ source: NAV_SOURCE, type: 'ready' }, '*');
  }
})();</script>
  </body>
  </html>
