<template id="tmpl-node_mu3td1ku1d4g35y4wv21q">
  <div class="main" data-node-id="node_mu3td1ku1d4g35y4wv21q" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1ku1d4g35y4wv21q" class="export-section">
    
    <div class="export-section__body"><h1 id="h-node_mu3td1ku1d4g35y4wv21q-meta-files">Meta Files</h1>
<p>Meta files let you split assets from a single source tree into multiple archives automatically.</p>
<h2 id="h-node_mu3td1ku1d4g35y4wv21q-file-format">File format</h2>
<p>A meta file is any file whose name ends with <code>.sfpak.meta</code> (e.g. <code>textures.sfpak.meta</code> or <code>my.textures.sfpak.meta</code>). It uses a simple semicolon-terminated key-value syntax:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>archive = textures;
exclude = .png, .jpg;
store-names = true;</code></pre><div class="code-language-tag code-language-tag--recognized">sfpak.meta</div></div>
<p>Each statement is a <code>key = value;</code> pair. Whitespace around <code>=</code> and <code>;</code> is ignored.</p>
<p>Comments start with <code>#</code> and run to the end of the line:</p>
<div class="code-block-wrapper code-tab-4"><pre><code># pack all UI assets together
archive = ui;
exclude = .psd; # skip source files</code></pre><div class="code-language-tag code-language-tag--recognized">sfpak.meta</div></div>
<p>Meta files are read as UTF-8, values can contain any Unicode characters (e.g. <code>archive = 纹理;</code>). A UTF-8 BOM at the start of the file is ignored. The details of the parser are described in <a class="doc-ref" href="#node_mu3td1ku1hsv9km18cfhyf" data-ref-node="node_mu3td1ku1hsv9km18cfhyf" title="Meta File Parser">Meta File Parser</a>.</p>
<h2 id="h-node_mu3td1ku1d4g35y4wv21q-supported-parameters">Supported parameters</h2>
<div class="table-wrapper"><table data-striped="row" data-hover="row"><thead><tr><th width="210">Key</th><th>Type</th><th>Required</th><th>Description</th></tr></thead><tbody><tr><td><code>archive</code></td><td>string</td><td>yes</td><td>Name of the archive produced from this directory</td></tr><tr><td><code>extension</code></td><td>string</td><td>no</td><td>File extension of the archive (e.g. <code>pak</code> or <code>.pak</code>, default <code>.sfpak</code>)</td></tr><tr><td><code>exclude</code></td><td>string[]</td><td>no</td><td>Comma-separated list of file extensions to skip (e.g. <code>.png</code>, <code>.tar.gz</code>)</td></tr><tr><td><code>store-names</code></td><td>bool</td><td>no</td><td>Store original filenames in the archive for debug inspection and extraction</td></tr><tr><td><code>compress</code></td><td>bool</td><td>no</td><td>Compress files larger than 4096 bytes</td></tr><tr><td><code>compress-block-size</code></td><td>int</td><td>no</td><td>Block size in bytes used for compression (1024 - 67108864, default 65536)</td></tr><tr><td><code>compress-table-size</code></td><td>int</td><td>no</td><td>Compressor match table size as power of two (8 - 24, default 16)</td></tr><tr><td><code>compress-min-match</code></td><td>int</td><td>no</td><td>Shortest repeated sequence stored as a reference (4 - 65535, default 8)</td></tr><tr><td><code>compress-min-saving</code></td><td>int</td><td>no</td><td>Percent a block or file must get smaller to be stored compressed (0 - 99, default 5)</td></tr></tbody></table></div>
<p>Bool values are <code>true</code> or <code>false</code> (case insensitive). Int values are plain decimal numbers without units (<code>65536</code>, not <code>64k</code>).</p>
<p>Example with all parameters:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>archive = main;
extension = pak;
exclude = .png, .jpg, .vert, .help;
store-names = true;
compress = true;
compress-block-size = 65536;
compress-table-size = 16;
compress-min-match = 8;
compress-min-saving = 5;</code></pre><div class="code-language-tag code-language-tag--recognized">sfpak.meta</div></div>
<h2 id="h-node_mu3td1ku1d4g35y4wv21q-archive-names">Archive names</h2>
<p>The archive name becomes the file name of the archive (<code>archive = textures;</code> produces <code>textures.sfpak</code>). It may contain dots (<code>textures.hd</code> produces <code>textures.hd.sfpak</code>) but no <code>/</code> or <code>\</code>, and it must not be <code>.</code> or <code>..</code>. Two archive names of one build must not only differ in case (<code>Audio</code> and <code>audio</code>), because they would be the same file on Windows.</p>
<h2 id="h-node_mu3td1ku1d4g35y4wv21q-archive-extension">Archive extension</h2>
<p><code>extension</code> sets the file extension of this archive, the leading dot is optional (<code>pak</code> is the same as <code>.pak</code>). It is appended to the archive name:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>archive = audio;
extension = snd;    # produces audio.snd</code></pre><div class="code-language-tag code-language-tag--recognized">sfpak.meta</div></div>
<ul><li>Without <code>extension</code> the archive gets the extension of the command line (<code>--extension</code>) or <code>.sfpak</code>.</li><li><code>--extension</code> on the command line (or <code>SetArchiveExtension</code> in code) wins over the meta file.</li><li>The extension must not end with <code>.</code>, and it can only contain the characters of a meta value (letters, digits, <code>_</code>, <code>.</code>, <code>-</code> and Unicode characters).</li><li>Two archives of one build must not get the same file name (<code>a</code> + <code>.b.c</code> and <code>a.b</code> + <code>.c</code>).</li></ul>
<p>The meta file itself always ends with <code>.sfpak.meta</code>, also if the archive gets another extension.</p>
<h2 id="h-node_mu3td1ku1d4g35y4wv21q-excluding-files">Excluding files</h2>
<p>A file is excluded if its name <strong>ends</strong> with one of the <code>exclude</code> entries:</p>
<ul><li>The comparison is case insensitive (<code>.PNG</code> excludes <code>image.png</code>).</li><li>Multi-part extensions work (<code>.tar.gz</code> excludes <code>data.tar.gz</code>, but not <code>data.gz</code>).</li><li>A missing dot is added (<code>png</code> is the same as <code>.png</code>), so <code>png</code> does not exclude <code>image.xpng</code>.</li></ul>
<h2 id="h-node_mu3td1ku1d4g35y4wv21q-how-it-works">How it works</h2>
<p>When the tool scans your source directories it looks for <code>.sfpak.meta</code> files. Every asset file in the same directory (or any subdirectory) is then packed into the archive named in that meta file. If a subdirectory has its own meta file, that one is used for the subdirectory. Excluded extensions are skipped entirely. Each directory can contain only one meta file.</p>
<div class="doc-tree"><ul class="doc-tree__list"><li class="doc-tree__item doc-tree__item--folder"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">assets</span></div><ul class="doc-tree__list"><li class="doc-tree__item doc-tree__item--folder"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">textures</span></div><ul class="doc-tree__list"><li class="doc-tree__item"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">textures.sfpak.meta</span><span class="doc-tree__comment">archive = textures; exclude = .psd;</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">background.png</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">ui.png</span></div></li></ul></li><li class="doc-tree__item doc-tree__item--folder"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">audio</span></div><ul class="doc-tree__list"><li class="doc-tree__item"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">audio.sfpak.meta</span><span class="doc-tree__comment">archive = audio; extension = snd;</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">music.ogg</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">sfx.wav</span></div></li></ul></li><li class="doc-tree__item doc-tree__item--folder"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">scripts</span></div><ul class="doc-tree__list"><li class="doc-tree__item"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">game.lua</span><span class="doc-tree__comment">no meta file → goes into the default archive</span></div></li></ul></li></ul></li></ul></div>
<p>Running the tool on <code>assets/</code> produces:</p>
<ul><li><code>textures.sfpak</code></li><li><code>audio.snd</code></li><li><code>main.sfpak</code> (for everything without a meta file)</li></ul>
<p>Asset paths inside the archive are always relative to the source folder, not to the meta file. <code>background.png</code> above is loaded as <code>textures/background.png</code>.</p>
<h2 id="h-node_mu3td1ku1d4g35y4wv21q-fallback">Fallback</h2>
<p>Files that are not covered by any meta file are packed into the archive name set with <code>--name</code> (default: <code>main</code>), with the extension set with <code>--extension</code> (default: <code>.sfpak</code>).</p>
<h2 id="h-node_mu3td1ku1d4g35y4wv21q-command-line-overrides">Command line overrides</h2>
<p>Values set on the command line win over the meta file:</p>
<ul><li><code>--store-names</code> and <code>--compress</code> force the option on for <strong>all</strong> archives, even those whose meta file sets it to <code>false</code>. The meta value only takes effect when the CLI flag is not set.</li><li><code>--extension</code>, <code>--compress-block-size</code>, <code>--compress-table-size</code>, <code>--compress-min-match</code> and <code>--compress-min-saving</code> replace the meta file value for all archives. Without the CLI argument the meta value is used, without both the default.</li></ul></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1ku1w2zp279b2ssx">
  <div class="main" data-node-id="node_mu3td1ku1w2zp279b2ssx" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1ku1w2zp279b2ssx" class="export-section">
    
    <div class="export-section__body"><h1 id="h-node_mu3td1ku1w2zp279b2ssx-inspecting-archives">Inspecting Archives</h1>
<p>Use <code>--info</code> to display header and index information of one or more existing archives, <code>--verify</code> to check them for damage, and <code>--extract</code> to turn an archive back into normal files. All three accept archives with any extension, the content of the file decides if it is an archive.</p>
<h2 id="h-node_mu3td1ku1w2zp279b2ssx-basic-info">Basic info</h2>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--info</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">textures</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">sfpak</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Output:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>Archive: textures.sfpak
Version: 3
File count: 2
Index offset: 64
Index size: 80
Data offset: 4096</code></pre><div class="code-language-tag code-language-tag--recognized">Output</div></div>
<h2 id="h-node_mu3td1ku1w2zp279b2ssx-inspecting-multiple-archives-at-once">Inspecting multiple archives at once</h2>
<p><code>--info</code> can be repeated to inspect several archives in one invocation:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--info</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">textures</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">sfpak</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--info</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">audio</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">snd</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Each archive is printed in sequence, separated by an empty line. With more than one archive the full path is shown instead of only the file name.</p>
<h2 id="h-node_mu3td1ku1w2zp279b2ssx-verbose-index-listing">Verbose index listing</h2>
<p>Add <code>--verbose</code> to also print every index entry:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--info</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">textures</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">sfpak</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--verbose</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Output includes a line per file showing its hash (hexadecimal), byte offset relative to the data section, and original size:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>Index entries:
<span class="code-indent-guide"> </span> [0] hash: a01c85352df03fae, offset: 0, size: 9
<span class="code-indent-guide"> </span> [1] hash: 0254d0414b3d0eaf, offset: 4096, size: 200000</code></pre><div class="code-language-tag code-language-tag--recognized">Output</div></div>
<p>If the archive was built with <code>--store-names</code> (or <code>store-names = true</code> in the meta file), each line also shows the original relative path:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>Index entries:
<span class="code-indent-guide"> </span> [0] name: textures/background.png, hash: 0254d0414b3d0eaf, offset: 0, size: 200000
<span class="code-indent-guide"> </span> [1] name: textures/ui.png, hash: a6cf994350b589ad, offset: 200704, size: 3</code></pre><div class="code-language-tag code-language-tag--recognized">Output</div></div>
<h2 id="h-node_mu3td1ku1w2zp279b2ssx-verifying-archives">Verifying archives</h2>
<p><code>--verify</code> checks the checksums of all files in one or more archives:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--verify</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__string">"</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__string">./build/textures.sfpak, ./build/main.sfpak"</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Output:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>[Error] ./build/textures.sfpak: Asset &#39;textures/ui.png&#39; is damaged (checksum mismatch)
[OK]    ./build/main.sfpak (12 files)</code></pre><div class="code-language-tag code-language-tag--recognized">Output</div></div>
<p>Several damaged files of one archive are listed below it:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>[Error] ./build/levels.sfpak:
- Asset &#39;levels/level_01.map&#39; is damaged (checksum mismatch)
- Asset &#39;levels/level_02.map&#39; is damaged (checksum mismatch)</code></pre><div class="code-language-tag code-language-tag--recognized">Output</div></div>
<p>All archives are checked, also if one of them is damaged. The exit code is not <code>0</code> if any archive is damaged or can't be loaded, so <code>--verify</code> can be used in build or install scripts. Without stored names a damaged file is reported by its hash. A file that is not an archive is reported as <code>Invalid archive magic</code>.</p>
<h2 id="h-node_mu3td1ku1w2zp279b2ssx-extracting-archives">Extracting archives</h2>
<p><code>--extract</code> writes every file of an archive back to disk. Each archive gets its own folder <code>&lt;output&gt;/&lt;archive file name without its extension&gt;/</code>:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--extract</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">textures</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">sfpak</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">unpacked</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--mkdir</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>All archives are loaded and checked before anything is written. The output directory is only created when all of them can be extracted.</p>
<p>With stored names the original folder structure is restored (the path inside the archive is relative to the source folder):</p>
<div class="doc-tree"><ul class="doc-tree__list"><li class="doc-tree__item doc-tree__item--folder"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">unpacked</span></div><ul class="doc-tree__list"><li class="doc-tree__item doc-tree__item--folder"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">textures</span><span class="doc-tree__comment">from textures.sfpak</span></div><ul class="doc-tree__list"><li class="doc-tree__item doc-tree__item--folder"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">textures</span></div><ul class="doc-tree__list"><li class="doc-tree__item"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">background.png</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">ui.png</span></div></li></ul></li></ul></li><li class="doc-tree__item doc-tree__item--folder"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">main</span><span class="doc-tree__comment">from main.sfpak, no names stored</span></div><ul class="doc-tree__list"><li class="doc-tree__item"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">a01c85352df03fae.bin</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">0254d0414b3d0eaf.bin</span></div></li></ul></li></ul></li></ul></div>
<p>Without stored names the original paths are unknown, so the files are named after their hash, matching the <code>--info --verbose</code> output: <code>./unpacked/main/a01c85352df03fae.bin</code>.</p>
<p>Several archives can be extracted at once:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--extract</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__string">"</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__string">./build/textures.sfpak, ./build/main.sfpak"</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">unpacked</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--mkdir</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--verbose</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Rules:</p>
<ul><li>Existing files are never overwritten. If one of the target files already exists, nothing is extracted. Empty the output folder first.</li><li>Names in the archive must be relative paths. An archive with names like <code>../file</code> or <code>C:/file</code> is rejected, so a manipulated archive can't write outside of the output folder.</li><li>Only the last extension is removed for the folder name: <code>textures.hd.sfpak</code> goes to <code>textures.hd/</code>, <code>main.data.bin</code> to <code>main.data/</code>. Two archives that would get the same folder are an error.</li></ul>
<blockquote><strong>Note:</strong> Without name storage the index only contains hashes. The original path is not recoverable from the archive alone — keep your source assets, or pack with <code>--store-names</code> if you need to extract with the original names.</blockquote></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1kuzgocka16m5db0">
  <div class="main" data-node-id="node_mu3td1kuzgocka16m5db0" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1kuzgocka16m5db0" class="export-section">
    
    <div class="export-section__body"><h1 id="h-node_mu3td1kuzgocka16m5db0-loading-assets-at-runtime">Loading Assets at Runtime</h1>
<p>At runtime, use <code>StaticForgeReader</code> to open an archive file and <code>StaticForgeArchive</code> to load individual assets.</p>
<div class="doc-toc doc-toc--outline doc-toc--numbered"><ul class="doc-toc__list"><li><a class="doc-toc__link" href="#h-node_mu3td1kuzgocka16m5db0-opening-an-archive" data-toc-target="h-node_mu3td1kuzgocka16m5db0-opening-an-archive"><span class="doc-toc__num">1</span><span class="doc-toc__text">Opening an archive</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuzgocka16m5db0-cloning-an-archive" data-toc-target="h-node_mu3td1kuzgocka16m5db0-cloning-an-archive"><span class="doc-toc__num">2</span><span class="doc-toc__text">Cloning an archive</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuzgocka16m5db0-loading-from-several-threads" data-toc-target="h-node_mu3td1kuzgocka16m5db0-loading-from-several-threads"><span class="doc-toc__num">3</span><span class="doc-toc__text">Loading from several threads</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuzgocka16m5db0-loading-from-several-archives" data-toc-target="h-node_mu3td1kuzgocka16m5db0-loading-from-several-archives"><span class="doc-toc__num">4</span><span class="doc-toc__text">Loading from several archives</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuzgocka16m5db0-loading-a-file-by-path" data-toc-target="h-node_mu3td1kuzgocka16m5db0-loading-a-file-by-path"><span class="doc-toc__num">5</span><span class="doc-toc__text">Loading a file by path</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuzgocka16m5db0-checking-assets-without-loading" data-toc-target="h-node_mu3td1kuzgocka16m5db0-checking-assets-without-loading"><span class="doc-toc__num">6</span><span class="doc-toc__text">Checking assets without loading</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuzgocka16m5db0-loading-into-an-existing-buffer" data-toc-target="h-node_mu3td1kuzgocka16m5db0-loading-into-an-existing-buffer"><span class="doc-toc__num">7</span><span class="doc-toc__text">Loading into an existing buffer</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuzgocka16m5db0-loading-a-part-of-an-asset" data-toc-target="h-node_mu3td1kuzgocka16m5db0-loading-a-part-of-an-asset"><span class="doc-toc__num">8</span><span class="doc-toc__text">Loading a part of an asset</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuzgocka16m5db0-verifying-the-archive-at-startup" data-toc-target="h-node_mu3td1kuzgocka16m5db0-verifying-the-archive-at-startup"><span class="doc-toc__num">9</span><span class="doc-toc__text">Verifying the archive at startup</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuzgocka16m5db0-loading-all-files" data-toc-target="h-node_mu3td1kuzgocka16m5db0-loading-all-files"><span class="doc-toc__num">10</span><span class="doc-toc__text">Loading all files</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuzgocka16m5db0-managing-the-file-stream" data-toc-target="h-node_mu3td1kuzgocka16m5db0-managing-the-file-stream"><span class="doc-toc__num">11</span><span class="doc-toc__text">Managing the file stream</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuzgocka16m5db0-memory-mapped-access" data-toc-target="h-node_mu3td1kuzgocka16m5db0-memory-mapped-access"><span class="doc-toc__num">12</span><span class="doc-toc__text">Memory-mapped access</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuzgocka16m5db0-compression" data-toc-target="h-node_mu3td1kuzgocka16m5db0-compression"><span class="doc-toc__num">13</span><span class="doc-toc__text">Compression</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuzgocka16m5db0-error-handling" data-toc-target="h-node_mu3td1kuzgocka16m5db0-error-handling"><span class="doc-toc__num">14</span><span class="doc-toc__text">Error handling</span></a></li></ul></div>
<h2 id="h-node_mu3td1kuzgocka16m5db0-opening-an-archive">Opening an archive</h2>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">#</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">include </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">StaticForgeCore/StaticForge.h</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword"></span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>

<p><code>Load</code> validates the whole archive structure (header, index and name table) against the file size, so a damaged or truncated archive is rejected with an error instead of crashing. Archives of another format version are rejected as well; rebuild them with the current tool.</p>
<p>The extension of the file is not checked, so archives packed with another extension (e.g. <code>--extension pak</code>, see <a class="doc-ref" href="#node_mu3td1ku93dq7vjxmvr2" data-ref-node="node_mu3td1ku93dq7vjxmvr2" title="Packing Assets">Packing Assets</a>) are loaded the same way. A file that is not an archive is rejected because of its header (<code>Invalid archive magic</code>).</p>
<p>The same archive object can be loaded again with another file. Everything of the previous archive (open stream, memory mapping, index, errors) is released first.</p>
<h2 id="h-node_mu3td1kuzgocka16m5db0-cloning-an-archive">Cloning an archive</h2>
<p>An archive can't be copied, but <code>Clone()</code> creates a second archive object for the same file without reading it again:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">clone</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Clone</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>The clone shares the loaded index and names (and the memory mapping, if the archive is mapped), but has its own file stream and its own errors. A single archive object must not be used from several threads at once, but each thread can use its own clone.</p>
<h2 id="h-node_mu3td1kuzgocka16m5db0-loading-from-several-threads">Loading from several threads</h2>

<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetPoolSize</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">4</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// optional, default: std::thread::hardware_concurrency()</span>

<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"><span class="code-indent-guide"> </span>   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">reader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">endl</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>

<p>It can also be created from a loaded archive and the other way around. Both share the loaded data:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeConcurrentArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">concurrent</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">CloneConcurrent</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">4</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">normal</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">concurrent</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">CloneArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p><strong>Stream pool:</strong> stream loads take a free file stream from a pool and give it back afterwards. Streams are only opened when they are needed. If all streams of the pool are in use, the load waits until one is free, so at most <code>GetPoolSize()</code> files are open. <code>GetActiveStreamCount()</code> and <code>GetOpenStreamCount()</code> return how many streams are used and open right now (only a snapshot, the value can change at any time). <code>SetPoolSize</code> can also be called while loading, <code>CloseFreeStreams()</code> closes all streams that are not used.</p>
<p><strong>Mapped:</strong> after <code>OpenMapped()</code> the mapped functions don't need the pool at all and are the fastest way to load from many threads. <code>OpenMapped</code> and <code>CloseMapped</code> themselves must not be called while other threads load assets.</p>
<p><strong>Errors:</strong> every function has an optional <code>std::string* errorOut</code> as last parameter.</p>
<ul><li>With <code>errorOut</code> the error is only written there, nothing is collected.</li><li>Without <code>errorOut</code> the error is collected for the calling thread. <code>TakeError()</code>, <code>GetError()</code>, <code>IsValid()</code> and <code>ClearErrors()</code> only see the errors of the calling thread.</li><li><code>GetAllErrors()</code> / <code>TakeAllErrors()</code> return the errors of all threads, each line starts with <code>[Thread &lt;n&gt;]</code>. Threads are numbered in the order of their first error.</li></ul>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// e.g. after a loading screen</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetAllErrors</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">().</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">empty</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">())</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"><span class="code-indent-guide"> </span>   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeAllErrors</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">endl</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>Errors without <code>errorOut</code> stay collected until they are taken or cleared, also if the thread has ended.</p>
<h2 id="h-node_mu3td1kuzgocka16m5db0-loading-from-several-archives">Loading from several archives</h2>

<ul><li>The set doesn't own the archives, it only keeps pointers. An archive must not be destroyed while the set uses it, call <code>Remove()</code> or <code>Clear()</code> first, or declare the set after the archives like above.</li><li>An asset path may only exist in one archive. <code>Add()</code> fails if the new archive contains a path that an added archive has too, and nothing is added. The packer reports the same case already when building.</li><li>The set has the loading functions by key (vector, buffer, range, mapped), <code>Contains</code>, <code>GetAssetSize</code>, <code>FindArchive</code> (the archive that contains an asset) and <code>VerifyAll</code>. Mapped functions need the archive that contains the asset to be mapped.</li><li>Errors are collected in the set, the archives stay untouched.</li><li>If an added archive is loaded again with <code>reader.Load</code>, the set reports an error for its assets. Remove it and add it again.</li></ul>
<p><code>StaticForgeConcurrentArchiveSet</code> does the same for <code>StaticForgeConcurrentArchive</code> and can be used from several threads. Errors work like in the concurrent archive (<code>errorOut</code> or collected per thread). Only <code>Add</code>, <code>Remove</code> and <code>Clear</code> must not be called while other threads load assets.</p>

<p><code>VerifyAll</code> checks the checksum of every asset. Use it e.g. at startup to detect a damaged or partly replaced installation and show a clear message instead of failing later while loading:</p>

<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"><span class="code-indent-guide"> </span>   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// one error per damaged asset, e.g. "Asset 'textures/ui.png' is damaged (checksum mismatch)"</span>

<h2 id="h-node_mu3td1kuzgocka16m5db0-managing-the-file-stream">Managing the file stream</h2>
<p>After <code>StaticForgeReader::Load</code> succeeds, the archive's file stream is open. <code>LoadAsset</code> reopens it automatically if it was closed. You can control this manually:</p>

<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">OpenFileStream</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">  </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// reopen when needed</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">bool</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">open</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">IsFileStreamOpen</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>A failed load (e.g. a checksum mismatch) does not affect later loads of other assets.</p>
<h2 id="h-node_mu3td1kuzgocka16m5db0-memory-mapped-access">Memory-mapped access</h2>

<p><code>GetAssetMapped</code> returns a non-owning <code>AssetView</code> directly into mapped memory — no allocation or copy needed. The view becomes invalid as soon as <code>CloseMapped</code> is called. For an empty file the view has <code>size == 0</code> and a valid (non-null) <code>data</code> pointer.</p>
<p><code>LoadAssetMapped</code> and <code>LoadAssetRangeMapped</code> also work for compressed assets, they decompress directly from the mapped memory.</p>
<blockquote><strong>Important:</strong> <code>GetAssetMapped</code> is <strong>not possible for compressed assets</strong>, because only the compressed data is in memory. It returns an empty view with an error. Use <code>LoadAssetMapped</code> instead.</blockquote>
<h2 id="h-node_mu3td1kuzgocka16m5db0-compression">Compression</h2>
<p>Assets can be stored compressed inside an archive. This is transparent for all functions except <code>GetAssetMapped</code> — <code>LoadAsset</code> detects compressed entries and decompresses them automatically before returning the data:</p>

<h2 id="h-node_mu3td1kuzgocka16m5db0-error-handling">Error handling</h2>
<p><code>StaticForgeReader</code> and <code>StaticForgeArchive</code> collect error messages (see <a class="doc-ref" href="#node_mu3td1ku72xkz714tsyqd" data-ref-node="node_mu3td1ku72xkz714tsyqd" title="ErrorSupport">ErrorSupport</a>). Always check the return value:</p>

<p>Errors of the archive accumulate over several calls until you take or clear them, so you can load many assets and report all problems at once:</p>

<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">b.png"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">b</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>

<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"><span class="code-indent-guide"> </span>   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">  </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// errors of both calls</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>

<p>or add them one at a time:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AddSourcePath</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets/textures"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AddSourcePath</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets/audio"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>Paths are <code>std::filesystem::path</code>. For UTF-8 strings use <code>std::filesystem::u8path(...)</code>, so non-ASCII names also work on Windows.</p>
<h2 id="h-node_mu3td1kurklac1g47o2b-fluent-api">Fluent API</h2>
<p>All setters return <code>*this</code> so they can be chained:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeBuilder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">main"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">},</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./build"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">};</span>

<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"><span class="code-indent-guide"> </span>   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetCreateOutputDir</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__literal">true</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>

<h2 id="h-node_mu3td1kurklac1g47o2b-options">Options</h2>
<div class="table-wrapper"><table data-striped="row" data-hover="row"><thead><tr><th width="300">Setter</th><th width="225">CLI equivalent</th><th>Description</th></tr></thead><tbody><tr><td><code>SetArchiveName(name)</code></td><td><code>--name</code></td><td>Archive name for files without a meta file (default <code>main</code>)</td></tr><tr><td><code>SetArchiveExtension(extension)</code></td><td><code>--extension</code></td><td>File extension of all archives, overrides the meta files (default <code>PACK_FILE_EXTENSION</code>, <code>.sfpak</code>)</td></tr><tr><td><code>SetSourcePath(paths)</code> / <code>AddSourcePath(path)</code></td><td><code>--source</code></td><td>Source directories</td></tr><tr><td><code>SetOutputPath(path)</code></td><td><code>--output</code></td><td>Output directory</td></tr><tr><td><code>SetCreateOutputDir(bool)</code></td><td><code>--mkdir</code></td><td>Create the output directory if it is missing</td></tr><tr><td><code>SetDebugMode(bool)</code></td><td><code>--verbose</code></td><td>Print detailed progress to <code>stdout</code></td></tr><tr><td><code>SetStoreNames(bool)</code></td><td><code>--store-names</code></td><td>Store file names in all archives</td></tr><tr><td><code>SetCompress(bool)</code></td><td><code>--compress</code></td><td>Compress files larger than 4096 bytes in all archives</td></tr><tr><td><code>SetCompressionBlockSize(size)</code></td><td><code>--compress-block-size</code></td><td>Compression block size in bytes (default <code>DEFAULT_COMPRESSION_BLOCK_SIZE</code>)</td></tr><tr><td><code>SetCompressionTableSizeLog2(size)</code></td><td><code>--compress-table-size</code></td><td>Match table size as power of two (default <code>DEFAULT_COMPRESSION_TABLE_SIZE_LOG2</code>)</td></tr><tr><td><code>SetCompressionMinMatchLength(length)</code></td><td><code>--compress-min-match</code></td><td>Shortest match stored as reference (default <code>DEFAULT_COMPRESSION_MIN_MATCH_LENGTH</code>)</td></tr><tr><td><code>SetCompressionMinSaving(percent)</code></td><td><code>--compress-min-saving</code></td><td>Minimum saving in percent, otherwise stored raw (default <code>DEFAULT_COMPRESSION_MIN_SAVING</code>)</td></tr><tr><td><code>SetCacheDir(path)</code></td><td><code>--cache-dir</code></td><td>Directory of the build cache, enables incremental builds</td></tr><tr><td><code>SetRebuild(bool)</code></td><td><code>--rebuild</code></td><td>Builds all archives, also the ones that are up to date</td></tr></tbody></table></div>
<p>The valid ranges of the compression settings are the <code>MIN_COMPRESSION_*</code> and <code>MAX_COMPRESSION_*</code> constants in <code>StaticForgeTypes.h</code>. Invalid values make <code>Build()</code> fail with an error. Compression settings that are set on the builder override the values of meta files, settings that are not set fall back to the meta file value and then to the default.</p>
<h2 id="h-node_mu3td1kurklac1g47o2b-archive-extension">Archive extension</h2>
<p><code>SetArchiveExtension</code> gives all archives another extension than <code>.sfpak</code>. The leading dot is optional:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeBuilder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">main"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">},</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./build"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">};</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"><span class="code-indent-guide"> </span>   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetCreateOutputDir</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__literal">true</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"><span class="code-indent-guide"> </span>   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetArchiveExtension</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">pak"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// same as ".pak", produces ./build/main.pak</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"><span class="code-indent-guide code-indent-guide--virtual" data-ws="    "></span>&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Build</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">())</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"><span class="code-indent-guide"> </span>   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// e.g. "Invalid archive extension '.pak.' (...)"</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"><span class="code-indent-guide"> </span>   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">endl</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<ul><li>The extension is checked when <code>Build()</code> runs. It must not be empty, contain <code>/</code>, <code>\</code> or <code>&lt; &gt; : &quot; | ? *</code>, or end with <code>.</code> or a space.</li><li>Like the compression settings it overrides the <code>extension</code> of the meta files. Without it the meta value is used, without both <code>PACK_FILE_EXTENSION</code> (<code>.sfpak</code>).</li><li><code>StaticForgeReader::Load</code> accepts archives with any extension, nothing has to be changed for loading.</li></ul>
<p>See <a class="doc-ref" href="#node_mu3td1ku93dq7vjxmvr2" data-ref-node="node_mu3td1ku93dq7vjxmvr2" title="Packing Assets">Packing Assets</a> and <a class="doc-ref" href="#node_mu3td1ku1d4g35y4wv21q" data-ref-node="node_mu3td1ku1d4g35y4wv21q" title="Meta Files">Meta Files</a> for the rules of the extension.</p>
<h2 id="h-node_mu3td1kurklac1g47o2b-building-again">Building again</h2>
<p>The same builder can run <code>Build()</code> several times, e.g. after changing the source paths. Each build starts fresh and clears the errors of the previous build.</p>
<h2 id="h-node_mu3td1kurklac1g47o2b-incremental-builds">Incremental builds</h2>
<p>With <code>SetCacheDir(path)</code> only the archives whose files or settings changed are built (see <a class="doc-ref" href="#node_mu3td1ku93dq7vjxmvr2" data-ref-node="node_mu3td1ku93dq7vjxmvr2" title="Packing Assets">Packing Assets</a>). After <code>Build()</code> the counts tell what happened:</p>
