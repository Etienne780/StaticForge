    <template id="tmpl-node_mu3td1kuufx8v3a1hzju">
  <div class="main" data-node-id="node_mu3td1kuufx8v3a1hzju" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1kuufx8v3a1hzju" class="export-section">
    
    <div class="export-section__body"><h1>Getting Started</h1>
<p>StaticForge is an asset archive system for bundling and loading game files. It combines multiple files into a compact <code>.sfpak</code> container that can be efficiently read at runtime.</p>
<h2>What you get</h2>
<ul><li>A command-line tool (<code>StaticForgeTool</code>) to pack your assets during your build process</li><li>A C++ library (<code>StaticForgeCore</code>) to load assets from <code>.sfpak</code> files at runtime</li></ul>
<h2>Typical workflow</h2>
<ol><li>Organize your asset folders</li><li>Optionally add <code>.sfpak.meta</code> files to control how folders are grouped into archives</li><li>Run <code>StaticForgeTool</code> to pack your assets into one or more <code>.sfpak</code> files</li><li>At runtime, use <code>StaticForgeReader</code> and <code>StaticForgeArchive</code> to load assets by path</li></ol>
<hr>
<blockquote><strong>Tip:</strong> <code>.sfpak</code> files are binary and not meant to be edited manually. Always rebuild them from source assets using the tool.</blockquote></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1ku93dq7vjxmvr2">
  <div class="main" data-node-id="node_mu3td1ku93dq7vjxmvr2" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1ku93dq7vjxmvr2" class="export-section">
    
    <div class="export-section__body"><h1>Packing Assets</h1>
<p>Use <code>StaticForgeTool</code> to pack a folder of assets into a <code>.sfpak</code> archive.</p>
<h2>Basic usage</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_keyword">source</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">assets</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">output</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">build</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>This scans <code>./assets</code> recursively and writes the archive to <code>./build/main.sfpak</code>.</p>
<h2>Specifying an archive name</h2>
<p>By default the archive is named <code>main</code>. Use <code>--name</code> to override:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_keyword">source</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">assets</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">output</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">build</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">name</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">textures</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>This produces <code>./build/textures.sfpak</code>.</p>
<h2>Multiple source folders</h2>
<p><code>--source</code> can be repeated to include multiple directories:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_keyword">source</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">textures</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_keyword">source</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">audio</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">output</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">build</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
or
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_keyword">source</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_string">"</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_string">./textures, ./audio"</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">output</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">build</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<h2>Creating the output directory automatically</h2>
<p>If the output directory doesn't exist yet, add <code>--mkdir</code>:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_keyword">source</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">assets</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">output</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">build</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">packed</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_keyword">mkdir</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">true</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<h2>Verbose output</h2>
<p>Add <code>--verbose</code> (or <code>-v</code>) to print detailed information about every file processed:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_keyword">source</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">assets</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">output</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">build</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">verbose</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div></div>

<template id="tmpl-node_mu3td1ku1d4g35y4wv21q">
  <div class="main" data-node-id="node_mu3td1ku1d4g35y4wv21q" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1ku1d4g35y4wv21q" class="export-section">
    
    <div class="export-section__body"><h1>Meta Files</h1>
<p>Meta files let you split assets from a single source tree into multiple <code>.sfpak</code> archives automatically.</p>
<h2>File format</h2>
<p>A meta file has the extension <code>.sfpak.meta</code> and uses a simple semicolon-terminated key-value syntax:</p>
<p><code>`</code><br>archive = textures;<br>exclude = .png, .jpg;<br>storenames = true;<br><code>`</code></p>
<p>Each statement is a <code>key = value;</code> pair. Whitespace around <code>=</code> and <code>;</code> is ignored.</p>
<p>Comments start with <code>#</code> and run to the end of the line:</p>
<p><code>`</code><br><h1>pack all UI assets together</h1><br>archive = ui;<br>exclude = .psd; # skip source files<br><code>`</code></p>
<h2>Supported parameters</h2>
<table><thead><tr><th>Key</th><th>Type</th><th>Required</th><th>Description</th></tr></thead><tbody><tr><td><code>archive</code></td><td>string</td><td>yes</td><td>Name for the <code>.sfpak</code> archive produced from this directory</td></tr><tr><td><code>exclude</code></td><td>string[]</td><td>no</td><td>Comma-separated list of file extensions to skip (e.g. <code>.png</code>)</td></tr><tr><td><code>store-names</code></td><td>bool</td><td>no</td><td>Store original filenames in the archive for debug inspection</td></tr><tr><td><code>compress</code></td><td>bool</td><td>no</td><td>Compresses files larger than 4096 bytes before storing them in the archive.</td></tr></tbody></table>
Example with all parameters:
<p><code>`</code><br>archive = main;<br>exclude = .png, .jpg, .vert, .help;<br>store-names = true;<br>compress = false;<br><code>`</code></p>
<h2>How it works</h2>
<p>When the tool scans your source directories it looks for <code>.sfpak.meta</code> files. Every asset file in the same directory (or any subdirectory) is then packed into the archive named in that meta file. Excluded extensions are skipped entirely.</p>
<p><code>`</code><br>assets/<br>  textures/<br>    textures.sfpak.meta   &lt;- archive = textures; exclude = .psd;<br>    background.png<br>    ui.png<br>  audio/<br>    audio.sfpak.meta      &lt;- archive = audio;<br>    music.ogg<br>    sfx.wav<br>  scripts/<br>    game.lua              &lt;- no meta file → goes into the default archive<br><code>`</code></p>
<p>Running the tool on <code>assets/</code> produces:<br><ul><li><code>textures.sfpak</code></li><li><code>audio.sfpak</code></li><li><code>main.sfpak</code> (for everything without a meta file)</li></ul></p>
<h2>Fallback</h2>
<p>Files that are not covered by any meta file are packed into the archive name set with <code>--name</code> (default: <code>main</code>).</p>
<h2>storenames override</h2>
<p>If <code>--store-names</code> is passed on the command line, name storage is enabled globally for <strong>all</strong> archives — even those whose meta file sets <code>store-names = false</code>. The meta value only takes effect when the CLI flag is not set.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1ku1w2zp279b2ssx">
  <div class="main" data-node-id="node_mu3td1ku1w2zp279b2ssx" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1ku1w2zp279b2ssx" class="export-section">
    
    <div class="export-section__body"><h1>Inspecting Archives</h1>
<p>Use <code>--info</code> to display header and index information of one or more existing <code>.sfpak</code> files without extracting anything.</p>
<h2>Basic info</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">info</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">build</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">textures</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_keyword">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">sfpak</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Output:</p>
<p><code>`</code><br>Archive: textures.sfpak<br>Version: 1<br>File count: 42<br>Index offset: 32<br>Index size: 1176<br>Data offset: 4096<br><code>`</code></p>
<h2>Inspecting multiple archives at once</h2>
<p><code>--info</code> can be repeated to inspect several archives in one invocation:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">info</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">build</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">textures</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_keyword">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">sfpak</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">info</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">build</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">audio</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_keyword">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">sfpak</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Each archive is printed in sequence with a separator between them.</p>
<h2>Verbose index listing</h2>
<p>Add <code>--verbose</code> to also print every index entry:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">info</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> </span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_punctuation">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">build</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other">/</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">textures</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_keyword">.</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">sfpak</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_other"> --</span><span class="token-type_ShellLang_highlightStyle_mu3tm9lsliqxx5uqhdog_identifier">verbose</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Output includes a line per file showing its hash, byte offset, size, and checksum:</p>
<p><code>`</code><br>Index entries:<br>  [0] hash: 12938471234  offset: 4096    size: 204800  checksum: 3421543<br>  [1] hash: 98712634521  offset: 208896  size: 81920   checksum: 9871234<br>  ...<br><code>`</code></p>
<h2>Name table</h2>
<p>If the archive was built with <code>--store-names</code> (or <code>store-names = true</code> in the meta file), the inspector also prints the name table, showing the original relative path for each entry.</p>
<blockquote><strong>Note:</strong> Without name storage the index only contains hashes. The original path is not recoverable from the archive alone — keep your source assets.</blockquote></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1kuzgocka16m5db0">
  <div class="main" data-node-id="node_mu3td1kuzgocka16m5db0" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1kuzgocka16m5db0" class="export-section">
    
    <div class="export-section__body"><h1>Loading Assets at Runtime</h1>
<p>At runtime, use <code>StaticForgeReader</code> to open a <code>.sfpak</code> file and <code>StaticForgeArchive</code> to load individual assets.</p>
<h2>Opening an archive</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_keyword">#</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_keyword">include </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">&lt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">StaticForgeCore/StaticForge.h</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">&gt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_keyword"></span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">archive</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_type">StaticForgeReader</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">reader</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_keyword">if</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">(</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">!</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">reader</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">Load</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">(</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">./build/textures.sfpak"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">,</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">&amp;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">archive</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">))</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_comment">// reader.GetError() contains a description of what went wrong</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">std</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_type">cerr </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">reader</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">GetError</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">()</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">std</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_variable">endl</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<h2>Loading a file by path</h2>
<p>Pass the <strong>relative path</strong> of the file exactly as it appeared under the source directory:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">std</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_type">vector</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">&lt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">std</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">byte</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">&gt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">data</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_keyword">if</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">(</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">!</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">archive</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">(</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">textures/background.png"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">,</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">data</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">))</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">std</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_type">cerr </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">archive</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">GetError</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">()</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">std</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_variable">endl</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">}</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_comment">// data now contains the raw bytes of the file</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<blockquote><strong>Important:</strong> The asset path must exactly match the path relative to the source root. Slashes are normalized internally, but typos or case mismatches will prevent the asset from being found.</blockquote>
<h2>Managing the file stream</h2>
<p>After <code>StaticForgeReader::Load</code> succeeds, the archive's file stream is open. <code>LoadAsset</code> reopens it automatically if it was closed. You can control this manually:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">archive</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">CloseFileStream</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">();</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_comment">// release the file handle</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">archive</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">OpenFileStream</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">();</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">  </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_comment">// reopen when needed</span>

<h2>Memory-mapped access</h2>

<p><code>GetAssetMapped</code> returns a non-owning <code>AssetView</code> directly into mapped memory — no allocation or copy needed. The view becomes invalid as soon as <code>CloseMapped</code> is called.</p>
<blockquote><strong>Important:</strong> Memory-mapped access is <strong>not supported for compressed assets</strong>. Calling <code>GetAssetMapped</code> or <code>LoadAssetMapped</code> on a compressed entry will return an error. Use <code>LoadAsset</code> (stream-based) instead, which handles decompression automatically.</blockquote>
<h2>Compression</h2>
<p>Assets can be stored compressed inside an archive. This is transparent when using the stream-based API — <code>LoadAsset</code> detects compressed entries and decompresses them automatically before returning the data:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_comment">// Works for both compressed and uncompressed assets</span>

<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">std</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_type">cerr </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">archive</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">GetError</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">()</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">std</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_variable">endl</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">;</span>

<p>Internally, compressed archives use per-block framing: each 4096-byte chunk is compressed independently and prefixed with its compressed and original size. This means the decompressor never needs to hold the entire file in memory at once.</p>
<p>Whether an entry is compressed can be determined from the index — if <code>compressedFileSize != 0</code> the entry is compressed, otherwise it is stored raw.</p>
<table><thead><tr><th>Access method</th><th>Uncompressed</th><th>Compressed</th></tr></thead><tbody><tr><td><code>LoadAsset</code></td><td>✅</td><td>✅ (auto-decompress)</td></tr><tr><td><code>LoadAssetMapped</code></td><td>✅</td><td>❌ not supported</td></tr><tr><td><code>GetAssetMapped</code></td><td>✅</td><td>❌ not supported</td></tr></tbody></table>
<h2>Error handling</h2>
<p>Both <code>StaticForgeReader</code> and <code>StaticForgeArchive</code> expose error messages. Always check the return value and read <code>GetError()</code> when it returns <code>false</code>:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_keyword">if</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">(</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">!</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">archive</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">(</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">audio/music.ogg"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">,</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">data</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">))</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_comment">// possible reasons: key not found, seek failure, checksum mismatch,</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_comment">// decompression failure, or compressed asset accessed via mmap</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">std</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_type">cerr </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">archive</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">GetError</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">()</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">std</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_variable">endl</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div></div>

    <section id="node_mu3td1kurklac1g47o2b" class="export-section">
    
    <div class="export-section__body"><h1>Building Archives in Code</h1>
<p>Instead of using the command-line tool you can drive the build process directly from C++ using <code>StaticForgeBuilder</code>.</p>
<h2>Minimal example</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_keyword">#</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_keyword">include </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">&lt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">StaticForgeCore/StaticForge.h</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">&gt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_keyword"></span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_type">StaticForgeBuilder</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">builder</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">builder</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">SetArchiveName</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">(</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">textures"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">AddSourcePath</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">(</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">./assets/textures"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">SetOutputPath</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">(</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">./build"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">SetCreateOutputDir</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">(</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_literal">true</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_keyword">if</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">(</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">!</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">builder</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">Build</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">())</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">std</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_type">cerr </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">builder</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">GetError</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">()</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">std</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_variable">endl</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<h2>Multiple source paths</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">builder</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">SetSourcePath</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">({</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">./assets/textures"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">,</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">./assets/audio"</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">});</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>or add them one at a time:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">builder</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">AddSourcePath</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">(</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">./assets/textures"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">builder</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">AddSourcePath</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">(</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">./assets/audio"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">);</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<h2>Fluent API</h2>
<p>All setters return <code>*this</code> so they can be chained:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_operator">::</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_type">StaticForgeBuilder</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">builder</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">{</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">main"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">,</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">{</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">./assets"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">},</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_string">./build"</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other"> </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">};</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_identifier">builder</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">SetCreateOutputDir</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">(</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_literal">true</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_other">    </span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">.</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_function">SetDebugMode</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">(</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_literal">true</span><span class="token-type_CppLang_highlightStyle_mu3tm9kw10l3ohxp1o6hw_punctuation">)</span>

<template id="tmpl-node_mu3td1kuw60i4y16ior5l">
  <div class="main" data-node-id="node_mu3td1kuw60i4y16ior5l" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1kuw60i4y16ior5l" class="export-section">
    
    <div class="export-section__body"><h1>CLI Reference</h1>
<p>Quick reference for all <code>StaticForgeTool</code> arguments.</p>
<h2>Arguments</h2>
<table><thead><tr><th>Argument</th><th>Short</th><th>Description</th><th>Type</th><th>Default</th><th>Multi</th></tr></thead><tbody><tr><td><code>--source</code></td><td><code>--src</code></td><td>Source path(s) of the files to be packed (can be specified multiple times)</td><td>filepath</td><td>—</td><td>yes</td></tr><tr><td><code>--output</code></td><td><code>--o</code></td><td>Output directory for the <code>.sfpak</code> file</td><td>filepath</td><td>—</td><td>no</td></tr><tr><td><code>--name</code></td><td><code>--n</code></td><td>Default archive name when no <code>.sfpak.meta</code> file is found</td><td>string</td><td><code>main</code></td><td>no</td></tr><tr><td><code>--mkdir</code></td><td><code>--p</code></td><td>Create the output directory if it does not exist</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--info</code></td><td><code>--i</code></td><td>Display header and index info of a <code>.sfpak</code> file (can be repeated)</td><td>filepath</td><td>—</td><td>yes</td></tr><tr><td><code>--verbose</code></td><td><code>--v</code></td><td>Enable debug/verbose console output</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--store-names</code></td><td><code>--sn</code></td><td>Store original filenames in all archives for debug inspection</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--compress</code></td><td><code>--c</code></td><td>Compresses files larger than 4096 bytes before storing them in the archive</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--help</code></td><td><code>--h</code></td><td>Show this help message</td><td>—</td><td>—</td><td>no</td></tr></tbody></table>
<h2>Modes</h2>
<p>Exactly one mode must be active per invocation. Modes are determined by which arguments are provided:</p>
<table><thead><tr><th>Mode</th><th>Required arguments</th></tr></thead><tbody><tr><td>pack</td><td><code>--source</code> and <code>--output</code></td></tr><tr><td>info</td><td><code>--info</code></td></tr><tr><td>help</td><td><code>--help</code></td></tr></tbody></table>
Combining arguments from multiple modes (e.g. <code>--source</code> together with <code>--info</code>) is an error.
<h2>storenames priority</h2>
<p>When <code>--store-names</code> is set on the command line, <br>name storage is forced on for every archive regardless of what the <code>.sfpak.meta</code> file specifies. <br>The meta-file value of <code>store-names</code> is only used when the CLI flag is absent.</p></div>
  </section>
  </div>
</template>
