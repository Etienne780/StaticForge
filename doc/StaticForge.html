inal names."},{"nodeId":"node_mu3td1kuzgocka16m5db0","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Loading Assets at Runtime","headings":["Loading Assets at Runtime","Opening an archive","Cloning an archive","Loading from several threads","Loading from several archives","Loading a file by path","Checking assets without loading","Loading into an existing buffer","Loading a part of an asset","Verifying the archive at startup","Loading all files","Managing the file stream","Memory-mapped access","Compression","Error handling"],"content":"At runtime, use `StaticForgeReader` to open an archive file and `StaticForgeArchive` to load individual assets. [toc] ```cpp #include <StaticForgeCore/StaticForge.h StaticForge::StaticForgeArchive archive; StaticForge::StaticForgeReader reader; if (!reader.Load(\"./build/textures.sfpak\", &archive)) { // reader.GetError() contains a description of what went wrong std::cerr << reader.GetError() << std::endl; } ``` `Load` validates the whole archive structure (header, index and name table) against the file size, so a damaged or truncated archive is rejected with an error instead of crashing. Archives of another format version are rejected as well; rebuild them with the current tool. The extension of the file is not checked, so archives packed with another extension (e.g. `--extension pak`, see Packing Assets) are loaded the same way. A file that is not an archive is rejected because of its header (`Invalid archive magic`). The same archive object can be loaded again with another file. Everything of the previous archive (open stream, memory mapping, index, errors) is released first. An archive can't be copied, but `Clone()` creates a second archive object for the same file without reading it again: ```cpp StaticForge::StaticForgeArchive clone = archive.Clone(); ``` The clone shares the loaded index and names (and the memory mapping, if the archive is mapped), but has its own file stream and its own errors. A single archive object must not be used from several threads at once, but each thread can use its own clone. `StaticForgeConcurrentArchive` can be used from several threads at the same time. It has the same loading functions as `StaticForgeArchive`: ```cpp StaticForge::StaticForgeConcurrentArchive archive; archive.SetPoolSize(4); // optional, default: std::thread::hardware concurrency() if (!reader.Load(\"./build/main.sfpak\", &archive)) { std::cerr << reader.GetError() << std::endl; } // in any thread std::vector<std::byte data; std::string error; if (!archive.LoadAsset(\"textures/hero.png\", &data, &error)) { std::cerr << error << std::endl; } ``` It can also be created from a loaded archive and the other way around. Both share the loaded data: ```cpp StaticForge::StaticForgeConcurrentArchive concurrent = archive.CloneConcurrent(4); StaticForge::StaticForgeArchive normal = concurrent.CloneArchive(); ``` Stream pool: stream loads take a free file stream from a pool and give it back afterwards. Streams are only opened when they are needed. If all streams of the pool are in use, the load waits until one is free, so at most `GetPoolSize()` files are open. `GetActiveStreamCount()` and `GetOpenStreamCount()` return how many streams are used and open right now (only a snapshot, the value can change at any time). `SetPoolSize` can also be called while loading, `CloseFreeStreams()` closes all streams that are not used. Mapped: after `OpenMapped()` the mapped functions don't need the pool at all and are the fastest way to load from many threads. `OpenMapped` and `CloseMapped` themselves must not be called while other threads load assets. Errors: every function has an optional `std::string errorOut` as last parameter. - With `errorOut` the error is only written there, nothing is collected. - Without `errorOut` the error is collected for the calling thread. `TakeError()`, `GetError()`, `IsValid()` and `ClearErrors()` only see the errors of the calling thread. - `GetAllErrors()` / `TakeAllErrors()` return the errors of all threads, each line starts with `[Thread <n ]`. Threads are numbered in the order of their first error. ```cpp // e.g. after a loading screen if (!archive.GetAllErrors().empty()) { std::cerr << archive.TakeAllErrors() << std::endl; } ``` Errors without `errorOut` stay collected until they are taken or cleared, also if the thread has ended. If the assets are split into several archives (e.g. with meta files), `StaticForgeArchiveSet` loads from all of them as if they were one archive: ```cpp struct GameAssets { StaticForge::StaticForgeArchive textures, audio; StaticForge::StaticForgeArchiveSet set; // declared last, so it is destroyed first }; GameAssets assets; reader.Load(\"./build/textures.sfpak\", &assets.textures); reader.Load(\"./build/audio.sfpak\", &assets.audio); if (!assets.set.Add(&assets.textures) || !assets.set.Add(&assets.audio)) std::cerr << assets.set.TakeError() << std::endl; std::vector<std::byte data; if (!assets.set.LoadAsset(\"audio/music.ogg\", &data)) std::cerr << assets.set.TakeError() << std::endl; ``` - The set doesn't own the archives, it only keeps pointers. An archive must not be destroyed while the set uses it, call `Remove()` or `Clear()` first, or declare the set after the archives like above. - An asset path may only exist in one archive. `Add()` fails if the new archive contains a path that an added archive has too, and nothing is added. The packer reports the same case already when building. - The set has the loading functions by key (vector, buffer, range, mapped), `Contains`, `GetAssetSize`, `FindArchive` (the archive that contains an asset) and `VerifyAll`. Mapped functions need the archive that contains the asset to be mapped. - Errors are collected in the set, the archives stay untouched. - If an added archive is loaded again with `reader.Load`, the set reports an error for its assets. Remove it and add it again. `StaticForgeConcurrentArchiveSet` does the same for `StaticForgeConcurrentArchive` and can be used from several threads. Errors work like in the concurrent archive (`errorOut` or collected per thread). Only `Add`, `Remove` and `Clear` must not be called while other threads load assets. Pass the relative path of the file exactly as it appeared under the source directory: ```cpp std::vector<std::byte data; if (!archive.LoadAsset(\"textures/background.png\", &data)) { std::cerr << archive.TakeError() << std::endl; } // data now contains the raw bytes of the file ``` Important: The asset path must exactly match the path relative to the source root, it is case sensitive and UTF-8 encoded. Backslashes are converted to forward slashes, so `textures\\background.png` works too. `Contains` checks whether an asset exists, `GetAssetSize` returns its original (uncompressed) size. Neither loads any data or adds errors: ```cpp if (archive.Contains(\"textures/background.png\")) { // ... } uint64 t size = 0; if (archive.GetAssetSize(\"textures/background.png\", &size)) { buffer.reserve(size); } ``` Instead of a `std::vector`, an asset can be loaded into any existing memory, e.g. a reused buffer or a GPU upload buffer. The buffer must hold at least the asset size: ```cpp uint64 t size = 0; if (archive.GetAssetSize(\"textures/background.png\", &size)) { std::byte buffer = AllocateUploadBuffer(size); if (!archive.LoadAsset(\"textures/background.png\", buffer, size)) { std::cerr << archive.TakeError() << std::endl; } } ``` If the buffer is too small, nothing is loaded and an error is added. The checksum is validated like with the vector version. `LoadAssetRange` loads only `size` bytes starting at `offset`, e.g. to stream audio or to read the header of a file: ```cpp std::byte chunk[64 1024]; uint64 t offset = 0; uint64 t total = 0; archive.GetAssetSize(\"audio/music.ogg\", &total); while (offset < total) { uint64 t size = std::min<uint64 t (sizeof(chunk), total - offset); if (!archive.LoadAssetRange(\"audio/music.ogg\", offset, size, chunk)) { std::cerr << archive.TakeError() << std::endl; break; } // use chunk offset += size; } ``` - `offset` and `size` refer to the original (uncompressed) data, the range must be inside of the asset. - For compressed assets only the blocks that contain the range are decompressed. - The checksum is not validated, because it covers the whole asset. Use `VerifyAll` (see below) to check the archive at startup. `LoadAssetAt` and `LoadAssetRangeAt` do the same by index. `VerifyAll` checks the checksum of every asset. Use it e.g. at startup to detect a damaged or partly replaced installation and show a clear message instead of failing later while loading: ```cpp if (!archive.VerifyAll()) { // one error per damaged asset, e.g. \"Asset 'textures/ui.png' is damaged (checksum mismatch)\" std::cerr << archive.TakeError() << std::endl; // e.g. ask the user to reinstall or verify the game files } ``` The data is read in 1 MB chunks, so large assets are not loaded into memory completely. Verifying reads the whole archive once, so for very large archives it takes as long as reading all files. `LoadAssetAt` loads an asset by its index, which is useful to iterate over the whole archive, also if it stores no names: ```cpp std::vector<std::byte data; for (size t i = 0; i < archive.GetFileCount(); i++) { if (!archive.LoadAssetAt(i, &data)) { std::cerr << archive.TakeError() << std::endl; continue; } // archive.GetName(i) is the path if the archive stores names, otherwise empty } ``` After `StaticForgeReader::Load` succeeds, the archive's file stream is open. `LoadAsset` reopens it automatically if it was closed. You can control this manually: ```cpp archive.CloseFileStream(); // release the file handle archive.OpenFileStream(); // reopen when needed bool open = archive.IsFileStreamOpen(); ``` A failed load (e.g. a checksum mismatch) does not affect later loads of other assets. For better read performance, the archive can be opened using memory mapping instead of a file stream. This avoids repeated `seek`/`read` calls and lets the OS manage page caching. ```cpp if (!archive.OpenMapped()) { std::cerr << archive.TakeError() << std::endl; } // Zero-copy view — valid only while the archive stays mapped StaticForge::AssetView view = archive.GetAssetMapped(\"textures/background.png\"); if (view.data == nullptr) { std::cerr << archive.TakeError() << std::endl; } // Or copy into a buffer, same as LoadAsset std::vector<std::byte data; if (!archive.LoadAssetMapped(\"textures/background.png\", &data)) { std::cerr << archive.TakeError() << std::endl; } // Also available: LoadAssetMapped(key, buffer, bufferSize) and LoadAssetRangeMapped(key, offset, size, buffer) archive.CloseMapped(); bool mapped = archive.IsMapped(); ``` `GetAssetMapped` returns a non-owning `AssetView` directly into mapped memory — no allocation or copy needed. The view becomes invalid as soon as `CloseMapped` is called. For an empty file the view has `size == 0` and a valid (non-null) `data` pointer. `LoadAssetMapped` and `LoadAssetRangeMapped` also work for compressed assets, they decompress directly from the mapped memory. Important: `GetAssetMapped` is not possible for compressed assets , because only the compressed data is in memory. It returns an empty view with an error. Use `LoadAssetMapped` instead. Assets can be stored compressed inside an archive. This is transparent for all functions except `GetAssetMapped` — `LoadAsset` detects compressed entries and decompresses them automatically before returning the data: ```cpp // Works for both compressed and uncompressed assets std::vector<std::byte data; if (!archive.LoadAsset(\"maps/level1.map\", &data)) { std::cerr << archive.TakeError() << std::endl; } ``` Internally, compressed files are split into blocks (64 KB by default, configurable when packing). Each block is compressed independently and prefixed with its compressed and original size (see File Format). | Access method | Uncompressed | Compressed | |----------------------|:------------:|:-------------------:| | `LoadAsset` | [x] | [x] (auto-decompress) | | `LoadAssetAt` | [x] | [x] (auto-decompress) | | `LoadAssetRange` | [x] | [x] (needed blocks) | | `LoadAssetMapped` | [x] | [x] (auto-decompress) | | `LoadAssetRangeMapped` | [x] | [x] (needed blocks) | | `GetAssetMapped` | [x] | [ ] not possible | `StaticForgeReader` and `StaticForgeArchive` collect error messages (see ErrorSupport). Always check the return value: ```cpp if (!archive.LoadAsset(\"audio/music.ogg\", &data)) { // possible reasons: key not found, seek failure, checksum mismatch, // decompression failure, or buffer too small std::cerr << archive.TakeError() << std::endl; } ``` | Function | Description | |-----------------|--------------------------------------------------------------| | `IsValid()` | `true` if no errors are stored | | `GetError()` | Returns all stored errors as one string | | `TakeError()` | Returns all stored errors and clears them | | `ClearErrors()` | Clears all stored errors | Errors of the archive accumulate over several calls until you take or clear them, so you can load many assets and report all problems at once: ```cpp archive.LoadAsset(\"a.png\", &a); archive.LoadAsset(\"b.png\", &b); if (!archive.IsValid()) std::cerr << archive.TakeError(); // errors of both calls ``` Errors that no longer apply are cleared automatically: `reader.Load` clears the errors of the reader and of the archive it loads into."},{"nodeId":"node_mu3td1kurklac1g47o2b","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Building Archives in Code","headings":["Building Archives in Code","Minimal example","Multiple source paths","Fluent API","Options","Archive extension","Building again","Incremental builds","Debug mode"],"content":"Instead of using the command-line tool you can drive the build process directly from C++ using `StaticForgeBuilder`. The phases of a build are described in Build Process. ```cpp #include <StaticForgeCore/StaticForge.h StaticForge::StaticForgeBuilder builder; builder .SetArchiveName(\"textures\") .AddSourcePath(\"./assets/textures\") .SetOutputPath(\"./build\") .SetCreateOutputDir(true); if (!builder.Build()) { std::cerr << builder.TakeError() << std::endl; } ``` At least one source path and an output path are required, `Build()` fails with an error otherwise. ```cpp builder.SetSourcePath({ \"./assets/textures\", \"./assets/audio\" }); ``` or add them one at a time: ```cpp builder.AddSourcePath(\"./assets/textures\"); builder.AddSourcePath(\"./assets/audio\"); ``` Paths are `std::filesystem::path`. For UTF-8 strings use `std::filesystem::u8path(...)`, so non-ASCII names also work on Windows. All setters return ` this` so they can be chained: ```cpp StaticForge::StaticForgeBuilder builder{ \"main\", { \"./assets\" }, \"./build\" }; builder .SetCreateOutputDir(true) .SetDebugMode(true) .Build(); ``` | Setter | CLI equivalent | Description | |---------------------------------------|--------------------------|-----------------------------------------------------------------------| | `SetArchiveName(name)` | `--name` | Archive name for files without a meta file (default `main`) | | `SetArchiveExtension(extension)` | `--extension` | File extension of all archives, overrides the meta files (default `PACK FILE EXTENSION`, `.sfpak`) | | `SetSourcePath(paths)` / `AddSourcePath(path)` | `--source` | Source directories | | `SetOutputPath(path)` | `--output` | Output directory | | `SetCreateOutputDir(bool)` | `--mkdir` | Create the output directory if it is missing | | `SetDebugMode(bool)` | `--verbose` | Print detailed progress to `stdout` | | `SetStoreNames(bool)` | `--store-names` | Store file names in all archives | | `SetCompress(bool)` | `--compress` | Compress files larger than 4096 bytes in all archives | | `SetCompressionBlockSize(size)` | `--compress-block-size` | Compression block size in bytes (default `DEFAULT COMPRESSION BLOCK SIZE`) | | `SetCompressionTableSizeLog2(size)` | `--compress-table-size` | Match table size as power of two (default `DEFAULT COMPRESSION TABLE SIZE LOG2`) | | `SetCompressionMinMatchLength(length)`| `--compress-min-match` | Shortest match stored as reference (default `DEFAULT COMPRESSION MIN MATCH LENGTH`) | | `SetCompressionMinSaving(percent)` | `--compress-min-saving` | Minimum saving in percent, otherwise stored raw (default `DEFAULT COMPRESSION MIN SAVING`) | | `SetCacheDir(path)` | `--cache-dir` | Directory of the build cache, enables incremental builds | | `SetRebuild(bool)` | `--rebuild` | Builds all archives, also the ones that are up to date | The valid ranges of the compression settings are the `MIN COMPRESSION ` and `MAX COMPRESSION ` constants in `StaticForgeTypes.h`. Invalid values make `Build()` fail with an error. Compression settings that are set on the builder override the values of meta files, settings that are not set fall back to the meta file value and then to the default. `SetArchiveExtension` gives all archives another extension than `.sfpak`. The leading dot is optional: ```cpp StaticForge::StaticForgeBuilder builder{ \"main\", { \"./assets\" }, \"./build\" }; builder .SetCreateOutputDir(true) .SetArchiveExtension(\"pak\"); // same as \".pak\", produces ./build/main.pak if (!builder.Build()) { // e.g. \"Invalid archive extension '.pak.' (...)\" std::cerr << builder.TakeError() << std::endl; } ``` - The extension is checked when `Build()` runs. It must not be empty, contain `/`, `` or `< : \" | ? `, or end with `.` or a space. - Like the compression settings it overrides the `extension` of the meta files. Without it the meta value is used, without both `PACK FILE EXTENSION` (`.sfpak`). - `StaticForgeReader::Load` accepts archives with any extension, nothing has to be changed for loading. See Packing Assets and Meta Files for the rules of the extension. The same builder can run `Build()` several times, e.g. after changing the source paths. Each build starts fresh and clears the errors of the previous build. With `SetCacheDir(path)` only the archives whose files or settings changed are built (see Packing Assets). After `Build()` the counts tell what happened: ```cpp builder.SetCacheDir(\"./build/intermediates/release/sfcache\"); if (builder.Build()) { std::cout << builder.GetBuiltArchiveCount() << \" built, \" << builder.GetUpToDateArchiveCount() << \" up to date, \" << builder.GetRemovedArchiveCount() << \" removed\\n\"; } ``` `SetDebugMode(true)` prints detailed progress to `stdout` - the same output as `--verbose` in the CLI tool."},{"nodeId":"node_mu3td1kuw60i4y16ior5l","tabId":"tab_mu3td1ku2qztxt16axy53","title":"CLI Reference","headings":["CLI Reference","Arguments","Archive extension","Compression settings","Incremental build","Values","Modes","Exit code","Command line priority"],"content":"Quick reference for all `StaticForgeTool` arguments. [toc] | Argument | Short | Description | Type | Default | Multi | |-----------------|---------|------------------------------------------------------------------------------|----------|---------|-------| | `--source` | `--src` | Source directory of the files to be packed (can be specified multiple times) | filepath | — | yes | | `--output` | `--o` | Output directory for packed archives or extracted files | filepath | — | no | | `--name` | `--n` | Default archive name when no `.sfpak.meta` file is found | string | `main` | no | | `--extension` | `--ext` | File extension of all archives (`pak` or `.pak`), overrides the meta files | string | `.sfpak`| no | | `--mkdir` | `--p` | Create the output directory if it does not exist | bool | false | no | | `--info` | `--i` | Display header and index info of an archive file (can be repeated) | filepath | — | yes | | `--extract` | `--x` | Extract archive file(s) into `<output /<archive name /` (can be repeated) | filepath | — | yes | | `--verify` | `--vf` | Check the checksums of all files in archive file(s) (can be repeated) | filepath | — | yes | | `--verbose` | `--v` | Enable debug/verbose console output | bool | false | no | | `--store-names` | `--sn` | Store original filenames in all archives for debug inspection and extraction | bool | false | no | | `--compress` | `--c` | Compress files larger than 4096 bytes before storing them in the archive | bool | false | no | | `--help` | `--h` | Show the help message | — | — | no | Short forms always use two dashes (`--v`, not `-v`). Arguments that can be repeated also accept a comma-separated list: `--source \"./textures, ./audio\"`. `--info`, `--extract` and `--verify` accept archives with any extension, the content of the file decides if it is an archive. ```bash StaticForgeTool --source ./assets --output ./build --ext pak ``` `--extension` sets the extension of every archive of the build, also of the archives whose meta file sets its own `extension`. The leading dot is optional. An invalid extension (empty, contains `/`, ``, `< : \" | ? ` or ends with `.` or a space) is an error: ``` [Error] Build failed: Invalid archive extension '.pak.' (must not be empty, contain '/', '', '<', ' ', ':', '\"', '|', '?', ' ' or end with '.' or ' ') ``` See Packing Assets for the details. Only used together with compression (`--compress` or `compress = true;` in a meta file). They override the values of `.sfpak.meta` files. | Argument | Short | Description | Default | Range | |-------------------------|---------|-------------------------------------------------------------------|---------|------------------| | `--compress-block-size` | `--cbs` | Size in bytes of the blocks a file is split into for compression | `65536` | 1024 - 67108864 | | `--compress-table-size` | `--cts` | Match table size as power of two (entries = 2^value) | `16` | 8 - 24 | | `--compress-min-match` | `--cmm` | Shortest repeated sequence that is stored as a reference | `8` | 4 - 65535 | | `--compress-min-saving` | `--cms` | Percent a block or file must get smaller, otherwise it is stored uncompressed | `5` | 0 - 99 | Larger blocks compress better, because a block can only reference data inside of itself. Above 64 KB the gain is very small. `--compress-min-saving` avoids compression that isn't worth the time it takes to decompress: a block is only stored compressed if it gets at least this many percent smaller, otherwise it is stored raw. The same applies to the whole file, a file that doesn't get small enough is stored completely uncompressed. With `0` every saved byte counts. | Argument | Short | Description | Type | Default | |---------------|--------|-----------------------------------------------------------------|----------|---------| | `--cache-dir` | `--cd` | Directory of the build cache, enables incremental builds | filepath | — | | `--rebuild` | `--rb` | Builds all archives, also the ones that are up to date | bool | false | With `--cache-dir` only the archives whose files or settings changed are built, see Packing Assets. Without it every archive is built. - bool arguments can be used without a value: `--verbose` is the same as `--verbose true`. Accepted values are `true`/`false`, `1`/`0`, `yes`/`no` and `y`/`n` (case insensitive). Anything else is an error, so a forgotten value like `--mkdir ./assets` is reported instead of silently being `false`. - int arguments must be plain decimal numbers (`65536`, not `64k`). - All other arguments require a value. - Arguments and paths can contain any Unicode characters. - Paths with spaces must be quoted: `--source \"C:\\Program Files\\Game\\assets\"`. On Windows a path in quotes must not end with `` (`\"C:\\assets\"`), because `\"` is read as a quote character. Exactly one mode must be active per invocation. Modes are determined by which arguments are provided: | Mode | Required arguments | Optional arguments | |---------|-------------------------------|-----------------------------------------------------------------------------| | pack | `--source` and `--output` | `--name`, `--extension`, `--mkdir`, `--verbose`, `--store-names`, `--compress`, `--compress- `, `--cache-dir`, `--rebuild` | | extract | `--extract` and `--output` | `--mkdir`, `--verbose` | | info | `--info` | `--verbose` | | verify | `--verify` | `--verbose` | | help | `--help` | — | Combining arguments from multiple modes (e.g. `--source` together with `--info`) is an error. Pack arguments like `--extension` can't be used with the other modes either. The tool returns `0` on success and `1` on any error, so it can be used in build scripts. Errors are printed as `[Error] <message `. Several errors at once, e.g. more than one invalid argument, are listed below a short description: ``` [Error] Invalid arguments: - Unknown argument 'foo' - Invalid value '10k' for argument 'cbs' ``` When `--store-names` or `--compress` is set on the command line, the option is forced on for every archive regardless of what the `.sfpak.meta` file specifies. The meta-file value is only used when the CLI flag is absent. `--extension` and the `--compress- ` settings replace the meta file values for all archives when they are set."},{"nodeId":"node_mu3td1ku1de5w2cswv1sn","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"Architecture","headings":["Architecture","StaticForgeCore","StaticForgeTool","StaticForgeTests","Dependency graph","Platforms"],"content":"StaticForge is split into two main components. The core static library. Contains all format logic and is linked by both the tool and any consuming application: - Archive format definition and binary layout - `StaticForgeBuilder` - writes archive files (`.sfpak` or an own extension) - `StaticForgeReader` - reads and validates archive files - `StaticForgeArchive` - runtime handle for an open archive - `StaticForgeConcurrentArchive` - runtime handle that can be used from several threads at once - `StaticForgeArchiveSet` / `StaticForgeConcurrentArchiveSet` - load from several archives as if they were one - Meta file parsing (`StaticForgeMeta`, see Meta File Parser) - Archive core (`Internal/ArchiveCore`): the loaded archive data, shared between archive objects, and the asset loading logic (see StaticForgeArchive) - Internal helpers: hashing, alignment, endian handling, compression, memory mapping, error support Only the headers directly in `include/StaticForgeCore/` are part of the public API. The `Internal/` headers are not included in the SDK release packages. The CLI executable. Wraps `StaticForgeCore` with argument parsing and five modes: pack, extract, info, verify, help. Does not contain any format logic itself. `Utf8Console` makes the tool work with Unicode on Windows: it reads the command line arguments as UTF-8 and switches the console output to UTF-8 while the tool runs. On other platforms the arguments already are UTF-8. A console application with the tests of the library, built with its own small test framework (`TEST CASE`, `CHECK`, `REQUIRE`). Slow tests are marked with `STRESS TEST` and only run with `--stress`. The tests also use the internal headers, e.g. to test the compressor directly. The normal tests run in the CI on every push (`.github/workflows/tests.yml`) and before every release. ```tree StaticForgeTool/ StaticForgeCore/ StaticForgeBuilder StaticForgeReader StaticForgeArchive StaticForgeConcurrentArchive StaticForgeArchiveSet / StaticForgeConcurrentArchiveSet + Internal/ ArchiveCore # loaded archive data and asset loading ArchiveSetIndex ThreadErrors BuildCache StaticForgeMeta / MetaTokenizer LZ4Compression MmapFile InternalHelpers # hashing, alignment, endian handling Your Game or Application/ StaticForgeCore/ StaticForgeReader StaticForgeArchive / StaticForgeConcurrentArchive StaticForgeArchiveSet / StaticForgeConcurrentArchiveSet # optional ``` The tool-side classes (`StaticForgeBuilder`, meta parsing) are compiled into Core but an application that only reads archives still links the same library - there is currently no separate runtime-only build target. Tested on Windows (MSVC) and Linux (GCC, Ubuntu). Archives are byte-identical across platforms: the same sources give the same archive on Windows and Linux (the files are sorted by path), and an archive packed on Windows can be loaded on Linux and the other way around."},{"nodeId":"node_mu3td1kuuhnvwc15ryskk","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"File Format","headings":["File Format","Layout","Header","Index entry","Data blocks","Name Table Header","Name Table Entry","Name Table String Data","Alignment","Validation"],"content":"An archive file consists of three required regions and three optional regions written sequentially: Header , Index , Data , and — when name storage is enabled — Name Table Header , Name Table Entries , and Name Table String Data . All integers are stored little-endian on all platforms. The file extension is not part of the format. Archives use `.sfpak` by default, but can have any extension (see Packing Assets). The reader identifies an archive only by its header (magic and version). [toc] ``` [ HEADER ] 52 bytes, padded to a multiple of ALIGNMENT HEADER = 32 (64 bytes) [ INDEX ] N × 40 bytes, then padded to ALIGNMENT FILE = 4096 [ DATA BLOCKS ] files written back-to-back, each padded to ALIGNMENT FILE = 4096 [ NAME TABLE HEADER ] optional — present when store-names is enabled [ NAME TABLE ENTRIES ] optional — one entry per file [ NAME TABLE STRING DATA ] optional — raw UTF-8 path strings packed together ``` Magic bytes `SFPK` followed by six `uint64 t` fields. | Field | Type | Description | |-------------------------|------------|-----------------------------------------------------------------| | `magic` | `char[4]` | Always `S`, `F`, `P`, `K` | | `version` | `uint64 t` | Format version (currently `3`) | | `fileCount` | `uint64 t` | Number of files in this archive | | `indexOffset` | `uint64 t` | Byte offset to the start of the index | | `indexSize` | `uint64 t` | Total size of the index in bytes (`fileCount × 40`) | | `dataOffset` | `uint64 t` | Byte offset to the start of data | | `nameTableHeaderOffset` | `uint64 t` | Byte offset to the Name Table Header, or `0` if not present | The reader only accepts archives with exactly its own `version`. The format is not backward compatible, archives are rebuilt with the application that uses them. One 40-byte entry per file, stored contiguously starting at `indexOffset`. | Field | Type | Description | |----------------------|------------|------------------------------------------------------------------------------------------| | `hashName` | `uint64 t` | 64-bit FNV-1a hash of the relative file path | | `fileOffset` | `uint64 t` | Byte offset of the file's data block relative to `dataOffset` | | `fileSize` | `uint64 t` | Original (uncompressed) file size in bytes | | `compressedFileSize` | `uint64 t` | Total bytes on disk including the framing headers. `0` means stored uncompressed | | `filePadding` | `uint32 t` | Padding bytes appended after the file data to reach the next 4096-byte boundary | | `checksum` | `uint32 t` | 32-bit FNV-1a checksum of the data as written on disk (covers framing headers + compressed data) | Each file occupies one data block starting at `dataOffset + fileOffset`. The block is always padded with zero bytes to the next 4096-byte boundary; the padding size is stored in `filePadding`. When `compressedFileSize == 0` the block contains the raw file bytes verbatim. When `compressedFileSize != 0` the block contains a sequence of independently compressed chunks: ``` [ CHUNK 0 ][ CHUNK 1 ][ ... ][ CHUNK N ] ``` Each chunk has the following layout: ``` [ compressedSize : uint32 t ] size of the compressed payload that follows [ originalSize : uint32 t ] size of the decompressed output for this chunk [ payload : bytes ] compressedSize bytes of compressed data, or the raw bytes if compressedSize == originalSize ``` Chunks are produced by splitting the original file into pieces of the compression block size (default 64 KB, at most `MAX COMPRESSION BLOCK SIZE`) and compressing each piece independently. The decompressor reads chunks sequentially until all `compressedFileSize` bytes are consumed. Because each chunk carries its own original size, the reader does not need to know the block size that was used for packing. A chunk with `compressedSize == originalSize` is stored raw (it didn't get small enough when packing) and is copied instead of decompressed. The FNV-1a checksum covers all chunk bytes as written on disk — framing headers included — so integrity is verified before any decompression takes place. Note: Compressed data blocks can't be viewed zero-copy with `GetAssetMapped`, because only the compressed data is in the file. `LoadAsset`, `LoadAssetMapped` and the range functions decompress them automatically, see StaticForgeArchive. Present only when the archive was built with name storage enabled. Located at `nameTableHeaderOffset`. | Field | Type | Description | |----------------------------|------------|--------------------------------------------------------------| | `entryOffset` | `uint64 t` | Byte offset to the first Name Table Entry | | `stringDataOffset` | `uint64 t` | Byte offset to the start of the compressed String Data | | `stringDataSize` | `uint64 t` | Size of the String Data after decompression | | `stringDataCompressedSize` | `uint64 t` | Size of the compressed String Data in the file | One 16-byte entry per file, stored contiguously starting at `entryOffset`, in the same order as the index. | Field | Type | Description | |--------------|------------|--------------------------------------------------------------------------------| | `hash` | `uint64 t` | FNV-1a hash of the path (matches `hashName` in the corresponding index entry) | | `nameLength` | `uint32 t` | Length of the UTF-8 path string in bytes | | `nameOffset` | `uint32 t` | Byte offset within the decompressed String Data where this path starts | UTF-8 path strings packed end-to-end with no separators. The whole block is compressed as one piece with the same compression as the file data (without framing header), because paths usually share long prefixes and compress very well (often to 20 - 50 %). If it doesn't get small enough (e.g. only a few short names), it is stored raw and `stringDataCompressedSize == stringDataSize`. To read a filename, read `stringDataCompressedSize` bytes at `stringDataOffset`, decompress them to `stringDataSize` bytes (or use them directly if both sizes are equal), then take `nameLength` bytes at `nameOffset`. Paths use `/` as separator and are relative to the source folder. - The header region is padded to a multiple of 32 bytes (`ALIGNMENT HEADER`), which makes it 64 bytes. - Every file data block is padded to 4096 bytes (`ALIGNMENT FILE`) — one filesystem page. - Padding bytes are always zero. This alignment ensures that file offsets are always multiples of 4096, which allows direct memory-mapped access for uncompressed assets without additional alignment work. `StaticForgeReader::Load` only checks that the path is an existing regular file, the extension doesn't matter. Then it reads the header and rejects the file if the magic is not `SFPK` or the version is not its own. After that the archive is checked against the real file size before any memory is allocated: - `indexSize` must match `fileCount × 40`, and the index must be inside the file. - `dataOffset` and the name table must be inside the file. - The data of every index entry must be inside the file, and every hash must be unique. - The compressed string data must be inside the file, and `stringDataSize` must be possible for its compressed size (at most `compressedSize × 13108`). - Every name must be inside the decompressed string data. When loading a compressed entry, every chunk's `originalSize` must be at most `MAX COMPRESSION BLOCK SIZE` and the sum must match `fileSize`. A corrupted archive is rejected with an error instead of crashing."},{"nodeId":"node_mu3td1kucsyh3x1ldzws1","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"Hashing","headings":["Hashing","Filename hashing","Data checksum","Path format"],"content":"StaticForge uses FNV-1a (Fowler–Noll–Vo) for two purposes: filename lookup (64 bit) and data integrity (32 bit). When the builder packs a file, the relative path string (e.g. `textures/background.png`) is hashed with 64-bit FNV-1a (offset basis `14695981039346656037`, prime `1099511628211`) and stored in the index as `hashName`. At runtime, `StaticForgeArchive::LoadAsset` hashes the key string you pass in and looks it up in the index map. Unless the archive was built with `store-names`, the original string is not stored in the archive. Implications: - Lookups are O(1) via `std::unordered map`. - Without a name table the archive cannot list filenames - only validate whether a known key exists. `--info --verbose` and `--extract` then show the hash instead (16 hex digits). - Hash collisions between two different paths of one build are detected at build time and cause an error. With 64 bit they are practically impossible (even with 100 000 files the probability is below one in a billion). During packing, each file's bytes as written to disk are fed through 32-bit FNV-1a with the initial value `2166136261` to produce a `uint32 t` checksum. This is written into the index entry. When loading, `LoadEntry` (a free function in `Internal/ArchiveCore`, used by all archive types, see StaticForgeArchive) recomputes the checksum over the read bytes and compares it to the stored value. A mismatch causes `LoadAsset` to return `false` with an error message. Partial loads (`LoadAssetRange`) don't validate the checksum, because it covers the whole stored data. The checksum detects accidental damage. It is not a cryptographic signature and does not protect against intentional changes. Use a path relative to the source root used during packing. The path is UTF-8 and case sensitive, backslashes are converted to forward slashes before hashing. ```cpp // Correct archive.LoadAsset(\"textures/background.png\", &data); // Also valid archive.LoadAsset(\"textures\\background.png\", &data); // Wrong - path is not relative to the source root archive.LoadAsset(\"./assets/textures/background.png\", &data); ```"},{"nodeId":"node_mu3td1kulgv50d577zxf","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"Build Process","headings":["Build Process","1. CheckCompressionSettings","2. CheckFilepaths","3. ScanFiles","4. CheckUpToDate","5. CreateOutputDir","6. CreateGroups","7. CommitArchives","8. WriteCacheFiles","9. RemoveOldArchives","Write phases summary","Compression","Compressor","Overflow safety"],"content":"`StaticForgeBuilder::Build()` resets the data of a previous build, then runs the internal phases below in sequence. How the builder is used is described in Building Archives in Code. [toc] Validates the compression settings set on the builder (block size, table size, min match length, min saving) against the `MIN COMPRESSION ` / `MAX COMPRESSION ` ranges. Settings that are not set are skipped. Validates that: - the default archive name is a valid file name (no `/` or ``, not `.` or `..`) - the archive extension set with `SetArchiveExtension` is valid (see below) - at least one source path and an output path are set - all source paths exist and are directories - the output path, if it exists, is a directory A missing output directory is only an error if `SetCreateOutputDir(true)` was not called. The directory is created later in `CreateOutputDir`, so a build that fails while scanning leaves nothing behind. `SetArchiveExtension` adds a missing leading dot (`pak` becomes `.pak`) and stores the value, it is checked here. A valid extension: - starts with `.` and has at least one more character - contains no `/`, ``, `< : \" | ? ` and no control characters - doesn't end with `.` or a space, because Windows removes them from file names Each source directory is read once into a list of files. Read errors are reported as build errors. The list is sorted by the UTF-8 path, because every file system returns the files in a different order. Then two passes run over these lists: Pass 1 — Meta collection: Collects all files ending with `.sfpak.meta` and builds a `directory → StaticForgeMetaData` mapping. Each entry stores the archive name, the extension, excluded extensions, the `store-names` and `compress` flags and the optional compression settings. Archive names, extensions (normalized and checked like above) and compression settings are validated here. Pass 2 — File assignment: Iterates all non-meta files, computes their relative path (from the path itself, so a symbolic link to a file is stored under its own path with the content of its target), hashes it with 64-bit FNV-1a, and assigns each file to the appropriate `ArchiveGroup` by walking up the directory tree until a meta entry is found. Falls back to the default archive name if no meta file applies. For each file the builder also: - Skips files whose name ends with one of the excluded extensions (case insensitive). - Reports an error if the same relative path occurs more than once in the build, also if the files go into different archives (e.g. two `--source` folders that both contain `textures/hero.png`). It can't be decided which of the files is the right one. - Reports an error on hash collisions between different paths. - Applies the overrides when an archive group is created: - `store-names` and `compress`: if the global flag is set, it is forced on even when the meta file sets it to `false`. - extension and compression settings: builder value → meta file value → default (`PACK FILE EXTENSION` for the extension). At the end the files of every archive group are sorted by their relative path (UTF-8 byte order), also when they come from several source paths. The same sources therefore always give the same archive, byte for byte, on every system. Finally the file names of all archive groups (name + extension) are compared case insensitive. With own extensions two archives could get the same file, e.g. `a` + `.b.c` and `a.b` + `.c`, which is an error. Only runs with a cache directory (`SetCacheDir`). For every archive group the cache file `<cache dir /<archive name .sfcache` is read and compared in this order, the first difference is the reason for the build: 1. `SetRebuild(true)` was called 2. the cache file is missing or can't be parsed, or has another cache version 3. the archive format version (`VERSION`) or the absolute output path is different 4. the extension is different (`archive extension changed (was '.sfpak')`) 5. the settings are different 6. the archive file is missing, or its size or modification time is different 7. the file list is different (both lists are sorted by path) 8. the size of a file is different 9. the modification time of a file is different and the 64-bit FNV-1a hash of its content as well If only the modification time of a file changed, the archive is up to date and only its cache file is written again with the new time. Archives that are up to date are skipped by all following phases. The archive file path is always name + extension, so a changed extension means a new file. If the cache file belongs to the same output directory and contains another (valid) extension, the old archive file is remembered and deleted in `RemoveOldArchives` after the new one was written. The same happens if the archive name only changed in case (`Audio` → `audio`): the old file is deleted if it is another file than the new one, which is only the case on case-sensitive file systems. Cache files in the cache directory without an archive group of this build belong to archives that are not built anymore. If the cache file is valid and contains the same output directory, the archive (found with the extension stored in the cache file) and its cache file are deleted in `RemoveOldArchives` after the build. An extension in the cache file that is not valid is never used to build a path, so a damaged cache file can't point to another file. The cache file is text: ``` StaticForgeCache 2 format 3 output D:/dev/game/build/packed extension .sfpak settings store-names=1 compress=1 block-size=65536 table-size=16 min-match=8 min-saving=10 exclude=.psd archive 41100 134364826999478632 files 3 20000 134364826980778712 af8f0deb8b372d7b textures/hero.png 9000 134364826981220378 87ddee1928e25947 textures/ui/button.png 23492 134364826981425961 499fa1f519db8fe5 textures/ui/theme.txt ``` | Line | Content | |------|---------| | `StaticForgeCache` | version of the cache file format (`BUILD CACHE VERSION`, currently `2`) | | `format` | archive format version | | `output` | absolute output directory | | `extension` | extension of the archive file, to find the file again if the extension changes or the archive is not built anymore | | `settings` | settings of the archive that are used for the build | | `archive` | size and modification time of the archive file | | `files` | number of files, followed by one line per file: size, modification time, content hash (hex) and the relative path (rest of the line) | Cache files of an older cache version (e.g. `1`, without `extension`) are invalid, so the first build after an update builds every archive once. Modification times are the raw values of the file clock (`std::filesystem::file time type`), so a cache file is only valid on the system that wrote it. The content hash is calculated while the file is written into the archive, no extra read is needed. Creates the output directory and its missing parents if `SetCreateOutputDir(true)` was called. The created directories are remembered, so they can be removed again if the build fails. The archive groups are written in order of their name. For each `ArchiveGroup` the temporary file `<output /<archive name <extension .tmp` (e.g. `main.sfpak.tmp`) is created and the following phases run in order: CalculateDataStart — computes the byte offset at which file data begins. This is the sum of the aligned header size and the index table size, rounded up to the next 4096-byte boundary. WriteData — writes `dataStart` bytes of zero-padding to reserve space for the header and index, then writes all file data blocks. During this pass, `blockOffset`, `filePadding`, `checksum`, and `compressedFileSize` are filled in on each file entry so the index can be written correctly afterwards. WriteHeader — seeks back to offset `0` and writes the `StaticForgeHeader` struct, padded to a multiple of 32 bytes. WriteIndex — writes one `StaticForgeIndexEntry` per file directly after the header. Checksums computed during `WriteData` are included here — no second seek is needed. BuildNameTable (optional, when store-names is enabled) — computes the byte layout of the Name Table Header, Name Table Entries, and String Data region, and compresses all names as one block. Offsets are appended after the last data block. WriteNameTable (optional) — seeks to `nameTableStart` (set at the end of `WriteData`) and writes the Name Table Header, Name Table Entries, and the compressed UTF-8 string data. When all archives are written, every temporary file is renamed to `<archive name <extension ` and replaces the old archive. Only runs with a cache directory. Writes the cache files of the built archives and of the archives whose cache changed, each to a temporary file that is renamed when it is complete. The cache directory is created if it is missing. Only runs with a cache directory. Deletes: - the archives found by `CheckUpToDate` that are not built anymore, together with their cache files - the old archive files of archives whose extension changed or whose name only changed in case, if they are another file than the new archive - the old cache files of renamed archives, under the same condition If any phase from `CreateOutputDir` on fails, all temporary files are removed and the directories created by `CreateOutputDir` are removed again if they are empty. The old archives stay as they were, unless the error happens while renaming: the archives renamed until then are already replaced. The cache files of a failed build stay as they were, so the next build checks the archives again. | Phase | Seeks to | What it writes | |-------------------|-------------------|------------------------------------------------------------------------------| | `WriteData` | `0` (start) | `dataStart` zero-padding, then all file data blocks in order | | `WriteHeader` | `0` (seekp back) | `StaticForgeHeader` struct padded to a multiple of 32 bytes | | `WriteIndex` | after header | One `StaticForgeIndexEntry` per file, including computed checksums | | `WriteNameTable` | `nameTableStart` (seekp forward) | Name Table Header, Name Table Entries, compressed UTF-8 string data | When compression is enabled for an archive group (via the meta file or the global `SetCompress` flag), files larger than 4096 bytes are compressed. Compression is applied per block during `WriteData`: - The file is read in blocks of the compression block size (default 64 KB) and each block is compressed independently. - Each compressed block is prefixed with a framing header: `[uint32 t compressedSize][uint32 t originalSize]` (little-endian). - The raw compressed bytes follow immediately after the framing header. - A block that doesn't get at least `compress-min-saving` percent smaller (default 5 %) is stored raw instead. It is marked by `compressedSize == originalSize`; a compressed block never has this size, because it would not be small enough. - If the whole file (framing headers included) doesn't get at least `compress-min-saving` percent smaller, the builder seeks back to the start of the file in the archive and writes it again uncompressed (`compressedFileSize = 0`). Only files that don't compress well are read twice. Because the compressed attempt can be a few bytes longer, the archive is cut to its real size with `std::filesystem::resize file` after writing. - `compressedFileSize` in the index entry is set to the total number of bytes written for the file, including the framing headers. A value of `0` means the entry is stored uncompressed. The per-block approach means the decompressor can process one block at a time. The FNV-1a checksum covers the framing headers and compressed block data as written, so integrity verification happens before decompression (see Hashing). The name table string data uses the same rule: if it doesn't get small enough, it is stored raw and `stringDataCompressedSize == stringDataSize`. The compressor (`Internal::LZ4Compression`) is an LZ77 compressor inspired by LZ4, with its own simple format: | Block | Layout | Meaning | |---------|-------------------------------------|------------------------------------------------------| | literal | `[0x01][len:u16][len bytes]` | Bytes stored as they are | | match | `[0x02][distance:u16][len:u16]` | Copy `len` bytes from `distance` bytes back | | end | `[0x00]` | End of the compressed block | For every position the compressor looks up the last position of the same 4-byte sequence in a hash table (`compress-table-size`). A match is extended as far as possible and only stored if it is at least `compress-min-match` bytes long — shorter matches would take more space than storing the bytes as literals. A match can only reference data inside the same block and at most 65535 bytes back. The hash table is only allocated when compressing and is reset per block with a generation counter instead of clearing the whole table. All size and offset arithmetic uses checked helpers that return `false` on overflow instead of wrapping silently: | Helper | Description | |-----------------|--------------------------------------------------------| | `SafeAddU64` | Addition with overflow check | | `SafeMulU64` | Multiplication with overflow check | | `SafeAlignSize` | Rounds up to a power-of-two alignment, overflow-safe | | `GetHeaderSize` | Returns the aligned header size via `SafeAlignSize` | Any overflow causes `Build()` to return `false` with a descriptive error."},{"nodeId":"node_mu3td1ku1hsv9km18cfhyf","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"Meta File Parser","headings":["Meta File Parser","Syntax","Tokenizer","Parser","Error suggestions","Supported parameters","Value parsing"],"content":"Meta files use a minimal custom format parsed by `StaticForgeMeta` inside `StaticForgeCore`. How meta files are used is described in Meta Files. Each statement is a key-value pair terminated by a semicolon: ``` key = value; ``` Multiple statements can appear in any order: ``` archive = main; extension = pak; exclude = .png, .jpg, .vert, .help; store-names = true; ``` Comments start with `#` and run to the end of the line: ``` archive = main; # this is also a comment ``` `MetaTokenizer` reads the entire file into memory (skipping a UTF-8 BOM), then walks it character by character via `ProcessContent` → `ProcessChar`. It tracks the current line and column for error reporting and produces a flat `std::vector<MetaToken `. Columns count characters, not bytes, so multi-byte UTF-8 characters count as one column. Character dispatch (`ProcessChar`): | Input | Action | |----------------------------------------------|----------------------------------------------| | Whitespace (`\\r`, `\\n`, ` `, `\\t`) | Skipped; newlines increment the line counter | | `=` | Emit `Assign` | | `,` | Emit `Separator` | | `;` | Emit `Delimiter` | | `#` | Call `SkipComment` — consume until `\\n` | | Letter, digit, ` `, `.`, `-`, UTF-8 byte | Call `ReadIdentifier` | | Anything else | Add error, emit `UNKNOWN` | `ReadIdentifier`: records the start pointer, then advances `m cur` while the character is an identifier character (`IsIdentifierChar`: alphanumeric, ` `, `.`, `-` or a byte ≥ `0x80`, which is part of a UTF-8 character). The resulting `string view` into the in-memory buffer is stored in the token without any heap allocation. Token types: | Token type | Description | |--------------|--------------------------------------------------------------| | `Identifier` | An unquoted word — keys, values, extensions, booleans, numbers | | `Assign` | The `=` character | | `Separator` | The `,` character (used between list values like extensions) | | `Delimiter` | The `;` character — terminates a statement | | `EndOfFile` | Sentinel appended after the last character | | `UNKNOWN` | Unrecognised character; always accompanied by an error | Every token stores its line and column at the point it was emitted. `StaticForgeMeta::ParseTokens` consumes the token stream produced by `MetaTokenizer`. Each statement follows this pattern: ``` Identifier(key) Assign Identifier(value) Delimiter ``` For list values (e.g. `exclude`) the value section is instead: ``` Identifier Separator Identifier Separator ... Identifier Delimiter ``` Any deviation — wrong token type, unexpected `EndOfFile`, missing `Delimiter` — is a parse error. Errors include the line and column of the offending token, also a missing or invalid value: ``` Missing value for 'compress' at line: 2, column: 1 Failed to parse value '5' of 'compress' at line: 2, column: 1 ``` If a key is not recognised, the parser compares it with every known key. Separators (`-`, ` `, space) and case are ignored, and the names are compared character by character. If the lengths differ by at most 3 and at most 3 characters are different, a suggestion is appended to the error: ``` Unknown identifier 'archiv' at line: 1, column: 1. Did you mean 'archive'? ``` | Key | Type | Required | Description | |-----------------------|----------|----------|-----------------------------------------------------------------------------| | `archive` | string | yes | Name of the archive | | `extension` | string | no | File extension of the archive (default `.sfpak`) | | `exclude` | string[] | no | Comma-separated list of file extensions to skip | | `store-names` | bool | no | Store original filenames in the archive for debug inspection and extraction | | `compress` | bool | no | Compress files larger than 4096 bytes | | `compress-block-size` | uint | no | Compression block size in bytes | | `compress-table-size` | uint | no | Compressor match table size as power of two | | `compress-min-match` | uint | no | Shortest match the compressor stores as reference | | `compress-min-saving` | uint | no | Percent a block or file must get smaller to be stored compressed | `archive` — the `Identifier` token value is used as-is. The builder rejects names containing `/` or `` and the names `.` and `..`. `extension` — the `Identifier` token value is stored as-is in `StaticForgeMetaData::archiveExtension`, an empty string means not set (a meta value can never be empty). The builder adds a missing leading dot and rejects extensions that end with `.`, see Build Process. The other invalid characters (`/`, ``, `:`, ...) can't appear, because the tokenizer doesn't accept them in an identifier. `exclude` — after the `=`, the parser collects `Identifier` tokens separated by `Separator` (`,`) tokens until it sees a `Delimiter` (`;`). Each value is lowercased and a missing leading dot is added, so `.PNG`, `.png` and `png` are treated identically. `store-names`, `compress` — the single `Identifier` token after `=` is compared case-insensitively. Only `true` and `false` are valid, anything else is a parse error. `compress-block-size`, `compress-table-size`, `compress-min-match`, `compress-min-saving` — parsed with `std::from chars` as an unsigned decimal number. The whole value has to be a number (`64k` or `-5` are errors). The builder checks the value against the valid range."},{"nodeId":"node_mu3td1ku1t629jd11ytz7k","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"StaticForgeArchive","headings":["StaticForgeArchive","Ownership, move and Clone","Internal state","LoadAsset flow","LoadAssetRange flow","LoadAssetMapped / GetAssetMapped flow","Access method comparison","Accessor methods","VerifyAll","Managing the file stream","Managing memory mapping","Error handling","StaticForgeConcurrentArchive","Stream pool","Errors","Archive sets"],"content":"`StaticForgeArchive` is the runtime handle for a loaded archive file. It is populated by `StaticForgeReader::Load` and then used to retrieve asset data. The usage is described in Loading Assets at Runtime. [toc] `StaticForgeArchive` can be moved but not copied, so a copy doesn't open another file handle by accident. Use `Clone()` for a second archive object: ```cpp StaticForge::StaticForgeArchive a; StaticForge::StaticForgeArchive b = std::move(a); // OK StaticForge::StaticForgeArchive c = a; // compile error StaticForge::StaticForgeArchive d = b.Clone(); // OK, shares the loaded data ``` An archive object can be loaded again with `StaticForgeReader::Load`. The reader calls the private `Reset()` first, which closes the stream and releases the mapping, the loaded data and the errors of the previous archive. Clones keep the old data. | Member | Description | |----------|--------------------------------------------------------------------------------------------| | `m data` | `std::shared ptr<const Internal::ArchiveData `, the loaded data, shared with clones | | `m mmap` | `std::shared ptr<Internal::MmapFile `, the memory mapping, shared with clones | | `m stream` | `std::ifstream` used for stream-based reads, every archive object has its own | `Internal::ArchiveData` (in `Internal/ArchiveCore.h`) holds everything the reader loads: | Field | Description | |-------------------|-----------------------------------------------------------------| | `path` | Path to the archive file on disk (any extension) | | `header` | Parsed `StaticForgeHeader` struct | | `indexEntries` | `std::vector<StaticForgeIndexEntry ` — one per file | | `hashNameToEntry` | `std::unordered map<uint64 t, size t ` for O(1) lookup | | `indexToName` | `std::unordered map<size t, std::string ` for reverse name lookup | The data is never changed after loading, so it can be shared between archive objects and threads without locking. If nothing is loaded `m data` is `nullptr` and the getters use empty data. `Clone()` copies both `shared ptr`s. The clone gets its own stream (opened on the first load) and its own errors. `CloseMapped()` only releases the archive's own reference to the mapping, it is unmapped when the last archive releases it. `OpenMapped()` on an archive that isn't mapped creates a new mapping. The loading logic (`LoadEntry`, `LoadEntryRange`, `DecompressBlocks`, `VerifyEntry`) lives in `Internal/ArchiveCore` as free functions. They get the data, the entry and an `EntrySource` (the stream or the mapping), so they can be used by other archive types too. The decompressor is shared, its `DecompressTo` doesn't change the object and reports errors through a parameter. 1. Normalize the slashes of the key and hash it with `HashFilename` (64-bit FNV-1a). 2. Look up the hash in `hashNameToEntry` to find the index position. 3. Call `LoadEntry`, which is shared by all full loads (vector or buffer, stream or mapped): - Clear the stream state, so a previous failed read does not break this one. - If `compressedFileSize == 0` (uncompressed): read `fileSize` bytes at `dataOffset + fileOffset` directly into the target and validate the FNV-1a checksum (see Hashing). - If `compressedFileSize != 0` (compressed): read `compressedFileSize` bytes, validate the checksum, then decompress block by block (`DecompressBlocks`). Each block is prefixed with `[uint32 t compressedSize][uint32 t originalSize]` and decompressed independently, directly into the target. A block with `compressedSize == originalSize` is stored raw and only copied. 4. With a vector, the block sizes are checked before the vector is resized to `fileSize`, so a damaged size in the index can't cause a huge allocation. The vector is only changed on success. `LoadAssetAt(index, ...)` skips steps 1 and 2 and loads the entry at the given index directly. The buffer variants (`LoadAsset(key, buffer, bufferSize)`, ...) fail with an error if `bufferSize` is smaller than `fileSize`. Only `fileSize` bytes are written. `LoadEntryRange` checks that `[offset, offset + size)` is inside of `fileSize` (overflow safe). The checksum is not validated, because it covers the whole stored data. - Uncompressed: read `size` bytes at `dataOffset + fileOffset + offset`. - Compressed: `DecompressBlocks` walks the block frames. Blocks before the range are skipped by reading only their 8 byte frame. Blocks completely inside of the range are decompressed directly into the buffer; the first and last block, if only partly inside, are decompressed into a temporary block buffer and the needed part is copied. The walk stops after the last block of the range. Reading a range near the end of a large compressed asset reads one frame per block before it, which is small compared to decompressing them. 1. Verify the archive is memory-mapped (`IsMapped()`). 2. Hash the key and look up the index entry. 3. Get the pointer with `MmapFile::At(offset, size)`, which returns `nullptr` if the range `[dataOffset + fileOffset, storedSize]` is not inside the mapped file. An empty range at the end of the file is valid. 4. `GetAssetMapped` returns a non-owning `AssetView` pointing directly into mapped memory — no copy. Compressed entries are rejected, because their original data is not in memory. `LoadAssetMapped` uses the same `LoadEntry` as the stream version, only the stored bytes come from the mapping instead of the stream. It validates the checksum, then copies the bytes or decompresses them directly from the mapping into the target. `LoadAssetRangeMapped` works like `LoadAssetRange`, the block frames are read directly from the mapping. The `AssetView` is only valid while the archive remains mapped. Call `CloseMapped` only after you are done with all views. `OpenMapped` works with relative and absolute paths. On Windows the path is made absolute and prefixed with `\\?`, so long paths work too. | Method | Compressed | Allocates | Copies data | Checksum | |----------------------------------|:----------:|:---------:|:-----------:|:--------:| | `LoadAsset` / `LoadAssetAt` (vector) | [x] | [x] | [x] | [x] | | `LoadAsset` / `LoadAssetAt` (buffer) | [x] | [ ] [^temp-buffer] | [x] | [x] | | `LoadAssetRange` / `LoadAssetRangeAt` | [x] | [ ] [^temp-buffer] | [x] | [ ] | | `LoadAssetMapped` (vector) | [x] | [x] | [x] | [x] | | `LoadAssetMapped` (buffer) | [x] | [ ] | [x] | [x] | | `LoadAssetRangeMapped` | [x] | [ ] [^range-block] | [x] | [ ] | | `GetAssetMapped` | [ ] | [ ] | [ ] | [ ] | [^temp-buffer]: No allocation for uncompressed assets. For compressed assets a temporary buffer for the stored data (full load) or for one block (range) is used. [^range-block]: For compressed assets a temporary buffer for a block that is only partly inside of the range. All getters read directly from the header or the index entries and are cheap: ```cpp archive.GetVersion(); // uint64 t archive.GetFileCount(); // size t archive.GetIndexOffset(); // uint64 t archive.GetIndexSize(); // uint64 t archive.GetDataOffset(); // uint64 t archive.StoresNames(); // bool — true if name table is present archive.GetHashName(i); // uint64 t — 0 if i is invalid archive.GetFileOffset(i); // uint64 t — 0 if i is invalid archive.GetFileSize(i); // uint64 t — 0 if i is invalid archive.GetFilePadding(i); // uint64 t — 0 if i is invalid archive.GetName(i); // std::string — empty if name table not present or i is invalid archive.Contains(key); // bool — asset exists archive.GetAssetSize(key, &size); // bool — false if the asset doesn't exist, size is the original size ``` `Contains` and `GetAssetSize` only use the index in memory, they don't read the file and don't add errors. `VerifyAll` opens the file stream if needed and, for every index entry, reads the stored bytes (`compressedFileSize` for compressed entries, otherwise `fileSize`) in 1 MB chunks while computing the FNV-1a checksum. A mismatch or missing data adds one error per asset (`Asset '<name ' is damaged (...)`, or the hash if no names are stored). All entries are checked, the function returns `false` if any of them is damaged. Nothing is decompressed. After `StaticForgeReader::Load` succee /**
 * Opens every collapsed section (::: Title) around el, so a link / toc / search
 * target inside it can be scrolled to.
 */
function revealInSections(el) {
  var section = el && el.closest ? el.closest('details.doc-section') : null;
  while (section) {
    section.open = true;
    section = section.parentElement ? section.parentElement.closest('details.doc-section') : null;
  }
}

/** [toc] links (MarkdownParser): scroll to the heading instead of changing the URL hash (page navigation). */
function initTocLinks() {
  document.addEventListener('click', function (e) {
    // [toc] links and footnotes: scroll to the target instead of changing the hash
    var link = e.target.closest('a[data-toc-target]');
    if (!link)
      return;
    e.preventDefault();
    var heading = document.getElementById(link.getAttribute('data-toc-target'));
    if (heading) {
      revealInSections(heading);
      heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
}

/**
 * {copy} button of code blocks. Copies the code without line numbers; diff
 * blocks copy the new version (without removed lines).
 */
function initCodeCopy() {
  function getCodeText(wrapper) {
    var diffLines = wrapper.querySelectorAll('.code-block-diff-line:not(.code-block-diff-removed)');
    if (diffLines.length) {
      return Array.prototype.map.call(diffLines, function (line) { return line.textContent; })
        .join('\n').replace(/^\u00A0$/gm, '');
    }
    var source = wrapper.querySelector('pre');
    return source ? source.textContent.replace(/^\u00A0$/gm, '') : '';
  }
  function copyWithBuffer(text) {
    var buffer = document.createElement('textarea');
    buffer.className = 'code-copy-buffer';
    buffer.value = text;
    buffer.setAttribute('readonly', '');
    document.body.appendChild(buffer);
    buffer.select();
    try { document.execCommand('copy'); } catch (e) {}
    buffer.remove();
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText)
      return navigator.clipboard.writeText(text).catch(function () { copyWithBuffer(text); });
    copyWithBuffer(text);
    return Promise.resolve();
  }
  document.addEventListener('click', function (e) {
    var button = e.target.closest && e.target.closest('.code-copy-btn');
    var wrapper = button && button.closest('.code-block-wrapper');
    if (!wrapper)
      return;
    copyText(getCodeText(wrapper)).then(function () {
      button.textContent = 'Copied';
      clearTimeout(button._copyTimeout);
      button._copyTimeout = setTimeout(function () { button.textContent = 'Copy'; }, 1500);
    });
  });
}

/**
 * Keeps the {copy} button of code blocks visible while the content scrolls
 * through a block (same approach as initStickyTableHead).
 * @param {HTMLElement} scrollEl  The scroll container.
 */
function initStickyCodeCopy(scrollEl) {
  var codeCopyPending = false;
  function updateCodeCopyButtons() {
    codeCopyPending = false;
    var stickTop = scrollEl.getBoundingClientRect().top;
    var copies = scrollEl.querySelectorAll('.code-copy');

    // measure all buttons first, then write (see buildStickyTableHeadJs)
    var offsets = [];
    copies.forEach(function (copy) {
      // the row isn't always at the top of the wrapper (numbered blocks have the tag above)
      var naturalTop = copy.getBoundingClientRect().top - (copy._offset || 0);
      var wrapperBottom = copy.parentElement.getBoundingClientRect().bottom;
      var button = copy.firstElementChild;
      var maxOffset = Math.max(wrapperBottom - naturalTop - (button ? button.offsetHeight : 0) - 16, 0);
      offsets.push(Math.min(Math.max(stickTop - naturalTop, 0), maxOffset));
    });

    copies.forEach(function (copy, i) {
      if ((copy._offset || 0) === offsets[i])
        return;
      copy._offset = offsets[i];
      copy.style.transform = offsets[i] ? 'translateY(' + offsets[i] + 'px)' : '';
    });
  }
  scrollEl.addEventListener('scroll', function () {
    if (codeCopyPending)
      return;
    codeCopyPending = true;
    requestAnimationFrame(updateCodeCopyButtons);
  }, { passive: true });
}

/**
 * {hover=col} tables: marks every cell of the hovered column with
 * .tbl-hover-col (row and cell hover are plain CSS).
 */
function initTableColumnHover() {
  var hoveredCells = [];
  var hoveredCell = null;
  function clearColumn() {
    hoveredCells.forEach(function (cell) { cell.classList.remove('tbl-hover-col'); });
    hoveredCells = [];
    hoveredCell = null;
  }
  document.addEventListener('mouseover', function (e) {
    var cell = e.target.closest && e.target.closest('table[data-hover~="col"] th, table[data-hover~="col"] td');
    if (cell === hoveredCell)
      return;
    clearColumn();
    if (!cell)
      return;
    hoveredCell = cell;
    cell.closest('table').querySelectorAll('tr').forEach(function (tr) {
      var columnCell = tr.cells[cell.cellIndex];
      if (columnCell) {
        columnCell.classList.add('tbl-hover-col');
        hoveredCells.push(columnCell);
      }
    });
  });
  document.addEventListener('mouseout', function (e) {
    if (!e.relatedTarget)
      clearColumn();
  });
}

/**
 * Keeps table headers visible while the content scrolls. Tables sit in a
 * horizontally scrolling wrapper, where position: sticky can't follow the
 * page scroll, so the thead is shifted down instead.
 * @param {HTMLElement} scrollEl  The scroll container.
 */
function initStickyTableHead(scrollEl) {
  var tableHeadPending = false;
  function updateTableHeads() {
    tableHeadPending = false;
    var stickTop = scrollEl.getBoundingClientRect().top;
    var heads = scrollEl.querySelectorAll('.table-wrapper thead');

    // measure all tables first, then write: measuring after a write forces a new layout per table
    var transforms = [];
    heads.forEach(function (thead) {
      var tableRect = thead.parentElement.getBoundingClientRect();
      // only a table whose top scrolled above the edge and that is still in view needs a shift
      if (tableRect.top >= stickTop || tableRect.bottom <= stickTop) {
        transforms.push('');
        return;
      }
      var maxOffset = Math.max(tableRect.height - thead.offsetHeight, 0);
      // 1px less: the header also covers the top border line
      var offset = Math.min(stickTop - tableRect.top, maxOffset) - 1;
      transforms.push(offset > 0 ? 'translateY(' + offset + 'px)' : '');
    });

    heads.forEach(function (thead, i) {
      if (thead.style.transform !== transforms[i])
        thead.style.transform = transforms[i];
    });
  }
  scrollEl.addEventListener('scroll', function () {
    if (tableHeadPending)
      return;
    tableHeadPending = true;
    requestAnimationFrame(updateTableHeads);
  }, { passive: true });
}

/**
 * Forwards key events not handled inside the iframe to the parent document,
 * so app shortcuts also work while the preview has focus. Dispatches
 * synchronously (same-origin blob iframe), so a shortcut that prevents the
 * forwarded event also prevents the original one. Presses (pointerdown /
 * mousedown, no click) are dispatched on the iframe element, so the app's
 * outside-press handlers close open menus and popups. Does nothing when the
 * page is not embedded (exported HTML).
 */
function initKeyForward() {
  if (window.parent === window)
    return;
  function forwardKey(e) {
    if (e.defaultPrevented)
      return;
    try {
      var forwarded = new window.parent.KeyboardEvent(e.type, {
        key: e.key,
        code: e.code,
        location: e.location,
        repeat: e.repeat,
        ctrlKey: e.ctrlKey,
        shiftKey: e.shiftKey,
        altKey: e.altKey,
        metaKey: e.metaKey,
        bubbles: true,
        cancelable: true
      });
      if (!window.parent.document.dispatchEvent(forwarded))
        e.preventDefault();
    } catch (err) {}
  }
  window.addEventListener('keydown', forwardKey);
  window.addEventListener('keyup', forwardKey);

  function forwardPress(e) {
    var frame = window.frameElement;
    if (!frame)
      return;
    try {
      var rect = frame.getBoundingClientRect();
      var Type = e.type === 'pointerdown' ? window.parent.PointerEvent : window.parent.MouseEvent;
      frame.dispatchEvent(new Type(e.type, {
        button: e.button,
        buttons: e.buttons,
        clientX: e.clientX + rect.left,
        clientY: e.clientY + rect.top,
        ctrlKey: e.ctrlKey,
        shiftKey: e.shiftKey,
        altKey: e.altKey,
        metaKey: e.metaKey,
        pointerType: e.pointerType,
        bubbles: true,
        cancelable: true
      }));
    } catch (err) {}
  }
  window.addEventListener('pointerdown', forwardPress, true);
  window.addEventListener('mousedown', forwardPress, true);
}

var currentTabId = null;
var currentNodeId = null;
var isTransitioning = false;
var dynamicContent = document.getElementById('dynamicContent');

// -- Search state --------------------------------------------------------
var searchInput   = document.getElementById('searchInput');
var searchResults = document.getElementById('searchResults');

// -- Helper: find node's tab --------------------------------------------
function getNodeTabId(nodeId) {
  var node = allNodes.find(n => { return n.id === nodeId; });
  return node ? node.tabId : null;
}

// -- Helper: page (and section) that shows a node ----------------------
function resolveTarget(nodeId) {
  if (!nodeId)
    return null;
  if (allNodes.some(n => { return n.id === nodeId; }))
    return { pageId: nodeId, anchor: null };
  return nodeAliases[nodeId] || null;
}

function scrollToSection(anchor) {
  if (!anchor)
    return;
  var el = document.getElementById(anchor);
  if (el && dynamicContent.contains(el)) {
    revealInSections(el);
    el.scrollIntoView();
  }
}

// Opens any node: pages directly, merged children on their page at their section.
// anchor (optional) overrides the section of the node.
function openNode(nodeId, updateUrl, onDone, anchor) {
  var target = resolveTarget(nodeId);
  if (!target) {
    onDone?.();
    return;
  }
  loadNode(target.pageId, updateUrl, onDone, () => {
    scrollToSection(anchor || target.anchor);
  });
}

// -- Header scroll-hide behaviour --------------------------------------
var docHeader = document.getElementById('docHeader');
if (docHeader && docHeader.classList.contains('header-scroll-hide')) {
  var lastScrollY = 0;
  var scrollTarget = document.querySelector('.dynamic-content') || window;
  var onScroll = () => {
    var y = (scrollTarget === window) ? window.scrollY : scrollTarget.scrollTop;
    if (y > lastScrollY && y > 60) {
      docHeader.classList.add('hidden-scrolled');
    } else {
      docHeader.classList.remove('hidden-scrolled');
    }
    lastScrollY = y;
  };
  scrollTarget.addEventListener('scroll', onScroll, { passive: true });
}

// -- TOC builder --------------------------------------------------------
var tocLinks = document.getElementById('tocLinks');
function buildToc() {
  if (!tocLinks) 
    return;
  var headings = dynamicContent.querySelectorAll('h1,h2,h3,h4');
  tocLinks.innerHTML = '';
  headings.forEach(h => {
    if (!h.id) h.id = 'h-' + Math.random().toString(36).slice(2, 7);
    var a = document.createElement('a');
    a.className = 'toc-link';
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    a.dataset.level = h.tagName[1];
    a.addEventListener('click', e => {
      e.preventDefault();
      revealInSections(h);
      h.scrollIntoView({ behavior: 'smooth' });
    });
    tocLinks.appendChild(a);
  });
}

// -- Sidebar toggle ------------------------------------------------------
var docRoot = document.getElementById('docRoot');
var navBackdrop = document.getElementById('navBackdrop');
var toggleButtons = [
  document.getElementById('navToggleBtn')
].filter(Boolean);

function setSidebarCollapsed(collapsed, persist) {
  docRoot.classList.toggle('sidebar-collapsed', collapsed);
  toggleButtons.forEach(btn => {
    btn.setAttribute('aria-expanded', String(!collapsed));
  });
  if (persist) {
    try { sessionStorage.setItem('_docSidebarCollapsed', collapsed ? '1' : '0'); } catch (e) {}
  }

function toggleSidebar() {
  setSidebarCollapsed(!docRoot.classList.contains('sidebar-collapsed'), true);
}

toggleButtons.forEach(btn => {

});

});

// When the sidebar floats over the content (position: fixed, e.g. on

var navContainer = document.querySelector('.nav-container');
function collapseOverlaySidebar() {

  if (isOverlay && toggleButtons.length > 0) {

// Default: open on desktop, closed on mobile — unless the user already

(function initSidebarState() {

  try { stored = sessionStorage.getItem('_docSidebarCollapsed'); } catch (e) {}

  var canReopen = toggleButtons.length > 0;
  var collapsed = stored !== null
    ? stored === '1'
