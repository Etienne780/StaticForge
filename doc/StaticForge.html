  var firstNode = {"id":"node_mu3td1kuufx8v3a1hzju","tabId":"tab_mu3td1ku2qztxt16axy53"};
  var searchIndex = [{"nodeId":"node_mu3td1kuufx8v3a1hzju","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Getting Started","headings":["Getting Started","What you get","Typical workflow"],"content":"StaticForge is an asset archive system for bundling and loading game files. It combines multiple files into a compact `.sfpak` container that can be efficiently read at runtime. - A command-line tool (`StaticForgeTool`) to pack your assets during your build process - A C++ library (`StaticForgeCore`) to load assets from `.sfpak` files at runtime 1. Organize your asset folders 2. Optionally add `.sfpak.meta` files to control how folders are grouped into archives 3. Run `StaticForgeTool` to pack your assets into one or more `.sfpak` files 4. At runtime, use `StaticForgeReader` and `StaticForgeArchive` to load assets by path --- Tip: `.sfpak` files are binary and not meant to be edited manually. Always rebuild them from source assets using the tool."},{"nodeId":"node_mu3td1ku93dq7vjxmvr2","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Packing Assets","headings":["Packing Assets","Basic usage","Specifying an archive name","Multiple source folders","Creating the output directory automatically","Verbose output"],"content":"Use `StaticForgeTool` to pack a folder of assets into a `.sfpak` archive. ```bash StaticForgeTool --source ./assets --output ./build ``` This scans `./assets` recursively and writes the archive to `./build/main.sfpak`. By default the archive is named `main`. Use `--name` to override: ```bash StaticForgeTool --source ./assets --output ./build --name textures ``` This produces `./build/textures.sfpak`. `--source` can be repeated to include multiple directories: ```bash StaticForgeTool --source ./textures --source ./audio --output ./build ``` or ```bash StaticForgeTool --source \"./textures, ./audio\" --output ./build ``` If the output directory doesn't exist yet, add `--mkdir`: ```bash StaticForgeTool --source ./assets --output ./build/packed --mkdir true ``` Add `--verbose` (or `-v`) to print detailed information about every file processed: ```bash StaticForgeTool --source ./assets --output ./build --verbose ```"},{"nodeId":"node_mu3td1ku1d4g35y4wv21q","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Meta Files","headings":["Meta Files","File format","Supported parameters","How it works","Fallback","storenames override"],"content":"Meta files let you split assets from a single source tree into multiple `.sfpak` archives automatically. A meta file has the extension `.sfpak.meta` and uses a simple semicolon-terminated key-value syntax: ``` archive = textures; exclude = .png, .jpg; storenames = true; ``` Each statement is a `key = value;` pair. Whitespace around `=` and `;` is ignored. Comments start with `#` and run to the end of the line: ``` archive = ui; exclude = .psd; # skip source files ``` | Key | Type | Required | Description | |--------------|----------|----------|-----------------------------------------------------------------| | `archive` | string | yes | Name for the `.sfpak` archive produced from this directory | | `exclude` | string[] | no | Comma-separated list of file extensions to skip (e.g. `.png`) | | `store-names` | bool | no | Store original filenames in the archive for debug inspection | | `compress` | bool | no | Compresses files larger than 4096 bytes before storing them in the archive. | Example with all parameters: ``` archive = main; exclude = .png, .jpg, .vert, .help; store-names = true; compress = false; ``` When the tool scans your source directories it looks for `.sfpak.meta` files. Every asset file in the same directory (or any subdirectory) is then packed into the archive named in that meta file. Excluded extensions are skipped entirely. ``` assets/ textures/ textures.sfpak.meta <- archive = textures; exclude = .psd; background.png ui.png audio/ audio.sfpak.meta <- archive = audio; music.ogg sfx.wav scripts/ game.lua <- no meta file → goes into the default archive ``` Running the tool on `assets/` produces: - `textures.sfpak` - `audio.sfpak` - `main.sfpak` (for everything without a meta file) Files that are not covered by any meta file are packed into the archive name set with `--name` (default: `main`). If `--store-names` is passed on the command line, name storage is enabled globally for all archives — even those whose meta file sets `store-names = false`. The meta value only takes effect when the CLI flag is not set."},{"nodeId":"node_mu3td1ku1w2zp279b2ssx","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Inspecting Archives","headings":["Inspecting Archives","Basic info","Inspecting multiple archives at once","Verbose index listing","Name table"],"content":"Use `--info` to display header and index information of one or more existing `.sfpak` files without extracting anything. ```bash StaticForgeTool --info ./build/textures.sfpak ``` Output: ``` Archive: textures.sfpak Version: 1 File count: 42 Index offset: 32 Index size: 1176 Data offset: 4096 ``` `--info` can be repeated to inspect several archives in one invocation: ```bash StaticForgeTool --info ./build/textures.sfpak --info ./build/audio.sfpak ``` Each archive is printed in sequence with a separator between them. Add `--verbose` to also print every index entry: ```bash StaticForgeTool --info ./build/textures.sfpak --verbose ``` Output includes a line per file showing its hash, byte offset, size, and checksum: ``` Index entries: [0] hash: 12938471234 offset: 4096 size: 204800 checksum: 3421543 [1] hash: 98712634521 offset: 208896 size: 81920 checksum: 9871234 ... ``` If the archive was built with `--store-names` (or `store-names = true` in the meta file), the inspector also prints the name table, showing the original relative path for each entry. Note: Without name storage the index only contains hashes. The original path is not recoverable from the archive alone — keep your source assets."},{"nodeId":"node_mu3td1kuzgocka16m5db0","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Loading Assets at Runtime","headings":["Loading Assets at Runtime","Opening an archive","Loading a file by path","Managing the file stream","Memory-mapped access","Compression","Error handling"],"content":"At runtime, use `StaticForgeReader` to open a `.sfpak` file and `StaticForgeArchive` to load individual assets. ```cpp #include <StaticForgeCore/StaticForge.h StaticForge::StaticForgeArchive archive; StaticForge::StaticForgeReader reader; if (!reader.Load(\"./build/textures.sfpak\", &archive)) { // reader.GetError() contains a description of what went wrong std::cerr << reader.GetError() << std::endl; } ``` Pass the relative path of the file exactly as it appeared under the source directory: ```cpp std::vector<std::byte data; if (!archive.LoadAsset(\"textures/background.png\", data)) { std::cerr << archive.GetError() << std::endl; } // data now contains the raw bytes of the file ``` Important: The asset path must exactly match the path relative to the source root. Slashes are normalized internally, but typos or case mismatches will prevent the asset from being found. After `StaticForgeReader::Load` succeeds, the archive's file stream is open. `LoadAsset` reopens it automatically if it was closed. You can control this manually: ```cpp archive.CloseFileStream(); // release the file handle archive.OpenFileStream(); // reopen when needed bool open = archive.IsFileStreamOpen(); ``` For better read performance, the archive can be opened using memory mapping instead of a file stream. This avoids repeated `seek`/`read` calls and lets the OS manage page caching. ```cpp if (!archive.OpenMapped()) { std::cerr << archive.GetError() << std::endl; } // Zero-copy view — valid only while the archive stays mapped StaticForge::AssetView view = archive.GetAssetMapped(\"textures/background.png\"); if (view.data == nullptr) { std::cerr << archive.GetError() << std::endl; } // Or copy into a buffer, same as LoadAsset std::vector<std::byte data; if (!archive.LoadAssetMapped(\"textures/background.png\", data)) { std::cerr << archive.GetError() << std::endl; } archive.CloseMapped(); bool mapped = archive.IsMapped(); ``` `GetAssetMapped` returns a non-owning `AssetView` directly into mapped memory — no allocation or copy needed. The view becomes invalid as soon as `CloseMapped` is called. Important: Memory-mapped access is not supported for compressed assets . Calling `GetAssetMapped` or `LoadAssetMapped` on a compressed entry will return an error. Use `LoadAsset` (stream-based) instead, which handles decompression automatically. Assets can be stored compressed inside an archive. This is transparent when using the stream-based API — `LoadAsset` detects compressed entries and decompresses them automatically before returning the data: ```cpp // Works for both compressed and uncompressed assets std::vector<std::byte data; if (!archive.LoadAsset(\"maps/level1.map\", data)) { std::cerr << archive.GetError() << std::endl; } ``` Internally, compressed archives use per-block framing: each 4096-byte chunk is compressed independently and prefixed with its compressed and original size. This means the decompressor never needs to hold the entire file in memory at once. Whether an entry is compressed can be determined from the index — if `compressedFileSize != 0` the entry is compressed, otherwise it is stored raw. | Access method | Uncompressed | Compressed | |----------------------|:------------:|:-------------------:| | `LoadAsset` | ✅ | ✅ (auto-decompress) | | `LoadAssetMapped` | ✅ | ❌ not supported | | `GetAssetMapped` | ✅ | ❌ not supported | Both `StaticForgeReader` and `StaticForgeArchive` expose error messages. Always check the return value and read `GetError()` when it returns `false`: ```cpp if (!archive.LoadAsset(\"audio/music.ogg\", data)) { // possible reasons: key not found, seek failure, checksum mismatch, // decompression failure, or compressed asset accessed via mmap std::cerr << archive.GetError() << std::endl; } ```"},{"nodeId":"node_mu3td1kurklac1g47o2b","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Building Archives in Code","headings":["Building Archives in Code","Minimal example","Multiple source paths","Fluent API","Debug mode"],"content":"Instead of using the command-line tool you can drive the build process directly from C++ using `StaticForgeBuilder`. ```cpp #include <StaticForgeCore/StaticForge.h StaticForge::StaticForgeBuilder builder; builder .SetArchiveName(\"textures\") .AddSourcePath(\"./assets/textures\") .SetOutputPath(\"./build\") .SetCreateOutputDir(true); if (!builder.Build()) { std::cerr << builder.GetError() << std::endl; } ``` ```cpp builder.SetSourcePath({ \"./assets/textures\", \"./assets/audio\" }); ``` or add them one at a time: ```cpp builder.AddSourcePath(\"./assets/textures\"); builder.AddSourcePath(\"./assets/audio\"); ``` All setters return ` this` so they can be chained: ```cpp StaticForge::StaticForgeBuilder builder{ \"main\", { \"./assets\" }, \"./build\" }; builder .SetCreateOutputDir(true) .SetDebugMode(true) .Build(); ``` `SetDebugMode(true)` prints detailed progress to `stdout` - the same output as `--verbose` in the CLI tool."},{"nodeId":"node_mu3td1kuw60i4y16ior5l","tabId":"tab_mu3td1ku2qztxt16axy53","title":"CLI Reference","headings":["CLI Reference","Arguments","Modes","storenames priority"],"content":"Quick reference for all `StaticForgeTool` arguments. | Argument | Short | Description | Type | Default | Multi | |-----------------|---------|----------------------------------------------------------------------------|----------|---------|-------| | `--source` | `--src` | Source path(s) of the files to be packed (can be specified multiple times) | filepath | — | yes | | `--output` | `--o` | Output directory for the `.sfpak` file | filepath | — | no | | `--name` | `--n` | Default archive name when no `.sfpak.meta` file is found | string | `main` | no | | `--mkdir` | `--p` | Create the output directory if it does not exist | bool | false | no | | `--info` | `--i` | Display header and index info of a `.sfpak` file (can be repeated) | filepath | — | yes | | `--verbose` | `--v` | Enable debug/verbose console output | bool | false | no | | `--store-names` | `--sn` | Store original filenames in all archives for debug inspection | bool | false | no | | `--compress` | `--c` | Compresses files larger than 4096 bytes before storing them in the archive | bool | false | no | | `--help` | `--h` | Show this help message | — | — | no | Exactly one mode must be active per invocation. Modes are determined by which arguments are provided: | Mode | Required arguments | |-------|---------------------------------| | pack | `--source` and `--output` | | info | `--info` | | help | `--help` | Combining arguments from multiple modes (e.g. `--source` together with `--info`) is an error. When `--store-names` is set on the command line, name storage is forced on for every archive regardless of what the `.sfpak.meta` file specifies. The meta-file value of `store-names` is only used when the CLI flag is absent."},{"nodeId":"node_mu3td1ku1de5w2cswv1sn","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"Architecture","headings":["Architecture","StaticForgeCore","StaticForgeTool","Dependency graph"],"content":"StaticForge is split into two main components. The core static library. Contains all format logic and is linked by both the tool and any consuming application: - Archive format definition and binary layout - `StaticForgeBuilder` - writes `.sfpak` files - `StaticForgeReader` - reads and validates `.sfpak` files - `StaticForgeArchive` - runtime handle for an open archive - Meta file parsing (`StaticForgeMeta`) - Internal helpers: hashing, alignment, endian handling, error support The CLI executable. Wraps `StaticForgeCore` with argument parsing and three modes: pack, info, help. Does not contain any format logic itself. ``` StaticForgeTool └── StaticForgeCore ├── StaticForgeBuilder ├── StaticForgeReader ├── StaticForgeArchive └── Internal (helpers, meta, hashing) Your Game / Application └── StaticForgeCore ├── StaticForgeReader └── StaticForgeArchive ``` The tool-side classes (`StaticForgeBuilder`, meta parsing) are compiled into Core but an application that only reads archives still links the same library - there is currently no separate runtime-only build target."},{"nodeId":"node_mu3td1kuuhnvwc15ryskk","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"File Format","headings":["File Format","Layout","Header","Index entry","Data blocks","Name Table Header","Name Table Entry","Name Table String Data","Alignment"],"content":"A `.sfpak` file consists of three required regions and two optional regions written sequentially: Header , Index , Data , and — when name storage is enabled — Name Table Header , Name Table Entries , and Name Table String Data . ``` [ HEADER ] aligned to ALIGNMENT HEADER = 32 bytes [ INDEX ] N × sizeof(IndexEntry), then padded to ALIGNMENT FILE = 4096 [ DATA BLOCKS ] files written back-to-back, each padded to ALIGNMENT FILE = 4096 [ NAME TABLE HEADER ] optional — present when storenames is enabled [ NAME TABLE ENTRIES ] optional — one entry per file [ NAME TABLE STRING DATA ] optional — raw UTF-8 path strings packed together ``` Magic bytes `SFPK` followed by six `uint64 t` fields. Written little-endian on all platforms. | Field | Type | Description | |-------------------------|------------|-----------------------------------------------------------------| | `magic` | `char[4]` | Always `S`, `F`, `P`, `K` | | `version` | `uint64 t` | Format version (currently `2`) | | `fileCount` | `uint64 t` | Number of files in this archive | | `indexOffset` | `uint64 t` | Byte offset to the start of the index | | `indexSize` | `uint64 t` | Total size of the index in bytes | | `dataOffset` | `uint64 t` | Byte offset to the start of data | | `nameTableHeaderOffset` | `uint64 t` | Byte offset to the Name Table Header, or `0` if not present | One entry per file, stored contiguously starting at `indexOffset`. | Field | Type | Description | |----------------------|------------|------------------------------------------------------------------------------------------| | `hashName` | `uint64 t` | FNV-1a hash of the relative file path | | `fileOffset` | `uint64 t` | Byte offset of the file's data block relative to `dataOffset` | | `fileSize` | `uint64 t` | Original (uncompressed) file size in bytes | | `compressedFileSize` | `uint64 t` | Total compressed bytes on disk, excluding framing headers. `0` means stored uncompressed | | `filePadding` | `uint32 t` | Padding bytes appended after the file data to reach the next 4096-byte boundary | | `checksum` | `uint32 t` | FNV-1a checksum of the data as written on disk (covers framing headers + compressed data)| Each file occupies one data block starting at `dataOffset + fileOffset`. The block is always padded with zero bytes to the next 4096-byte boundary; the padding size is stored in `filePadding`. When `compressedFileSize == 0` the block contains the raw file bytes verbatim. When `compressedFileSize != 0` the block contains a sequence of independently compressed chunks: ``` [ CHUNK 0 ][ CHUNK 1 ][ ... ][ CHUNK N ] ``` Each chunk has the following layout: ``` [ compressedSize : uint32 t ] size of the compressed payload that follows [ originalSize : uint32 t ] size of the decompressed output for this chunk [ payload : bytes ] compressedSize bytes of compressed data ``` Chunks are produced by splitting the original file into 4096-byte pieces and compressing each piece independently. The decompressor reads chunks sequentially until `compressedSize` bytes consumed equals `compressedFileSize`. Because each chunk carries its own original size, no global decompressed-size context is needed per chunk. The FNV-1a checksum covers all chunk bytes as written on disk — framing headers included — so integrity is verified before any decompression takes place. Note: Compressed data blocks cannot be accessed via memory mapping. Use the stream-based `LoadAsset` API which handles decompression automatically. Present only when the archive was built with name storage enabled. Located at `nameTableHeaderOffset`. | Field | Type | Description | |--------------------|------------|--------------------------------------------------------| | `entryOffset` | `uint64 t` | Byte offset to the first Name Table Entry | | `stringDataOffset` | `uint64 t` | Byte offset to the start of Name Table String Data | One entry per file, stored contiguously starting at `entryOffset`. | Field | Type | Description | |--------------|------------|--------------------------------------------------------------------------------| | `hash` | `uint64 t` | FNV-1a hash of the path (matches `hashName` in the corresponding index entry) | | `nameLength` | `uint32 t` | Length of the UTF-8 path string in bytes | | `nameOffset` | `uint32 t` | Byte offset within the String Data region where this path starts | Raw UTF-8 path strings packed end-to-end with no separators. To read a filename, seek to `stringDataOffset + nameOffset` and read `nameLength` bytes. - The header region is padded to 32 bytes (`ALIGNMENT HEADER`). - Every file data block is padded to 4096 bytes (`ALIGNMENT FILE`) — one filesystem page. - Padding bytes are always zero. This alignment ensures that file offsets are always multiples of 4096, which allows direct memory-mapped access for uncompressed assets without additional alignment work."},{"nodeId":"node_mu3td1kucsyh3x1ldzws1","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"Hashing","headings":["Hashing","Filename hashing","Data checksum","Path format"],"content":"StaticForge uses FNV-1a (Fowler–Noll–Vo) for two purposes: filename lookup and data integrity. When the builder packs a file, the relative path string (e.g. `textures/background.png`) is hashed to a `uint64 t` and stored in the index as `hashName`. At runtime, `StaticForgeArchive::LoadAsset` hashes the key string you pass in and looks it up in the index map. The original string is never stored in the archive. Implications: - Lookups are O(1) via `std::unordered map`. - The archive cannot list filenames - only validate whether a known key exists. - Hash collisions between two different paths in the same archive are detected at build time and cause an error. During packing, each file's raw bytes are fed through FNV-1a with the initial value `2166136261` to produce a `uint32 t` checksum. This is written back into the index entry after the data is flushed. When loading, `StaticForgeArchive::LoadEntry` recomputes the checksum over the read bytes and compares it to the stored value. A mismatch causes `LoadAsset` to return `false` with an error message. Use a path relative to the source root used during packing. ```cpp // Correct archive.LoadAsset(\"textures/background.png\", data); // Also valid archive.LoadAsset(\"textures\\\\background.png\", data); // Wrong - path is not relative to the source root archive.LoadAsset(\"./assets/textures/background.png\", data); ```"},{"nodeId":"node_mu3td1kulgv50d577zxf","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"Build Process","headings":["Build Process","1. CheckFilepaths","2. ScanFiles","3. CreateGroups","Write phases summary","Compression","Overflow safety"],"content":"`StaticForgeBuilder::Build()` runs three internal phases in sequence. Validates that all source paths exist and that the output path is a directory (no file extension). If `SetCreateOutputDir(true)` was called and the directory is missing, it is created here. Recursively iterates every source path in two passes: Pass 1 — Meta collection: Collects all `.sfpak.meta` files and builds a `directory → ArchiveMeta` mapping. Each entry stores the archive name, excluded extensions, and the `storenames` and `compress` flags. Pass 2 — File assignment: Iterates all non-meta files, computes their relative path, hashes it with FNV-1a, and assigns each file to the appropriate `ArchiveGroup` by walking up the directory tree until a meta entry is found. Falls back to the default archive name if no meta file applies. For each file the builder also: - Detects hash collisions between files in the same group and reports them as errors. - Applies the `storenames` and `compress` overrides: if a global flag is set, it is forced on even when the meta file sets it to `false`. For each `ArchiveGroup` the following phases run in order: CalculateDataStart — computes the byte offset at which file data begins. This is the sum of the aligned header size and the index table size, rounded up to the next 4096-byte boundary. WriteData — opens the output file and writes `dataStart` bytes of zero-padding to reserve space for the header and index, then writes all file data blocks. During this pass, `blockOffset`, `filePadding`, `checksum`, and `compressedFileSize` are filled in on each file entry so the index can be written correctly afterwards. WriteHeader — seeks back to offset `0` and writes the `StaticForgeHeader` struct, padded to 32 bytes. WriteIndex — writes one `StaticForgeIndexEntry` per file directly after the header. Checksums computed during `WriteData` are included here — no second seek is needed. BuildNameTable (optional, when storenames is enabled) — computes the byte layout of the Name Table Header, Name Table Entries, and String Data region. Offsets are appended after the last data block. WriteNameTable (optional) — seeks to `nameTableStart` (set at the end of `WriteData`) and writes the Name Table Header, Name Table Entries, and raw UTF-8 string data. | Phase | Seeks to | What it writes | |-------------------|-------------------|------------------------------------------------------------------------------| | `WriteData` | `0` (start) | `dataStart` zero-padding, then all file data blocks in order | | `WriteHeader` | `0` (seekp back) | `StaticForgeHeader` struct padded to 32 bytes | | `WriteIndex` | after header | One `StaticForgeIndexEntry` per file, including computed checksums | | `WriteNameTable` | `nameTableStart` (seekp forward) | Name Table Header, Name Table Entries, raw UTF-8 string data | When compression is enabled for an archive group (via the meta file or the global `SetCompress` flag), files larger than one 4096-byte block are compressed. Compression is applied per-block during `WriteData`: - Each 4096-byte read chunk is compressed independently. - Each compressed block is prefixed with a framing header: `[uint32 t compressedSize][uint32 t originalSize]`. - The raw compressed bytes follow immediately after the framing header. - `compressedFileSize` in the index entry is set to the total number of compressed bytes written (excluding framing headers). A value of `0` means the entry is stored uncompressed. The per-block approach means the decompressor can process one chunk at a time without buffering the entire file. The FNV-1a checksum covers the framing headers and compressed block data as written, so integrity verification happens before decompression. All size and offset arithmetic uses checked helpers that return `false` on overflow instead of wrapping silently: | Helper | Description | |-----------------|--------------------------------------------------------| | `SafeAddU64` | Addition with overflow check | | `SafeMulU64` | Multiplication with overflow check | | `SafeAlignSize` | Rounds up to a power-of-two alignment, overflow-safe | | `GetHeaderSize` | Returns the aligned header size via `SafeAlignSize` | Any overflow causes `Build()` to return `false` with a descriptive error."},{"nodeId":"node_mu3td1ku1hsv9km18cfhyf","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"Meta File Parser","headings":["Meta File Parser","Syntax","Tokenizer","Parser","Error suggestions","Supported parameters","Value parsing"],"content":"Meta files use a minimal custom format parsed by `StaticForgeMeta` inside `StaticForgeCore`. Each statement is a key-value pair terminated by a semicolon: ``` key = value; ``` Multiple statements can appear in any order: ``` archive = main; exclude = .png, .jpg, .vert, .help; store-names = true; ``` Comments start with `#` and run to the end of the line: ``` archive = main;storenames ``` `MetaTokenizer` reads the entire file into memory, then walks it character by character via `ProcessContent` → `ProcessChar`. It tracks the current line and column for error reporting and produces a flat `std::vector<MetaToken `. Character dispatch (`ProcessChar`): | Input | Action | |--------------------------------------|----------------------------------------------| | Whitespace (`\\r`, `\\n`, ` `, `\\t`) | Skipped; newlines increment the line counter | | `=` | Emit `Assign` | | `,` | Emit `Separator` | | `;` | Emit `Delimiter` | | `#` | Call `SkipComment` — consume until `\\n` | | Alpha, ` `, `.`, `-` | Call `ReadIdentifier` | | Anything else | Add error, emit `UNKNOWN` | `ReadIdentifier`: records the start pointer, then advances `m cur` while the character is alphanumeric, ` `, `.`, or `-`. The resulting `string view` into the in-memory buffer is stored in the token without any heap allocation. Token types: | Token type | Description | |--------------|--------------------------------------------------------------| | `Identifier` | An unquoted word — keys, values, extensions, booleans | | `Assign` | The `=` character | | `Separator` | The `,` character (used between list values like extensions) | | `Delimiter` | The `;` character — terminates a statement | | `EndOfFile` | Sentinel appended after the last character | | `UNKNOWN` | Unrecognised character; always accompanied by an error | Every token stores its line and column at the point it was emitted. `StaticForgeMeta::ParseTokens` consumes the token stream produced by `MetaTokenizer`. Each statement follows this pattern: ``` Identifier(key) Assign Identifier(value) Delimiter ``` For list values (e.g. `exclude`) the value section is instead: ``` Identifier Separator Identifier Separator ... Identifier Delimiter ``` Any deviation — wrong token type, unexpected `EndOfFile`, missing `Delimiter` — is a parse error that includes the line and column of the offending token. If an `Identifier` key is not recognised, the parser computes the edit distance to every known key. If the closest match differs by at most 3 characters a suggestion is appended to the error: ``` Unknown key 'archiv' at line 1, column 1. Did you mean 'archive'? ``` | Key | Type | Required | Description | |--------------|----------|----------|-----------------------------------------------------------------| | `archive` | string | yes | Name for the `.sfpak` archive | | `exclude` | string[] | no | Comma-separated list of file extensions to skip | | `storen-ames` | bool | no | Store original filenames in the archive for debug inspection | | `compress` | bool | no | Compresses files larger than 4096 bytes before storing them in the archive. | `archive` — the `Identifier` token value is used as-is. `exclude` — after the `=`, the parser collects `Identifier` tokens separated by `Separator` (`,`) tokens until it sees a `Delimiter` (`;`). Each token value is trimmed and lowercased, so `.PNG` and `.png` are treated identically. `storenames` — the single `Identifier` token after `=` is compared case-insensitively. `true` and `1` are truthy; anything else is false."},{"nodeId":"node_mu3td1ku1t629jd11ytz7k","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"StaticForgeArchive","headings":["StaticForgeArchive","Ownership and move semantics","Internal state","LoadAsset flow","LoadAssetMapped / GetAssetMapped flow","Access method comparison","Accessor methods","Managing the file stream","Managing memory mapping","Error handling"],"content":"`StaticForgeArchive` is the runtime handle for a loaded `.sfpak` file. It is populated by `StaticForgeReader::Load` and then used to retrieve asset data. `StaticForgeArchive` is move-only. Copying is deleted because it owns an open `std::ifstream`. ```cpp StaticForge::StaticForgeArchive a; StaticForge::StaticForgeArchive b = std::move(a); // OK StaticForge::StaticForgeArchive c = a; // compile error ``` | Member | Description | |---------------------|---------------------------------------------------------------------| | `m path` | Path to the `.sfpak` file on disk | | `m stream` | `std::ifstream` used for stream-based reads | | `m mmap` | `std::unique ptr<Internal::MmapFile ` used for memory mapping | | `m compressor` | `std::unique ptr<Internal::LZ4Compression ` used for decompression | | `m header` | Parsed `StaticForgeHeader` struct | | `m indexEntries` | `std::vector<StaticForgeIndexEntry ` — one per file | | `m hashNameToEntry` | `std::unordered map<uint64 t, size t ` for O(1) lookup | | `m indexToName` | `std::unordered map<size t, std::string ` for reverse name lookup | 1. Hash the key string with `HashFilename`. 2. Look up the hash in `m hashNameToEntry` to find the index position. 3. Call `LoadEntry`: - If `compressedFileSize == 0` (uncompressed): seek to `dataOffset + fileOffset`, read `fileSize` bytes, validate the FNV-1a checksum, return the raw bytes. - If `compressedFileSize != 0` (compressed): seek to `dataOffset + fileOffset`, read `compressedFileSize` bytes, validate the checksum, then decompress block by block. Each block is prefixed with `[uint32 t compressedSize][uint32 t originalSize]` and decompressed independently until all bytes are consumed. The reassembled output must equal `fileSize` bytes. 4. Return the decompressed (or raw) bytes in `outData`. 1. Verify the archive is memory-mapped (`IsMapped()`). 2. Hash the key and look up the index entry. 3. Reject compressed entries — if `compressedFileSize != 0`, add an error and return `false` / empty view. Use `LoadAsset` instead for compressed assets. 4. Verify the range `[dataOffset + fileOffset, fileSize]` is within the mapped region. 5. `GetAssetMapped` returns a non-owning `AssetView` pointing directly into mapped memory — no copy. `LoadAssetMapped` validates the checksum first, then copies the bytes into `outData`. The `AssetView` is only valid while the archive remains mapped. Call `CloseMapped` only after you are done with all views. | Method | Compressed | Allocates | Copies data | |-------------------|:----------:|:---------:|:-----------:| | `LoadAsset` | ✅ | ✅ | ✅ | | `LoadAssetMapped` | ❌ | ✅ | ✅ | | `GetAssetMapped` | ❌ | ❌ | ❌ | All getters read directly from `m header` or `m indexEntries` and are cheap: ```cpp archive.GetVersion(); // uint64 t archive.GetFileCount(); // size t archive.GetIndexOffset(); // uint64 t archive.GetIndexSize(); // uint64 t archive.GetDataOffset(); // uint64 t archive.StoresNames(); // bool — true if name table is present archive.GetHashName(i); // uint64 t archive.GetFileOffset(i); // uint64 t archive.GetFileSize(i); // uint64 t archive.GetFilePadding(i); // uint64 t archive.GetName(i); // std::string — empty if name table not present ``` After `StaticForgeReader::Load` succeeds the archive's file stream is open. `LoadAsset` reopens it automatically if it was closed. You can control this manually: ```cpp archive.CloseFileStream(); // release the file handle archive.OpenFileStream(); // reopen when needed bool open = archive.IsFileStreamOpen(); ``` Memory mapping is independent of the file stream and must be opened explicitly: ```cpp archive.OpenMapped(); // map the file into memory archive.IsMapped(); // bool archive.CloseMapped(); // unmap — invalidates all AssetViews ``` Both `StaticForgeReader` and `StaticForgeArchive` support error messages. Always check the return value and read `GetError()` when it returns `false`: ```cpp if (!archive.LoadAsset(\"audio/music.ogg\", data)) { // possible reasons: key not found, seek/read failure, // checksum mismatch, decompression failure std::cerr << archive.GetError() << std::endl; } if (!archive.LoadAssetMapped(\"textures/ui.png\", data)) { // additional possible reason: entry is compressed std::cerr << archive.GetError() << std::endl; } ```"},{"nodeId":"node_mu3td1ku72xkz714tsyqd","tabId":"tab_mu3td1ku1xe2e1n1pqfbar","title":"ErrorSupport","headings":["ErrorSupport","API","Header mode","Error accumulation"],"content":"`ErrorSupport` is the base class for `StaticForgeBuilder`, `StaticForgeReader`, and `StaticForgeArchive`. It provides a simple error collection system with optional formatted prefixes. ```cpp bool IsValid() const; // true if no errors were added std::string GetError(); // returns all collected errors as a single string ``` The constructor takes a boolean `hasHeader`. When enabled, the first error is prefixed with: ```txt [Error]: ``` Additional errors are indented for readability. Example: ```txt [Error]: Failed to load archive Failed to read header Invalid magic value ``` `HAS HEADER` is a constant with the value `true` and is used by: - `StaticForgeBuilder` - `StaticForgeReader` - `StaticForgeArchive` Internal helper classes such as `StaticForgeMeta` usually disable this mode and emit raw messages without formatting. Errors are accumulated in insertion order. Each call to `AddError()` appends a new entry to the internal error list. `GetError()` combines all stored messages into a single newline-separated string."}];
  var currentTabId = null;
  var currentNodeId = null;
  var isTransitioning = false;
  var dynamicContent = document.getElementById('dynamicContent');

  // -- Search state --------------------------------------------------------
  var searchInput   = document.getElementById('searchInput');
  var searchResults = document.getElementById('searchResults');
  var searchResultsList = document.getElementById('searchResultsList');
  var searchToggle  = document.getElementById('searchIncludeTabs');
  var searchDebounceTimer = null;

  // -- Helper: find node's tab --------------------------------------------
  function getNodeTabId(nodeId) {
    var node = allNodes.find(n => { return n.id === nodeId; });
    return node ? node.tabId : null;
  }

  // -- Header scroll-hide behaviour --------------------------------------
  var docHeader = document.getElementById('docHeader');
  if (docHeader && docHeader.classList.contains('header-scroll-hide')) {
    var lastScrollY = 0;
    var scrollTarget = document.querySelector('.dynamic-content') || window;
    var onScroll = () => {
      var y = (scrollTarget === window) ? window.scrollY : scrollTarget.scrollTop;
      if (y > lastScrollY && y > 60) {
        docHeader.classList.add('hidden-scrolled');
      } else {
        docHeader.classList.remove('hidden-scrolled');
      }
      lastScrollY = y;
    };
    scrollTarget.addEventListener('scroll', onScroll, { passive: true });
  }

  // -- TOC builder --------------------------------------------------------
  var tocLinks = document.getElementById('tocLinks');
  function buildToc() {
    if (!tocLinks) 
      return;
    var headings = dynamicContent.querySelectorAll('h1,h2,h3,h4');
    tocLinks.innerHTML = '';
    headings.forEach(h => {
      if (!h.id) h.id = 'h-' + Math.random().toString(36).slice(2, 7);
      var a = document.createElement('a');
      a.className = 'toc-link';
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.dataset.level = h.tagName[1];
      a.addEventListener('click', e => {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth' });
      });
      tocLinks.appendChild(a);
    });
  }

  // -- Sidebar toggle ------------------------------------------------------
  var docRoot = document.getElementById('docRoot');
  var navBackdrop = document.getElementById('navBackdrop');
  var toggleButtons = [
    document.getElementById('navToggleBtn')
  ].filter(Boolean);
  var closeBtn = document.getElementById('navCloseBtn');

  function setSidebarCollapsed(collapsed, persist) {
    docRoot.classList.toggle('sidebar-collapsed', collapsed);
    toggleButtons.forEach(btn => {
      btn.setAttribute('aria-expanded', String(!collapsed));
    });
    if (persist) {
      try { sessionStorage.setItem('_docSidebarCollapsed', collapsed ? '1' : '0'); } catch (e) {}
    }
  }

  function toggleSidebar() {
    setSidebarCollapsed(!docRoot.classList.contains('sidebar-collapsed'), true);
  }

  toggleButtons.forEach(btn => {
    btn.addEventListener('click', toggleSidebar);
  });

  if (closeBtn) {
    closeBtn.addEventListener('click', () => {
      setSidebarCollapsed(true, true);
    });
  }

  navBackdrop.addEventListener('click', () => {
    setSidebarCollapsed(true, true);
  });

  // Default: open on desktop, closed on mobile — unless the user already
  // picked a state this session. Never auto-collapse if there is no way
  // to reopen the sidebar again (no toggle button rendered, e.g.
  // header-show:'sidebar'/'never').
  (function initSidebarState() {
    var stored = null;
    try { stored = sessionStorage.getItem('_docSidebarCollapsed'); } catch (e) {}

    var canReopen = toggleButtons.length > 0;
    var collapsed = stored !== null
      ? stored === '1'
      : (canReopen && window.innerWidth <= 768);

    setSidebarCollapsed(collapsed, false);
  })();

  // -- Load node content from template with crossfade ---------------------
  function loadNode(nodeId, updateUrl, onDone) {
    if (isTransitioning) {
      onDone?.();
      return;
    }

    if (nodeId === currentNodeId) { 
      onDone?.(); 
      return; 
    }

    var template = document.getElementById('tmpl-' + nodeId);
    if (!template) {
      console.warn('Template not found for node', nodeId);
      onDone?.(); 
      return;
    }

    var newTabId = getNodeTabId(nodeId);
    if (!newTabId) { 
      onDone?.(); 
      return;
    }

    var activeTabSection = document.querySelector('.sidebar-section.active');
    if (activeTabSection && activeTabSection.dataset.tab !== newTabId) {
      switchTab(newTabId, () => {
        loadNode(nodeId, updateUrl, onDone);
      });
      return;
    }

    isTransitioning = true;
    dynamicContent.classList.add('fade-out');

    setTimeout(() => {
      var clone = document.importNode(template.content, true);
      dynamicContent.innerHTML = '';
      dynamicContent.appendChild(clone);
      buildToc();

      document.querySelectorAll('.nav-row').forEach(row => {
        row.classList.remove('active');
      });
      document.querySelectorAll('.nav-row[data-node-id="' + nodeId + '"]').forEach(row => {
        row.classList.add('active');
      });

      currentNodeId = nodeId;
      currentTabId = newTabId;

      if (updateUrl !== false && window.location.hash !== '#' + nodeId) {
        history.pushState(null, '', '#' + nodeId);
      }

      dynamicContent.classList.remove('fade-out');
      setTimeout(() => {
        isTransitioning = false;
        onDone?.(); 
      }, 50);
    }, 150);
  }

  // -- Tab switching -----------
  function switchTab(tabId, callback) {
    document.querySelectorAll('.sidebar-section').forEach(s => {
      s.classList.toggle('active', s.dataset.tab === tabId);
    });
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tabId);
    });

    try { 
      sessionStorage.setItem('_docActiveTab', tabId); 
    } catch (e) {}

    var firstNodeInTab = allNodes.find(n => n.tabId === tabId);
    if (firstNodeInTab) {
      loadNode(firstNodeInTab.id, true, callback);
    } else {
      dynamicContent.innerHTML = '<div class="main"><p>No content in this tab.</p></div>';
      currentNodeId = null;
      currentTabId = tabId;
      callback?.();
    }
  }

  // -- Nav group toggle --------------------------------------
  function toggleNavGroup(groupId) {
    var group = document.getElementById(groupId);
    if (!group)
      return;
    group.classList.toggle('collapsed');
  }

  // -- Search helpers ------------------------------------------------------

  /** Escapes a string for safe insertion as HTML text content. */
  function _escHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /**
   * Returns the HTML-escaped string with all occurrences of query
   * wrapped in <mark> tags for highlighting.
   */
  function _highlight(text, query) {
    if (!query || !text)
      return _escHtml(text);
    var escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('(' + escaped + ')', 'gi');
    return _escHtml(text).replace(re, '<mark>$1</mark>');
  }

  /**
   * Returns a short excerpt of text centred around the first occurrence
   * of query, padded by radius characters on each side.
   */
  function _getSnippet(text, query, radius) {
    radius = radius || 80;
    if (!text)
      return '';
    if (!query)
      return text.slice(0, radius * 2);
    var idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx < 0) 
      return text.slice(0, radius * 2);
    var start = Math.max(0, idx - radius);
    var end   = Math.min(text.length, idx + query.length + radius);
    return (start > 0 ? '\u2026' : '') + text.slice(start, end) + (end < text.length ? '\u2026' : '');
  }

  /**
   * Scores a single index entry against the query string.
   * Returns { score, matchedHeading }.
   *
   * Score weights:
   *   title match   +100
   *   heading match  +50  (first matched heading captured)
   *   content match  +10
   */
  function _scoreEntry(entry, query) {
    var ql = query.toLowerCase();
    var score = 0;
    var matchedHeading = null;

    if (entry.title.toLowerCase().indexOf(ql) >= 0)
      score += 100;

    for (var i = 0; i < entry.headings.length; i++) {
      if (entry.headings[i].toLowerCase().indexOf(ql) >= 0) {
        score += 50;
        if (!matchedHeading) matchedHeading = entry.headings[i];
      }
    }

    if (entry.content.toLowerCase().indexOf(ql) >= 0)
      score += 10;

    return { score: score, matchedHeading: matchedHeading };
  }

  /**
   * Executes a search over the index and renders results into the
   * floating results panel. Hides the panel when query is empty.
   */
  function _runSearch(query) {
    if (!searchResultsList)
      return;

    query = (query || '').trim();

    if (query.length < 2) {
      searchResults.classList.remove('visible');
      searchResultsList.innerHTML = '';
      return;
    }

    // Scope: current tab only, or all tabs when toggle is checked.
    var crossTab = searchToggle ? searchToggle.checked : false;
    var pool = crossTab
      ? searchIndex
      : searchIndex.filter(e => { return e.tabId === currentTabId; });

    var scored = [];
    for (var i = 0; i < pool.length; i++) {
      var res = _scoreEntry(pool[i], query);
      if (res.score > 0)
        scored.push({ entry: pool[i], score: res.score, matchedHeading: res.matchedHeading });
    }

    scored.sort((a, b) => { return b.score - a.score; });
    var top = scored.slice(0, 20);

    if (top.length === 0) {
      searchResultsList.innerHTML = '<div class="search-no-results">No results found</div>';
      searchResults.classList.add('visible');
      return;
    }

    searchResultsList.innerHTML = top.map(item => {
      var e = item.entry;
      var snippet = _getSnippet(e.content, query, 80);
      var headingHtml = item.matchedHeading
        ? '<div class="search-result-heading">' + _highlight(item.matchedHeading, query) + '</div>'
        : '';
      return '<div class="search-result" data-node-id="' + _escHtml(e.nodeId) + '">'
        + '<div class="search-result-title">'   + _highlight(e.title, query) + '</div>'
        + headingHtml
        + '<div class="search-result-preview">' + _highlight(snippet, query) + '</div>'
        + '</div>';
    }).join('');

    searchResults.classList.add('visible');
  }

  // -- Event handling -----------------------------------------------------

  // Sidebar-Clicks (Delegation)
  document.body.addEventListener('click', e => {
    var link = e.target.closest('.nav-row[data-node-id]');
    if (link && link.getAttribute('data-node-id')) {
      e.preventDefault();
      var nodeId = link.getAttribute('data-node-id');
      loadNode(nodeId, true);
    }
  });

  // Chevron-Clicks
  document.body.addEventListener('click', e => {
    var btn = e.target.closest('.nav-chevron-btn');
    if (btn && btn.dataset.toggleGroup) {
      e.preventDefault();
      toggleNavGroup(btn.dataset.toggleGroup);
      return;
    }

    var link = e.target.closest('.nav-row[data-node-id]');
    if (link && link.getAttribute('data-node-id')) {
      e.preventDefault();
      loadNode(link.getAttribute('data-node-id'), true);
    }
  });

  // Tab-Clicks
  var tabNav = document.getElementById('tabNav');
  if (tabNav) {
    tabNav.addEventListener('click', e => {
      var btn = e.target.closest('.tab-btn');
      if (btn && btn.dataset.tab) {
        switchTab(btn.dataset.tab);
      }
    });
  }

  var tabNavContainer = document.getElementById('tabNavContainer');
  if (tabNavContainer) {
    // Convert vertical scroll to horizontal scroll
    tabNavContainer.addEventListener('wheel', (e) => {
      if (e.deltaY === 0)
        return;
    
      e.preventDefault(); // prevent vertical scroll
      tabNavContainer.scrollBy({
        left: e.deltaY,
        behavior: 'smooth'
      });
    }, { passive: false });
  }

  window.addEventListener('hashchange', () => {
    var hash = window.location.hash.slice(1);
    if (hash && allNodes.some(n => { return n.id === hash; })) {
      loadNode(hash, false);
    } else if (firstNode) {
      loadNode(firstNode.id, true);
    }
  });

  // -- Search event handling ----------------------------------------------

  if (searchInput) {
    // Debounced input -> run search after 120 ms of silence.
    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounceTimer);
      var val = searchInput.value;
      searchDebounceTimer = setTimeout(() => {
        _runSearch(val);
      }, 120);
    });

    // Re-show results on focus if there is a pending query.
    searchInput.addEventListener('focus', () => {
      if (searchInput.value.trim().length >= 2 && searchResultsList)
        searchResults.classList.add('visible');
    });
  }

  // Result clicks: navigate to node and close panel.
  if (searchResultsList) {
    searchResultsList.addEventListener('click', e => {
      var item = e.target.closest('.search-result');
      if (!item)
        return;
      
      var nodeId = item.getAttribute('data-node-id');
      searchResults.classList.remove('visible');
      
      if (searchInput)
        searchInput.value = '';
      if (nodeId)
        loadNode(nodeId, true);
    });
  }

  // Close results when clicking anywhere outside the search widget.
  document.addEventListener('click', e => {
    if (!searchResultsList)
      return;
    var docSearch = document.getElementById('docSearch');
    if (docSearch && !docSearch.contains(e.target))
      searchResults.classList.remove('visible');
  });

  // -- Externe Navigation (postMessage) ------------------------------------
  var NAV_SOURCE = 'doc-nav';
  var navScrollPending = false;

  function getLocationPayload() {
    var scrollTop = dynamicContent.scrollTop;
    var scrollHeight = dynamicContent.scrollHeight;
    var clientHeight = dynamicContent.clientHeight;
    var maxScroll = scrollHeight - clientHeight;
    return {
      tabId: currentTabId,
      nodeId: currentNodeId,
      scrollTop: scrollTop,
      scrollHeight: scrollHeight,
      clientHeight: clientHeight,
      ratio: maxScroll > 0 ? scrollTop / maxScroll : 0
    };
  }

  function postLocation() {
    try {
      window.parent.postMessage({ source: NAV_SOURCE, type: 'location', payload: getLocationPayload() }, '*');
    } catch (e) {
    }
  }

  dynamicContent.addEventListener('scroll', function () {
    if (navScrollPending) 
      return;
    navScrollPending = true;
    requestAnimationFrame(function () {
      navScrollPending = false;
      postLocation();
    });
  }, { passive: true });

  function applyExternalScroll(scrollPosition) {
    if (scrollPosition == null) 
      return;
    var top;
    if (typeof scrollPosition === 'object' && scrollPosition.ratio != null) {
      top = scrollPosition.ratio * (dynamicContent.scrollHeight - dynamicContent.clientHeight);
    } else if (typeof scrollPosition === 'number') {
      top = scrollPosition;
    } else {
      return;
    }
    dynamicContent.scrollTop = top;
  }

  function handleExternalNavigate(msg) {
    var targetNodeId = msg.nodeId || currentNodeId;
    if (targetNodeId && targetNodeId !== currentNodeId) {
      loadNode(targetNodeId, true, function () {
        applyExternalScroll(msg.scrollPosition);
        postLocation();
      });
    } else {
      applyExternalScroll(msg.scrollPosition);
      postLocation();
    }
  }

  window.addEventListener('message', function (e) {
    var msg = e.data;
    if (!msg || msg.source !== NAV_SOURCE)
      return;
    if (msg.type === 'navigate') {
      handleExternalNavigate(msg);
    } else if (msg.type === 'location:get') {
      postLocation();
    }
  });

  // Direkter Zugriff, falls contentWindow verfügbar ist
  window.docNav = {
    navigate: function (opts) { handleExternalNavigate(opts || {}); },
    getLocation: getLocationPayload
  };

  // -- Initialization ---------------------------------------
  var savedTab = null;
  try { 
    savedTab = sessionStorage.getItem('_docActiveTab'); 
  } catch (e) {
  }
  var initialTab = (savedTab && allNodes.some(n => { 
      return n.tabId === savedTab; 
    })
  ) ? savedTab : (firstNode ? firstNode.tabId : null);
  
  var hashNodeId = window.location.hash.slice(1);
  var initialNodeId = null;
  if (hashNodeId && allNodes.some(n => { return n.id === hashNodeId; })) {
    initialNodeId = hashNodeId;
  } else if (firstNode) {
    initialNodeId = firstNode.id;
  }

  if (initialTab) {
    document.querySelectorAll('.sidebar-section').forEach(s => {
      s.classList.toggle('active', s.dataset.tab === initialTab);
    });
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === initialTab);
    });
  }

  if (initialNodeId) {
    loadNode(initialNodeId, false, () => {
      postLocation();
      window.parent.postMessage({ source: NAV_SOURCE, type: 'ready' }, '*');
    });
  } else {
    postLocation();
    window.parent.postMessage({ source: NAV_SOURCE, type: 'ready' }, '*');
  }
})();</script>
  </body>
  </html>
