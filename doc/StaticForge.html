    <div class="export-section__body"><h1 id="h-node_mu3td1kuw60i4y16ior5l-cli-reference">CLI Reference</h1>
<p>Quick reference for all <code>StaticForgeTool</code> arguments.</p>
<div class="doc-toc doc-toc--outline doc-toc--numbered"><ul class="doc-toc__list"><li><a class="doc-toc__link" href="#h-node_mu3td1kuw60i4y16ior5l-arguments" data-toc-target="h-node_mu3td1kuw60i4y16ior5l-arguments"><span class="doc-toc__num">1</span><span class="doc-toc__text">Arguments</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuw60i4y16ior5l-archive-extension" data-toc-target="h-node_mu3td1kuw60i4y16ior5l-archive-extension"><span class="doc-toc__num">2</span><span class="doc-toc__text">Archive extension</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuw60i4y16ior5l-compression-settings" data-toc-target="h-node_mu3td1kuw60i4y16ior5l-compression-settings"><span class="doc-toc__num">3</span><span class="doc-toc__text">Compression settings</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuw60i4y16ior5l-incremental-build" data-toc-target="h-node_mu3td1kuw60i4y16ior5l-incremental-build"><span class="doc-toc__num">4</span><span class="doc-toc__text">Incremental build</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuw60i4y16ior5l-values" data-toc-target="h-node_mu3td1kuw60i4y16ior5l-values"><span class="doc-toc__num">5</span><span class="doc-toc__text">Values</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuw60i4y16ior5l-modes" data-toc-target="h-node_mu3td1kuw60i4y16ior5l-modes"><span class="doc-toc__num">6</span><span class="doc-toc__text">Modes</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuw60i4y16ior5l-exit-code" data-toc-target="h-node_mu3td1kuw60i4y16ior5l-exit-code"><span class="doc-toc__num">7</span><span class="doc-toc__text">Exit code</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuw60i4y16ior5l-command-line-priority" data-toc-target="h-node_mu3td1kuw60i4y16ior5l-command-line-priority"><span class="doc-toc__num">8</span><span class="doc-toc__text">Command line priority</span></a></li></ul></div>
<h2 id="h-node_mu3td1kuw60i4y16ior5l-arguments">Arguments</h2>
<div class="table-wrapper"><table data-striped="row" data-hover="row"><thead><tr><th width="160">Argument</th><th width="100">Short</th><th>Description</th><th>Type</th><th>Default</th><th>Multi</th></tr></thead><tbody><tr><td><code>--source</code></td><td><code>--src</code></td><td>Source directory of the files to be packed (can be specified multiple times)</td><td>filepath</td><td>—</td><td>yes</td></tr><tr><td><code>--output</code></td><td><code>--o</code></td><td>Output directory for packed archives or extracted files</td><td>filepath</td><td>—</td><td>no</td></tr><tr><td><code>--name</code></td><td><code>--n</code></td><td>Default archive name when no <code>.sfpak.meta</code> file is found</td><td>string</td><td><code>main</code></td><td>no</td></tr><tr><td><code>--extension</code></td><td><code>--ext</code></td><td>File extension of all archives (<code>pak</code> or <code>.pak</code>), overrides the meta files</td><td>string</td><td><code>.sfpak</code></td><td>no</td></tr><tr><td><code>--mkdir</code></td><td><code>--p</code></td><td>Create the output directory if it does not exist</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--info</code></td><td><code>--i</code></td><td>Display header and index info of an archive file (can be repeated)</td><td>filepath</td><td>—</td><td>yes</td></tr><tr><td><code>--extract</code></td><td><code>--x</code></td><td>Extract archive file(s) into <code>&lt;output&gt;/&lt;archive name&gt;/</code> (can be repeated)</td><td>filepath</td><td>—</td><td>yes</td></tr><tr><td><code>--verify</code></td><td><code>--vf</code></td><td>Check the checksums of all files in archive file(s) (can be repeated)</td><td>filepath</td><td>—</td><td>yes</td></tr><tr><td><code>--verbose</code></td><td><code>--v</code></td><td>Enable debug/verbose console output</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--store-names</code></td><td><code>--sn</code></td><td>Store original filenames in all archives for debug inspection and extraction</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--compress</code></td><td><code>--c</code></td><td>Compress files larger than 4096 bytes before storing them in the archive</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--help</code></td><td><code>--h</code></td><td>Show the help message</td><td>—</td><td>—</td><td>no</td></tr></tbody></table></div>
<p>Short forms always use two dashes (<code>--v</code>, not <code>-v</code>).</p>
<p>Arguments that can be repeated also accept a comma-separated list: <code>--source &quot;./textures, ./audio&quot;</code>.</p>
<p><code>--info</code>, <code>--extract</code> and <code>--verify</code> accept archives with any extension, the content of the file decides if it is an archive.</p>
<h2 id="h-node_mu3td1kuw60i4y16ior5l-archive-extension">Archive extension</h2>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">assets</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--ext</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">pak</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p><code>--extension</code> sets the extension of every archive of the build, also of the archives whose meta file sets its own <code>extension</code>. The leading dot is optional. An invalid extension (empty, contains <code>/</code>, <code>\</code>, <code>&lt; &gt; : &quot; | ? *</code> or ends with <code>.</code> or a space) is an error:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>[Error] Build failed: Invalid archive extension &#39;.pak.&#39; (must not be empty, contain &#39;/&#39;, &#39;\&#39;, &#39;&lt;&#39;, &#39;&gt;&#39;, &#39;:&#39;, &#39;&quot;&#39;, &#39;|&#39;, &#39;?&#39;, &#39;*&#39; or end with &#39;.&#39; or &#39; &#39;)</code></pre><div class="code-language-tag code-language-tag--recognized">Output</div></div>
<p>See <a class="doc-ref" href="#node_mu3td1ku93dq7vjxmvr2" data-ref-node="node_mu3td1ku93dq7vjxmvr2" title="Packing Assets">Packing Assets</a> for the details.</p>
<h2 id="h-node_mu3td1kuw60i4y16ior5l-compression-settings">Compression settings</h2>
<p>Only used together with compression (<code>--compress</code> or <code>compress = true;</code> in a meta file). They override the values of <code>.sfpak.meta</code> files.</p>
<div class="table-wrapper"><table data-striped="row" data-hover="row"><thead><tr><th width="250">Argument</th><th width="100">Short</th><th>Description</th><th>Default</th><th>Range</th></tr></thead><tbody><tr><td><code>--compress-block-size</code></td><td><code>--cbs</code></td><td>Size in bytes of the blocks a file is split into for compression</td><td><code>65536</code></td><td>1024 - 67108864</td></tr><tr><td><code>--compress-table-size</code></td><td><code>--cts</code></td><td>Match table size as power of two (entries = 2^value)</td><td><code>16</code></td><td>8 - 24</td></tr><tr><td><code>--compress-min-match</code></td><td><code>--cmm</code></td><td>Shortest repeated sequence that is stored as a reference</td><td><code>8</code></td><td>4 - 65535</td></tr><tr><td><code>--compress-min-saving</code></td><td><code>--cms</code></td><td>Percent a block or file must get smaller, otherwise it is stored uncompressed</td><td><code>5</code></td><td>0 - 99</td></tr></tbody></table></div>
<p>Larger blocks compress better, because a block can only reference data inside of itself. Above 64 KB the gain is very small.</p>
<p><code>--compress-min-saving</code> avoids compression that isn't worth the time it takes to decompress: a block is only stored compressed if it gets at least this many percent smaller, otherwise it is stored raw. The same applies to the whole file, a file that doesn't get small enough is stored completely uncompressed. With <code>0</code> every saved byte counts.</p>
<h2 id="h-node_mu3td1kuw60i4y16ior5l-incremental-build">Incremental build</h2>
<div class="table-wrapper"><table data-striped="row" data-hover="row"><thead><tr><th width="140">Argument</th><th width="80">Short</th><th>Description</th><th>Type</th><th>Default</th></tr></thead><tbody><tr><td><code>--cache-dir</code></td><td><code>--cd</code></td><td>Directory of the build cache, enables incremental builds</td><td>filepath</td><td>—</td></tr><tr><td><code>--rebuild</code></td><td><code>--rb</code></td><td>Builds all archives, also the ones that are up to date</td><td>bool</td><td>false</td></tr></tbody></table></div>
<p>With <code>--cache-dir</code> only the archives whose files or settings changed are built, see <a class="doc-ref" href="#node_mu3td1ku93dq7vjxmvr2" data-ref-node="node_mu3td1ku93dq7vjxmvr2" title="Packing Assets">Packing Assets</a>. Without it every archive is built.</p>
<h2 id="h-node_mu3td1kuw60i4y16ior5l-values">Values</h2>
<ul><li><strong>bool</strong> arguments can be used without a value: <code>--verbose</code> is the same as <code>--verbose true</code>. Accepted values are <code>true</code>/<code>false</code>, <code>1</code>/<code>0</code>, <code>yes</code>/<code>no</code> and <code>y</code>/<code>n</code> (case insensitive). Anything else is an error, so a forgotten value like <code>--mkdir ./assets</code> is reported instead of silently being <code>false</code>.</li><li><strong>int</strong> arguments must be plain decimal numbers (<code>65536</code>, not <code>64k</code>).</li><li>All other arguments require a value.</li><li>Arguments and paths can contain any Unicode characters.</li><li>Paths with spaces must be quoted: <code>--source &quot;C:\Program Files\Game\assets&quot;</code>. On Windows a path in quotes must not end with <code>\</code> (<code>&quot;C:\assets\&quot;</code>), because <code>\&quot;</code> is read as a quote character.</li></ul>
<h2 id="h-node_mu3td1kuw60i4y16ior5l-modes">Modes</h2>
<p>Exactly one mode must be active per invocation. Modes are determined by which arguments are provided:</p>
<div class="table-wrapper"><table data-hover="row"><thead><tr><th class="tbl-hl-col">Mode</th><th>Required arguments</th><th>Optional arguments</th></tr></thead><tbody><tr><td class="tbl-hl-col">pack</td><td><code>--source</code> and <code>--output</code></td><td><code>--name</code>, <code>--extension</code>, <code>--mkdir</code>, <code>--verbose</code>, <code>--store-names</code>, <code>--compress</code>, <code>--compress-*</code>, <code>--cache-dir</code>, <code>--rebuild</code></td></tr><tr><td class="tbl-hl-col">extract</td><td><code>--extract</code> and <code>--output</code></td><td><code>--mkdir</code>, <code>--verbose</code></td></tr><tr><td class="tbl-hl-col">info</td><td><code>--info</code></td><td><code>--verbose</code></td></tr><tr><td class="tbl-hl-col">verify</td><td><code>--verify</code></td><td><code>--verbose</code></td></tr><tr><td class="tbl-hl-col">help</td><td><code>--help</code></td><td>—</td></tr></tbody></table></div>
<p>Combining arguments from multiple modes (e.g. <code>--source</code> together with <code>--info</code>) is an error. Pack arguments like <code>--extension</code> can't be used with the other modes either.</p>
<h2 id="h-node_mu3td1kuw60i4y16ior5l-exit-code">Exit code</h2>
<p>The tool returns <code>0</code> on success and <code>1</code> on any error, so it can be used in build scripts.</p>
<p>Errors are printed as <code>[Error] &lt;message&gt;</code>. Several errors at once, e.g. more than one invalid argument, are listed below a short description:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>[Error] Invalid arguments:
- Unknown argument &#39;foo&#39;
- Invalid value &#39;10k&#39; for argument &#39;cbs&#39;</code></pre><div class="code-language-tag code-language-tag--recognized">Output</div></div>
<h2 id="h-node_mu3td1kuw60i4y16ior5l-command-line-priority">Command line priority</h2>
<p>When <code>--store-names</code> or <code>--compress</code> is set on the command line, the option is forced on for every archive regardless of what the <code>.sfpak.meta</code> file specifies. The meta-file value is only used when the CLI flag is absent.</p>
<p><code>--extension</code> and the <code>--compress-*</code> settings replace the meta file values for all archives when they are set.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1ku1de5w2cswv1sn">
  <div class="main" data-node-id="node_mu3td1ku1de5w2cswv1sn" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1ku1de5w2cswv1sn" class="export-section">
    
    <div class="export-section__body"><h1 id="h-node_mu3td1ku1de5w2cswv1sn-architecture">Architecture</h1>
<p>StaticForge is split into two main components.</p>
<h2 id="h-node_mu3td1ku1de5w2cswv1sn-staticforgecore">StaticForgeCore</h2>
<p>The core static library. Contains all format logic and is linked by both the tool and any consuming application:</p>
<ul><li>Archive format definition and binary layout</li><li><code>StaticForgeBuilder</code> - writes archive files (<code>.sfpak</code> or an own extension)</li><li><code>StaticForgeReader</code> - reads and validates archive files</li><li><code>StaticForgeArchive</code> - runtime handle for an open archive</li><li><code>StaticForgeConcurrentArchive</code> - runtime handle that can be used from several threads at once</li><li><code>StaticForgeArchiveSet</code> / <code>StaticForgeConcurrentArchiveSet</code> - load from several archives as if they were one</li><li>Meta file parsing (<code>StaticForgeMeta</code>, see <a class="doc-ref" href="#node_mu3td1ku1hsv9km18cfhyf" data-ref-node="node_mu3td1ku1hsv9km18cfhyf" title="Meta File Parser">Meta File Parser</a>)</li><li>Archive core (<code>Internal/ArchiveCore</code>): the loaded archive data, shared between archive objects, and the asset loading logic (see <a class="doc-ref" href="#node_mu3td1ku1t629jd11ytz7k" data-ref-node="node_mu3td1ku1t629jd11ytz7k" title="StaticForgeArchive">StaticForgeArchive</a>)</li><li>Internal helpers: hashing, alignment, endian handling, compression, memory mapping, error support</li></ul>
<p>Only the headers directly in <code>include/StaticForgeCore/</code> are part of the public API. The <code>Internal/</code> headers are not included in the SDK release packages.</p>
<h2 id="h-node_mu3td1ku1de5w2cswv1sn-staticforgetool">StaticForgeTool</h2>
<p>The CLI executable. Wraps <code>StaticForgeCore</code> with argument parsing and five modes: pack, extract, info, verify, help. Does not contain any format logic itself.</p>
<p><code>Utf8Console</code> makes the tool work with Unicode on Windows: it reads the command line arguments as UTF-8 and switches the console output to UTF-8 while the tool runs. On other platforms the arguments already are UTF-8.</p>
<h2 id="h-node_mu3td1ku1de5w2cswv1sn-staticforgetests">StaticForgeTests</h2>
<p>A console application with the tests of the library, built with its own small test framework (<code>TEST_CASE</code>, <code>CHECK</code>, <code>REQUIRE</code>). Slow tests are marked with <code>STRESS_TEST</code> and only run with <code>--stress</code>. The tests also use the internal headers, e.g. to test the compressor directly. The normal tests run in the CI on every push (<code>.github/workflows/tests.yml</code>) and before every release.</p>
<h2 id="h-node_mu3td1ku1de5w2cswv1sn-dependency-graph">Dependency graph</h2>
<div class="doc-tree doc-tree--collapsible"><ul class="doc-tree__list"><li class="doc-tree__item doc-tree__item--folder"><details class="doc-tree__details" open><summary class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">StaticForgeTool</span></summary><ul class="doc-tree__list"><li class="doc-tree__item doc-tree__item--folder"><details class="doc-tree__details" open><summary class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">StaticForgeCore</span></summary><ul class="doc-tree__list"><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">StaticForgeBuilder</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">StaticForgeReader</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">StaticForgeArchive</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">StaticForgeConcurrentArchive</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">StaticForgeArchiveSet / StaticForgeConcurrentArchiveSet</span></div></li><li class="doc-tree__item doc-tree__item--folder"><details class="doc-tree__details"><summary class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">Internal</span></summary><ul class="doc-tree__list"><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">ArchiveCore</span><span class="doc-tree__comment">loaded archive data and asset loading</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">ArchiveSetIndex</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">ThreadErrors</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">BuildCache</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">StaticForgeMeta / MetaTokenizer</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">LZ4Compression</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">MmapFile</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">InternalHelpers</span><span class="doc-tree__comment">hashing, alignment, endian handling</span></div></li></ul></details></li></ul></details></li></ul></details></li><li class="doc-tree__item doc-tree__item--folder"><details class="doc-tree__details" open><summary class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">Your Game or Application</span></summary><ul class="doc-tree__list"><li class="doc-tree__item doc-tree__item--folder"><details class="doc-tree__details" open><summary class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">StaticForgeCore</span></summary><ul class="doc-tree__list"><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">StaticForgeReader</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">StaticForgeArchive / StaticForgeConcurrentArchive</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">StaticForgeArchiveSet / StaticForgeConcurrentArchiveSet</span><span class="doc-tree__comment">optional</span></div></li></ul></details></li></ul></details></li></ul></div>
<p>The tool-side classes (<code>StaticForgeBuilder</code>, meta parsing) are compiled into Core but an application that only reads archives still links the same library - there is currently no separate runtime-only build target.</p>
<h2 id="h-node_mu3td1ku1de5w2cswv1sn-platforms">Platforms</h2>
<p>Tested on Windows (MSVC) and Linux (GCC, Ubuntu). Archives are byte-identical across platforms: the same sources give the same archive on Windows and Linux (the files are sorted by path), and an archive packed on Windows can be loaded on Linux and the other way around.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1kuuhnvwc15ryskk">
  <div class="main" data-node-id="node_mu3td1kuuhnvwc15ryskk" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1kuuhnvwc15ryskk" class="export-section">
    
    <div class="export-section__body"><h1 id="h-node_mu3td1kuuhnvwc15ryskk-file-format">File Format</h1>
<p>An archive file consists of three required regions and three optional regions written sequentially: <strong>Header</strong>, <strong>Index</strong>, <strong>Data</strong>, and — when name storage is enabled — <strong>Name Table Header</strong>, <strong>Name Table Entries</strong>, and <strong>Name Table String Data</strong>.</p>
<p>All integers are stored little-endian on all platforms.</p>
<p>The file extension is not part of the format. Archives use <code>.sfpak</code> by default, but can have any extension (see <a class="doc-ref" href="#node_mu3td1ku93dq7vjxmvr2" data-ref-node="node_mu3td1ku93dq7vjxmvr2" title="Packing Assets">Packing Assets</a>). The reader identifies an archive only by its header (magic and version).</p>
<div class="doc-toc doc-toc--outline doc-toc--numbered"><ul class="doc-toc__list"><li><a class="doc-toc__link" href="#h-node_mu3td1kuuhnvwc15ryskk-layout" data-toc-target="h-node_mu3td1kuuhnvwc15ryskk-layout"><span class="doc-toc__num">1</span><span class="doc-toc__text">Layout</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuuhnvwc15ryskk-header" data-toc-target="h-node_mu3td1kuuhnvwc15ryskk-header"><span class="doc-toc__num">2</span><span class="doc-toc__text">Header</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuuhnvwc15ryskk-index-entry" data-toc-target="h-node_mu3td1kuuhnvwc15ryskk-index-entry"><span class="doc-toc__num">3</span><span class="doc-toc__text">Index entry</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuuhnvwc15ryskk-data-blocks" data-toc-target="h-node_mu3td1kuuhnvwc15ryskk-data-blocks"><span class="doc-toc__num">4</span><span class="doc-toc__text">Data blocks</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuuhnvwc15ryskk-name-table-header" data-toc-target="h-node_mu3td1kuuhnvwc15ryskk-name-table-header"><span class="doc-toc__num">5</span><span class="doc-toc__text">Name Table Header</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuuhnvwc15ryskk-name-table-entry" data-toc-target="h-node_mu3td1kuuhnvwc15ryskk-name-table-entry"><span class="doc-toc__num">6</span><span class="doc-toc__text">Name Table Entry</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuuhnvwc15ryskk-name-table-string-data" data-toc-target="h-node_mu3td1kuuhnvwc15ryskk-name-table-string-data"><span class="doc-toc__num">7</span><span class="doc-toc__text">Name Table String Data</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuuhnvwc15ryskk-alignment" data-toc-target="h-node_mu3td1kuuhnvwc15ryskk-alignment"><span class="doc-toc__num">8</span><span class="doc-toc__text">Alignment</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kuuhnvwc15ryskk-validation" data-toc-target="h-node_mu3td1kuuhnvwc15ryskk-validation"><span class="doc-toc__num">9</span><span class="doc-toc__text">Validation</span></a></li></ul></div>
<h2 id="h-node_mu3td1kuuhnvwc15ryskk-layout">Layout</h2>
<div class="code-block-wrapper code-tab-4"><pre><code>[ HEADER                 ]  52 bytes, padded to a multiple of ALIGNMENT_HEADER = 32 (64 bytes)
[ INDEX                  ]  N × 40 bytes, then padded to ALIGNMENT_FILE = 4096
[ DATA BLOCKS            ]  files written back-to-back, each padded to ALIGNMENT_FILE = 4096
[ NAME TABLE HEADER      ]  optional — present when store-names is enabled
[ NAME TABLE ENTRIES     ]  optional — one entry per file
[ NAME TABLE STRING DATA ]  optional — raw UTF-8 path strings packed together</code></pre><div class="code-language-tag code-language-tag--recognized">Layout</div></div>
<h2 id="h-node_mu3td1kuuhnvwc15ryskk-header">Header</h2>
<p>Magic bytes <code>SFPK</code> followed by six <code>uint64_t</code> fields.</p>
<div class="table-wrapper"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><code>magic</code></td><td><code>char[4]</code></td><td>Always <code>S</code>, <code>F</code>, <code>P</code>, <code>K</code></td></tr><tr><td><code>version</code></td><td><code>uint64_t</code></td><td>Format version (currently <code>3</code>)</td></tr><tr><td><code>fileCount</code></td><td><code>uint64_t</code></td><td>Number of files in this archive</td></tr><tr><td><code>indexOffset</code></td><td><code>uint64_t</code></td><td>Byte offset to the start of the index</td></tr><tr><td><code>indexSize</code></td><td><code>uint64_t</code></td><td>Total size of the index in bytes (<code>fileCount × 40</code>)</td></tr><tr><td><code>dataOffset</code></td><td><code>uint64_t</code></td><td>Byte offset to the start of data</td></tr><tr><td><code>nameTableHeaderOffset</code></td><td><code>uint64_t</code></td><td>Byte offset to the Name Table Header, or <code>0</code> if not present</td></tr></tbody></table></div>
<p>The reader only accepts archives with exactly its own <code>version</code>. The format is not backward compatible, archives are rebuilt with the application that uses them.</p>
<h2 id="h-node_mu3td1kuuhnvwc15ryskk-index-entry">Index entry</h2>
<p>One 40-byte entry per file, stored contiguously starting at <code>indexOffset</code>.</p>
<div class="table-wrapper"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><code>hashName</code></td><td><code>uint64_t</code></td><td>64-bit FNV-1a hash of the relative file path</td></tr><tr><td><code>fileOffset</code></td><td><code>uint64_t</code></td><td>Byte offset of the file's data block relative to <code>dataOffset</code></td></tr><tr><td><code>fileSize</code></td><td><code>uint64_t</code></td><td>Original (uncompressed) file size in bytes</td></tr><tr><td><code>compressedFileSize</code></td><td><code>uint64_t</code></td><td>Total bytes on disk including the framing headers. <code>0</code> means stored uncompressed</td></tr><tr><td><code>filePadding</code></td><td><code>uint32_t</code></td><td>Padding bytes appended after the file data to reach the next 4096-byte boundary</td></tr><tr><td><code>checksum</code></td><td><code>uint32_t</code></td><td>32-bit FNV-1a checksum of the data as written on disk (covers framing headers + compressed data)</td></tr></tbody></table></div>
<h2 id="h-node_mu3td1kuuhnvwc15ryskk-data-blocks">Data blocks</h2>
<p>Each file occupies one data block starting at <code>dataOffset + fileOffset</code>. The block is always padded with zero bytes to the next 4096-byte boundary; the padding size is stored in <code>filePadding</code>.</p>
<p>When <code>compressedFileSize == 0</code> the block contains the raw file bytes verbatim.</p>
<p>When <code>compressedFileSize != 0</code> the block contains a sequence of independently compressed chunks:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>[ CHUNK 0 ][ CHUNK 1 ][ ... ][ CHUNK N ]</code></pre><div class="code-language-tag code-language-tag--recognized">Data block</div></div>
<p>Each chunk has the following layout:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>[ compressedSize : uint32_t ]  size of the compressed payload that follows
[ originalSize   : uint32_t ]  size of the decompressed output for this chunk
[ payload        : bytes    ]  compressedSize bytes of compressed data, or the raw bytes if compressedSize == originalSize</code></pre><div class="code-language-tag code-language-tag--recognized">Chunk</div></div>
<p>Chunks are produced by splitting the original file into pieces of the compression block size (default 64 KB, at most <code>MAX_COMPRESSION_BLOCK_SIZE</code>) and compressing each piece independently. The decompressor reads chunks sequentially until all <code>compressedFileSize</code> bytes are consumed. Because each chunk carries its own original size, the reader does not need to know the block size that was used for packing. A chunk with <code>compressedSize == originalSize</code> is stored raw (it didn't get small enough when packing) and is copied instead of decompressed.</p>
<p>The FNV-1a checksum covers all chunk bytes as written on disk — framing headers included — so integrity is verified before any decompression takes place.</p>
<blockquote><strong>Note:</strong> Compressed data blocks can't be viewed zero-copy with <code>GetAssetMapped</code>, because only the compressed data is in the file. <code>LoadAsset</code>, <code>LoadAssetMapped</code> and the range functions decompress them automatically, see <a class="doc-ref" href="#node_mu3td1ku1t629jd11ytz7k" data-ref-node="node_mu3td1ku1t629jd11ytz7k" title="StaticForgeArchive">StaticForgeArchive</a>.</blockquote>
<h2 id="h-node_mu3td1kuuhnvwc15ryskk-name-table-header">Name Table Header</h2>
<p>Present only when the archive was built with name storage enabled. Located at <code>nameTableHeaderOffset</code>.</p>
<div class="table-wrapper"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><code>entryOffset</code></td><td><code>uint64_t</code></td><td>Byte offset to the first Name Table Entry</td></tr><tr><td><code>stringDataOffset</code></td><td><code>uint64_t</code></td><td>Byte offset to the start of the compressed String Data</td></tr><tr><td><code>stringDataSize</code></td><td><code>uint64_t</code></td><td>Size of the String Data after decompression</td></tr><tr><td><code>stringDataCompressedSize</code></td><td><code>uint64_t</code></td><td>Size of the compressed String Data in the file</td></tr></tbody></table></div>
<h2 id="h-node_mu3td1kuuhnvwc15ryskk-name-table-entry">Name Table Entry</h2>
<p>One 16-byte entry per file, stored contiguously starting at <code>entryOffset</code>, in the same order as the index.</p>
<div class="table-wrapper"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><code>hash</code></td><td><code>uint64_t</code></td><td>FNV-1a hash of the path (matches <code>hashName</code> in the corresponding index entry)</td></tr><tr><td><code>nameLength</code></td><td><code>uint32_t</code></td><td>Length of the UTF-8 path string in bytes</td></tr><tr><td><code>nameOffset</code></td><td><code>uint32_t</code></td><td>Byte offset within the decompressed String Data where this path starts</td></tr></tbody></table></div>
<h2 id="h-node_mu3td1kuuhnvwc15ryskk-name-table-string-data">Name Table String Data</h2>
<p>UTF-8 path strings packed end-to-end with no separators. The whole block is compressed as one piece with the same compression as the file data (without framing header), because paths usually share long prefixes and compress very well (often to 20 - 50 %). If it doesn't get small enough (e.g. only a few short names), it is stored raw and <code>stringDataCompressedSize == stringDataSize</code>.</p>
<p>To read a filename, read <code>stringDataCompressedSize</code> bytes at <code>stringDataOffset</code>, decompress them to <code>stringDataSize</code> bytes (or use them directly if both sizes are equal), then take <code>nameLength</code> bytes at <code>nameOffset</code>. Paths use <code>/</code> as separator and are relative to the source folder.</p>
<h2 id="h-node_mu3td1kuuhnvwc15ryskk-alignment">Alignment</h2>
<ul><li>The header region is padded to a multiple of 32 bytes (<code>ALIGNMENT_HEADER</code>), which makes it 64 bytes.</li><li>Every file data block is padded to 4096 bytes (<code>ALIGNMENT_FILE</code>) — one filesystem page.</li><li>Padding bytes are always zero.</li></ul>
<p>This alignment ensures that file offsets are always multiples of 4096, which allows direct memory-mapped access for uncompressed assets without additional alignment work.</p>
<h2 id="h-node_mu3td1kuuhnvwc15ryskk-validation">Validation</h2>
<p><code>StaticForgeReader::Load</code> only checks that the path is an existing regular file, the extension doesn't matter. Then it reads the header and rejects the file if the magic is not <code>SFPK</code> or the version is not its own. After that the archive is checked against the real file size before any memory is allocated:</p>
<ul><li><code>indexSize</code> must match <code>fileCount × 40</code>, and the index must be inside the file.</li><li><code>dataOffset</code> and the name table must be inside the file.</li><li>The data of every index entry must be inside the file, and every hash must be unique.</li><li>The compressed string data must be inside the file, and <code>stringDataSize</code> must be possible for its compressed size (at most <code>compressedSize × 13108</code>).</li><li>Every name must be inside the decompressed string data.</li></ul>
<p>When loading a compressed entry, every chunk's <code>originalSize</code> must be at most <code>MAX_COMPRESSION_BLOCK_SIZE</code> and the sum must match <code>fileSize</code>. A corrupted archive is rejected with an error instead of crashing.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1kucsyh3x1ldzws1">
  <div class="main" data-node-id="node_mu3td1kucsyh3x1ldzws1" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1kucsyh3x1ldzws1" class="export-section">
    
    <div class="export-section__body"><h1 id="h-node_mu3td1kucsyh3x1ldzws1-hashing">Hashing</h1>
<p>StaticForge uses <strong>FNV-1a</strong> (Fowler–Noll–Vo) for two purposes: filename lookup (64 bit) and data integrity (32 bit).</p>
<h2 id="h-node_mu3td1kucsyh3x1ldzws1-filename-hashing">Filename hashing</h2>
<p>When the builder packs a file, the relative path string (e.g. <code>textures/background.png</code>) is hashed with <strong>64-bit FNV-1a</strong> (offset basis <code>14695981039346656037</code>, prime <code>1099511628211</code>) and stored in the index as <code>hashName</code>.</p>
<p>At runtime, <code>StaticForgeArchive::LoadAsset</code> hashes the key string you pass in and looks it up in the index map. Unless the archive was built with <code>store-names</code>, the original string is not stored in the archive.</p>
<p><strong>Implications:</strong></p>
<ul><li>Lookups are O(1) via <code>std::unordered_map</code>.</li><li>Without a name table the archive cannot list filenames - only validate whether a known key exists. <code>--info --verbose</code> and <code>--extract</code> then show the hash instead (16 hex digits).</li><li>Hash collisions between two different paths of one build are detected at build time and cause an error. With 64 bit they are practically impossible (even with 100 000 files the probability is below one in a billion).</li></ul>
<h2 id="h-node_mu3td1kucsyh3x1ldzws1-data-checksum">Data checksum</h2>
<p>During packing, each file's bytes as written to disk are fed through <strong>32-bit FNV-1a</strong> with the initial value <code>2166136261</code> to produce a <code>uint32_t</code> checksum. This is written into the index entry.</p>
<p>When loading, <code>LoadEntry</code> (a free function in <code>Internal/ArchiveCore</code>, used by all archive types, see <a class="doc-ref" href="#node_mu3td1ku1t629jd11ytz7k" data-ref-node="node_mu3td1ku1t629jd11ytz7k" title="StaticForgeArchive">StaticForgeArchive</a>) recomputes the checksum over the read bytes and compares it to the stored value. A mismatch causes <code>LoadAsset</code> to return <code>false</code> with an error message. Partial loads (<code>LoadAssetRange</code>) don't validate the checksum, because it covers the whole stored data.</p>
<p>The checksum detects accidental damage. It is not a cryptographic signature and does not protect against intentional changes.</p>
<h2 id="h-node_mu3td1kucsyh3x1ldzws1-path-format">Path format</h2>
<p>Use a path <strong>relative to the source root</strong> used during packing. The path is UTF-8 and case sensitive, backslashes are converted to forward slashes before hashing.</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// Correct</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">textures/background.png"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">data</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// Also valid</span>
