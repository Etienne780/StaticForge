<p>After <code>StaticForgeReader::Load</code> succeeds the archive's file stream is open. <code>LoadAsset</code> reopens it automatically if it was closed. You can control this manually:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">CloseFileStream</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// release the file handle</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">OpenFileStream</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">  </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// reopen when needed</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">bool</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">open</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">IsFileStreamOpen</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>

<p>Memory mapping is independent of the file stream and must be opened explicitly:</p>

<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">CloseMapped</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// unmap — invalidates all AssetViews</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<h2>Error handling</h2>
<p><code>StaticForgeArchive</code> collects errors (see <em>ErrorSupport</em>). Always check the return value and read the error when it returns <code>false</code>:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">audio/music.ogg"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">data</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">))</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>

<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">endl</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>

<template id="tmpl-node_mu3td1ku72xkz714tsyqd">
  <div class="main" data-node-id="node_mu3td1ku72xkz714tsyqd" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1ku72xkz714tsyqd" class="export-section">
    
    <div class="export-section__body"><h1>ErrorSupport</h1>
<p><code>ErrorSupport</code> is the base class for <code>StaticForgeBuilder</code>, <code>StaticForgeReader</code>, and <code>StaticForgeArchive</code>.  <br>It provides a simple error collection system with optional formatted prefixes.</p>
<h2>API</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">bool</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">IsValid</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">const</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">            </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// true if no errors are stored</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">string</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">const</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// returns all stored errors as a single string</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">string</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">         </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// returns all stored errors and clears them</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">void</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">ClearErrors</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">              </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// clears all stored errors</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<h2>Header mode</h2>
<p>The constructor takes a boolean <code>hasHeader</code>.</p>
<p>When enabled, the first error is prefixed with:</p>
<div class="code-block-wrapper"><pre><code>[Error]:</code></pre><div class="code-language-tag code-language-tag--unrecognized">txt</div></div>
<p>Additional errors are indented for readability.</p>
<p>Example:</p>
<div class="code-block-wrapper"><pre><code>[Error]: Failed to load asset, entry with key &#39;missing1&#39; not found
&gt;        Failed to load asset, entry with key &#39;missing2&#39; not found</code></pre><div class="code-language-tag code-language-tag--unrecognized">txt</div></div>
<p><code>HAS_HEADER</code> is a constant with the value <code>true</code> and is used by:</p>
<ul><li><code>StaticForgeBuilder</code></li><li><code>StaticForgeReader</code></li><li><code>StaticForgeArchive</code></li></ul>
<p>Internal helper classes such as <code>StaticForgeMeta</code> disable this mode and emit raw messages without formatting.</p>
<h2>Error accumulation</h2>
<p>Errors are accumulated in insertion order.</p>
<p>Each call to <code>AddError()</code> appends a new entry to the internal error list.  <br><code>GetError()</code> combines all stored messages into a single newline-separated string.</p>
<h2>When errors are cleared</h2>
<p>Errors are only cleared when they no longer apply:</p>
<div class="table-wrapper"><table><thead><tr><th>Event</th><th>Cleared errors</th></tr></thead><tbody><tr><td><code>StaticForgeBuilder::Build()</code></td><td>errors of the builder (previous build)</td></tr><tr><td><code>StaticForgeReader::Load()</code></td><td>errors of the reader and of the target archive</td></tr><tr><td><code>StaticForgeMeta::Load()</code></td><td>errors of the meta parser</td></tr><tr><td><code>TakeError()</code> / <code>ClearErrors()</code></td><td>all errors of the object</td></tr></tbody></table></div>
Errors of <code>StaticForgeArchive</code> calls like <code>LoadAsset</code> stay stored until they are taken or cleared, so several failed loads can be reported together.</div>
  </section>
