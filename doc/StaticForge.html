<template id="tmpl-node_mu3td1kulgv50d577zxf">
  <div class="main" data-node-id="node_mu3td1kulgv50d577zxf" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1kulgv50d577zxf" class="export-section">
    
    <div class="export-section__body"><h1 id="h-node_mu3td1kulgv50d577zxf-build-process">Build Process</h1>
<p><code>StaticForgeBuilder::Build()</code> resets the data of a previous build, then runs the internal phases below in sequence. How the builder is used is described in <a class="doc-ref" href="#node_mu3td1kurklac1g47o2b" data-ref-node="node_mu3td1kurklac1g47o2b" title="Building Archives in Code">Building Archives in Code</a>.</p>
<div class="doc-toc doc-toc--outline doc-toc--numbered"><ul class="doc-toc__list"><li><a class="doc-toc__link" href="#h-node_mu3td1kulgv50d577zxf-1-checkcompressionsettings" data-toc-target="h-node_mu3td1kulgv50d577zxf-1-checkcompressionsettings"><span class="doc-toc__num">1</span><span class="doc-toc__text">1. CheckCompressionSettings</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kulgv50d577zxf-2-checkfilepaths" data-toc-target="h-node_mu3td1kulgv50d577zxf-2-checkfilepaths"><span class="doc-toc__num">2</span><span class="doc-toc__text">2. CheckFilepaths</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kulgv50d577zxf-3-scanfiles" data-toc-target="h-node_mu3td1kulgv50d577zxf-3-scanfiles"><span class="doc-toc__num">3</span><span class="doc-toc__text">3. ScanFiles</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kulgv50d577zxf-4-checkuptodate" data-toc-target="h-node_mu3td1kulgv50d577zxf-4-checkuptodate"><span class="doc-toc__num">4</span><span class="doc-toc__text">4. CheckUpToDate</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kulgv50d577zxf-5-createoutputdir" data-toc-target="h-node_mu3td1kulgv50d577zxf-5-createoutputdir"><span class="doc-toc__num">5</span><span class="doc-toc__text">5. CreateOutputDir</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kulgv50d577zxf-6-creategroups" data-toc-target="h-node_mu3td1kulgv50d577zxf-6-creategroups"><span class="doc-toc__num">6</span><span class="doc-toc__text">6. CreateGroups</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kulgv50d577zxf-7-commitarchives" data-toc-target="h-node_mu3td1kulgv50d577zxf-7-commitarchives"><span class="doc-toc__num">7</span><span class="doc-toc__text">7. CommitArchives</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kulgv50d577zxf-8-writecachefiles" data-toc-target="h-node_mu3td1kulgv50d577zxf-8-writecachefiles"><span class="doc-toc__num">8</span><span class="doc-toc__text">8. WriteCacheFiles</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kulgv50d577zxf-9-removeoldarchives" data-toc-target="h-node_mu3td1kulgv50d577zxf-9-removeoldarchives"><span class="doc-toc__num">9</span><span class="doc-toc__text">9. RemoveOldArchives</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kulgv50d577zxf-write-phases-summary" data-toc-target="h-node_mu3td1kulgv50d577zxf-write-phases-summary"><span class="doc-toc__num">10</span><span class="doc-toc__text">Write phases summary</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1kulgv50d577zxf-compression" data-toc-target="h-node_mu3td1kulgv50d577zxf-compression"><span class="doc-toc__num">11</span><span class="doc-toc__text">Compression</span></a><ul class="doc-toc__list"><li><a class="doc-toc__link" href="#h-node_mu3td1kulgv50d577zxf-compressor" data-toc-target="h-node_mu3td1kulgv50d577zxf-compressor"><span class="doc-toc__num">11.1</span><span class="doc-toc__text">Compressor</span></a></li></ul></li><li><a class="doc-toc__link" href="#h-node_mu3td1kulgv50d577zxf-overflow-safety" data-toc-target="h-node_mu3td1kulgv50d577zxf-overflow-safety"><span class="doc-toc__num">12</span><span class="doc-toc__text">Overflow safety</span></a></li></ul></div>
<h2 id="h-node_mu3td1kulgv50d577zxf-1-checkcompressionsettings">1. CheckCompressionSettings</h2>
<p>Validates the compression settings set on the builder (block size, table size, min match length, min saving) against the <code>MIN_COMPRESSION_*</code> / <code>MAX_COMPRESSION_*</code> ranges. Settings that are not set are skipped.</p>
<h2 id="h-node_mu3td1kulgv50d577zxf-2-checkfilepaths">2. CheckFilepaths</h2>
<p>Validates that:</p>
<ul><li>the default archive name is a valid file name (no <code>/</code> or <code>\</code>, not <code>.</code> or <code>..</code>)</li><li>the archive extension set with <code>SetArchiveExtension</code> is valid (see below)</li><li>at least one source path and an output path are set</li><li>all source paths exist and are directories</li><li>the output path, if it exists, is a directory</li></ul>
<p>A missing output directory is only an error if <code>SetCreateOutputDir(true)</code> was not called. The directory is created later in <code>CreateOutputDir</code>, so a build that fails while scanning leaves nothing behind.</p>
<p><code>SetArchiveExtension</code> adds a missing leading dot (<code>pak</code> becomes <code>.pak</code>) and stores the value, it is checked here. A valid extension:</p>
<ul><li>starts with <code>.</code> and has at least one more character</li><li>contains no <code>/</code>, <code>\</code>, <code>&lt; &gt; : &quot; | ? *</code> and no control characters</li><li>doesn't end with <code>.</code> or a space, because Windows removes them from file names</li></ul>
<h2 id="h-node_mu3td1kulgv50d577zxf-3-scanfiles">3. ScanFiles</h2>
<p>Each source directory is read <strong>once</strong> into a list of files. Read errors are reported as build errors. The list is sorted by the UTF-8 path, because every file system returns the files in a different order. Then two passes run over these lists:</p>
<p><strong>Pass 1 — Meta collection:</strong><br>Collects all files ending with <code>.sfpak.meta</code> and builds a <code>directory → StaticForgeMetaData</code> mapping. Each entry stores the archive name, the extension, excluded extensions, the <code>store-names</code> and <code>compress</code> flags and the optional compression settings. Archive names, extensions (normalized and checked like above) and compression settings are validated here.</p>
<p><strong>Pass 2 — File assignment:</strong><br>Iterates all non-meta files, computes their relative path (from the path itself, so a symbolic link to a file is stored under its own path with the content of its target), hashes it with 64-bit FNV-1a, and assigns each file to the appropriate <code>ArchiveGroup</code> by walking up the directory tree until a meta entry is found. Falls back to the default archive name if no meta file applies.</p>
<p>For each file the builder also:</p>
<ul><li>Skips files whose name ends with one of the excluded extensions (case insensitive).</li><li>Reports an error if the same relative path occurs more than once in the build, also if the files go into different archives (e.g. two <code>--source</code> folders that both contain <code>textures/hero.png</code>). It can't be decided which of the files is the right one.</li><li>Reports an error on hash collisions between different paths.</li><li>Applies the overrides when an archive group is created:<ul><li><code>store-names</code> and <code>compress</code>: if the global flag is set, it is forced on even when the meta file sets it to <code>false</code>.</li><li>extension and compression settings: builder value → meta file value → default (<code>PACK_FILE_EXTENSION</code> for the extension).</li></ul></li></ul>
<p>At the end the files of every archive group are sorted by their relative path (UTF-8 byte order), also when they come from several source paths. The same sources therefore always give the same archive, byte for byte, on every system.</p>
<p>Finally the file names of all archive groups (name + extension) are compared case insensitive. With own extensions two archives could get the same file, e.g. <code>a</code> + <code>.b.c</code> and <code>a.b</code> + <code>.c</code>, which is an error.</p>
<h2 id="h-node_mu3td1kulgv50d577zxf-4-checkuptodate">4. CheckUpToDate</h2>
<p>Only runs with a cache directory (<code>SetCacheDir</code>). For every archive group the cache file <code>&lt;cache dir&gt;/&lt;archive name&gt;.sfcache</code> is read and compared in this order, the first difference is the reason for the build:</p>
<ol><li><code>SetRebuild(true)</code> was called</li><li>the cache file is missing or can't be parsed, or has another cache version</li><li>the archive format version (<code>VERSION</code>) or the absolute output path is different</li><li>the extension is different (<code>archive extension changed (was &#39;.sfpak&#39;)</code>)</li><li>the settings are different</li><li>the archive file is missing, or its size or modification time is different</li><li>the file list is different (both lists are sorted by path)</li><li>the size of a file is different</li><li>the modification time of a file is different and the 64-bit FNV-1a hash of its content as well</li></ol>
<p>If only the modification time of a file changed, the archive is up to date and only its cache file is written again with the new time. Archives that are up to date are skipped by all following phases.</p>
<p>The archive file path is always name + extension, so a changed extension means a new file. If the cache file belongs to the same output directory and contains another (valid) extension, the old archive file is remembered and deleted in <code>RemoveOldArchives</code> after the new one was written. The same happens if the archive name only changed in case (<code>Audio</code> → <code>audio</code>): the old file is deleted if it is another file than the new one, which is only the case on case-sensitive file systems.</p>
<p>Cache files in the cache directory without an archive group of this build belong to archives that are not built anymore. If the cache file is valid and contains the same output directory, the archive (found with the extension stored in the cache file) and its cache file are deleted in <code>RemoveOldArchives</code> after the build. An extension in the cache file that is not valid is never used to build a path, so a damaged cache file can't point to another file.</p>
<p>The cache file is text:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>StaticForgeCache 2
format 3
output D:/dev/game/build/packed
extension .sfpak
settings store-names=1 compress=1 block-size=65536 table-size=16 min-match=8 min-saving=10 exclude=.psd
archive 41100 134364826999478632
files 3
20000 134364826980778712 af8f0deb8b372d7b textures/hero.png
9000 134364826981220378 87ddee1928e25947 textures/ui/button.png
23492 134364826981425961 499fa1f519db8fe5 textures/ui/theme.txt</code></pre><div class="code-language-tag code-language-tag--recognized">audio.sfcache</div></div>
<div class="table-wrapper"><table data-hover="row"><thead><tr><th width="170">Line</th><th>Content</th></tr></thead><tbody><tr><td><code>StaticForgeCache</code></td><td>version of the cache file format (<code>BUILD_CACHE_VERSION</code>, currently <code>2</code>)</td></tr><tr><td><code>format</code></td><td>archive format version</td></tr><tr><td><code>output</code></td><td>absolute output directory</td></tr><tr><td><code>extension</code></td><td>extension of the archive file, to find the file again if the extension changes or the archive is not built anymore</td></tr><tr><td><code>settings</code></td><td>settings of the archive that are used for the build</td></tr><tr><td><code>archive</code></td><td>size and modification time of the archive file</td></tr><tr><td><code>files</code></td><td>number of files, followed by one line per file: size, modification time, content hash (hex) and the relative path (rest of the line)</td></tr></tbody></table></div>
<p>Cache files of an older cache version (e.g. <code>1</code>, without <code>extension</code>) are invalid, so the first build after an update builds every archive once.</p>
<p>Modification times are the raw values of the file clock (<code>std::filesystem::file_time_type</code>), so a cache file is only valid on the system that wrote it. The content hash is calculated while the file is written into the archive, no extra read is needed.</p>
<h2 id="h-node_mu3td1kulgv50d577zxf-5-createoutputdir">5. CreateOutputDir</h2>
<p>Creates the output directory and its missing parents if <code>SetCreateOutputDir(true)</code> was called. The created directories are remembered, so they can be removed again if the build fails.</p>
<h2 id="h-node_mu3td1kulgv50d577zxf-6-creategroups">6. CreateGroups</h2>
<p>The archive groups are written in order of their name. For each <code>ArchiveGroup</code> the temporary file <code>&lt;output&gt;/&lt;archive name&gt;&lt;extension&gt;.tmp</code> (e.g. <code>main.sfpak.tmp</code>) is created and the following phases run in order:</p>
<p><strong>CalculateDataStart</strong> — computes the byte offset at which file data begins. This is the sum of the aligned header size and the index table size, rounded up to the next 4096-byte boundary.</p>
<p><strong>WriteData</strong> — writes <code>dataStart</code> bytes of zero-padding to reserve space for the header and index, then writes all file data blocks. During this pass, <code>blockOffset</code>, <code>filePadding</code>, <code>checksum</code>, and <code>compressedFileSize</code> are filled in on each file entry so the index can be written correctly afterwards.</p>
<p><strong>WriteHeader</strong> — seeks back to offset <code>0</code> and writes the <code>StaticForgeHeader</code> struct, padded to a multiple of 32 bytes.</p>
<p><strong>WriteIndex</strong> — writes one <code>StaticForgeIndexEntry</code> per file directly after the header. Checksums computed during <code>WriteData</code> are included here — no second seek is needed.</p>
<p><strong>BuildNameTable</strong> <em>(optional, when store-names is enabled)</em> — computes the byte layout of the Name Table Header, Name Table Entries, and String Data region, and compresses all names as one block. Offsets are appended after the last data block.</p>
<p><strong>WriteNameTable</strong> <em>(optional)</em> — seeks to <code>nameTableStart</code> (set at the end of <code>WriteData</code>) and writes the Name Table Header, Name Table Entries, and the compressed UTF-8 string data.</p>
<h2 id="h-node_mu3td1kulgv50d577zxf-7-commitarchives">7. CommitArchives</h2>
<p>When all archives are written, every temporary file is renamed to <code>&lt;archive name&gt;&lt;extension&gt;</code> and replaces the old archive.</p>
<h2 id="h-node_mu3td1kulgv50d577zxf-8-writecachefiles">8. WriteCacheFiles</h2>
<p>Only runs with a cache directory. Writes the cache files of the built archives and of the archives whose cache changed, each to a temporary file that is renamed when it is complete. The cache directory is created if it is missing.</p>
<h2 id="h-node_mu3td1kulgv50d577zxf-9-removeoldarchives">9. RemoveOldArchives</h2>
<p>Only runs with a cache directory. Deletes:</p>
<ul><li>the archives found by <code>CheckUpToDate</code> that are not built anymore, together with their cache files</li><li>the old archive files of archives whose extension changed or whose name only changed in case, if they are another file than the new archive</li><li>the old cache files of renamed archives, under the same condition</li></ul>
<p>If any phase from <code>CreateOutputDir</code> on fails, all temporary files are removed and the directories created by <code>CreateOutputDir</code> are removed again if they are empty. The old archives stay as they were, unless the error happens while renaming: the archives renamed until then are already replaced. The cache files of a failed build stay as they were, so the next build checks the archives again.</p>
<h2 id="h-node_mu3td1kulgv50d577zxf-write-phases-summary">Write phases summary</h2>
<div class="table-wrapper"><table data-striped="row" data-hover="row"><thead><tr><th>Phase</th><th>Seeks to</th><th>What it writes</th></tr></thead><tbody><tr><td><code>WriteData</code></td><td><code>0</code> (start)</td><td><code>dataStart</code> zero-padding, then all file data blocks in order</td></tr><tr><td><code>WriteHeader</code></td><td><code>0</code> (seekp back)</td><td><code>StaticForgeHeader</code> struct padded to a multiple of 32 bytes</td></tr><tr><td><code>WriteIndex</code></td><td>after header</td><td>One <code>StaticForgeIndexEntry</code> per file, including computed checksums</td></tr><tr><td><code>WriteNameTable</code></td><td><code>nameTableStart</code> (seekp forward)</td><td>Name Table Header, Name Table Entries, compressed UTF-8 string data</td></tr></tbody></table></div>
<h2 id="h-node_mu3td1kulgv50d577zxf-compression">Compression</h2>
<p>When compression is enabled for an archive group (via the meta file or the global <code>SetCompress</code> flag), files larger than 4096 bytes are compressed. Compression is applied per block during <code>WriteData</code>:</p>
<ul><li>The file is read in blocks of the compression block size (default 64 KB) and each block is compressed independently.</li><li>Each compressed block is prefixed with a framing header: <code>[uint32_t compressedSize][uint32_t originalSize]</code> (little-endian).</li><li>The raw compressed bytes follow immediately after the framing header.</li><li>A block that doesn't get at least <code>compress-min-saving</code> percent smaller (default 5 %) is stored raw instead. It is marked by <code>compressedSize == originalSize</code>; a compressed block never has this size, because it would not be small enough.</li><li>If the whole file (framing headers included) doesn't get at least <code>compress-min-saving</code> percent smaller, the builder seeks back to the start of the file in the archive and writes it again uncompressed (<code>compressedFileSize = 0</code>). Only files that don't compress well are read twice. Because the compressed attempt can be a few bytes longer, the archive is cut to its real size with <code>std::filesystem::resize_file</code> after writing.</li><li><code>compressedFileSize</code> in the index entry is set to the total number of bytes written for the file, <strong>including</strong> the framing headers. A value of <code>0</code> means the entry is stored uncompressed.</li></ul>
<p>The per-block approach means the decompressor can process one block at a time.</p>
<p>The FNV-1a checksum covers the framing headers and compressed block data as written, so integrity verification happens before decompression (see <a class="doc-ref" href="#node_mu3td1kucsyh3x1ldzws1" data-ref-node="node_mu3td1kucsyh3x1ldzws1" title="Hashing">Hashing</a>).</p>
<p>The name table string data uses the same rule: if it doesn't get small enough, it is stored raw and <code>stringDataCompressedSize == stringDataSize</code>.</p>
<h3 id="h-node_mu3td1kulgv50d577zxf-compressor">Compressor</h3>
<p>The compressor (<code>Internal::LZ4Compression</code>) is an LZ77 compressor inspired by LZ4, with its own simple format:</p>
<div class="table-wrapper"><table data-hover="row"><thead><tr><th>Block</th><th>Layout</th><th>Meaning</th></tr></thead><tbody><tr><td>literal</td><td><code>[0x01][len:u16][len bytes]</code></td><td>Bytes stored as they are</td></tr><tr><td>match</td><td><code>[0x02][distance:u16][len:u16]</code></td><td>Copy <code>len</code> bytes from <code>distance</code> bytes back</td></tr><tr><td>end</td><td><code>[0x00]</code></td><td>End of the compressed block</td></tr></tbody></table></div>
<p>For every position the compressor looks up the last position of the same 4-byte sequence in a hash table (<code>compress-table-size</code>). A match is extended as far as possible and only stored if it is at least <code>compress-min-match</code> bytes long — shorter matches would take more space than storing the bytes as literals. A match can only reference data inside the same block and at most 65535 bytes back.</p>
<p>The hash table is only allocated when compressing and is reset per block with a generation counter instead of clearing the whole table.</p>
<h2 id="h-node_mu3td1kulgv50d577zxf-overflow-safety">Overflow safety</h2>
<p>All size and offset arithmetic uses checked helpers that return <code>false</code> on overflow instead of wrapping silently:</p>
<div class="table-wrapper"><table data-hover="row"><thead><tr><th>Helper</th><th>Description</th></tr></thead><tbody><tr><td><code>SafeAddU64</code></td><td>Addition with overflow check</td></tr><tr><td><code>SafeMulU64</code></td><td>Multiplication with overflow check</td></tr><tr><td><code>SafeAlignSize</code></td><td>Rounds up to a power-of-two alignment, overflow-safe</td></tr><tr><td><code>GetHeaderSize</code></td><td>Returns the aligned header size via <code>SafeAlignSize</code></td></tr></tbody></table></div>
<p>Any overflow causes <code>Build()</code> to return <code>false</code> with a descriptive error.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1ku1hsv9km18cfhyf">
  <div class="main" data-node-id="node_mu3td1ku1hsv9km18cfhyf" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1ku1hsv9km18cfhyf" class="export-section">
    
    <div class="export-section__body"><h1 id="h-node_mu3td1ku1hsv9km18cfhyf-meta-file-parser">Meta File Parser</h1>
<p>Meta files use a minimal custom format parsed by <code>StaticForgeMeta</code> inside <code>StaticForgeCore</code>. How meta files are used is described in <a class="doc-ref" href="#node_mu3td1ku1d4g35y4wv21q" data-ref-node="node_mu3td1ku1d4g35y4wv21q" title="Meta Files">Meta Files</a>.</p>
<h2 id="h-node_mu3td1ku1hsv9km18cfhyf-syntax">Syntax</h2>
<p>Each statement is a key-value pair terminated by a semicolon:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>key = value;</code></pre><div class="code-language-tag code-language-tag--recognized">sfpak.meta</div></div>
<p>Multiple statements can appear in any order:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>archive = main;
extension = pak;
exclude = .png, .jpg, .vert, .help;
store-names = true;</code></pre><div class="code-language-tag code-language-tag--recognized">sfpak.meta</div></div>
<p>Comments start with <code>#</code> and run to the end of the line:</p>
<div class="code-block-wrapper code-tab-4"><pre><code># this is a comment
archive = main; # this is also a comment</code></pre><div class="code-language-tag code-language-tag--recognized">sfpak.meta</div></div>
<h2 id="h-node_mu3td1ku1hsv9km18cfhyf-tokenizer">Tokenizer</h2>
<p><code>MetaTokenizer</code> reads the entire file into memory (skipping a UTF-8 BOM), then walks it character by character via <code>ProcessContent</code> → <code>ProcessChar</code>. It tracks the current line and column for error reporting and produces a flat <code>std::vector&lt;MetaToken&gt;</code>. Columns count characters, not bytes, so multi-byte UTF-8 characters count as one column.</p>
<p><strong>Character dispatch (<code>ProcessChar</code>):</strong></p>
<div class="table-wrapper"><table data-hover="row"><thead><tr><th>Input</th><th>Action</th></tr></thead><tbody><tr><td>Whitespace (<code>\r</code>, <code>\n</code>, <code> </code>, <code>\t</code>)</td><td>Skipped; newlines increment the line counter</td></tr><tr><td><code>=</code></td><td>Emit <code>Assign</code></td></tr><tr><td><code>,</code></td><td>Emit <code>Separator</code></td></tr><tr><td><code>;</code></td><td>Emit <code>Delimiter</code></td></tr><tr><td><code>#</code></td><td>Call <code>SkipComment</code> — consume until <code>\n</code></td></tr><tr><td>Letter, digit, <code>_</code>, <code>.</code>, <code>-</code>, UTF-8 byte</td><td>Call <code>ReadIdentifier</code></td></tr><tr><td>Anything else</td><td>Add error, emit <code>UNKNOWN</code></td></tr></tbody></table></div>
<p><strong><code>ReadIdentifier</code>:</strong> records the start pointer, then advances <code>m_cur</code> while the character is an identifier character (<code>IsIdentifierChar</code>: alphanumeric, <code>_</code>, <code>.</code>, <code>-</code> or a byte ≥ <code>0x80</code>, which is part of a UTF-8 character). The resulting <code>string_view</code> into the in-memory buffer is stored in the token without any heap allocation.</p>
<p><strong>Token types:</strong></p>
<div class="table-wrapper"><table data-hover="row"><thead><tr><th>Token type</th><th>Description</th></tr></thead><tbody><tr><td><code>Identifier</code></td><td>An unquoted word — keys, values, extensions, booleans, numbers</td></tr><tr><td><code>Assign</code></td><td>The <code>=</code> character</td></tr><tr><td><code>Separator</code></td><td>The <code>,</code> character (used between list values like extensions)</td></tr><tr><td><code>Delimiter</code></td><td>The <code>;</code> character — terminates a statement</td></tr><tr><td><code>EndOfFile</code></td><td>Sentinel appended after the last character</td></tr><tr><td><code>UNKNOWN</code></td><td>Unrecognised character; always accompanied by an error</td></tr></tbody></table></div>
<p>Every token stores its <strong>line</strong> and <strong>column</strong> at the point it was emitted.</p>
<h2 id="h-node_mu3td1ku1hsv9km18cfhyf-parser">Parser</h2>
<p><code>StaticForgeMeta::ParseTokens</code> consumes the token stream produced by <code>MetaTokenizer</code>. Each statement follows this pattern:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>Identifier(key)  Assign  Identifier(value)  Delimiter</code></pre><div class="code-language-tag code-language-tag--recognized">Tokens</div></div>
<p>For list values (e.g. <code>exclude</code>) the value section is instead:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>Identifier  Separator  Identifier  Separator  ...  Identifier  Delimiter</code></pre><div class="code-language-tag code-language-tag--recognized">Tokens</div></div>
<p>Any deviation — wrong token type, unexpected <code>EndOfFile</code>, missing <code>Delimiter</code> — is a parse error. Errors include the line and column of the offending token, also a missing or invalid value:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>Missing value for &#39;compress&#39; at line: 2, column: 1
Failed to parse value &#39;5&#39; of &#39;compress&#39; at line: 2, column: 1</code></pre><div class="code-language-tag code-language-tag--recognized">Error</div></div>
<h2 id="h-node_mu3td1ku1hsv9km18cfhyf-error-suggestions">Error suggestions</h2>
<p>If a key is not recognised, the parser compares it with every known key. Separators (<code>-</code>, <code>_</code>, space) and case are ignored, and the names are compared character by character. If the lengths differ by at most 3 and at most 3 characters are different, a suggestion is appended to the error:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>Unknown identifier &#39;archiv&#39; at line: 1, column: 1. Did you mean &#39;archive&#39;?</code></pre><div class="code-language-tag code-language-tag--recognized">Error</div></div>
<h2 id="h-node_mu3td1ku1hsv9km18cfhyf-supported-parameters">Supported parameters</h2>
<div class="table-wrapper"><table data-striped="row" data-hover="row"><thead><tr><th width="205">Key</th><th>Type</th><th>Required</th><th>Description</th></tr></thead><tbody><tr><td><code>archive</code></td><td>string</td><td>yes</td><td>Name of the archive</td></tr><tr><td><code>extension</code></td><td>string</td><td>no</td><td>File extension of the archive (default <code>.sfpak</code>)</td></tr><tr><td><code>exclude</code></td><td>string[]</td><td>no</td><td>Comma-separated list of file extensions to skip</td></tr><tr><td><code>store-names</code></td><td>bool</td><td>no</td><td>Store original filenames in the archive for debug inspection and extraction</td></tr><tr><td><code>compress</code></td><td>bool</td><td>no</td><td>Compress files larger than 4096 bytes</td></tr><tr><td><code>compress-block-size</code></td><td>uint</td><td>no</td><td>Compression block size in bytes</td></tr><tr><td><code>compress-table-size</code></td><td>uint</td><td>no</td><td>Compressor match table size as power of two</td></tr><tr><td><code>compress-min-match</code></td><td>uint</td><td>no</td><td>Shortest match the compressor stores as reference</td></tr><tr><td><code>compress-min-saving</code></td><td>uint</td><td>no</td><td>Percent a block or file must get smaller to be stored compressed</td></tr></tbody></table></div>
<h2 id="h-node_mu3td1ku1hsv9km18cfhyf-value-parsing">Value parsing</h2>
<p><strong><code>archive</code></strong> — the <code>Identifier</code> token value is used as-is. The builder rejects names containing <code>/</code> or <code>\</code> and the names <code>.</code> and <code>..</code>.</p>
<p><strong><code>extension</code></strong> — the <code>Identifier</code> token value is stored as-is in <code>StaticForgeMetaData::archiveExtension</code>, an empty string means not set (a meta value can never be empty). The builder adds a missing leading dot and rejects extensions that end with <code>.</code>, see <a class="doc-ref" href="#node_mu3td1kulgv50d577zxf" data-ref-node="node_mu3td1kulgv50d577zxf" title="Build Process">Build Process</a>. The other invalid characters (<code>/</code>, <code>\</code>, <code>:</code>, ...) can't appear, because the tokenizer doesn't accept them in an identifier.</p>
<p><strong><code>exclude</code></strong> — after the <code>=</code>, the parser collects <code>Identifier</code> tokens separated by <code>Separator</code> (<code>,</code>) tokens until it sees a <code>Delimiter</code> (<code>;</code>). Each value is lowercased and a missing leading dot is added, so <code>.PNG</code>, <code>.png</code> and <code>png</code> are treated identically.</p>
<p><strong><code>store-names</code>, <code>compress</code></strong> — the single <code>Identifier</code> token after <code>=</code> is compared case-insensitively. Only <code>true</code> and <code>false</code> are valid, anything else is a parse error.</p>
<p><strong><code>compress-block-size</code>, <code>compress-table-size</code>, <code>compress-min-match</code>, <code>compress-min-saving</code></strong> — parsed with <code>std::from_chars</code> as an unsigned decimal number. The whole value has to be a number (<code>64k</code> or <code>-5</code> are errors). The builder checks the value against the valid range.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1ku1t629jd11ytz7k">
  <div class="main" data-node-id="node_mu3td1ku1t629jd11ytz7k" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1ku1t629jd11ytz7k" class="export-section">
    
    <div class="export-section__body"><h1 id="h-node_mu3td1ku1t629jd11ytz7k-staticforgearchive">StaticForgeArchive</h1>
<p><code>StaticForgeArchive</code> is the runtime handle for a loaded archive file. It is populated by <code>StaticForgeReader::Load</code> and then used to retrieve asset data. The usage is described in <a class="doc-ref" href="#node_mu3td1kuzgocka16m5db0" data-ref-node="node_mu3td1kuzgocka16m5db0" title="Loading Assets at Runtime">Loading Assets at Runtime</a>.</p>
<div class="doc-toc doc-toc--outline doc-toc--numbered"><ul class="doc-toc__list"><li><a class="doc-toc__link" href="#h-node_mu3td1ku1t629jd11ytz7k-ownership-move-and-clone" data-toc-target="h-node_mu3td1ku1t629jd11ytz7k-ownership-move-and-clone"><span class="doc-toc__num">1</span><span class="doc-toc__text">Ownership, move and Clone</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku1t629jd11ytz7k-internal-state" data-toc-target="h-node_mu3td1ku1t629jd11ytz7k-internal-state"><span class="doc-toc__num">2</span><span class="doc-toc__text">Internal state</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku1t629jd11ytz7k-loadasset-flow" data-toc-target="h-node_mu3td1ku1t629jd11ytz7k-loadasset-flow"><span class="doc-toc__num">3</span><span class="doc-toc__text">LoadAsset flow</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku1t629jd11ytz7k-loadassetrange-flow" data-toc-target="h-node_mu3td1ku1t629jd11ytz7k-loadassetrange-flow"><span class="doc-toc__num">4</span><span class="doc-toc__text">LoadAssetRange flow</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku1t629jd11ytz7k-loadassetmapped-getassetmapped-flow" data-toc-target="h-node_mu3td1ku1t629jd11ytz7k-loadassetmapped-getassetmapped-flow"><span class="doc-toc__num">5</span><span class="doc-toc__text">LoadAssetMapped / GetAssetMapped flow</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku1t629jd11ytz7k-access-method-comparison" data-toc-target="h-node_mu3td1ku1t629jd11ytz7k-access-method-comparison"><span class="doc-toc__num">6</span><span class="doc-toc__text">Access method comparison</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku1t629jd11ytz7k-accessor-methods" data-toc-target="h-node_mu3td1ku1t629jd11ytz7k-accessor-methods"><span class="doc-toc__num">7</span><span class="doc-toc__text">Accessor methods</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku1t629jd11ytz7k-verifyall" data-toc-target="h-node_mu3td1ku1t629jd11ytz7k-verifyall"><span class="doc-toc__num">8</span><span class="doc-toc__text">VerifyAll</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku1t629jd11ytz7k-managing-the-file-stream" data-toc-target="h-node_mu3td1ku1t629jd11ytz7k-managing-the-file-stream"><span class="doc-toc__num">9</span><span class="doc-toc__text">Managing the file stream</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku1t629jd11ytz7k-managing-memory-mapping" data-toc-target="h-node_mu3td1ku1t629jd11ytz7k-managing-memory-mapping"><span class="doc-toc__num">10</span><span class="doc-toc__text">Managing memory mapping</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku1t629jd11ytz7k-error-handling" data-toc-target="h-node_mu3td1ku1t629jd11ytz7k-error-handling"><span class="doc-toc__num">11</span><span class="doc-toc__text">Error handling</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku1t629jd11ytz7k-staticforgeconcurrentarchive" data-toc-target="h-node_mu3td1ku1t629jd11ytz7k-staticforgeconcurrentarchive"><span class="doc-toc__num">12</span><span class="doc-toc__text">StaticForgeConcurrentArchive</span></a><ul class="doc-toc__list"><li><a class="doc-toc__link" href="#h-node_mu3td1ku1t629jd11ytz7k-stream-pool" data-toc-target="h-node_mu3td1ku1t629jd11ytz7k-stream-pool"><span class="doc-toc__num">12.1</span><span class="doc-toc__text">Stream pool</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku1t629jd11ytz7k-errors" data-toc-target="h-node_mu3td1ku1t629jd11ytz7k-errors"><span class="doc-toc__num">12.2</span><span class="doc-toc__text">Errors</span></a></li></ul></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku1t629jd11ytz7k-archive-sets" data-toc-target="h-node_mu3td1ku1t629jd11ytz7k-archive-sets"><span class="doc-toc__num">13</span><span class="doc-toc__text">Archive sets</span></a></li></ul></div>
<h2 id="h-node_mu3td1ku1t629jd11ytz7k-ownership-move-and-clone">Ownership, move and Clone</h2>
<p><code>StaticForgeArchive</code> can be moved but not copied, so a copy doesn't open another file handle by accident. Use <code>Clone()</code> for a second archive object:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">a</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">b</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">move</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">a</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// OK</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">c</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">a</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">            </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// compile error</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">d</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">b</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Clone</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// OK, shares the loaded data</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>An archive object can be loaded again with <code>StaticForgeReader::Load</code>. The reader calls the private <code>Reset()</code> first, which closes the stream and releases the mapping, the loaded data and the errors of the previous archive. Clones keep the old data.</p>
<h2 id="h-node_mu3td1ku1t629jd11ytz7k-internal-state">Internal state</h2>
<div class="table-wrapper"><table data-hover="row"><thead><tr><th>Member</th><th>Description</th></tr></thead><tbody><tr><td><code>m_data</code></td><td><code>std::shared_ptr&lt;const Internal::ArchiveData&gt;</code>, the loaded data, shared with clones</td></tr><tr><td><code>m_mmap</code></td><td><code>std::shared_ptr&lt;Internal::MmapFile&gt;</code>, the memory mapping, shared with clones</td></tr><tr><td><code>m_stream</code></td><td><code>std::ifstream</code> used for stream-based reads, every archive object has its own</td></tr></tbody></table></div>
<p><code>Internal::ArchiveData</code> (in <code>Internal/ArchiveCore.h</code>) holds everything the reader loads:</p>
<div class="table-wrapper"><table data-hover="row"><thead><tr><th>Field</th><th>Description</th></tr></thead><tbody><tr><td><code>path</code></td><td>Path to the archive file on disk (any extension)</td></tr><tr><td><code>header</code></td><td>Parsed <code>StaticForgeHeader</code> struct</td></tr><tr><td><code>indexEntries</code></td><td><code>std::vector&lt;StaticForgeIndexEntry&gt;</code> — one per file</td></tr><tr><td><code>hashNameToEntry</code></td><td><code>std::unordered_map&lt;uint64_t, size_t&gt;</code> for O(1) lookup</td></tr><tr><td><code>indexToName</code></td><td><code>std::unordered_map&lt;size_t, std::string&gt;</code> for reverse name lookup</td></tr></tbody></table></div>
<p>The data is never changed after loading, so it can be shared between archive objects and threads without locking. If nothing is loaded <code>m_data</code> is <code>nullptr</code> and the getters use empty data.</p>
<p><code>Clone()</code> copies both <code>shared_ptr</code>s. The clone gets its own stream (opened on the first load) and its own errors. <code>CloseMapped()</code> only releases the archive's own reference to the mapping, it is unmapped when the last archive releases it. <code>OpenMapped()</code> on an archive that isn't mapped creates a new mapping.</p>
<p>The loading logic (<code>LoadEntry</code>, <code>LoadEntryRange</code>, <code>DecompressBlocks</code>, <code>VerifyEntry</code>) lives in <code>Internal/ArchiveCore</code> as free functions. They get the data, the entry and an <code>EntrySource</code> (the stream or the mapping), so they can be used by other archive types too. The decompressor is shared, its <code>DecompressTo</code> doesn't change the object and reports errors through a parameter.</p>
<h2 id="h-node_mu3td1ku1t629jd11ytz7k-loadasset-flow">LoadAsset flow</h2>
<ol><li>Normalize the slashes of the key and hash it with <code>HashFilename</code> (64-bit FNV-1a).</li><li>Look up the hash in <code>hashNameToEntry</code> to find the index position.</li><li>Call <code>LoadEntry</code>, which is shared by all full loads (vector or buffer, stream or mapped):</li></ol>
<ul><li>Clear the stream state, so a previous failed read does not break this one.</li><li>If <code>compressedFileSize == 0</code> (uncompressed): read <code>fileSize</code> bytes at <code>dataOffset + fileOffset</code> directly into the target and validate the FNV-1a checksum (see <a class="doc-ref" href="#node_mu3td1kucsyh3x1ldzws1" data-ref-node="node_mu3td1kucsyh3x1ldzws1" title="Hashing">Hashing</a>).</li><li>If <code>compressedFileSize != 0</code> (compressed): read <code>compressedFileSize</code> bytes, validate the checksum, then decompress block by block (<code>DecompressBlocks</code>). Each block is prefixed with <code>[uint32_t compressedSize][uint32_t originalSize]</code> and decompressed independently, directly into the target. A block with <code>compressedSize == originalSize</code> is stored raw and only copied.</li></ul>
<ol><li value="4">With a vector, the block sizes are checked before the vector is resized to <code>fileSize</code>, so a damaged size in the index can't cause a huge allocation. The vector is only changed on success.</li></ol>
<p><code>LoadAssetAt(index, ...)</code> skips steps 1 and 2 and loads the entry at the given index directly.</p>
<p>The buffer variants (<code>LoadAsset(key, buffer, bufferSize)</code>, ...) fail with an error if <code>bufferSize</code> is smaller than <code>fileSize</code>. Only <code>fileSize</code> bytes are written.</p>
<h2 id="h-node_mu3td1ku1t629jd11ytz7k-loadassetrange-flow">LoadAssetRange flow</h2>
<p><code>LoadEntryRange</code> checks that <code>[offset, offset + size)</code> is inside of <code>fileSize</code> (overflow safe). The checksum is <strong>not</strong> validated, because it covers the whole stored data.</p>
<ul><li>Uncompressed: read <code>size</code> bytes at <code>dataOffset + fileOffset + offset</code>.</li><li>Compressed: <code>DecompressBlocks</code> walks the block frames. Blocks before the range are skipped by reading only their 8 byte frame. Blocks completely inside of the range are decompressed directly into the buffer; the first and last block, if only partly inside, are decompressed into a temporary block buffer and the needed part is copied. The walk stops after the last block of the range.</li></ul>
<p>Reading a range near the end of a large compressed asset reads one frame per block before it, which is small compared to decompressing them.</p>
<h2 id="h-node_mu3td1ku1t629jd11ytz7k-loadassetmapped-getassetmapped-flow">LoadAssetMapped / GetAssetMapped flow</h2>
<ol><li>Verify the archive is memory-mapped (<code>IsMapped()</code>).</li><li>Hash the key and look up the index entry.</li><li>Get the pointer with <code>MmapFile::At(offset, size)</code>, which returns <code>nullptr</code> if the range <code>[dataOffset + fileOffset, storedSize]</code> is not inside the mapped file. An empty range at the end of the file is valid.</li><li><code>GetAssetMapped</code> returns a non-owning <code>AssetView</code> pointing directly into mapped memory — no copy. Compressed entries are rejected, because their original data is not in memory.</li></ol>
<p><code>LoadAssetMapped</code> uses the same <code>LoadEntry</code> as the stream version, only the stored bytes come from the mapping instead of the stream. It validates the checksum, then copies the bytes or decompresses them directly from the mapping into the target.</p>
<p><code>LoadAssetRangeMapped</code> works like <code>LoadAssetRange</code>, the block frames are read directly from the mapping.</p>
<blockquote>The <code>AssetView</code> is only valid while the archive remains mapped. Call <code>CloseMapped</code> only after you are done with all views.</blockquote>
<p><code>OpenMapped</code> works with relative and absolute paths. On Windows the path is made absolute and prefixed with <code>\\?\</code>, so long paths work too.</p>
<h2 id="h-node_mu3td1ku1t629jd11ytz7k-access-method-comparison">Access method comparison</h2>

<p><code>Contains</code> and <code>GetAssetSize</code> only use the index in memory, they don't read the file and don't add errors.</p>
<h2 id="h-node_mu3td1ku1t629jd11ytz7k-verifyall">VerifyAll</h2>
<p><code>VerifyAll</code> opens the file stream if needed and, for every index entry, reads the stored bytes (<code>compressedFileSize</code> for compressed entries, otherwise <code>fileSize</code>) in 1 MB chunks while computing the FNV-1a checksum. A mismatch or missing data adds one error per asset (<code>Asset &#39;&lt;name&gt;&#39; is damaged (...)</code>, or the hash if no names are stored). All entries are checked, the function returns <code>false</code> if any of them is damaged. Nothing is decompressed.</p>

<h2 id="h-node_mu3td1ku1t629jd11ytz7k-staticforgeconcurrentarchive">StaticForgeConcurrentArchive</h2>
<p><code>StaticForgeConcurrentArchive</code> uses the same <code>ArchiveData</code> and the same loading functions of <code>Internal/ArchiveCore</code>, only the stream handling and the errors are different. It doesn't derive from <code>ErrorSupport</code>.</p>
<div class="table-wrapper"><table data-hover="row"><thead><tr><th>Member</th><th>Description</th></tr></thead><tbody><tr><td><code>m_data</code></td><td><code>std::shared_ptr&lt;const Internal::ArchiveData&gt;</code>, shared with clones</td></tr><tr><td><code>m_mmap</code></td><td><code>std::shared_ptr&lt;Internal::MmapFile&gt;</code>, shared with clones</td></tr><tr><td><code>m_state</code></td><td><code>std::unique_ptr&lt;State&gt;</code> with the stream pool and the errors (defined in the <code>.cpp</code>)</td></tr></tbody></table></div>
<p><code>State</code> is behind a pointer, because a <code>std::mutex</code> can't be moved. The move constructor gives the moved-from object a new empty <code>State</code>, so it stays usable as an empty archive.</p>
<h3 id="h-node_mu3td1ku1t629jd11ytz7k-stream-pool">Stream pool</h3>
<ul><li><code>freeStreams</code>: open streams that are not used, protected by <code>poolMutex</code>.</li><li><code>poolSize</code>, <code>activeCount</code>, <code>openCount</code>: <code>std::atomic</code>, so the getters can read them without the lock. They are only changed while the lock is held.</li><li><strong>Acquire:</strong> waits on <code>poolCondition</code> until a free stream exists or <code>openCount &lt; poolSize</code>. A free stream is taken, otherwise a new one is opened (outside of the lock).</li><li><strong>Release:</strong> gives the stream back and wakes up one waiting load. If the pool got smaller in the meantime (<code>openCount &gt; poolSize</code>), the stream is closed instead.</li><li>A <code>Lease</code> object gives the stream back in its destructor, so it isn't lost if loading throws.</li><li><code>SetPoolSize</code> closes the free streams above the new size and wakes up all waiting loads, so it can be called while loading.</li><li><code>StaticForgeReader::Load</code> puts the stream it used for reading into the pool as the first free stream.</li></ul>
<p>Mapped loads use <code>m_mmap</code> directly and don't touch the pool. <code>m_mmap</code> itself is not protected, so <code>OpenMapped</code>/<code>CloseMapped</code> must not run while other threads load.</p>
<h3 id="h-node_mu3td1ku1t629jd11ytz7k-errors">Errors</h3>
<p>Every function takes an optional <code>std::string* errorOut</code>. <code>Report()</code> writes the error there, or adds it to the list of the calling thread in <code>Internal::ThreadErrors</code> (<code>Internal/ThreadErrors.h</code>): a <code>std::unordered_map&lt;std::thread::id, ...&gt;</code> protected by a mutex. Each thread gets a number when it reports its first error. The number is kept when its errors are cleared, so the same thread keeps the same number. The format of a thread's list is the same as <code>ErrorSupport</code>: one message per line. <code>GetAllErrors()</code> sorts the threads by number and prefixes every line with <code>[Thread &lt;n&gt;] </code>.</p>
<h2 id="h-node_mu3td1ku1t629jd11ytz7k-archive-sets">Archive sets</h2>
<p><code>StaticForgeArchiveSet</code> and <code>StaticForgeConcurrentArchiveSet</code> share <code>Internal::ArchiveSetIndex&lt;Archive&gt;</code> (<code>Internal/ArchiveSetIndex.h</code>):</p>
<ul><li>A list of slots: the archive pointer and the <code>shared_ptr</code> to the <code>ArchiveData</code> the archive had when it was added.</li><li>A lookup <code>asset hash -&gt; (slot, entry index)</code>, so finding an asset stays O(1) for any number of archives.</li><li><code>Add</code> checks all hashes of the new archive against the lookup before anything is added. A hash that already exists means the same path (or a hash collision) in two archives and is an error.</li><li><code>Remove</code> rebuilds the lookup, because the slot indices change.</li></ul>
<p>The sets are friends of their archive class and call the private <code>LoadEntry</code>/<code>LoadEntryRange</code>/<code>VerifyAllInto</code> with an error string, so errors end up in the set and not in the archive. Before each load the set compares the archive's current <code>m_data</code> with the stored one. If the archive was loaded again in the meantime, the stored entry belongs to the old file and an error is reported instead.</p>
<p>The sets only keep pointers and never touch the archives in their destructor. <code>StaticForgeArchiveSet</code> derives from <code>ErrorSupport</code>, <code>StaticForgeConcurrentArchiveSet</code> uses <code>Internal::ThreadErrors</code> like the concurrent archive. Its lookup is only read while loading, so loads need no lock; <code>Add</code>, <code>Remove</code> and <code>Clear</code> change it and must not run at the same time.</p>
<section class="doc-footnotes"><ol class="doc-footnotes__list"><li id="fn-node_mu3td1ku1t629jd11ytz7k-temp-buffer">No allocation for uncompressed assets. For compressed assets a temporary buffer for the stored data (full load) or for one block (range) is used.<a class="doc-footnotes__back" href="#fn-node_mu3td1ku1t629jd11ytz7k-temp-buffer-ref" data-toc-target="fn-node_mu3td1ku1t629jd11ytz7k-temp-buffer-ref" aria-label="Back to the text">↩</a></li><li id="fn-node_mu3td1ku1t629jd11ytz7k-range-block">For compressed assets a temporary buffer for a block that is only partly inside of the range.<a class="doc-footnotes__back" href="#fn-node_mu3td1ku1t629jd11ytz7k-range-block-ref" data-toc-target="fn-node_mu3td1ku1t629jd11ytz7k-range-block-ref" aria-label="Back to the text">↩</a></li></ol></section></div>

    <section id="node_mu3td1ku72xkz714tsyqd" class="export-section">
    
    <div class="export-section__body"><h1 id="h-node_mu3td1ku72xkz714tsyqd-errorsupport">ErrorSupport</h1>
<p><code>ErrorSupport</code> is the base class for <code>StaticForgeBuilder</code>, <code>StaticForgeReader</code>, <code>StaticForgeArchive</code> and <code>StaticForgeArchiveSet</code>, and internally for <code>StaticForgeMeta</code> and <code>MetaTokenizer</code>. It provides a simple error collection system.</p>
<p>The concurrent classes (<code>StaticForgeConcurrentArchive</code>, <code>StaticForgeConcurrentArchiveSet</code>) don't derive from it, they collect the errors per thread (see <a class="doc-ref" href="#node_mu3td1ku1t629jd11ytz7k" data-ref-node="node_mu3td1ku1t629jd11ytz7k" title="StaticForgeArchive">StaticForgeArchive</a>).</p>
<h2 id="h-node_mu3td1ku72xkz714tsyqd-api">API</h2>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">bool</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">IsValid</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">const</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">            </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// true if no errors are stored</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">string</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">const</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// returns all stored errors as a single string</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">string</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">         </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// returns all stored errors and clears them</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">void</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">ClearErrors</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">              </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// clears all stored errors</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<h2 id="h-node_mu3td1ku72xkz714tsyqd-format">Format</h2>
<p><code>GetError()</code> returns one message per line:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>Failed to load asset, entry with key &#39;missing1&#39; not found
Failed to load asset, entry with key &#39;missing2&#39; not found</code></pre><div class="code-language-tag code-language-tag--recognized">Error</div></div>
<p>Formatting is left to the application. The CLI tool, for example, prints a single error as <code>[Error] &lt;message&gt;</code> and several errors as a list. Paths in messages always use <code>/</code> as separator.</p>
<h2 id="h-node_mu3td1ku72xkz714tsyqd-error-accumulation">Error accumulation</h2>
<p>Errors are accumulated in insertion order.</p>
<p>Each call to <code>AddError()</code> appends a new entry to the internal error list. <code>GetError()</code> combines all stored messages into a single newline-separated string.</p>
<h2 id="h-node_mu3td1ku72xkz714tsyqd-when-errors-are-cleared">When errors are cleared</h2>
<p>Errors are only cleared when they no longer apply:</p>
<div class="table-wrapper"><table data-hover="row"><thead><tr><th>Event</th><th>Cleared errors</th></tr></thead><tbody><tr><td><code>StaticForgeBuilder::Build()</code></td><td>errors of the builder (previous build)</td></tr><tr><td><code>StaticForgeReader::Load()</code></td><td>errors of the reader and of the target archive</td></tr><tr><td><code>StaticForgeMeta::Load()</code></td><td>errors of the meta parser</td></tr><tr><td><code>TakeError()</code> / <code>ClearErrors()</code></td><td>all errors of the object</td></tr></tbody></table></div>
<p>Errors of <code>StaticForgeArchive</code> calls like <code>LoadAsset</code> stay stored until they are taken or cleared, so several failed loads can be reported together.</p></div>

var searchIndex = [{"nodeId":"node_mu3td1kuufx8v3a1hzju","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Getting Started","headings":["Getting Started","What you get","Typical workflow"],"content":"StaticForge is an asset archive system for bundling and loading game files. It combines multiple files into a compact archive file that can be efficiently read at runtime. Archives use the extension `.sfpak` by default, any other extension can be set when packing (see Packing Assets). - A command-line tool (`StaticForgeTool`) to pack your assets during your build process, and to inspect or extract existing archives - A C++ library (`StaticForgeCore`) to load assets from archives at runtime 1. Organize your asset folders 2. Optionally add `.sfpak.meta` files to control how folders are grouped into archives (see Meta Files) 3. Run `StaticForgeTool` to pack your assets into one or more archives (see Packing Assets) 4. At runtime, use `StaticForgeReader` and `StaticForgeArchive` to load assets by path (see Loading Assets at Runtime) ```bash StaticForgeTool --source ./assets --output ./build --mkdir ``` ```cpp #include <StaticForgeCore/StaticForge.h StaticForge::StaticForgeReader reader; StaticForge::StaticForgeArchive archive; if (reader.Load(\"./build/main.sfpak\", &archive)) { std::vector<std::byte data; if (!archive.LoadAsset(\"textures/background.png\", &data)) { std::cerr << archive.TakeError() << std::endl; } } ``` --- Tip: Archives are binary and not meant to be edited manually. Always rebuild them from source assets using the tool. Note: The archive format is not meant for long-term storage. Archives are rebuilt together with your application, so the reader only accepts archives of its own format version (currently `3`)."},{"nodeId":"node_mu3td1ku93dq7vjxmvr2","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Packing Assets","headings":["Packing Assets","Basic usage","Specifying an archive name","Archive extension","Multiple source folders","Output directory","Compression","Incremental builds","Bool arguments","Verbose output","Unicode"],"content":"Use `StaticForgeTool` to pack a folder of assets into an archive. [toc] ```bash StaticForgeTool --source ./assets --output ./build ``` This scans `./assets` recursively and writes the archive to `./build/main.sfpak`. By default the archive is named `main`. Use `--name` to override: ```bash StaticForgeTool --source ./assets --output ./build --name textures ``` This produces `./build/textures.sfpak`. The name may contain dots (`textures.hd` produces `textures.hd.sfpak`) and non-ASCII characters, but no `/` or ``. Archives get the extension `.sfpak` by default. Use `--extension` (or `--ext`) to give all archives another extension, the leading dot is optional: ```bash StaticForgeTool --source ./assets --output ./build --extension pak ``` This produces `./build/main.pak`. A single archive can also get its own extension in its meta file (`extension = pak;`, see Meta Files). The value of the command line wins over the meta file, without both `.sfpak` is used. - The extension is appended to the archive name, also if the name contains dots: `textures.hd` with `pak` produces `textures.hd.pak`. - Multi-part extensions work (`.data.bin`). - The extension must not be empty and must not contain `/`, `` or characters that are invalid in Windows file names (`< : \" | ? `). It must not end with `.` or a space, because Windows removes them. - Two archives of one build must not end up with the same file name, e.g. archive `a` with `.b.c` and archive `a.b` with `.c`. The build fails with an error. The reader accepts archives with any extension, it only checks the content of the file. `--source` can be repeated to include multiple directories: ```bash StaticForgeTool --source ./textures --source ./audio --output ./build ``` or ```bash StaticForgeTool --source \"./textures, ./audio\" --output ./build ``` Every source path has to be a directory. Asset paths inside the archive are relative to the source folder they were found in, so two source folders must not contain the same relative path. `--output` is always a directory. The archive file names come from the archive name (`--name` or a meta file, see Meta Files) and the extension. Directory names with dots (e.g. `./build/v1.0`) are fine, a path like `./build/main.sfpak` is a directory as well, the archive is written to `./build/main.sfpak/main.sfpak`. An existing file as output path is an error. If the output directory doesn't exist yet, add `--mkdir`: ```bash StaticForgeTool --source ./assets --output ./build/packed --mkdir ``` The archives are written to temporary files (`<archive file .tmp`, e.g. `main.sfpak.tmp`) and renamed when all of them are written. If the build fails, the existing archives stay as they were, the temporary files are removed and a directory created by `--mkdir` is removed again. Add `--compress` to compress every file larger than 4096 bytes: ```bash StaticForgeTool --source ./assets --output ./build --compress ``` Compressed assets are decompressed automatically by `LoadAsset` and `LoadAssetMapped`, only the zero-copy view `GetAssetMapped` is not possible for them. Data that doesn't compress well, like JPG, PNG or OGG files, is stored uncompressed automatically (per block and per file, see `--compress-min-saving`), so compression never makes an archive noticeably larger. The compression can be tuned with `--compress-block-size`, `--compress-table-size`, `--compress-min-match` and `--compress-min-saving`, see CLI Reference. The defaults are the most efficient values for typical game assets. Already compressed formats (PNG, JPG, OGG, ...) barely get smaller, text and uncompressed data (shaders, scripts, JSON, meshes) compress well. With `--cache-dir` only the archives whose files or settings changed are built, the others are skipped and keep their modification time: ```bash StaticForgeTool --source ./assets --output ./build/packed --cache-dir ./build/intermediates/release/sfcache ``` ``` Build was successful (1 archive built, 3 up to date) ``` The cache directory holds one small text file per archive (`<archive name .sfcache`), it is created automatically. Keep it outside of the output directory, so the released build only contains the archives. Use one cache directory per build configuration: ```tree build/ intermediates/ debug/ sfcache/ # cache of the debug build release/ sfcache/ # cache of the release build audio.sfcache main.sfcache packed/ # only the archives audio.sfpak main.sfpak ``` An archive is built again if: - a file was added, removed or changed (size, or content after a changed modification time) - its settings changed (meta file or command line) - its extension changed, the file with the old extension is deleted after the build - the archive file is missing or was changed - the cache file is missing or invalid, or the archive format version changed - `--rebuild` is set A file with a new modification time but the same content, e.g. after a `git checkout`, doesn't trigger a build. An archive that is not built anymore, e.g. because its meta file was deleted, is deleted from the output directory together with its cache file after a successful build. The cache file stores the extension of the archive, so it is found also if it doesn't use `.sfpak`: ``` audio: not built anymore, archive and cache file are deleted Build was successful (1 archive built, 2 up to date, 1 removed) ``` Only archives with a cache file of the same output directory are deleted. `--verbose` shows the reason for every archive: ``` =================================== Up to date check (cache: ./build/intermediates/release/sfcache) =================================== audio: rebuild, archive extension changed (was '.sfpak') data: rebuild, 'data/items.json' changed main: up to date textures: up to date ``` The cache files store the modification times of the local file system, so they belong to one machine and are not meant to be committed. Bool arguments like `--mkdir`, `--verbose`, `--store-names` and `--compress` can be used without a value. `--verbose` is the same as `--verbose true`. Accepted values are `true`/`false`, `1`/`0`, `yes`/`no` and `y`/`n`, anything else is an error. Add `--verbose` (or `--v`) to print detailed information about every file processed: ```bash StaticForgeTool --source ./assets --output ./build --verbose ``` The output has these sections: - Paths - the output and source paths, with the absolute path in brackets. - Meta files - every meta file found and the values it sets. - Files - the files of every archive with their source file, and the excluded files. - Up to date check - only with `--cache-dir`, the reason why an archive is built or skipped. - Writing archive - one section per archive, sorted by name: the settings that are really used (command line, meta file or default), the layout of header, index and data, and for every file its hash, offset, size, how it is stored (raw or compressed, and why it is raw), padding and checksum. Archives with stored names also show the layout of the name table. ::: Example: Writing archive ``` =================================== Writing archive 'textures' - ./build/textures.sfpak =================================== store-names: true compress: true compression: block size 65536, table size 2^16, min match 8, min saving 10% header: offset 0, 64 bytes (52 + padding) index: offset 64, 3 x 40 = 120 bytes data: offset 4096 files (3): [0] textures/hero.png - hash: f798a942ed32fd87 - offset: 0 (in file 4096) - size: 20000 bytes - stored: raw, compressed 20008 bytes, saving below 10% - padding: 480 bytes (aligned 20480 bytes) - checksum: fbd33a7b ... [2] textures/ui/theme.txt - hash: 8e586dbde1d8ef94 - offset: 32768 (in file 36864) - size: 23492 bytes - stored: 3633 bytes compressed (-84%), 1 block - padding: 463 bytes (aligned 4096 bytes) - checksum: a08daa81 name table: - header: offset 40960, 32 bytes - entries: offset 40992, 3 x 16 = 48 bytes - names: offset 41040, 60 bytes, raw archive size: 41100 bytes ``` ::: The offset of a file is relative to the start of the data, `in file` is the position in the archive file. File names, directories, archive names and command line arguments can contain any Unicode characters (e.g. `纹理/背景.png`). Names are stored as UTF-8."},{"nodeId":"node_mu3td1ku1d4g35y4wv21q","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Meta Files","headings":["Meta Files","File format","Supported parameters","Archive names","Archive extension","Excluding files","How it works","Fallback","Command line overrides"],"content":"Meta files let you split assets from a single source tree into multiple archives automatically. A meta file is any file whose name ends with `.sfpak.meta` (e.g. `textures.sfpak.meta` or `my.textures.sfpak.meta`). It uses a simple semicolon-terminated key-value syntax: ``` archive = textures; exclude = .png, .jpg; store-names = true; ``` Each statement is a `key = value;` pair. Whitespace around `=` and `;` is ignored. Comments start with `#` and run to the end of the line: ``` archive = ui; exclude = .psd; # skip source files ``` Meta files are read as UTF-8, values can contain any Unicode characters (e.g. `archive = 纹理;`). A UTF-8 BOM at the start of the file is ignored. The details of the parser are described in Meta File Parser. | Key | Type | Required | Description | |-----------------------|----------|----------|-----------------------------------------------------------------------------| | `archive` | string | yes | Name of the archive produced from this directory | | `extension` | string | no | File extension of the archive (e.g. `pak` or `.pak`, default `.sfpak`) | | `exclude` | string[] | no | Comma-separated list of file extensions to skip (e.g. `.png`, `.tar.gz`) | | `store-names` | bool | no | Store original filenames in the archive for debug inspection and extraction | | `compress` | bool | no | Compress files larger than 4096 bytes | | `compress-block-size` | int | no | Block size in bytes used for compression (1024 - 67108864, default 65536) | | `compress-table-size` | int | no | Compressor match table size as power of two (8 - 24, default 16) | | `compress-min-match` | int | no | Shortest repeated sequence stored as a reference (4 - 65535, default 8) | | `compress-min-saving` | int | no | Percent a block or file must get smaller to be stored compressed (0 - 99, default 5) | Bool values are `true` or `false` (case insensitive). Int values are plain decimal numbers without units (`65536`, not `64k`). Example with all parameters: ``` archive = main; extension = pak; exclude = .png, .jpg, .vert, .help; store-names = true; compress = true; compress-block-size = 65536; compress-table-size = 16; compress-min-match = 8; compress-min-saving = 5; ``` The archive name becomes the file name of the archive (`archive = textures;` produces `textures.sfpak`). It may contain dots (`textures.hd` produces `textures.hd.sfpak`) but no `/` or ``, and it must not be `.` or `..`. Two archive names of one build must not only differ in case (`Audio` and `audio`), because they would be the same file on Windows. `extension` sets the file extension of this archive, the leading dot is optional (`pak` is the same as `.pak`). It is appended to the archive name: ``` archive = audio; extension = snd; # produces audio.snd ``` - Without `extension` the archive gets the extension of the command line (`--extension`) or `.sfpak`. - `--extension` on the command line (or `SetArchiveExtension` in code) wins over the meta file. - The extension must not end with `.`, and it can only contain the characters of a meta value (letters, digits, ` `, `.`, `-` and Unicode characters). - Two archives of one build must not get the same file name (`a` + `.b.c` and `a.b` + `.c`). The meta file itself always ends with `.sfpak.meta`, also if the archive gets another extension. A file is excluded if its name ends with one of the `exclude` entries: - The comparison is case insensitive (`.PNG` excludes `image.png`). - Multi-part extensions work (`.tar.gz` excludes `data.tar.gz`, but not `data.gz`). - A missing dot is added (`png` is the same as `.png`), so `png` does not exclude `image.xpng`. When the tool scans your source directories it looks for `.sfpak.meta` files. Every asset file in the same directory (or any subdirectory) is then packed into the archive named in that meta file. If a subdirectory has its own meta file, that one is used for the subdirectory. Excluded extensions are skipped entirely. Each directory can contain only one meta file. ```tree assets/ textures/ textures.sfpak.meta # archive = textures; exclude = .psd; background.png ui.png audio/ audio.sfpak.meta # archive = audio; extension = snd; music.ogg sfx.wav scripts/ game.lua # no meta file → goes into the default archive ``` Running the tool on `assets/` produces: - `textures.sfpak` - `audio.snd` - `main.sfpak` (for everything without a meta file) Asset paths inside the archive are always relative to the source folder, not to the meta file. `background.png` above is loaded as `textures/background.png`. Files that are not covered by any meta file are packed into the archive name set with `--name` (default: `main`), with the extension set with `--extension` (default: `.sfpak`). Values set on the command line win over the meta file: - `--store-names` and `--compress` force the option on for all archives, even those whose meta file sets it to `false`. The meta value only takes effect when the CLI flag is not set. - `--extension`, `--compress-block-size`, `--compress-table-size`, `--compress-min-match` and `--compress-min-saving` replace the meta file value for all archives. Without the CLI argument the meta value is used, without both the default."},{"nodeId":"node_mu3td1ku1w2zp279b2ssx","tabId":"tab_mu3td1ku2qztxt16axy53","title":"Inspecting Archives","headings":["Inspecting Archives","Basic info","Inspecting multiple archives at once","Verbose index listing","Verifying archives","Extracting archives"],"content":"Use `--info` to display header and index information of one or more existing archives, `--verify` to check them for damage, and `--extract` to turn an archive back into normal files. All three accept archives with any extension, the content of the file decides if it is an archive. ```bash StaticForgeTool --info ./build/textures.sfpak ``` Output: ``` Archive: textures.sfpak Version: 3 File count: 2 Index offset: 64 Index size: 80 Data offset: 4096 ``` `--info` can be repeated to inspect several archives in one invocation: ```bash StaticForgeTool --info ./build/textures.sfpak --info ./build/audio.snd ``` Each archive is printed in sequence, separated by an empty line. With more than one archive the full path is shown instead of only the file name. Add `--verbose` to also print every index entry: ```bash StaticForgeTool --info ./build/textures.sfpak --verbose ``` Output includes a line per file showing its hash (hexadecimal), byte offset relative to the data section, and original size: ``` Index entries: [0] hash: a01c85352df03fae, offset: 0, size: 9 [1] hash: 0254d0414b3d0eaf, offset: 4096, size: 200000 ``` If the archive was built with `--store-names` (or `store-names = true` in the meta file), each line also shows the original relative path: ``` Index entries: [0] name: textures/background.png, hash: 0254d0414b3d0eaf, offset: 0, size: 200000 [1] name: textures/ui.png, hash: a6cf994350b589ad, offset: 200704, size: 3 ``` `--verify` checks the checksums of all files in one or more archives: ```bash StaticForgeTool --verify \"./build/textures.sfpak, ./build/main.sfpak\" ``` Output: ``` [Error] ./build/textures.sfpak: Asset 'textures/ui.png' is damaged (checksum mismatch) [OK] ./build/main.sfpak (12 files) ``` Several damaged files of one archive are listed below it: ``` [Error] ./build/levels.sfpak: - Asset 'levels/level 01.map' is damaged (checksum mismatch) - Asset 'levels/level 02.map' is damaged (checksum mismatch) ``` All archives are checked, also if one of them is damaged. The exit code is not `0` if any archive is damaged or can't be loaded, so `--verify` can be used in build or install scripts. Without stored names a damaged file is reported by its hash. A file that is not an archive is reported as `Invalid archive magic`. `--extract` writes every file of an archive back to disk. Each archive gets its own folder `<output /<archive file name without its extension /`: ```bash StaticForgeTool --extract ./build/textures.sfpak --output ./unpacked --mkdir ``` All archives are loaded and checked before anything is written. The output directory is only created when all of them can be extracted. With stored names the original folder structure is restored (the path inside the archive is relative to the source folder): ```tree unpacked/ textures/ # from textures.sfpak textures/ background.png ui.png main/ # from main.sfpak, no names stored a01c85352df03fae.bin 0254d0414b3d0eaf.bin ``` Without stored names the original paths are unknown, so the files are named after their hash, matching the `--info --verbose` output: `./unpacked/main/a01c85352df03fae.bin`. Several archives can be extracted at once: ```bash StaticForgeTool --extract \"./build/textures.sfpak, ./build/main.sfpak\" --output ./unpacked --mkdir --verbose ``` Rules: - Existing files are never overwritten. If one of the target files already exists, nothing is extracted. Empty the output folder first. - Names in the archive must be relative paths. An archive with names like `../file` or `C:/file` is rejected, so a manipulated archive can't write outside of the output folder. - Only the last extension is removed for the folder name: `textures.hd.sfpak` goes to `textures.hd/`, `main.data.bin` to `main.data/`. Two archives that would get the same folder are an error. Note: Without name storage the index only contains hashes. The original path is not recoverable from the archive alone — keep your source assets, or pack with `--store-names` if you need to extract with the orig
