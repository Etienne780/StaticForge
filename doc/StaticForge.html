  background: var(--code-gutter-bg);
  font-family: var(--font-mono);
  font-size: var(--font-size-code);
  line-height: var(--code-line-height, 1.65);
  color: var(--muted);
  text-align: right;
  user-select: none;
  white-space: pre;
}

.code-block-wrapper--no-tag .code-line-numbers {
  border-top-color: var(--cbrd);
  border-radius: 6px 0 0 6px;
}

/* {indent=4|tab}: line on the left edge of the first character of every indent level.
   inline-block with the line height of the code, so the lines of consecutive rows touch.
   Empty guides of blank lines show their whitespace through ::before (not copied). */
.code-indent-guide {
  display: inline-block;
  vertical-align: top;
  box-shadow: inset 1px 0 0 var(--code-indent-guide, color-mix(in srgb, var(--ctext) 35%, transparent));
}

.code-indent-guide--virtual::before {
  content: attr(data-ws);
}

/* inline code with {lang=...} */
code.code-inline-highlight {
  white-space: pre-wrap;
}

.code-block-diff {
  padding: 0;
  overflow-x: auto;
}

/* transparent border so context lines line up with the bordered add/removed lines */
.code-block-diff-line {
  display: block;
  padding: 0 var(--sp-m);
  width: 100%;
  border-left: 3px solid transparent;
}

.code-block-diff-line:first-child {
  margin-top: var(--sp-s);
}

.code-block-diff-line:last-child {
  margin-bottom: var(--sp-s);
}

.code-block-diff-add {
  --tmp-code-diff-add-border: var(--code-diff-add);
  --tmp-code-diff-add-background: color-mix(in srgb,
      var(--code-diff-add) 15%,
      transparent);

  border-left: 3px solid var(--tmp-code-diff-add-border);
  background: var(--tmp-code-diff-add-background);
}

.code-block-diff-removed {
  --tmp-code-diff-removed-border: var(--code-diff-removed);
  --tmp-code-diff-removed-background: color-mix(in srgb,
      var(--code-diff-removed) 15%,
      transparent);

  border-left: 3px solid var(--tmp-code-diff-removed-border);
  background: var(--tmp-code-diff-removed-background);
}

.code-block-diff-context {
  background: var(--diff-context-background, transparent);
}

/* -- Table of contents block ([toc]) -------------------------------------- */
/* shared; every style below is its own block (style=card|tree|outline|leader) */
.doc-toc {
  margin: 0 0 var(--gap-p);
  font-family: var(--font-body);
}

.doc-toc .doc-toc__list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.doc-toc .doc-toc__list .doc-toc__list {
  padding-left: 16px;
}

.doc-toc li {
  margin: 1px 0;
  line-height: 1.6;
}

.doc-toc__title {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
}

.doc-toc__link {
  display: flex;
  align-items: baseline;
  gap: 8px;
  color: var(--text2);
  text-decoration: none;
  border-bottom: none;
}

.doc-toc__link:hover {
  color: var(--accent);
}

.doc-toc__num {
  flex-shrink: 0;
  min-width: 2.6em;
  font-family: var(--font-mono);
  font-size: 0.85em;
  color: var(--muted);
}

.doc-toc__empty {
  font-size: 0.9em;
  color: var(--muted);
}

/* card: border all around, title as a header row */
.doc-toc--card {
  border: 1px solid var(--brd);
  border-radius: var(--bq-radius, 5px);
}

.doc-toc--card .doc-toc__title {
  padding: 6px 14px;
  border-bottom: 1px solid var(--brd);
}

.doc-toc--card>.doc-toc__list,
.doc-toc--card>.doc-toc__empty {
  display: block;
  padding: 8px 14px;
}

/* tree: no box, a thin guide line per level */
.doc-toc--tree .doc-toc__title {
  margin-bottom: 4px;
}

.doc-toc--tree .doc-toc__list .doc-toc__list {
  margin-left: 4px;
  padding-left: 12px;
  border-left: 1px solid var(--brd);
}

/* outline: numbered, lines above and below */
.doc-toc--outline {
  padding: 8px 0;
  border-top: 1px solid var(--brd);
  border-bottom: 1px solid var(--brd);
}

.doc-toc--outline .doc-toc__title {
  margin-bottom: 4px;
}

.doc-toc--outline .doc-toc__list .doc-toc__list {
  padding-left: 0;
}

.doc-toc--outline .doc-toc__num {
  min-width: 4em;
}

/* leader: like a book, dotted line to an arrow */
.doc-toc--leader .doc-toc__title {
  margin-bottom: 4px;
}

.doc-toc--leader .doc-toc__leader {
  flex: 1;
  min-width: 16px;
  border-bottom: 1px dotted var(--muted);
  transform: translateY(-4px);
}

.doc-toc--leader .doc-toc__arrow {
  flex-shrink: 0;
  color: var(--muted);
}

.doc-toc--leader .doc-toc__link:hover .doc-toc__arrow {
  color: var(--accent);
}

h1[id],
h2[id],
h3[id],
h4[id] {
  scroll-margin-top: var(--sp-m, 16px);
}

/* -- Lists ----------------------------------------------------------------- */
ul,
ol {
  padding-left: 24px;
  margin: 8px 0 var(--gap-p);
  font-family: var(--font-body);
  color: var(--text);
}

li {
  margin: var(--list-gap, 4px) 0;
  line-height: 1.7;
}

li::marker {
  color: var(--bullet, var(--text));
}

/* bullet per level: disc, circle, square, repeating ({bullet=...} sets a class per level) */
ul ul ul ul {
  list-style-type: disc;
}

ul ul ul ul ul {
  list-style-type: circle;
}

ul ul ul ul ul ul {
  list-style-type: square;
}

ul.md-bullets--disc {
  list-style-type: disc;
}

ul.md-bullets--circle {
  list-style-type: circle;
}

ul.md-bullets--square {
  list-style-type: square;
}

ul.md-bullets--dash {
  list-style-type: "–  ";
}

ul.md-bullets--arrow {
  list-style-type: "→  ";
}

ul.md-bullets--none {
  list-style-type: none;
  padding-left: 4px;
}

ul.md-bullets--none ul {
  padding-left: 20px;
}

/* check mark items: the box replaces the bullet, numbers stay */
ul>li.task-item {
  list-style: none;
}

.task-box {
  display: inline-block;
  position: relative;
  width: 0.95em;
  height: 0.95em;
  margin: 0 0.15em;
  vertical-align: -0.12em;
  box-sizing: border-box;
  border: 1.5px solid var(--checkbox, var(--accent));
  border-radius: 3px;
  pointer-events: none;
  user-select: none;
}

li.task-item>.task-box:first-child {
  margin: 0 0.5em 0 0;
}

ul>li.task-item>.task-box:first-child {
  margin-left: -1.45em;
}

.task-box--checked {
  background: var(--checkbox, var(--accent));
}

.task-box--checked::after {
  content: '';
  position: absolute;
  left: 0.27em;
  top: 0.08em;
  width: 0.22em;
  height: 0.48em;
  border: solid var(--bg);
  border-width: 0 0.12em 0.12em 0;
  transform: rotate(45deg);
}

/* -- Footnotes ------------------------------------------------------------ */
.fn-ref {
  font-size: 0.75em;
  line-height: 0;
  vertical-align: super;
  scroll-margin-top: var(--sp-m);
}

.fn-ref__link {
  position: relative;
  padding: 0 1px;
  font-weight: 600;
  color: var(--footnote, var(--link));
  border-bottom: none;
}

.fn-ref__link:hover {
  color: var(--accent);
}

/* tooltip with the text of the footnote */
.fn-ref__link[data-fn-text]:hover::after {
  content: attr(data-fn-text);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 6px);
  transform: translateX(-50%);
  width: max-content;
  max-width: 320px;
  padding: 6px 10px;
  font-family: var(--font-body);
  font-size: calc(var(--font-size, 16px) * 0.85);
  font-weight: 400;
  line-height: 1.5;
  white-space: normal;
  color: var(--text);
  background: var(--bg2);
  border: 1px solid var(--brd);
  border-radius: 6px;
  pointer-events: none;
  z-index: 20;
}

.fn-ref--missing {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-color: var(--code-diff-removed, currentColor);
  cursor: help;
}

.doc-footnotes {
  margin-top: var(--gap-h);
  padding-top: var(--sp-s);
  border-top: 1px solid var(--brd);
  font-size: 0.9em;
  color: var(--text2);
}

.doc-footnotes .doc-footnotes__list {
  margin: 0;
  padding-left: 24px;
  color: inherit;
}

.doc-footnotes__list li {
  margin: 2px 0;
  scroll-margin-top: var(--sp-m);
}

.doc-footnotes__list li::marker {
  color: var(--footnote, var(--link));
}

.doc-footnotes__back {
  margin-left: 6px;
  color: var(--muted);
  border-bottom: none;
}

.doc-footnotes__back:hover {
  color: var(--accent);
}

/* -- Tree (tree code block) ----------------------------------------------------- */
.doc-tree {
  margin: 0 0 var(--gap-p);
  padding: var(--sp-s) var(--sp-m);
  background: var(--cbg);
  border: 2px solid var(--cbrd);
  border-radius: var(--code-radius, 6px);
  font-family: var(--font-mono);
  font-size: var(--font-size-code);
  line-height: 1.7;
  color: var(--ctext);
  overflow-x: auto;
}

.doc-tree .doc-tree__list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.doc-tree .doc-tree__list .doc-tree__list {
  margin-left: 7px;
  padding-left: 12px;
  border-left: 1px solid color-mix(in srgb, var(--ctext) 22%, transparent);
}

.doc-tree--collapsible .doc-tree__list .doc-tree__list {
  margin-left: 21px;
}

.doc-tree .doc-tree__item {
  margin: 0;
  line-height: inherit;
}

.doc-tree__row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

summary.doc-tree__row {
  list-style: none;
  cursor: pointer;
  border-radius: 3px;
}

summary.doc-tree__row::-webkit-details-marker {
  display: none;
}

summary.doc-tree__row:hover .doc-tree__name {
  color: var(--accent);
}

.doc-tree__icon {
  flex-shrink: 0;
  width: 1em;
  height: 1em;
}

.doc-tree__icon--folder {
  fill: color-mix(in srgb, var(--accent) 30%, transparent);
  stroke: var(--accent);
  stroke-width: 1.2;
}

.doc-tree__icon--file {
  fill: none;
  stroke: var(--muted);
  stroke-width: 1.2;
  stroke-linejoin: round;
}

.doc-tree__comment {
  margin-left: 10px;
  color: var(--muted);
  font-style: italic;
}

.doc-tree__comment::before {
  content: '# ';
}

.doc-tree--empty .doc-tree__comment::before {
  content: none;
}

/* chevron slot in every row of a collapsible tree, so names line up */
.doc-tree__chevron {
  flex-shrink: 0;
  width: 0.8em;
  height: 0.8em;
}

summary.doc-tree__row .doc-tree__chevron {
  position: relative;
}

summary.doc-tree__row .doc-tree__chevron::before {
  content: '';
  position: absolute;
  left: 0.2em;
  top: 0.2em;
  width: 0.32em;
  height: 0.32em;
  border: solid var(--muted);
  border-width: 0 1.5px 1.5px 0;
  transform: rotate(-45deg);
  transition: transform .15s;
}

details[open]>summary.doc-tree__row .doc-tree__chevron::before {
  transform: rotate(45deg);
  top: 0.12em;
}

/* -- Sections (::: Title ... :::) ------------------------------------------- */
.doc-section {
  margin: 0 0 var(--gap-p);
  border: 1px solid var(--section-brd, var(--brd));
  border-radius: var(--bq-radius, 5px);
  overflow: hidden;
}

.doc-section__title {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  list-style: none;
  cursor: pointer;
  user-select: none;
  font-family: var(--font-heading);
  font-weight: 600;
  color: var(--section-title, var(--heading-color, var(--text)));
  background: var(--section-bg, color-mix(in srgb, var(--accent) 6%, transparent));
  transition: box-shadow .15s;
}

.doc-section__title::-webkit-details-marker {
  display: none;
}

/* hover: a light layer over any title bar color */
.doc-section__title:hover {
  box-shadow: inset 0 0 0 100vmax color-mix(in srgb, var(--text) 6%, transparent);
}

/* chevron: points right when collapsed, down when open */
.doc-section__title::before {
  content: '';
  flex-shrink: 0;
  width: 6px;
  height: 6px;
  margin-left: 2px;
  border: solid var(--section-icon, var(--accent));
  border-width: 0 2px 2px 0;
  transform: rotate(-45deg);
  transition: transform .2s;
}

.doc-section[open]>.doc-section__title::before {
  transform: rotate(45deg);
}

.doc-section[open]>.doc-section__title {
  border-bottom: 1px solid var(--section-brd, var(--brd));
}

.doc-section__body {
  padding: 12px 16px;
}

.doc-section__body> :first-child:not(.code-block-wrapper) {
  margin-top: 0;
}

.doc-section__body> :last-child {
  margin-bottom: 0;
}

/* opening / closing slides (browsers without ::details-content ignore it) */
@media (prefers-reduced-motion: no-preference) {
  .doc-section {
    interpolate-size: allow-keywords;
  }

  .doc-section::details-content {
    block-size: 0;
    overflow: hidden;
    transition: block-size .2s ease, content-visibility .2s allow-discrete;
  }

  .doc-section[open]::details-content {
    block-size: auto;
  }
}

/* -- Tables ---------------------------------------------------------------- */
/* Wide tables scroll horizontally inside the wrapper, not the page.
   position: sticky can't work in there, so the header is kept visible
   by the script (see buildStickyTableHeadJs). */
.table-wrapper {
  overflow-x: auto;
  margin: 14px 0;
}

/* shifted while scrolling (sticky table heads): own layer, the table isn't repainted */
.table-wrapper thead {
  will-change: transform;
  /* own z-index: positioned cell content (e.g. check marks) would otherwise paint above it */
  position: relative;
  z-index: 1;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size);
}

th {
  padding: var(--table-pad, 7px) 12px;
  background: var(--bg2);
  border: 1px solid var(--brd);
  text-align: left;
  font-family: var(--font-mono);
  font-size: var(--font-size);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}

td {
  padding: var(--table-pad, 7px) 12px;
  border: 1px solid var(--brd);
  font-family: var(--font-body);
  color: var(--text);
}

/* Table properties ({hl}, {hover=...}, {striped}): every kind is its own
   translucent layer, so where a row and a column cross it gets brighter.
   Only cells with at least one layer get the gradients: seven gradients on every
   cell made big tables slow to paint while scrolling. */
table[data-striped~="row"] tbody tr:nth-child(even)>*,
table[data-striped~="col"] tbody tr> :nth-child(even),
tr.tbl-hl-row>*,
.tbl-hl-col,
.tbl-hl-cell,
table[data-hover~="row"] tbody tr:hover>*,
.tbl-hover-col,
table[data-hover~="cell"] td:hover,
table[data-hover~="cell"] th:hover {
  background-image:
    linear-gradient(var(--tbl-stripe-row, transparent), var(--tbl-stripe-row, transparent)),
    linear-gradient(var(--tbl-stripe-col, transparent), var(--tbl-stripe-col, transparent)),
    linear-gradient(var(--tbl-hl-row, transparent), var(--tbl-hl-row, transparent)),
    linear-gradient(var(--tbl-hl-col, transparent), var(--tbl-hl-col, transparent)),
    linear-gradient(var(--tbl-hl-cell, transparent), var(--tbl-hl-cell, transparent)),
    linear-gradient(var(--tbl-hover-row, transparent), var(--tbl-hover-row, transparent)),
    linear-gradient(var(--tbl-hover-col, transparent), var(--tbl-hover-col, transparent)),
    linear-gradient(var(--tbl-hover-cell, transparent), var(--tbl-hover-cell, transparent));
}

table[data-striped~="row"] tbody tr:nth-child(even) {
  --tbl-stripe-row: color-mix(in srgb, var(--table-stripe) 5%, transparent);
}

table[data-striped~="col"] tbody tr> :nth-child(even) {
  --tbl-stripe-col: color-mix(in srgb, var(--table-stripe) 5%, transparent);
}

tr.tbl-hl-row {
  --tbl-hl-row: color-mix(in srgb, var(--table-hl) 5%, transparent);
}

.tbl-hl-col {
  --tbl-hl-col: color-mix(in srgb, var(--table-hl) 5%, transparent);
}

.tbl-hl-cell {
  --tbl-hl-cell: color-mix(in srgb, var(--table-hl) 5%, transparent);
}

/* cells that already have a stripe or highlight get a weaker hover layer, so they
   don't get much brighter than a plain hovered cell. The hover layers are set on
   the cells themselves, so they see the --tbl-hover-mix of the cell. */
table[data-striped~="row"] tbody tr:nth-child(even)>*,
table[data-striped~="col"] tbody tr> :nth-child(even),
tr.tbl-hl-row>*,
.tbl-hl-col,
.tbl-hl-cell {
  --tbl-hover-mix: 6%;
}

table[data-hover~="row"] tbody tr:hover>* {
  --tbl-hover-row: color-mix(in srgb, var(--table-hover) var(--tbl-hover-mix, 8%), transparent);
}

.tbl-hover-col {
  --tbl-hover-col: color-mix(in srgb, var(--table-hover) var(--tbl-hover-mix, 8%), transparent);
}

table[data-hover~="cell"] td:hover,
table[data-hover~="cell"] th:hover {
  --tbl-hover-cell: color-mix(in srgb, var(--table-hover) var(--tbl-hover-mix, 8%), transparent);
}

table .tbl-align-left {
  text-align: left;
}

table .tbl-align-center {
  text-align: center;
}

table .tbl-align-right {
  text-align: right;
}

table .tbl-line-b-1 { border-bottom-width: 1px; }
table .tbl-line-r-1 { border-right-width: 1px; }
table .tbl-line-b-2 { border-bottom-width: 2px; }
table .tbl-line-r-2 { border-right-width: 2px; }
table .tbl-line-b-3 { border-bottom-width: 3px; }
table .tbl-line-r-3 { border-right-width: 3px; }
table .tbl-line-b-4 { border-bottom-width: 4px; }
table .tbl-line-r-4 { border-right-width: 4px; }
table .tbl-line-b-5 { border-bottom-width: 5px; }
table .tbl-line-r-5 { border-right-width: 5px; }
table .tbl-line-b-6 { border-bottom-width: 6px; }
table .tbl-line-r-6 { border-right-width: 6px; }
table .tbl-line-b-7 { border-bottom-width: 7px; }
table .tbl-line-r-7 { border-right-width: 7px; }
table .tbl-line-b-8 { border-bottom-width: 8px; }
table .tbl-line-r-8 { border-right-width: 8px; }
table .tbl-line-b-9 { border-bottom-width: 9px; }
table .tbl-line-r-9 { border-right-width: 9px; }
table .tbl-line-b-10 { border-bottom-width: 10px; }
table .tbl-line-r-10 { border-right-width: 10px; }

.indent-0 {
  --indent: calc(var(--indent-spacing) * 1)
}

.indent-1 {
  --indent: calc(var(--indent-spacing) * 2)
}

.indent-2 {
  --indent: calc(var(--indent-spacing) * 3)
}

.indent-3 {
  --indent: calc(var(--indent-spacing) * 4)
}

.indent-4 {
  --indent: calc(var(--indent-spacing) * 5)
}

/* -- Search --------------------------------------------------------------- */
.doc-search {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--sp-xs);
  margin-left: auto;
  align-self: center;
  padding: 0 var(--sp-s);
  flex: 0 1 auto;
  min-width: 80px;
}

.doc-search-input {
  background: var(--bg);
  border: 1px solid var(--brd);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 5px 10px;
  width: 180px;
  max-width: 100%;
  min-width: 0;
  outline: none;
  transition: border-color .15s, width .2s ease;
}

.doc-search-input::placeholder {
  color: var(--muted);
}

.doc-search-input:focus {
  border-color: var(--accent);
  width: 240px;
}

.doc-search-toggle {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
  flex-shrink: 0;
}

.doc-search-toggle input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 13px;
  height: 13px;
  flex-shrink: 0;
  background: var(--bg);
  border: 1px solid var(--brd);
  border-radius: 3px;
  cursor: pointer;
  margin: 0;
  position: relative;
  transition: background .15s, border-color .15s;
}

.doc-search-toggle input[type="checkbox"]:checked {
  background: var(--accent);
  border-color: var(--accent);
}

.doc-search-toggle input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  left: 3px;
  top: 0px;
  width: 5px;
  height: 8px;
  border: 2px solid var(--bg);
  border-top: none;
  border-left: none;
  transform: rotate(45deg);
}

.search-results-list {
  overflow-y: auto;
  max-height: 360px;
}

.search-results-footer {
  padding: 8px 12px;
  border-top: 1px solid var(--brd);
  background: var(--bg2);
  border-radius: 0 0 6px 6px;
  flex-shrink: 0;
}

.search-results {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  right: var(--sp-s);
  width: 360px;
  max-height: 420px;
  overflow-y: auto;
  background: var(--bg1);
  border: 1px solid var(--brd);
  border-radius: 6px;
  z-index: 200;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

.search-results.visible {
  display: block;
}

.search-result {
  padding: 10px 14px;

    <div class="export-section__body"><h1 id="h-node_mu3td1kuufx8v3a1hzju-getting-started">Getting Started</h1>
<p>StaticForge is an asset archive system for bundling and loading game files. It combines multiple files into a compact archive file that can be efficiently read at runtime. Archives use the extension <code>.sfpak</code> by default, any other extension can be set when packing (see <a class="doc-ref" href="#node_mu3td1ku93dq7vjxmvr2" data-ref-node="node_mu3td1ku93dq7vjxmvr2" title="Packing Assets">Packing Assets</a>).</p>
<h2 id="h-node_mu3td1kuufx8v3a1hzju-what-you-get">What you get</h2>
<ul><li>A command-line tool (<code>StaticForgeTool</code>) to pack your assets during your build process, and to inspect or extract existing archives</li><li>A C++ library (<code>StaticForgeCore</code>) to load assets from archives at runtime</li></ul>
<h2 id="h-node_mu3td1kuufx8v3a1hzju-typical-workflow">Typical workflow</h2>
<ol><li>Organize your asset folders</li><li>Optionally add <code>.sfpak.meta</code> files to control how folders are grouped into archives (see <a class="doc-ref" href="#node_mu3td1ku1d4g35y4wv21q" data-ref-node="node_mu3td1ku1d4g35y4wv21q" title="Meta Files">Meta Files</a>)</li><li>Run <code>StaticForgeTool</code> to pack your assets into one or more archives (see <a class="doc-ref" href="#node_mu3td1ku93dq7vjxmvr2" data-ref-node="node_mu3td1ku93dq7vjxmvr2" title="Packing Assets">Packing Assets</a>)</li><li>At runtime, use <code>StaticForgeReader</code> and <code>StaticForgeArchive</code> to load assets by path (see <a class="doc-ref" href="#node_mu3td1kuzgocka16m5db0" data-ref-node="node_mu3td1kuzgocka16m5db0" title="Loading Assets at Runtime">Loading Assets at Runtime</a>)</li></ol>

    <div class="export-section__body"><h1 id="h-node_mu3td1ku93dq7vjxmvr2-packing-assets">Packing Assets</h1>
<p>Use <code>StaticForgeTool</code> to pack a folder of assets into an archive.</p>
<div class="doc-toc doc-toc--outline doc-toc--numbered"><ul class="doc-toc__list"><li><a class="doc-toc__link" href="#h-node_mu3td1ku93dq7vjxmvr2-basic-usage" data-toc-target="h-node_mu3td1ku93dq7vjxmvr2-basic-usage"><span class="doc-toc__num">1</span><span class="doc-toc__text">Basic usage</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku93dq7vjxmvr2-specifying-an-archive-name" data-toc-target="h-node_mu3td1ku93dq7vjxmvr2-specifying-an-archive-name"><span class="doc-toc__num">2</span><span class="doc-toc__text">Specifying an archive name</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku93dq7vjxmvr2-archive-extension" data-toc-target="h-node_mu3td1ku93dq7vjxmvr2-archive-extension"><span class="doc-toc__num">3</span><span class="doc-toc__text">Archive extension</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku93dq7vjxmvr2-multiple-source-folders" data-toc-target="h-node_mu3td1ku93dq7vjxmvr2-multiple-source-folders"><span class="doc-toc__num">4</span><span class="doc-toc__text">Multiple source folders</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku93dq7vjxmvr2-output-directory" data-toc-target="h-node_mu3td1ku93dq7vjxmvr2-output-directory"><span class="doc-toc__num">5</span><span class="doc-toc__text">Output directory</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku93dq7vjxmvr2-compression" data-toc-target="h-node_mu3td1ku93dq7vjxmvr2-compression"><span class="doc-toc__num">6</span><span class="doc-toc__text">Compression</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku93dq7vjxmvr2-incremental-builds" data-toc-target="h-node_mu3td1ku93dq7vjxmvr2-incremental-builds"><span class="doc-toc__num">7</span><span class="doc-toc__text">Incremental builds</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku93dq7vjxmvr2-bool-arguments" data-toc-target="h-node_mu3td1ku93dq7vjxmvr2-bool-arguments"><span class="doc-toc__num">8</span><span class="doc-toc__text">Bool arguments</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku93dq7vjxmvr2-verbose-output" data-toc-target="h-node_mu3td1ku93dq7vjxmvr2-verbose-output"><span class="doc-toc__num">9</span><span class="doc-toc__text">Verbose output</span></a></li><li><a class="doc-toc__link" href="#h-node_mu3td1ku93dq7vjxmvr2-unicode" data-toc-target="h-node_mu3td1ku93dq7vjxmvr2-unicode"><span class="doc-toc__num">10</span><span class="doc-toc__text">Unicode</span></a></li></ul></div>
<h2 id="h-node_mu3td1ku93dq7vjxmvr2-basic-usage">Basic usage</h2>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">assets</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>This scans <code>./assets</code> recursively and writes the archive to <code>./build/main.sfpak</code>.</p>
<h2 id="h-node_mu3td1ku93dq7vjxmvr2-specifying-an-archive-name">Specifying an archive name</h2>
<p>By default the archive is named <code>main</code>. Use <code>--name</code> to override:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">assets</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--name</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">textures</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>This produces <code>./build/textures.sfpak</code>. The name may contain dots (<code>textures.hd</code> produces <code>textures.hd.sfpak</code>) and non-ASCII characters, but no <code>/</code> or <code>\</code>.</p>
<h2 id="h-node_mu3td1ku93dq7vjxmvr2-archive-extension">Archive extension</h2>
<p>Archives get the extension <code>.sfpak</code> by default. Use <code>--extension</code> (or <code>--ext</code>) to give all archives another extension, the leading dot is optional:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">assets</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--extension</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">pak</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>This produces <code>./build/main.pak</code>. A single archive can also get its own extension in its meta file (<code>extension = pak;</code>, see <a class="doc-ref" href="#node_mu3td1ku1d4g35y4wv21q" data-ref-node="node_mu3td1ku1d4g35y4wv21q" title="Meta Files">Meta Files</a>). The value of the command line wins over the meta file, without both <code>.sfpak</code> is used.</p>
<ul><li>The extension is appended to the archive name, also if the name contains dots: <code>textures.hd</code> with <code>pak</code> produces <code>textures.hd.pak</code>.</li><li>Multi-part extensions work (<code>.data.bin</code>).</li><li>The extension must not be empty and must not contain <code>/</code>, <code>\</code> or characters that are invalid in Windows file names (<code>&lt; &gt; : &quot; | ? *</code>). It must not end with <code>.</code> or a space, because Windows removes them.</li><li>Two archives of one build must not end up with the same file name, e.g. archive <code>a</code> with <code>.b.c</code> and archive <code>a.b</code> with <code>.c</code>. The build fails with an error.</li></ul>
<p>The reader accepts archives with any extension, it only checks the content of the file.</p>
<h2 id="h-node_mu3td1ku93dq7vjxmvr2-multiple-source-folders">Multiple source folders</h2>
<p><code>--source</code> can be repeated to include multiple directories:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">textures</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">audio</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>or</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__string">"</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__string">./textures, ./audio"</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Every source path has to be a directory. Asset paths inside the archive are relative to the source folder they were found in, so two source folders must not contain the same relative path.</p>
<h2 id="h-node_mu3td1ku93dq7vjxmvr2-output-directory">Output directory</h2>
<p><code>--output</code> is always a directory. The archive file names come from the archive name (<code>--name</code> or a meta file, see <a class="doc-ref" href="#node_mu3td1ku1d4g35y4wv21q" data-ref-node="node_mu3td1ku1d4g35y4wv21q" title="Meta Files">Meta Files</a>) and the extension. Directory names with dots (e.g. <code>./build/v1.0</code>) are fine, a path like <code>./build/main.sfpak</code> is a directory as well, the archive is written to <code>./build/main.sfpak/main.sfpak</code>. An existing file as output path is an error.</p>
<p>If the output directory doesn't exist yet, add <code>--mkdir</code>:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">assets</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">packed</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--mkdir</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>The archives are written to temporary files (<code>&lt;archive file&gt;.tmp</code>, e.g. <code>main.sfpak.tmp</code>) and renamed when all of them are written. If the build fails, the existing archives stay as they were, the temporary files are removed and a directory created by <code>--mkdir</code> is removed again.</p>
<h2 id="h-node_mu3td1ku93dq7vjxmvr2-compression">Compression</h2>
<p>Add <code>--compress</code> to compress every file larger than 4096 bytes:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">assets</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--compress</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Compressed assets are decompressed automatically by <code>LoadAsset</code> and <code>LoadAssetMapped</code>, only the zero-copy view <code>GetAssetMapped</code> is not possible for them. Data that doesn't compress well, like JPG, PNG or OGG files, is stored uncompressed automatically (per block and per file, see <code>--compress-min-saving</code>), so compression never makes an archive noticeably larger. The compression can be tuned with <code>--compress-block-size</code>, <code>--compress-table-size</code>, <code>--compress-min-match</code> and <code>--compress-min-saving</code>, see <a class="doc-ref" href="#node_mu3td1kuw60i4y16ior5l" data-ref-node="node_mu3td1kuw60i4y16ior5l" title="CLI Reference">CLI Reference</a>. The defaults are the most efficient values for typical game assets.</p>
<p>Already compressed formats (PNG, JPG, OGG, ...) barely get smaller, text and uncompressed data (shaders, scripts, JSON, meshes) compress well.</p>
<h2 id="h-node_mu3td1ku93dq7vjxmvr2-incremental-builds">Incremental builds</h2>
<p>With <code>--cache-dir</code> only the archives whose files or settings changed are built, the others are skipped and keep their modification time:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">assets</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">packed</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--cache-dir</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">intermediates</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">release</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">sfcache</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<div class="code-block-wrapper code-tab-4"><pre><code>Build was successful (1 archive built, 3 up to date)</code></pre><div class="code-language-tag code-language-tag--recognized">Output</div></div>
<p>The cache directory holds one small text file per archive (<code>&lt;archive name&gt;.sfcache</code>), it is created automatically. Keep it outside of the output directory, so the released build only contains the archives. Use one cache directory per build configuration:</p>
<div class="doc-tree doc-tree--collapsible"><ul class="doc-tree__list"><li class="doc-tree__item doc-tree__item--folder"><details class="doc-tree__details" open><summary class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">build</span></summary><ul class="doc-tree__list"><li class="doc-tree__item doc-tree__item--folder"><details class="doc-tree__details" open><summary class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">intermediates</span></summary><ul class="doc-tree__list"><li class="doc-tree__item doc-tree__item--folder"><details class="doc-tree__details" open><summary class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">debug</span></summary><ul class="doc-tree__list"><li class="doc-tree__item doc-tree__item--folder"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">sfcache</span><span class="doc-tree__comment">cache of the debug build</span></div></li></ul></details></li><li class="doc-tree__item doc-tree__item--folder"><details class="doc-tree__details" open><summary class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">release</span></summary><ul class="doc-tree__list"><li class="doc-tree__item doc-tree__item--folder"><details class="doc-tree__details" open><summary class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">sfcache</span><span class="doc-tree__comment">cache of the release build</span></summary><ul class="doc-tree__list"><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">audio.sfcache</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">main.sfcache</span></div></li></ul></details></li></ul></details></li></ul></details></li><li class="doc-tree__item doc-tree__item--folder"><details class="doc-tree__details" open><summary class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg><span class="doc-tree__name">packed</span><span class="doc-tree__comment">only the archives</span></summary><ul class="doc-tree__list"><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">audio.sfpak</span></div></li><li class="doc-tree__item"><div class="doc-tree__row"><span class="doc-tree__chevron" aria-hidden="true"></span><svg class="doc-tree__icon doc-tree__icon--file" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3"/></svg><span class="doc-tree__name">main.sfpak</span></div></li></ul></details></li></ul></details></li></ul></div>
<p>An archive is built again if:</p>
<ul><li>a file was added, removed or changed (size, or content after a changed modification time)</li><li>its settings changed (meta file or command line)</li><li>its extension changed, the file with the old extension is deleted after the build</li><li>the archive file is missing or was changed</li><li>the cache file is missing or invalid, or the archive format version changed</li><li><code>--rebuild</code> is set</li></ul>
<p>A file with a new modification time but the same content, e.g. after a <code>git checkout</code>, doesn't trigger a build.</p>
<p>An archive that is not built anymore, e.g. because its meta file was deleted, is deleted from the output directory together with its cache file after a successful build. The cache file stores the extension of the archive, so it is found also if it doesn't use <code>.sfpak</code>:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>audio: not built anymore, archive and cache file are deleted

Build was successful (1 archive built, 2 up to date, 1 removed)</code></pre><div class="code-language-tag code-language-tag--recognized">Output</div></div>
<p>Only archives with a cache file of the same output directory are deleted. <code>--verbose</code> shows the reason for every archive:</p>
<div class="code-block-wrapper code-tab-4"><pre><code>===================================
Up to date check (cache: ./build/intermediates/release/sfcache)
===================================
audio: rebuild, archive extension changed (was &#39;.sfpak&#39;)
data: rebuild, &#39;data/items.json&#39; changed
main: up to date
textures: up to date</code></pre><div class="code-language-tag code-language-tag--recognized">Output</div></div>
<p>The cache files store the modification times of the local file system, so they belong to one machine and are not meant to be committed.</p>
<h2 id="h-node_mu3td1ku93dq7vjxmvr2-bool-arguments">Bool arguments</h2>
<p>Bool arguments like <code>--mkdir</code>, <code>--verbose</code>, <code>--store-names</code> and <code>--compress</code> can be used without a value. <code>--verbose</code> is the same as <code>--verbose true</code>. Accepted values are <code>true</code>/<code>false</code>, <code>1</code>/<code>0</code>, <code>yes</code>/<code>no</code> and <code>y</code>/<code>n</code>, anything else is an error.</p>
<h2 id="h-node_mu3td1ku93dq7vjxmvr2-verbose-output">Verbose output</h2>
<p>Add <code>--verbose</code> (or <code>--v</code>) to print detailed information about every file processed:</p>
<div class="code-block-wrapper code-tab-4"><div class="code-copy"><button type="button" class="code-copy-btn">Copy</button></div><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">assets</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--verbose</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>The output has these sections:</p>
<ul><li><strong>Paths</strong> - the output and source paths, with the absolute path in brackets.</li><li><strong>Meta files</strong> - every meta file found and the values it sets.</li><li><strong>Files</strong> - the files of every archive with their source file, and the excluded files.</li><li><strong>Up to date check</strong> - only with <code>--cache-dir</code>, the reason why an archive is built or skipped.</li><li><strong>Writing archive</strong> - one section per archive, sorted by name: the settings that are really used (command line, meta file or default), the layout of header, index and data, and for every file its hash, offset, size, how it is stored (raw or compressed, and why it is raw), padding and checksum. Archives with stored names also show the layout of the name table.</li></ul>
<details class="doc-section"><summary class="doc-section__title">Example: Writing archive</summary><div class="doc-section__body">
<div class="code-block-wrapper code-tab-4"><pre><code>===================================

<p>The offset of a file is relative to the start of the data, <code>in file</code> is the position in the archive file.</p>
<h2 id="h-node_mu3td1ku93dq7vjxmvr2-unicode">Unicode</h2>
<p>File names, directories, archive names and command line arguments can contain any Unicode characters (e.g. <code>纹理/背景.png</code>). Names are stored as UTF-8.</p></div>
