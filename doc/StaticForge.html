<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">bool</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">mapped</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">IsMapped</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p><code>GetAssetMapped</code> returns a non-owning <code>AssetView</code> directly into mapped memory — no allocation or copy needed. The view becomes invalid as soon as <code>CloseMapped</code> is called. For an empty file the view has <code>size == 0</code> and a valid (non-null) <code>data</code> pointer.</p>
<blockquote><strong>Important:</strong> Memory-mapped access is <strong>not supported for compressed assets</strong>. Calling <code>GetAssetMapped</code> or <code>LoadAssetMapped</code> on a compressed entry will return an error. Use <code>LoadAsset</code> (stream-based) instead, which handles decompression automatically.</blockquote>
<h2>Compression</h2>
<p>Assets can be stored compressed inside an archive. This is transparent when using the stream-based API — <code>LoadAsset</code> detects compressed entries and decompresses them automatically before returning the data:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// Works for both compressed and uncompressed assets</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">vector</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">byte</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">data</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">maps/level1.map"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">data</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">))</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">endl</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>Internally, compressed files are split into blocks (64 KB by default, configurable when packing). Each block is compressed independently and prefixed with its compressed and original size.</p>
<div class="table-wrapper"><table><thead><tr><th>Access method</th><th>Uncompressed</th><th>Compressed</th></tr></thead><tbody><tr><td><code>LoadAsset</code></td><td>✅</td><td>✅ (auto-decompress)</td></tr><tr><td><code>LoadAssetAt</code></td><td>✅</td><td>✅ (auto-decompress)</td></tr><tr><td><code>LoadAssetMapped</code></td><td>✅</td><td>❌ not supported</td></tr><tr><td><code>GetAssetMapped</code></td><td>✅</td><td>❌ not supported</td></tr></tbody></table></div>
<h2>Error handling</h2>
<p><code>StaticForgeReader</code> and <code>StaticForgeArchive</code> collect error messages. Always check the return value:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">audio/music.ogg"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">data</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">))</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// possible reasons: key not found, seek failure, checksum mismatch,</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// decompression failure, or compressed asset accessed via mmap</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">endl</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<div class="table-wrapper"><table><thead><tr><th>Function</th><th>Description</th></tr></thead><tbody><tr><td><code>IsValid()</code></td><td><code>true</code> if no errors are stored</td></tr><tr><td><code>GetError()</code></td><td>Returns all stored errors as one string</td></tr><tr><td><code>TakeError()</code></td><td>Returns all stored errors and clears them</td></tr><tr><td><code>ClearErrors()</code></td><td>Clears all stored errors</td></tr></tbody></table></div>
Errors of the archive accumulate over several calls until you take or clear them, so you can load many assets and report all problems at once:
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">a.png"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">a</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">b.png"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">b</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">IsValid</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">())</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">  </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// errors of both calls</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>Errors that no longer apply are cleared automatically: <code>reader.Load</code> clears the errors of the reader and of the archive it loads into.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1kurklac1g47o2b">
  <div class="main" data-node-id="node_mu3td1kurklac1g47o2b" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1kurklac1g47o2b" class="export-section">
    
    <div class="export-section__body"><h1>Building Archives in Code</h1>
<p>Instead of using the command-line tool you can drive the build process directly from C++ using <code>StaticForgeBuilder</code>.</p>
<h2>Minimal example</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">#</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">include </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">StaticForgeCore/StaticForge.h</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword"></span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeBuilder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetArchiveName</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">textures"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AddSourcePath</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets/textures"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetOutputPath</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./build"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetCreateOutputDir</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__literal">true</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Build</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">())</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">endl</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<h2>Multiple source paths</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetSourcePath</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">({</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets/textures"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets/audio"</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">});</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>or add them one at a time:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AddSourcePath</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets/textures"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AddSourcePath</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets/audio"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>Paths are <code>std::filesystem::path</code>. For UTF-8 strings use <code>std::filesystem::u8path(...)</code>, so non-ASCII names also work on Windows.</p>
<h2>Fluent API</h2>
<p>All setters return <code>*this</code> so they can be chained:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeBuilder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">main"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./assets"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">},</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./build"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">};</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetCreateOutputDir</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__literal">true</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetDebugMode</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__literal">true</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Build</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<h2>Options</h2>
<div class="table-wrapper"><table><thead><tr><th>Setter</th><th>CLI equivalent</th><th>Description</th></tr></thead><tbody><tr><td><code>SetArchiveName(name)</code></td><td><code>--name</code></td><td>Archive name for files without a meta file (default <code>main</code>)</td></tr><tr><td><code>SetSourcePath(paths)</code> / <code>AddSourcePath(path)</code></td><td><code>--source</code></td><td>Source directories</td></tr><tr><td><code>SetOutputPath(path)</code></td><td><code>--output</code></td><td>Output directory</td></tr><tr><td><code>SetCreateOutputDir(bool)</code></td><td><code>--mkdir</code></td><td>Create the output directory if it is missing</td></tr><tr><td><code>SetDebugMode(bool)</code></td><td><code>--verbose</code></td><td>Print detailed progress to <code>stdout</code></td></tr><tr><td><code>SetStoreNames(bool)</code></td><td><code>--store-names</code></td><td>Store file names in all archives</td></tr><tr><td><code>SetCompress(bool)</code></td><td><code>--compress</code></td><td>Compress files larger than 4096 bytes in all archives</td></tr><tr><td><code>SetCompressionBlockSize(size)</code></td><td><code>--compress-block-size</code></td><td>Compression block size in bytes (default <code>DEFAULT_COMPRESSION_BLOCK_SIZE</code>)</td></tr><tr><td><code>SetCompressionTableSizeLog2(size)</code></td><td><code>--compress-table-size</code></td><td>Match table size as power of two (default <code>DEFAULT_COMPRESSION_TABLE_SIZE_LOG2</code>)</td></tr><tr><td><code>SetCompressionMinMatchLength(length)</code></td><td><code>--compress-min-match</code></td><td>Shortest match stored as reference (default <code>DEFAULT_COMPRESSION_MIN_MATCH_LENGTH</code>)</td></tr></tbody></table></div>
The valid ranges of the compression settings are the <code>MIN_COMPRESSION_*</code> and <code>MAX_COMPRESSION_*</code> constants in <code>StaticForgeTypes.h</code>. Invalid values make <code>Build()</code> fail with an error. Compression settings that are set on the builder override the values of meta files, settings that are not set fall back to the meta file value and then to the default.
<h2>Building again</h2>
<p>The same builder can run <code>Build()</code> several times, e.g. after changing the source paths. Each build starts fresh and clears the errors of the previous build.</p>
<h2>Debug mode</h2>
<p><code>SetDebugMode(true)</code> prints detailed progress to <code>stdout</code> - the same output as <code>--verbose</code> in the CLI tool.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1kuw60i4y16ior5l">
  <div class="main" data-node-id="node_mu3td1kuw60i4y16ior5l" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1kuw60i4y16ior5l" class="export-section">
    
    <div class="export-section__body"><h1>CLI Reference</h1>
<p>Quick reference for all <code>StaticForgeTool</code> arguments.</p>
<h2>Arguments</h2>
<div class="table-wrapper"><table><thead><tr><th>Argument</th><th>Short</th><th>Description</th><th>Type</th><th>Default</th><th>Multi</th></tr></thead><tbody><tr><td><code>--source</code></td><td><code>--src</code></td><td>Source directory of the files to be packed (can be specified multiple times)</td><td>filepath</td><td>—</td><td>yes</td></tr><tr><td><code>--output</code></td><td><code>--o</code></td><td>Output directory for packed archives or extracted files</td><td>filepath</td><td>—</td><td>no</td></tr><tr><td><code>--name</code></td><td><code>--n</code></td><td>Default archive name when no <code>.sfpak.meta</code> file is found</td><td>string</td><td><code>main</code></td><td>no</td></tr><tr><td><code>--mkdir</code></td><td><code>--p</code></td><td>Create the output directory if it does not exist</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--info</code></td><td><code>--i</code></td><td>Display header and index info of a <code>.sfpak</code> file (can be repeated)</td><td>filepath</td><td>—</td><td>yes</td></tr><tr><td><code>--extract</code></td><td><code>--x</code></td><td>Extract <code>.sfpak</code> file(s) into <code>&lt;output&gt;/&lt;archive name&gt;/</code> (can be repeated)</td><td>filepath</td><td>—</td><td>yes</td></tr><tr><td><code>--verbose</code></td><td><code>--v</code></td><td>Enable debug/verbose console output</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--store-names</code></td><td><code>--sn</code></td><td>Store original filenames in all archives for debug inspection and extraction</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--compress</code></td><td><code>--c</code></td><td>Compress files larger than 4096 bytes before storing them in the archive</td><td>bool</td><td>false</td><td>no</td></tr><tr><td><code>--help</code></td><td><code>--h</code></td><td>Show the help message</td><td>—</td><td>—</td><td>no</td></tr></tbody></table></div>
Short forms always use two dashes (<code>--v</code>, not <code>-v</code>).
<p>Arguments that can be repeated also accept a comma-separated list: <code>--source &quot;./textures, ./audio&quot;</code>.</p>
<h2>Compression settings</h2>
<p>Only used together with compression (<code>--compress</code> or <code>compress = true;</code> in a meta file). They override the values of <code>.sfpak.meta</code> files.</p>
<div class="table-wrapper"><table><thead><tr><th>Argument</th><th>Short</th><th>Description</th><th>Default</th><th>Range</th></tr></thead><tbody><tr><td><code>--compress-block-size</code></td><td><code>--cbs</code></td><td>Size in bytes of the blocks a file is split into for compression</td><td><code>65536</code></td><td>1024 - 67108864</td></tr><tr><td><code>--compress-table-size</code></td><td><code>--cts</code></td><td>Match table size as power of two (entries = 2^value)</td><td><code>16</code></td><td>8 - 24</td></tr><tr><td><code>--compress-min-match</code></td><td><code>--cmm</code></td><td>Shortest repeated sequence that is stored as a reference</td><td><code>8</code></td><td>4 - 65535</td></tr></tbody></table></div>
Larger blocks compress better, because a block can only reference data inside of itself. Above 64 KB the gain is very small.
<h2>Values</h2>
<ul><li><strong>bool</strong> arguments can be used without a value: <code>--verbose</code> is the same as <code>--verbose true</code>. Accepted values are <code>true</code>/<code>false</code>, <code>1</code>/<code>0</code>, <code>yes</code>/<code>no</code> and <code>y</code>/<code>n</code> (case insensitive). Anything else is an error, so a forgotten value like <code>--mkdir ./assets</code> is reported instead of silently being <code>false</code>.</li><li><strong>int</strong> arguments must be plain decimal numbers (<code>65536</code>, not <code>64k</code>).</li><li>All other arguments require a value.</li><li>Arguments and paths can contain any Unicode characters.</li></ul>
<h2>Modes</h2>
<p>Exactly one mode must be active per invocation. Modes are determined by which arguments are provided:</p>
<div class="table-wrapper"><table><thead><tr><th>Mode</th><th>Required arguments</th><th>Optional arguments</th></tr></thead><tbody><tr><td>pack</td><td><code>--source</code> and <code>--output</code></td><td><code>--name</code>, <code>--mkdir</code>, <code>--verbose</code>, <code>--store-names</code>, <code>--compress</code>, <code>--compress-*</code></td></tr><tr><td>extract</td><td><code>--extract</code> and <code>--output</code></td><td><code>--mkdir</code>, <code>--verbose</code></td></tr><tr><td>info</td><td><code>--info</code></td><td><code>--verbose</code></td></tr><tr><td>help</td><td><code>--help</code></td><td>—</td></tr></tbody></table></div>
Combining arguments from multiple modes (e.g. <code>--source</code> together with <code>--info</code>) is an error.
<h2>Exit code</h2>
<p>The tool returns <code>0</code> on success and a non-zero exit code on any error, so it can be used in build scripts.</p>
<h2>Command line priority</h2>
<p>When <code>--store-names</code> or <code>--compress</code> is set on the command line, the option is forced on for every archive regardless of what the <code>.sfpak.meta</code> file specifies. The meta-file value is only used when the CLI flag is absent.</p>
<p>The <code>--compress-*</code> settings replace the meta file values for all archives when they are set.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1ku1de5w2cswv1sn">
  <div class="main" data-node-id="node_mu3td1ku1de5w2cswv1sn" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1ku1de5w2cswv1sn" class="export-section">
    
    <div class="export-section__body"><h1>Architecture</h1>
<p>StaticForge is split into two main components.</p>
<h2>StaticForgeCore</h2>
<p>The core static library. Contains all format logic and is linked by both the tool and any consuming application:</p>
<ul><li>Archive format definition and binary layout</li><li><code>StaticForgeBuilder</code> - writes <code>.sfpak</code> files</li><li><code>StaticForgeReader</code> - reads and validates <code>.sfpak</code> files</li><li><code>StaticForgeArchive</code> - runtime handle for an open archive</li><li>Meta file parsing (<code>StaticForgeMeta</code>)</li><li>Internal helpers: hashing, alignment, endian handling, compression, memory mapping, error support</li></ul>
<p>Only the headers directly in <code>include/StaticForgeCore/</code> are part of the public API. The <code>Internal/</code> headers are not included in the SDK release packages.</p>
<h2>StaticForgeTool</h2>
<p>The CLI executable. Wraps <code>StaticForgeCore</code> with argument parsing and four modes: pack, extract, info, help. Does not contain any format logic itself.</p>
<p><code>Utf8Console</code> makes the tool work with Unicode on Windows: it reads the command line arguments as UTF-8 and switches the console output to UTF-8 while the tool runs. On other platforms the arguments already are UTF-8.</p>
<h2>Dependency graph</h2>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>StaticForgeTool
    └── StaticForgeCore
            ├── StaticForgeBuilder
            ├── StaticForgeReader
            ├── StaticForgeArchive
            └── Internal (helpers, meta, hashing, compression, mmap)

Your Game / Application
    └── StaticForgeCore
            ├── StaticForgeReader
            └── StaticForgeArchive</code></pre></div>
<p>The tool-side classes (<code>StaticForgeBuilder</code>, meta parsing) are compiled into Core but an application that only reads archives still links the same library - there is currently no separate runtime-only build target.</p>
<h2>Platforms</h2>
<p>Tested on Windows (MSVC) and Linux (GCC, Ubuntu). Archives are byte-identical across platforms: an archive packed on Windows can be loaded on Linux and the other way around.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1kuuhnvwc15ryskk">
  <div class="main" data-node-id="node_mu3td1kuuhnvwc15ryskk" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1kuuhnvwc15ryskk" class="export-section">
    
    <div class="export-section__body"><h1>File Format</h1>
<p>A <code>.sfpak</code> file consists of three required regions and three optional regions written sequentially: <strong>Header</strong>, <strong>Index</strong>, <strong>Data</strong>, and — when name storage is enabled — <strong>Name Table Header</strong>, <strong>Name Table Entries</strong>, and <strong>Name Table String Data</strong>.</p>
<p>All integers are stored little-endian on all platforms.</p>
<h2>Layout</h2>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>[ HEADER                 ]  52 bytes, padded to a multiple of ALIGNMENT_HEADER = 32 (64 bytes)
[ INDEX                  ]  N × 40 bytes, then padded to ALIGNMENT_FILE = 4096
[ DATA BLOCKS            ]  files written back-to-back, each padded to ALIGNMENT_FILE = 4096
[ NAME TABLE HEADER      ]  optional — present when store-names is enabled
[ NAME TABLE ENTRIES     ]  optional — one entry per file
[ NAME TABLE STRING DATA ]  optional — raw UTF-8 path strings packed together</code></pre></div>
<h2>Header</h2>
<p>Magic bytes <code>SFPK</code> followed by six <code>uint64_t</code> fields.</p>
<div class="table-wrapper"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><code>magic</code></td><td><code>char[4]</code></td><td>Always <code>S</code>, <code>F</code>, <code>P</code>, <code>K</code></td></tr><tr><td><code>version</code></td><td><code>uint64_t</code></td><td>Format version (currently <code>3</code>)</td></tr><tr><td><code>fileCount</code></td><td><code>uint64_t</code></td><td>Number of files in this archive</td></tr><tr><td><code>indexOffset</code></td><td><code>uint64_t</code></td><td>Byte offset to the start of the index</td></tr><tr><td><code>indexSize</code></td><td><code>uint64_t</code></td><td>Total size of the index in bytes (<code>fileCount × 40</code>)</td></tr><tr><td><code>dataOffset</code></td><td><code>uint64_t</code></td><td>Byte offset to the start of data</td></tr><tr><td><code>nameTableHeaderOffset</code></td><td><code>uint64_t</code></td><td>Byte offset to the Name Table Header, or <code>0</code> if not present</td></tr></tbody></table></div>
The reader only accepts archives with exactly its own <code>version</code>. The format is not backward compatible, archives are rebuilt with the application that uses them.
<h2>Index entry</h2>
<p>One 40-byte entry per file, stored contiguously starting at <code>indexOffset</code>.</p>
<div class="table-wrapper"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><code>hashName</code></td><td><code>uint64_t</code></td><td>64-bit FNV-1a hash of the relative file path</td></tr><tr><td><code>fileOffset</code></td><td><code>uint64_t</code></td><td>Byte offset of the file's data block relative to <code>dataOffset</code></td></tr><tr><td><code>fileSize</code></td><td><code>uint64_t</code></td><td>Original (uncompressed) file size in bytes</td></tr><tr><td><code>compressedFileSize</code></td><td><code>uint64_t</code></td><td>Total bytes on disk including the framing headers. <code>0</code> means stored uncompressed</td></tr><tr><td><code>filePadding</code></td><td><code>uint32_t</code></td><td>Padding bytes appended after the file data to reach the next 4096-byte boundary</td></tr><tr><td><code>checksum</code></td><td><code>uint32_t</code></td><td>32-bit FNV-1a checksum of the data as written on disk (covers framing headers + compressed data)</td></tr></tbody></table></div>
<h2>Data blocks</h2>
<p>Each file occupies one data block starting at <code>dataOffset + fileOffset</code>. The block is always padded with zero bytes to the next 4096-byte boundary; the padding size is stored in <code>filePadding</code>.</p>
<p>When <code>compressedFileSize == 0</code> the block contains the raw file bytes verbatim.</p>
<p>When <code>compressedFileSize != 0</code> the block contains a sequence of independently compressed chunks:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>[ CHUNK 0 ][ CHUNK 1 ][ ... ][ CHUNK N ]</code></pre></div>
<p>Each chunk has the following layout:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>[ compressedSize : uint32_t ]  size of the compressed payload that follows
[ originalSize   : uint32_t ]  size of the decompressed output for this chunk
[ payload        : bytes    ]  compressedSize bytes of compressed data</code></pre></div>
<p>Chunks are produced by splitting the original file into pieces of the compression block size (default 64 KB, at most <code>MAX_COMPRESSION_BLOCK_SIZE</code>) and compressing each piece independently. The decompressor reads chunks sequentially until all <code>compressedFileSize</code> bytes are consumed. Because each chunk carries its own original size, the reader does not need to know the block size that was used for packing.</p>
<p>The FNV-1a checksum covers all chunk bytes as written on disk — framing headers included — so integrity is verified before any decompression takes place.</p>
<blockquote><strong>Note:</strong> Compressed data blocks cannot be accessed via memory mapping. Use the stream-based <code>LoadAsset</code> API which handles decompression automatically.</blockquote>
<h2>Name Table Header</h2>
<p>Present only when the archive was built with name storage enabled. Located at <code>nameTableHeaderOffset</code>.</p>
<div class="table-wrapper"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><code>entryOffset</code></td><td><code>uint64_t</code></td><td>Byte offset to the first Name Table Entry</td></tr><tr><td><code>stringDataOffset</code></td><td><code>uint64_t</code></td><td>Byte offset to the start of Name Table String Data</td></tr></tbody></table></div>
<h2>Name Table Entry</h2>
<p>One 16-byte entry per file, stored contiguously starting at <code>entryOffset</code>, in the same order as the index.</p>
<div class="table-wrapper"><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><code>hash</code></td><td><code>uint64_t</code></td><td>FNV-1a hash of the path (matches <code>hashName</code> in the corresponding index entry)</td></tr><tr><td><code>nameLength</code></td><td><code>uint32_t</code></td><td>Length of the UTF-8 path string in bytes</td></tr><tr><td><code>nameOffset</code></td><td><code>uint32_t</code></td><td>Byte offset within the String Data region where this path starts</td></tr></tbody></table></div>
<h2>Name Table String Data</h2>
<p>Raw UTF-8 path strings packed end-to-end with no separators. To read a filename, seek to <code>stringDataOffset + nameOffset</code> and read <code>nameLength</code> bytes. Paths use <code>/</code> as separator and are relative to the source folder.</p>
<h2>Alignment</h2>
<ul><li>The header region is padded to a multiple of 32 bytes (<code>ALIGNMENT_HEADER</code>), which makes it 64 bytes.</li><li>Every file data block is padded to 4096 bytes (<code>ALIGNMENT_FILE</code>) — one filesystem page.</li><li>Padding bytes are always zero.</li></ul>
<p>This alignment ensures that file offsets are always multiples of 4096, which allows direct memory-mapped access for uncompressed assets without additional alignment work.</p>
<h2>Validation</h2>
<p><code>StaticForgeReader::Load</code> checks the archive against the real file size before allocating any memory:</p>
<ul><li><code>indexSize</code> must match <code>fileCount × 40</code>, and the index must be inside the file.</li><li><code>dataOffset</code> and the name table must be inside the file.</li><li>The data of every index entry must be inside the file, and every hash must be unique.</li><li>Every name table entry and every name must be inside the file.</li></ul>
<p>When loading a compressed entry, every chunk's <code>originalSize</code> must be at most <code>MAX_COMPRESSION_BLOCK_SIZE</code> and the sum must match <code>fileSize</code>. A corrupted archive is rejected with an error instead of crashing.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1kucsyh3x1ldzws1">
  <div class="main" data-node-id="node_mu3td1kucsyh3x1ldzws1" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1kucsyh3x1ldzws1" class="export-section">
    
    <div class="export-section__body"><h1>Hashing</h1>
<p>StaticForge uses <strong>FNV-1a</strong> (Fowler–Noll–Vo) for two purposes: filename lookup (64 bit) and data integrity (32 bit).</p>
<h2>Filename hashing</h2>
<p>When the builder packs a file, the relative path string (e.g. <code>textures/background.png</code>) is hashed with <strong>64-bit FNV-1a</strong> (offset basis <code>14695981039346656037</code>, prime <code>1099511628211</code>) and stored in the index as <code>hashName</code>.</p>
<p>At runtime, <code>StaticForgeArchive::LoadAsset</code> hashes the key string you pass in and looks it up in the index map. Unless the archive was built with <code>store-names</code>, the original string is not stored in the archive.</p>
<p><strong>Implications:</strong><br><ul><li>Lookups are O(1) via <code>std::unordered_map</code>.</li><li>Without a name table the archive cannot list filenames - only validate whether a known key exists. <code>--info --verbose</code> and <code>--extract</code> then show the hash instead (16 hex digits).</li><li>Hash collisions between two different paths in the same archive are detected at build time and cause an error. With 64 bit they are practically impossible (even with 100 000 files the probability is below one in a billion).</li></ul></p>
<h2>Data checksum</h2>
<p>During packing, each file's bytes as written to disk are fed through <strong>32-bit FNV-1a</strong> with the initial value <code>2166136261</code> to produce a <code>uint32_t</code> checksum. This is written into the index entry.</p>
<p>When loading, <code>StaticForgeArchive::LoadEntry</code> recomputes the checksum over the read bytes and compares it to the stored value. A mismatch causes <code>LoadAsset</code> to return <code>false</code> with an error message.</p>
<p>The checksum detects accidental damage. It is not a cryptographic signature and does not protect against intentional changes.</p>
<h2>Path format</h2>
<p>Use a path <strong>relative to the source root</strong> used during packing. The path is UTF-8 and case sensitive, backslashes are converted to forward slashes before hashing.</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// Correct</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">textures/background.png"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">data</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// Also valid</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">textures</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__escape">\\</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">background.png"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">data</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>

<template id="tmpl-node_mu3td1kulgv50d577zxf">
  <div class="main" data-node-id="node_mu3td1kulgv50d577zxf" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1kulgv50d577zxf" class="export-section">
    
    <div class="export-section__body"><h1>Build Process</h1>
<p><code>StaticForgeBuilder::Build()</code> resets the data of a previous build, then runs four internal phases in sequence.</p>
<h2>1. CheckCompressionSettings</h2>
<p>Validates the compression settings set on the builder (block size, table size, min match length) against the <code>MIN_COMPRESSION_*</code> / <code>MAX_COMPRESSION_*</code> ranges. Settings that are not set are skipped.</p>
<h2>2. CheckFilepaths</h2>
<p>Validates that:</p>
<ul><li>the default archive name is a valid file name (no <code>/</code> or <code>\</code>, not <code>.</code> or <code>..</code>)</li><li>all source paths exist and are directories</li><li>the output path is not an archive file path (ending with <code>.sfpak</code>) and, if it exists, is a directory</li></ul>
<p>If <code>SetCreateOutputDir(true)</code> was called and the output directory is missing, it is created here.</p>
<h2>3. ScanFiles</h2>
<p>Each source directory is read <strong>once</strong> into a list of files. Read errors are reported as build errors. Then two passes run over these lists:</p>
<p><strong>Pass 1 — Meta collection:</strong>  <br>Collects all files ending with <code>.sfpak.meta</code> and builds a <code>directory → StaticForgeMetaData</code> mapping. Each entry stores the archive name, excluded extensions, the <code>store-names</code> and <code>compress</code> flags and the optional compression settings. Archive names and compression settings are validated here.</p>
<p><strong>Pass 2 — File assignment:</strong>  <br>Iterates all non-meta files, computes their relative path, hashes it with 64-bit FNV-1a, and assigns each file to the appropriate <code>ArchiveGroup</code> by walking up the directory tree until a meta entry is found. Falls back to the default archive name if no meta file applies.</p>
<p>For each file the builder also:<br><ul><li>Skips files whose name ends with one of the excluded extensions (case insensitive).</li><li>Detects hash collisions between files in the same group and reports them as errors.</li><li>Applies the overrides when an archive group is created:<ul><li><code>store-names</code> and <code>compress</code>: if the global flag is set, it is forced on even when the meta file sets it to <code>false</code>.</li><li>compression settings: builder value → meta file value → default.</li></ul></li></ul></p>
<h2>4. CreateGroups</h2>
<p>For each <code>ArchiveGroup</code> the output file <code>&lt;output&gt;/&lt;archive name&gt;.sfpak</code> is created and the following phases run in order:</p>
<p><strong>CalculateDataStart</strong> — computes the byte offset at which file data begins. This is the sum of the aligned header size and the index table size, rounded up to the next 4096-byte boundary.</p>
<p><strong>WriteData</strong> — writes <code>dataStart</code> bytes of zero-padding to reserve space for the header and index, then writes all file data blocks. During this pass, <code>blockOffset</code>, <code>filePadding</code>, <code>checksum</code>, and <code>compressedFileSize</code> are filled in on each file entry so the index can be written correctly afterwards.</p>
<p><strong>WriteHeader</strong> — seeks back to offset <code>0</code> and writes the <code>StaticForgeHeader</code> struct, padded to a multiple of 32 bytes.</p>
<p><strong>WriteIndex</strong> — writes one <code>StaticForgeIndexEntry</code> per file directly after the header. Checksums computed during <code>WriteData</code> are included here — no second seek is needed.</p>
<p><strong>BuildNameTable</strong> <em>(optional, when store-names is enabled)</em> — computes the byte layout of the Name Table Header, Name Table Entries, and String Data region. Offsets are appended after the last data block.</p>
<p><strong>WriteNameTable</strong> <em>(optional)</em> — seeks to <code>nameTableStart</code> (set at the end of <code>WriteData</code>) and writes the Name Table Header, Name Table Entries, and raw UTF-8 string data.</p>
<h2>Write phases summary</h2>
<div class="table-wrapper"><table><thead><tr><th>Phase</th><th>Seeks to</th><th>What it writes</th></tr></thead><tbody><tr><td><code>WriteData</code></td><td><code>0</code> (start)</td><td><code>dataStart</code> zero-padding, then all file data blocks in order</td></tr><tr><td><code>WriteHeader</code></td><td><code>0</code> (seekp back)</td><td><code>StaticForgeHeader</code> struct padded to a multiple of 32 bytes</td></tr><tr><td><code>WriteIndex</code></td><td>after header</td><td>One <code>StaticForgeIndexEntry</code> per file, including computed checksums</td></tr><tr><td><code>WriteNameTable</code></td><td><code>nameTableStart</code> (seekp forward)</td><td>Name Table Header, Name Table Entries, raw UTF-8 string data</td></tr></tbody></table></div>
<h2>Compression</h2>
<p>When compression is enabled for an archive group (via the meta file or the global <code>SetCompress</code> flag), files larger than 4096 bytes are compressed. Compression is applied per block during <code>WriteData</code>:</p>
<ul><li>The file is read in blocks of the compression block size (default 64 KB) and each block is compressed independently.</li><li>Each compressed block is prefixed with a framing header: <code>[uint32_t compressedSize][uint32_t originalSize]</code> (little-endian).</li><li>The raw compressed bytes follow immediately after the framing header.</li><li><code>compressedFileSize</code> in the index entry is set to the total number of bytes written for the file, <strong>including</strong> the framing headers. A value of <code>0</code> means the entry is stored uncompressed.</li></ul>
<p>The per-block approach means the decompressor can process one block at a time.</p>
<p>The FNV-1a checksum covers the framing headers and compressed block data as written, so integrity verification happens before decompression.</p>
<h3>Compressor</h3>
<p>The compressor (<code>Internal::LZ4Compression</code>) is an LZ77 compressor inspired by LZ4, with its own simple format:</p>
<div class="table-wrapper"><table><thead><tr><th>Block</th><th>Layout</th><th>Meaning</th></tr></thead><tbody><tr><td>literal</td><td><code>[0x01][len:u16][len bytes]</code></td><td>Bytes stored as they are</td></tr><tr><td>match</td><td><code>[0x02][distance:u16][len:u16]</code></td><td>Copy <code>len</code> bytes from <code>distance</code> bytes back</td></tr><tr><td>end</td><td><code>[0x00]</code></td><td>End of the compressed block</td></tr></tbody></table></div>
For every position the compressor looks up the last position of the same 4-byte sequence in a hash table (<code>compress-table-size</code>). A match is extended as far as possible and only stored if it is at least <code>compress-min-match</code> bytes long — shorter matches would take more space than storing the bytes as literals. A match can only reference data inside the same block and at most 65535 bytes back.
<p>The hash table is only allocated when compressing and is reset per block with a generation counter instead of clearing the whole table.</p>
<h2>Overflow safety</h2>
<p>All size and offset arithmetic uses checked helpers that return <code>false</code> on overflow instead of wrapping silently:</p>
<div class="table-wrapper"><table><thead><tr><th>Helper</th><th>Description</th></tr></thead><tbody><tr><td><code>SafeAddU64</code></td><td>Addition with overflow check</td></tr><tr><td><code>SafeMulU64</code></td><td>Multiplication with overflow check</td></tr><tr><td><code>SafeAlignSize</code></td><td>Rounds up to a power-of-two alignment, overflow-safe</td></tr><tr><td><code>GetHeaderSize</code></td><td>Returns the aligned header size via <code>SafeAlignSize</code></td></tr></tbody></table></div>
Any overflow causes <code>Build()</code> to return <code>false</code> with a descriptive error.</div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1ku1hsv9km18cfhyf">
  <div class="main" data-node-id="node_mu3td1ku1hsv9km18cfhyf" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1ku1hsv9km18cfhyf" class="export-section">
    
    <div class="export-section__body"><h1>Meta File Parser</h1>
<p>Meta files use a minimal custom format parsed by <code>StaticForgeMeta</code> inside <code>StaticForgeCore</code>.</p>
<h2>Syntax</h2>
<p>Each statement is a key-value pair terminated by a semicolon:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>key = value;</code></pre></div>
<p>Multiple statements can appear in any order:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>archive = main;
exclude = .png, .jpg, .vert, .help;
store-names = true;</code></pre></div>
<p>Comments start with <code>#</code> and run to the end of the line:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code># this is a comment
archive = main; # this is also a comment</code></pre></div>
<h2>Tokenizer</h2>
<p><code>MetaTokenizer</code> reads the entire file into memory (skipping a UTF-8 BOM), then walks it character by character via <code>ProcessContent</code> → <code>ProcessChar</code>. It tracks the current line and column for error reporting and produces a flat <code>std::vector&lt;MetaToken&gt;</code>. Columns count characters, not bytes, so multi-byte UTF-8 characters count as one column.</p>
<p><strong>Character dispatch (<code>ProcessChar</code>):</strong></p>
<div class="table-wrapper"><table><thead><tr><th>Input</th><th>Action</th></tr></thead><tbody><tr><td>Whitespace (<code>\r</code>, <code>\n</code>, <code> </code>, <code>\t</code>)</td><td>Skipped; newlines increment the line counter</td></tr><tr><td><code>=</code></td><td>Emit <code>Assign</code></td></tr><tr><td><code>,</code></td><td>Emit <code>Separator</code></td></tr><tr><td><code>;</code></td><td>Emit <code>Delimiter</code></td></tr><tr><td><code>#</code></td><td>Call <code>SkipComment</code> — consume until <code>\n</code></td></tr><tr><td>Letter, digit, <code>_</code>, <code>.</code>, <code>-</code>, UTF-8 byte</td><td>Call <code>ReadIdentifier</code></td></tr><tr><td>Anything else</td><td>Add error, emit <code>UNKNOWN</code></td></tr></tbody></table></div>
<strong><code>ReadIdentifier</code>:</strong> records the start pointer, then advances <code>m_cur</code> while the character is an identifier character (<code>IsIdentifierChar</code>: alphanumeric, <code>_</code>, <code>.</code>, <code>-</code> or a byte ≥ <code>0x80</code>, which is part of a UTF-8 character). The resulting <code>string_view</code> into the in-memory buffer is stored in the token without any heap allocation.
<p><strong>Token types:</strong></p>
<div class="table-wrapper"><table><thead><tr><th>Token type</th><th>Description</th></tr></thead><tbody><tr><td><code>Identifier</code></td><td>An unquoted word — keys, values, extensions, booleans, numbers</td></tr><tr><td><code>Assign</code></td><td>The <code>=</code> character</td></tr><tr><td><code>Separator</code></td><td>The <code>,</code> character (used between list values like extensions)</td></tr><tr><td><code>Delimiter</code></td><td>The <code>;</code> character — terminates a statement</td></tr><tr><td><code>EndOfFile</code></td><td>Sentinel appended after the last character</td></tr><tr><td><code>UNKNOWN</code></td><td>Unrecognised character; always accompanied by an error</td></tr></tbody></table></div>
Every token stores its <strong>line</strong> and <strong>column</strong> at the point it was emitted.
<h2>Parser</h2>
<p><code>StaticForgeMeta::ParseTokens</code> consumes the token stream produced by <code>MetaTokenizer</code>. Each statement follows this pattern:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>Identifier(key)  Assign  Identifier(value)  Delimiter</code></pre></div>
<p>For list values (e.g. <code>exclude</code>) the value section is instead:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>Identifier  Separator  Identifier  Separator  ...  Identifier  Delimiter</code></pre></div>
<p>Any deviation — wrong token type, unexpected <code>EndOfFile</code>, missing <code>Delimiter</code> — is a parse error. Errors about the statement structure include the line and column of the offending token.</p>
<h2>Error suggestions</h2>
<p>If a key is not recognised, the parser compares it with every known key. Separators (<code>-</code>, <code>_</code>, space) and case are ignored, and the names are compared character by character. If the lengths differ by at most 3 and at most 3 characters are different, a suggestion is appended to the error:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>Unknown identifier &#39;archiv&#39;. Did you mean &#39;archive&#39;?</code></pre></div>
<h2>Supported parameters</h2>
<div class="table-wrapper"><table><thead><tr><th>Key</th><th>Type</th><th>Required</th><th>Description</th></tr></thead><tbody><tr><td><code>archive</code></td><td>string</td><td>yes</td><td>Name for the <code>.sfpak</code> archive</td></tr><tr><td><code>exclude</code></td><td>string[]</td><td>no</td><td>Comma-separated list of file extensions to skip</td></tr><tr><td><code>store-names</code></td><td>bool</td><td>no</td><td>Store original filenames in the archive for debug inspection and extraction</td></tr><tr><td><code>compress</code></td><td>bool</td><td>no</td><td>Compress files larger than 4096 bytes</td></tr><tr><td><code>compress-block-size</code></td><td>uint</td><td>no</td><td>Compression block size in bytes</td></tr><tr><td><code>compress-table-size</code></td><td>uint</td><td>no</td><td>Compressor match table size as power of two</td></tr><tr><td><code>compress-min-match</code></td><td>uint</td><td>no</td><td>Shortest match the compressor stores as reference</td></tr></tbody></table></div>
<h2>Value parsing</h2>
<p><strong><code>archive</code></strong> — the <code>Identifier</code> token value is used as-is. The builder rejects names containing <code>/</code> or <code>\</code> and the names <code>.</code> and <code>..</code>.</p>
<p><strong><code>exclude</code></strong> — after the <code>=</code>, the parser collects <code>Identifier</code> tokens separated by <code>Separator</code> (<code>,</code>) tokens until it sees a <code>Delimiter</code> (<code>;</code>). Each value is lowercased and a missing leading dot is added, so <code>.PNG</code>, <code>.png</code> and <code>png</code> are treated identically.</p>
<p><strong><code>store-names</code>, <code>compress</code></strong> — the single <code>Identifier</code> token after <code>=</code> is compared case-insensitively. Only <code>true</code> and <code>false</code> are valid, anything else is a parse error.</p>
<p><strong><code>compress-block-size</code>, <code>compress-table-size</code>, <code>compress-min-match</code></strong> — parsed with <code>std::from_chars</code> as an unsigned decimal number. The whole value has to be a number (<code>64k</code> or <code>-5</code> are errors). The builder checks the value against the valid range.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1ku1t629jd11ytz7k">
  <div class="main" data-node-id="node_mu3td1ku1t629jd11ytz7k" data-tab-id="tab_mu3td1ku1xe2e1n1pqfbar">
    <section id="node_mu3td1ku1t629jd11ytz7k" class="export-section">
    
    <div class="export-section__body"><h1>StaticForgeArchive</h1>
<p><code>StaticForgeArchive</code> is the runtime handle for a loaded <code>.sfpak</code> file. It is populated by <code>StaticForgeReader::Load</code> and then used to retrieve asset data.</p>
<h2>Ownership and move semantics</h2>
<p><code>StaticForgeArchive</code> is move-only. Copying is deleted because it owns an open <code>std::ifstream</code>.</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">a</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">b</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">move</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">a</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// OK</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">c</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">a</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">            </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// compile error</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>An archive object can be loaded again with <code>StaticForgeReader::Load</code>. The reader calls the private <code>Reset()</code> first, which closes the stream and the memory mapping and clears the header, index, name table and errors of the previous archive.</p>
<h2>Internal state</h2>
<div class="table-wrapper"><table><thead><tr><th>Member</th><th>Description</th></tr></thead><tbody><tr><td><code>m_path</code></td><td>Path to the <code>.sfpak</code> file on disk</td></tr><tr><td><code>m_stream</code></td><td><code>std::ifstream</code> used for stream-based reads</td></tr><tr><td><code>m_mmap</code></td><td><code>std::unique_ptr&lt;Internal::MmapFile&gt;</code> used for memory mapping</td></tr><tr><td><code>m_compressor</code></td><td><code>std::unique_ptr&lt;Internal::LZ4Compression&gt;</code> used for decompression</td></tr><tr><td><code>m_header</code></td><td>Parsed <code>StaticForgeHeader</code> struct</td></tr><tr><td><code>m_indexEntries</code></td><td><code>std::vector&lt;StaticForgeIndexEntry&gt;</code> — one per file</td></tr><tr><td><code>m_hashNameToEntry</code></td><td><code>std::unordered_map&lt;uint64_t, size_t&gt;</code> for O(1) lookup</td></tr><tr><td><code>m_indexToName</code></td><td><code>std::unordered_map&lt;size_t, std::string&gt;</code> for reverse name lookup</td></tr></tbody></table></div>
<h2>LoadAsset flow</h2>
<ol><li>Normalize the slashes of the key and hash it with <code>HashFilename</code> (64-bit FNV-1a).</li><li>Look up the hash in <code>m_hashNameToEntry</code> to find the index position.</li><li>Call <code>LoadEntry</code>:</li></ol>
<ul><li>Clear the stream state, so a previous failed read does not break this one.</li><li>If <code>compressedFileSize == 0</code> (uncompressed): seek to <code>dataOffset + fileOffset</code>, read <code>fileSize</code> bytes, validate the FNV-1a checksum, return the raw bytes.</li><li>If <code>compressedFileSize != 0</code> (compressed): seek to <code>dataOffset + fileOffset</code>, read <code>compressedFileSize</code> bytes, validate the checksum, then decompress block by block. Each block is prefixed with <code>[uint32_t compressedSize][uint32_t originalSize]</code> and decompressed independently until all bytes are consumed. The reassembled output must equal <code>fileSize</code> bytes.</li></ul>
<ol><li>Return the decompressed (or raw) bytes in <code>outData</code>.</li></ol>
<p><code>LoadAssetAt(index, &amp;data)</code> skips steps 1 and 2 and loads the entry at the given index directly.</p>
<h2>LoadAssetMapped / GetAssetMapped flow</h2>
<ol><li>Verify the archive is memory-mapped (<code>IsMapped()</code>).</li><li>Hash the key and look up the index entry.</li><li><strong>Reject compressed entries</strong> — if <code>compressedFileSize != 0</code>, add an error and return <code>false</code> / empty view. Use <code>LoadAsset</code> instead for compressed assets.</li><li>Get the pointer with <code>MmapFile::At(offset, size)</code>, which returns <code>nullptr</code> if the range <code>[dataOffset + fileOffset, fileSize]</code> is not inside the mapped file. An empty range at the end of the file is valid.</li><li><code>GetAssetMapped</code> returns a non-owning <code>AssetView</code> pointing directly into mapped memory — no copy.</li></ol>
   <code>LoadAssetMapped</code> validates the checksum first, then copies the bytes into <code>outData</code>.
<blockquote>The <code>AssetView</code> is only valid while the archive remains mapped. Call <code>CloseMapped</code> only after you are done with all views.</blockquote>
<p><code>OpenMapped</code> works with relative and absolute paths. On Windows the path is made absolute and prefixed with <code>\\?\</code>, so long paths work too.</p>
<h2>Access method comparison</h2>
<div class="table-wrapper"><table><thead><tr><th>Method</th><th>Compressed</th><th>Allocates</th><th>Copies data</th></tr></thead><tbody><tr><td><code>LoadAsset</code></td><td>✅</td><td>✅</td><td>✅</td></tr><tr><td><code>LoadAssetAt</code></td><td>✅</td><td>✅</td><td>✅</td></tr><tr><td><code>LoadAssetMapped</code></td><td>❌</td><td>✅</td><td>✅</td></tr><tr><td><code>GetAssetMapped</code></td><td>❌</td><td>❌</td><td>❌</td></tr></tbody></table></div>

<p>All getters read directly from <code>m_header</code> or <code>m_indexEntries</code> and are cheap:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetVersion</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">       </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// uint64_t</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetFileCount</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">     </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// size_t</span>

<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetDataOffset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// uint64_t</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">StoresNames</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">      </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// bool — true if name table is present</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetHashName</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">i</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">     </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// uint64_t — 0 if i is invalid</span>

<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetFileSize</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">i</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">     </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// uint64_t — 0 if i is invalid</span>
