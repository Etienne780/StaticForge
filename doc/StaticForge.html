    <section id="node_mu3td1kuufx8v3a1hzju" class="export-section">
    
    <div class="export-section__body"><h1>Getting Started</h1>
<p>StaticForge is an asset archive system for bundling and loading game files. It combines multiple files into a compact <code>.sfpak</code> container that can be efficiently read at runtime.</p>
<h2>What you get</h2>
<ul><li>A command-line tool (<code>StaticForgeTool</code>) to pack your assets during your build process, and to inspect or extract existing archives</li><li>A C++ library (<code>StaticForgeCore</code>) to load assets from <code>.sfpak</code> files at runtime</li></ul>
<h2>Typical workflow</h2>
<ol><li>Organize your asset folders</li><li>Optionally add <code>.sfpak.meta</code> files to control how folders are grouped into archives</li><li>Run <code>StaticForgeTool</code> to pack your assets into one or more <code>.sfpak</code> files</li><li>At runtime, use <code>StaticForgeReader</code> and <code>StaticForgeArchive</code> to load assets by path</li></ol>
<hr>
<blockquote><strong>Tip:</strong> <code>.sfpak</code> files are binary and not meant to be edited manually. Always rebuild them from source assets using the tool.</blockquote>
<blockquote><strong>Note:</strong> The archive format is not meant for long-term storage. Archives are rebuilt together with your application, so the reader only accepts archives of its own format version (currently <code>3</code>).</blockquote></div>
  </section>

<template id="tmpl-node_mu3td1ku93dq7vjxmvr2">
  <div class="main" data-node-id="node_mu3td1ku93dq7vjxmvr2" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1ku93dq7vjxmvr2" class="export-section">
    
    <div class="export-section__body"><h1>Packing Assets</h1>
<p>Use <code>StaticForgeTool</code> to pack a folder of assets into a <code>.sfpak</code> archive.</p>
<h2>Basic usage</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">assets</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>This scans <code>./assets</code> recursively and writes the archive to <code>./build/main.sfpak</code>.</p>
<h2>Specifying an archive name</h2>
<p>By default the archive is named <code>main</code>. Use <code>--name</code> to override:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">assets</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--name</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">textures</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>This produces <code>./build/textures.sfpak</code>. The name may contain dots (<code>textures.hd</code> produces <code>textures.hd.sfpak</code>) and non-ASCII characters, but no <code>/</code> or <code>\</code>.</p>
<h2>Multiple source folders</h2>
<p><code>--source</code> can be repeated to include multiple directories:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">textures</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">audio</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>or</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__string">"</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__string">./textures, ./audio"</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Every source path has to be a directory. Asset paths inside the archive are relative to the source folder they were found in, so two source folders must not contain the same relative path.</p>
<h2>Output directory</h2>
<p><code>--output</code> is always a directory. The archive file name comes from <code>--name</code> or from a meta file (see <em>Meta Files</em>), so a path like <code>./build/main.sfpak</code> is rejected. Directory names with dots (e.g. <code>./build/v1.0</code>) are fine.</p>
<p>If the output directory doesn't exist yet, add <code>--mkdir</code>:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">assets</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">packed</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--mkdir</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>The archives are written to temporary files (<code>&lt;name&gt;.sfpak.tmp</code>) and renamed when all of them are written. If the build fails, the existing archives stay as they were, the temporary files are removed and a directory created by <code>--mkdir</code> is removed again.</p>
<h2>Compression</h2>
<p>Add <code>--compress</code> to compress every file larger than 4096 bytes:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">assets</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--compress</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Compressed assets are decompressed automatically by <code>LoadAsset</code> and <code>LoadAssetMapped</code>, only the zero-copy view <code>GetAssetMapped</code> is not possible for them. Data that doesn't compress well, like JPG, PNG or OGG files, is stored uncompressed automatically (per block and per file, see <code>--compress-min-saving</code>), so compression never makes an archive noticeably larger. The compression can be tuned with <code>--compress-block-size</code>, <code>--compress-table-size</code>, <code>--compress-min-match</code> and <code>--compress-min-saving</code>, see <em>CLI Reference</em>. The defaults are the most efficient values for typical game assets.</p>
<p>Already compressed formats (PNG, JPG, OGG, ...) barely get smaller, text and uncompressed data (shaders, scripts, JSON, meshes) compress well.</p>
<h2>Incremental builds</h2>
<p>With <code>--cache-dir</code> only the archives whose files or settings changed are built, the others are skipped and keep their modification time:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">assets</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">packed</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--cache-dir</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">intermediates</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">release</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">sfcache</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>Build was successful (1 archive built, 3 up to date)</code></pre></div>
<p>The cache directory holds one small text file per archive (<code>&lt;archive name&gt;.sfcache</code>), it is created automatically. Keep it outside of the output directory, so the released build only contains the archives. Use one cache directory per build configuration, e.g. <code>intermediates/debug/sfcache</code> and <code>intermediates/release/sfcache</code>.</p>
<p>An archive is built again if:</p>
<ul><li>a file was added, removed or changed (size, or content after a changed modification time)</li><li>its settings changed (meta file or command line)</li><li>the archive file is missing or was changed</li><li>the cache file is missing or invalid, or the archive format version changed</li><li><code>--rebuild</code> is set</li></ul>
<p>A file with a new modification time but the same content, e.g. after a <code>git checkout</code>, doesn't trigger a build.</p>
<p>An archive that is not built anymore, e.g. because its meta file was deleted, is deleted from the output directory together with its cache file after a successful build:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>audio: not built anymore, archive and cache file are deleted

Build was successful (1 archive built, 2 up to date, 1 removed)</code></pre></div>
<p>Only archives with a cache file of the same output directory are deleted. <code>--verbose</code> shows the reason for every archive:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>===================================
Up to date check (cache: ./build/intermediates/release/sfcache)
===================================
audio: up to date
data: rebuild, &#39;data/items.json&#39; changed
main: up to date
textures: up to date</code></pre></div>
<p>The cache files store the modification times of the local file system, so they belong to one machine and are not meant to be committed.</p>
<h2>Bool arguments</h2>
<p>Bool arguments like <code>--mkdir</code>, <code>--verbose</code>, <code>--store-names</code> and <code>--compress</code> can be used without a value. <code>--verbose</code> is the same as <code>--verbose true</code>. Accepted values are <code>true</code>/<code>false</code>, <code>1</code>/<code>0</code>, <code>yes</code>/<code>no</code> and <code>y</code>/<code>n</code>, anything else is an error.</p>
<h2>Verbose output</h2>
<p>Add <code>--verbose</code> (or <code>--v</code>) to print detailed information about every file processed:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--source</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">assets</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--verbose</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>The output has these sections:</p>
<ul><li><strong>Paths</strong> - the output and source paths, with the absolute path in brackets.</li><li><strong>Meta files</strong> - every meta file found and the values it sets.</li><li><strong>Files</strong> - the files of every archive with their source file, and the excluded files.</li><li><strong>Writing archive</strong> - one section per archive, sorted by name: the settings that are really used (command line, meta file or default), the layout of header, index and data, and for every file its hash, offset, size, how it is stored (raw or compressed, and why it is raw), padding and checksum. Archives with stored names also show the layout of the name table.</li></ul>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>===================================
Writing archive &#39;textures&#39; -&gt; ./build/textures.sfpak
===================================
store-names: true
compress: true
compression: block size 65536, table size 2^16, min match 8, min saving 10%
header: offset 0, 64 bytes (52 + padding)
index: offset 64, 3 x 40 = 120 bytes
data: offset 4096
files (3):
  [0] textures/hero.png
      - hash: f798a942ed32fd87
      - offset: 0 (in file 4096)
      - size: 20000 bytes
      - stored: raw, compressed 20008 bytes, saving below 10%
      - padding: 480 bytes (aligned 20480 bytes)
      - checksum: fbd33a7b
  ...
  [2] textures/ui/theme.txt
      - hash: 8e586dbde1d8ef94
      - offset: 32768 (in file 36864)
      - size: 23492 bytes
      - stored: 3633 bytes compressed (-84%), 1 block
      - padding: 463 bytes (aligned 4096 bytes)
      - checksum: a08daa81
name table:
  - header: offset 40960, 32 bytes
  - entries: offset 40992, 3 x 16 = 48 bytes
  - names: offset 41040, 60 bytes, raw
archive size: 41100 bytes</code></pre></div>
<p>The offset of a file is relative to the start of the data, <code>in file</code> is the position in the archive file.</p>
<h2>Unicode</h2>
<p>File names, directories, archive names and command line arguments can contain any Unicode characters (e.g. <code>纹理/背景.png</code>). Names are stored as UTF-8.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1ku1d4g35y4wv21q">
  <div class="main" data-node-id="node_mu3td1ku1d4g35y4wv21q" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1ku1d4g35y4wv21q" class="export-section">
    
    <div class="export-section__body"><h1>Meta Files</h1>
<p>Meta files let you split assets from a single source tree into multiple <code>.sfpak</code> archives automatically.</p>
<h2>File format</h2>
<p>A meta file is any file whose name ends with <code>.sfpak.meta</code> (e.g. <code>textures.sfpak.meta</code> or <code>my.textures.sfpak.meta</code>). It uses a simple semicolon-terminated key-value syntax:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>archive = textures;
exclude = .png, .jpg;
store-names = true;</code></pre></div>
<p>Each statement is a <code>key = value;</code> pair. Whitespace around <code>=</code> and <code>;</code> is ignored.</p>
<p>Comments start with <code>#</code> and run to the end of the line:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code># pack all UI assets together
archive = ui;
exclude = .psd; # skip source files</code></pre></div>
<p>Meta files are read as UTF-8, values can contain any Unicode characters (e.g. <code>archive = 纹理;</code>). A UTF-8 BOM at the start of the file is ignored.</p>
<h2>Supported parameters</h2>
<div class="table-wrapper"><table><thead><tr><th>Key</th><th>Type</th><th>Required</th><th>Description</th></tr></thead><tbody><tr><td><code>archive</code></td><td>string</td><td>yes</td><td>Name for the <code>.sfpak</code> archive produced from this directory</td></tr><tr><td><code>exclude</code></td><td>string[]</td><td>no</td><td>Comma-separated list of file extensions to skip (e.g. <code>.png</code>, <code>.tar.gz</code>)</td></tr><tr><td><code>store-names</code></td><td>bool</td><td>no</td><td>Store original filenames in the archive for debug inspection and extraction</td></tr><tr><td><code>compress</code></td><td>bool</td><td>no</td><td>Compress files larger than 4096 bytes</td></tr><tr><td><code>compress-block-size</code></td><td>int</td><td>no</td><td>Block size in bytes used for compression (1024 - 67108864, default 65536)</td></tr><tr><td><code>compress-table-size</code></td><td>int</td><td>no</td><td>Compressor match table size as power of two (8 - 24, default 16)</td></tr><tr><td><code>compress-min-match</code></td><td>int</td><td>no</td><td>Shortest repeated sequence stored as a reference (4 - 65535, default 8)</td></tr><tr><td><code>compress-min-saving</code></td><td>int</td><td>no</td><td>Percent a block or file must get smaller to be stored compressed (0 - 99, default 5)</td></tr></tbody></table></div>
<p>Bool values are <code>true</code> or <code>false</code> (case insensitive). Int values are plain decimal numbers without units (<code>65536</code>, not <code>64k</code>).</p>
<p>Example with all parameters:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>archive = main;
exclude = .png, .jpg, .vert, .help;
store-names = true;
compress = true;
compress-block-size = 65536;
compress-table-size = 16;
compress-min-match = 8;
compress-min-saving = 5;</code></pre></div>
<h2>Archive names</h2>
<p>The archive name becomes the file name of the archive (<code>archive = textures;</code> produces <code>textures.sfpak</code>). It may contain dots (<code>textures.hd</code> produces <code>textures.hd.sfpak</code>) but no <code>/</code> or <code>\</code>, and it must not be <code>.</code> or <code>..</code>. Two archive names of one build must not only differ in case (<code>Audio</code> and <code>audio</code>), because they would be the same file on Windows.</p>
<h2>Excluding files</h2>
<p>A file is excluded if its name <strong>ends</strong> with one of the <code>exclude</code> entries:</p>
<ul><li>The comparison is case insensitive (<code>.PNG</code> excludes <code>image.png</code>).</li><li>Multi-part extensions work (<code>.tar.gz</code> excludes <code>data.tar.gz</code>, but not <code>data.gz</code>).</li><li>A missing dot is added (<code>png</code> is the same as <code>.png</code>), so <code>png</code> does not exclude <code>image.xpng</code>.</li></ul>
<h2>How it works</h2>
<p>When the tool scans your source directories it looks for <code>.sfpak.meta</code> files. Every asset file in the same directory (or any subdirectory) is then packed into the archive named in that meta file. If a subdirectory has its own meta file, that one is used for the subdirectory. Excluded extensions are skipped entirely. Each directory can contain only one meta file.</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>assets/
  textures/
    textures.sfpak.meta   &lt;- archive = textures; exclude = .psd;
    background.png
    ui.png
  audio/
    audio.sfpak.meta      &lt;- archive = audio;
    music.ogg
    sfx.wav
  scripts/
    game.lua              &lt;- no meta file → goes into the default archive</code></pre></div>
<p>Running the tool on <code>assets/</code> produces:<br><ul><li><code>textures.sfpak</code></li><li><code>audio.sfpak</code></li><li><code>main.sfpak</code> (for everything without a meta file)</li></ul></p>
<p>Asset paths inside the archive are always relative to the source folder, not to the meta file. <code>background.png</code> above is loaded as <code>textures/background.png</code>.</p>
<h2>Fallback</h2>
<p>Files that are not covered by any meta file are packed into the archive name set with <code>--name</code> (default: <code>main</code>).</p>
<h2>Command line overrides</h2>
<p>Values set on the command line win over the meta file:</p>
<ul><li><code>--store-names</code> and <code>--compress</code> force the option on for <strong>all</strong> archives, even those whose meta file sets it to <code>false</code>. The meta value only takes effect when the CLI flag is not set.</li><li><code>--compress-block-size</code>, <code>--compress-table-size</code>, <code>--compress-min-match</code> and <code>--compress-min-saving</code> replace the meta file value for all archives. Without the CLI argument the meta value is used, without both the default.</li></ul></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1ku1w2zp279b2ssx">
  <div class="main" data-node-id="node_mu3td1ku1w2zp279b2ssx" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1ku1w2zp279b2ssx" class="export-section">
    
    <div class="export-section__body"><h1>Inspecting Archives</h1>
<p>Use <code>--info</code> to display header and index information of one or more existing <code>.sfpak</code> files, <code>--verify</code> to check them for damage, and <code>--extract</code> to turn an archive back into normal files.</p>
<h2>Basic info</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--info</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">textures</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">sfpak</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Output:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>Archive: textures.sfpak
Version: 3
File count: 2
Index offset: 64
Index size: 80
Data offset: 4096</code></pre></div>
<h2>Inspecting multiple archives at once</h2>
<p><code>--info</code> can be repeated to inspect several archives in one invocation:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--info</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">textures</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">sfpak</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--info</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">audio</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">sfpak</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Each archive is printed in sequence, separated by an empty line. With more than one archive the full path is shown instead of only the file name.</p>
<h2>Verbose index listing</h2>
<p>Add <code>--verbose</code> to also print every index entry:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--info</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">textures</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">sfpak</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--verbose</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Output includes a line per file showing its hash (hexadecimal), byte offset relative to the data section, and original size:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>Index entries:
  [0] hash: a01c85352df03fae, offset: 0, size: 9
  [1] hash: 0254d0414b3d0eaf, offset: 4096, size: 200000</code></pre></div>
<p>If the archive was built with <code>--store-names</code> (or <code>store-names = true</code> in the meta file), each line also shows the original relative path:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>Index entries:
  [0] name: textures/background.png, hash: 0254d0414b3d0eaf, offset: 0, size: 200000
  [1] name: textures/ui.png, hash: a6cf994350b589ad, offset: 200704, size: 3</code></pre></div>
<h2>Verifying archives</h2>
<p><code>--verify</code> checks the checksums of all files in one or more archives:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--verify</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__string">"</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__string">./build/textures.sfpak, ./build/main.sfpak"</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Output:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>[Error] ./build/textures.sfpak: Asset &#39;textures/ui.png&#39; is damaged (checksum mismatch)
[OK]    ./build/main.sfpak (12 files)</code></pre></div>
<p>Several damaged files of one archive are listed below it:</p>
<div class="code-block-wrapper code-block-wrapper--no-tag"><pre><code>[Error] ./build/levels.sfpak:
  - Asset &#39;levels/level_01.map&#39; is damaged (checksum mismatch)
  - Asset &#39;levels/level_02.map&#39; is damaged (checksum mismatch)</code></pre></div>
<p>All archives are checked, also if one of them is damaged. The exit code is not <code>0</code> if any archive is damaged or can't be loaded, so <code>--verify</code> can be used in build or install scripts. Without stored names a damaged file is reported by its hash.</p>
<h2>Extracting archives</h2>
<p><code>--extract</code> writes every file of an archive back to disk. Each archive gets its own folder <code>&lt;output&gt;/&lt;archive name&gt;/</code>:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--extract</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">build</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">textures</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">sfpak</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">unpacked</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--mkdir</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>All archives are loaded and checked before anything is written. The output directory is only created when all of them can be extracted.</p>
<p>With stored names the original folder structure is restored, e.g. <code>./unpacked/textures/textures/background.png</code> (the path inside the archive is relative to the source folder).</p>
<p>Without stored names the original paths are unknown, so the files are named after their hash, matching the <code>--info --verbose</code> output: <code>./unpacked/main/a01c85352df03fae.bin</code>.</p>
<p>Several archives can be extracted at once:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">StaticForgeTool</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--extract</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__string">"</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__string">./build/textures.sfpak, ./build/main.sfpak"</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--output</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__punctuation">.</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other">/</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__identifier">unpacked</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--mkdir</span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__other"> </span><span class="token-type_ShellLang_highlightStyle_ShellLang_Dark__parameter">--verbose</span></span></pre><div class="code-language-tag code-language-tag--recognized">bash</div></div>
<p>Rules:</p>
<ul><li>Existing files are never overwritten. If one of the target files already exists, nothing is extracted. Empty the output folder first.</li><li>Names in the archive must be relative paths. An archive with names like <code>../file</code> or <code>C:/file</code> is rejected, so a manipulated archive can't write outside of the output folder.</li></ul>
<blockquote><strong>Note:</strong> Without name storage the index only contains hashes. The original path is not recoverable from the archive alone — keep your source assets, or pack with <code>--store-names</code> if you need to extract with the original names.</blockquote></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu3td1kuzgocka16m5db0">
  <div class="main" data-node-id="node_mu3td1kuzgocka16m5db0" data-tab-id="tab_mu3td1ku2qztxt16axy53">
    <section id="node_mu3td1kuzgocka16m5db0" class="export-section">
    
    <div class="export-section__body"><h1>Loading Assets at Runtime</h1>
<p>At runtime, use <code>StaticForgeReader</code> to open a <code>.sfpak</code> file and <code>StaticForgeArchive</code> to load individual assets.</p>
<h2>Opening an archive</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">#</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">include </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">StaticForgeCore/StaticForge.h</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword"></span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeReader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">reader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">reader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Load</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./build/textures.sfpak"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">))</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// reader.GetError() contains a description of what went wrong</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">reader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">endl</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p><code>Load</code> validates the whole archive structure (header, index and name table) against the file size, so a damaged or truncated archive is rejected with an error instead of crashing. Archives of another format version are rejected as well; rebuild them with the current tool.</p>
<p>The same archive object can be loaded again with another file. Everything of the previous archive (open stream, memory mapping, index, errors) is released first.</p>
<h2>Cloning an archive</h2>
<p>An archive can't be copied, but <code>Clone()</code> creates a second archive object for the same file without reading it again:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">clone</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Clone</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>The clone shares the loaded index and names (and the memory mapping, if the archive is mapped), but has its own file stream and its own errors. A single archive object must not be used from several threads at once, but each thread can use its own clone.</p>
<h2>Loading from several threads</h2>
<p><code>StaticForgeConcurrentArchive</code> can be used from several threads at the same time. It has the same loading functions as <code>StaticForgeArchive</code>:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeConcurrentArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetPoolSize</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">4</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// optional, default: std::thread::hardware_concurrency()</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">reader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Load</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">./build/main.sfpak"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">))</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">reader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">endl</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// in any thread</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">vector</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">byte</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">data</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">string</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">error</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">LoadAsset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">textures/hero.png"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">data</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">error</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">))</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">error</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">endl</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>It can also be created from a loaded archive and the other way around. Both share the loaded data:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeConcurrentArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">concurrent</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">CloneConcurrent</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">4</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">StaticForge</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">StaticForgeArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">normal</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">concurrent</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">CloneArchive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p><strong>Stream pool:</strong> stream loads take a free file stream from a pool and give it back afterwards. Streams are only opened when they are needed. If all streams of the pool are in use, the load waits until one is free, so at most <code>GetPoolSize()</code> files are open. <code>GetActiveStreamCount()</code> and <code>GetOpenStreamCount()</code> return how many streams are used and open right now (only a snapshot, the value can change at any time). <code>SetPoolSize</code> can also be called while loading, <code>CloseFreeStreams()</code> closes all streams that are not used.</p>
<p><strong>Mapped:</strong> after <code>OpenMapped()</code> the mapped functions don't need the pool at all and are the fastest way to load from many threads. <code>OpenMapped</code> and <code>CloseMapped</code> themselves must not be called while other threads load assets.</p>
<p><strong>Errors:</strong> every function has an optional <code>std::string* errorOut</code> as last parameter.</p>
<ul><li>With <code>errorOut</code> the error is only written there, nothing is collected.</li><li>Without <code>errorOut</code> the error is collected for the calling thread. <code>TakeError()</code>, <code>GetError()</code>, <code>IsValid()</code> and <code>ClearErrors()</code> only see the errors of the calling thread.</li><li><code>GetAllErrors()</code> / <code>TakeAllErrors()</code> return the errors of all threads, each line starts with <code>[Thread &lt;n&gt;]</code>. Threads are numbered in the order of their first error.</li></ul>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// e.g. after a loading screen</span>

<ul><li>The set doesn't own the archives, it only keeps pointers. An archive must not be destroyed while the set uses it, call <code>Remove()</code> or <code>Clear()</code> first, or declare the set after the archives like above.</li><li>An asset path may only exist in one archive. <code>Add()</code> fails if the new archive contains a path that an added archive has too, and nothing is added. The packer reports the same case already when building.</li><li>The set has the loading functions by key (vector, buffer, range, mapped), <code>Contains</code>, <code>GetAssetSize</code>, <code>FindArchive</code> (the archive that contains an asset) and <code>VerifyAll</code>. Mapped functions need the archive that contains the asset to be mapped.</li><li>Errors are collected in the set, the archives stay untouched.</li><li>If an added archive is loaded again with <code>reader.Load</code>, the set reports an error for its assets. Remove it and add it again.</li></ul>
<p><code>StaticForgeConcurrentArchiveSet</code> does the same for <code>StaticForgeConcurrentArchive</code> and can be used from several threads. Errors work like in the concurrent archive (<code>errorOut</code> or collected per thread). Only <code>Add</code>, <code>Remove</code> and <code>Clear</code> must not be called while other threads load assets.</p>

<p><code>LoadAssetAt</code> and <code>LoadAssetRangeAt</code> do the same by index.</p>
<h2>Verifying the archive at startup</h2>
<p><code>VerifyAll</code> checks the checksum of every asset. Use it e.g. at startup to detect a damaged or partly replaced installation and show a clear message instead of failing later while loading:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">VerifyAll</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">())</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// one error per damaged asset, e.g. "Asset 'textures/ui.png' is damaged (checksum mismatch)"</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TakeError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">endl</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// e.g. ask the user to reinstall or verify the game files</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>The data is read in 1 MB chunks, so large assets are not loaded into memory completely. Verifying reads the whole archive once, so for very large archives it takes as long as reading all files.</p>

<h2>Managing the file stream</h2>
<p>After <code>StaticForgeReader::Load</code> succeeds, the archive's file stream is open. <code>LoadAsset</code> reopens it automatically if it was closed. You can control this manually:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">CloseFileStream</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// release the file handle</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">OpenFileStream</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">  </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// reopen when needed</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">bool</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">open</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">archive</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">IsFileStreamOpen</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>A failed load (e.g. a checksum mismatch) does not affect later loads of other assets.</p>
<h2>Memory-mapped access</h2>
